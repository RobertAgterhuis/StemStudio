# E2E override (feature 013, qa specs e2e/tests/library-care-*.spec.ts): slows the api's library
# jobs (backup, verify, restore copy) so the running-job cases (progress, cancel, write gate,
# maintenance overlay) can observe them on the small fake-stack library. Test stacks only.
#
#   docker compose -f docker-compose.yml -f docker-compose.e2e.yml up -d --build --wait
#   (CI sets COMPOSE_FILE=docker-compose.yml:docker-compose.e2e.yml for every later command)
#
# Together with it the specs need, in the shell that runs Playwright:
#   E2E_BACKUP_DIR=<host backups folder>   the folder bind-mounted at /backups
#                                           (= STEMSTUDIO_BACKUP_HOST_DIR, writable by uid 1654)
#   E2E_LIBRARY_THROTTLE=1                  enables the cases that need the throttle
#
# STEMSTUDIO_E2E_THROTTLE_BYTES_PER_SECOND (default 8 MiB/s): a fake-stack backup of a few tens
# of MB then takes a few seconds. 0 switches the throttle off (the api's own default).
#
# Feature 023 (lyric writing assistant, T069): e2e/lyric-scripts/ is mounted read-only at /lyric-scripts
# and STEMSTUDIO_LYRIC_ASSIST_FAKE_SCRIPT names that folder, so every assist answers from
# `<title-slug>-<kind>.json`, else `<kind>.json`, else `{"items":[]}` (contracts/DELTA.md sections 4 and 5).
# The folder is NOT mounted under /scripts: that is the read-only agent-script mount of the base file and
# Docker cannot create a mount point inside a read-only mount. The scripts are only read when the agent
# backend is `fake` (STEMSTUDIO_AGENT_BACKEND=fake, as the agent E2E passes set it); with the default
# backend `none` the variable is inert. The Claude double ("fake-claude") has no variable in the contracts.
# Git Bash on Windows: prefix MSYS_NO_PATHCONV=1 when you pass your own /lyric-scripts path.
#
# Feature 015 (play-along recording, T010): the web service runs with
# StemStudio__Recording__TestLoopback=true (a digital loopback for the calibration and alignment
# specs, e2e/tests/recording-loopback.spec.ts). Test stacks only, never the owner's stack. The shell
# that runs `npm run test:recording` exports E2E_RECORDING_LOOPBACK=1 (the loopback spec skips
# otherwise) and generates the capture fixtures first (feature 016: the fake-mic pass recreates the web with
# STEMSTUDIO_RECORDING_TEST_LOOPBACK=false, so Chromium's fake microphone is the input):
#   cd tests/fixtures && uv run --project ../../worker python -m recording.generate_recording_fixtures
#
# Feature 014 (practice flow, sections scenario 4): a second short pass starts the api with
# STEMSTUDIO_SECTION_DETECT_ON_COMPLETE=false (base file) and runs
# `E2E_SECTION_DETECT_ON_COMPLETE=false npm run test:practice-flow-no-detect`.
#
# Feature 020 (insights and handouts, T012): the worker runs the deterministic fake quality analyzer
# (data-model 2.6: ratings per channel, so every family and level is reachable) with 2 insights
# threads; both can be overridden from the shell (STEMSTUDIO_QUALITY_ANALYZER, STEMSTUDIO_INSIGHTS_THREADS).
# The stem quality report is switched ON for api and web (StemStudio__QualityReport__Enabled; the base
# file keeps it off by default since gate G1 failed), so the @insights specs, the visual baselines and
# the a11y pass see the quality card and badges; STEMSTUDIO_QUALITY_REPORT_ENABLED=false in the shell
# turns it off again. The api starts a report after every separation (StemStudio__AutoQualityReport,
# base file).

services:
  worker:
    environment:
      STEMSTUDIO_QUALITY_ANALYZER: ${STEMSTUDIO_QUALITY_ANALYZER:-fake}
      STEMSTUDIO_INSIGHTS_THREADS: ${STEMSTUDIO_INSIGHTS_THREADS:-2}
  web:
    environment:
      - StemStudio__Recording__TestLoopback=${STEMSTUDIO_RECORDING_TEST_LOOPBACK:-true}
      - StemStudio__QualityReport__Enabled=${STEMSTUDIO_QUALITY_REPORT_ENABLED:-true}
  api:
    environment:
      - StemStudio__QualityReport__Enabled=${STEMSTUDIO_QUALITY_REPORT_ENABLED:-true}
      - StemStudio__LibraryCare__ThrottleBytesPerSecond=${STEMSTUDIO_E2E_THROTTLE_BYTES_PER_SECOND:-8388608}
      - STEMSTUDIO_LYRIC_ASSIST_FAKE_SCRIPT=${STEMSTUDIO_LYRIC_ASSIST_FAKE_SCRIPT:-/lyric-scripts}
    volumes:
      - ./e2e/lyric-scripts:/lyric-scripts:ro
