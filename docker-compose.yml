# StemStudio: one-command start-up.
#   docker compose up --build                          # web http://localhost:8080, api http://localhost:8081
#   STEMSTUDIO_SEPARATOR=fake docker compose up -d --build --wait   # fast stack for E2E / smoke tests
#   docker compose -f docker-compose.yml -f docker-compose.gpu.yml up --build   # NVIDIA GPU (optional)
#
# GPU option (feature 003): the override builds stemstudio/worker:local-gpu (CUDA torch +
# onnxruntime-gpu, ~11.6 GB) and lets the worker use the GPU when one is usable; prerequisites are
# in docker-compose.gpu.yml. Without it everything runs on the CPU, as before.
# STEMSTUDIO_FAKE_DEVICE=gpu|gpu-oom (only with STEMSTUDIO_SEPARATOR=fake) fakes a GPU for E2E.
#
# The worker has no host port (internal network only). The first real separation downloads the
# Demucs weights (~300 MB) into the model-cache volume; the first real detail phase downloads about
# 1.9 GB more (MDX23C DrumSep, UVR KARA 2, MVSep Mega 53-stem) into the same volume
# (STEMSTUDIO_MODEL_DIR=/models). Later starts reuse them; weights are never in the image or repo.
# Memory: real detail separation of a 4-minute song needs about 16 GB in the worker, so Docker
# Desktop must allow at least 20 GB (check: docker info --format "{{.MemTotal}}").
# STEMSTUDIO_SEPARATOR=fake also fakes the detail phase (STEMSTUDIO_FAKE_DETAIL_STEP_SECONDS per
# parent step, default 1; set 0 for the fastest runs).
# No secrets are needed (the optional Claude key of feature 011 is entered in Settings or comes
# from your shell, see below). Kestrel serves directly (no reverse proxy), so the API's own
# upload limit (200 MiB) applies; a proxy added later must allow >= 200 MiB + multipart overhead.
#
# Online lookups (feature 005; specs/005-artwork-band-info/quickstart.md), worker only, all optional:
#   STEMSTUDIO_ONLINE_LOOKUPS=on|off        default on; off = no MusicBrainz/Cover Art Archive/
#                                           Wikidata/Wikipedia request at all
#   STEMSTUDIO_CONTACT_URL=https://...      public page about your install, sent in the User-Agent;
#                                           never an e-mail; unset = generic token (FR-010). It is
#                                           passed through from your shell only, never baked in.
#   STEMSTUDIO_WIKIPEDIA_LANGUAGES=nl,en    excerpt language order, 1-5 codes (default en)
#   STEMSTUDIO_FAKE_ONLINE=found|not-found|failed|off   fake lookups (only with the fake separator)
# Export and library (feature 007, ADR-016 D5): the worker mounts the API data volume READ-ONLY at
# /library (STEMSTUDIO_LIBRARY_DIR) to render exports from stems; the API is the only writer.
# Check it with scripts/check-library-mount.{sh,ps1}. STEMSTUDIO_RENDER_BLOCK_SECONDS (default 10)
# sets the render block length.
# Synced lyrics (feature 006; specs/006-synced-lyrics-karaoke/quickstart.md), worker only, optional:
#   STEMSTUDIO_ALIGN_MODEL=turbo|small      Whisper model; turbo downloads 1.6 GB into
#                                           /models/whisper (model-cache volume) at first alignment
#   STEMSTUDIO_ALIGN_AUTO=gpu|always|never  when plain lyrics are aligned without a click
#   STEMSTUDIO_FAKE_LYRICS=word|line|plain|instrumental|not-found|failed   (fake separator only)
#   Lyrics lookups use LRCLIB and honour STEMSTUDIO_ONLINE_LOOKUPS=off.
# Sheet music (feature 008; specs/008-sheet-music/quickstart.md), worker only, optional:
#   STEMSTUDIO_TRANSCRIBER=real|fake        empty (default) = fake with the fake separator, else real;
#                                           the piano model downloads into the model-cache volume
#                                           at first use
#   STEMSTUDIO_TRANSCRIBE_THREADS=1..64     intra-op threads of the transcribe lane (default 8)
#   The image installs the Leipzig music font (check: scripts/check-worker-fonts.{sh,ps1}).
# AI composer agent (feature 011; specs/011-ai-composer-agent/quickstart.md), api only, optional:
#   STEMSTUDIO_AGENT_BACKEND=ollama|claude|none|fake   initial backend (default ollama) when no
#                                           settings row exists; the settings page changes it later
#   STEMSTUDIO_OLLAMA_URL=http://...        default http://host.docker.internal:11434. Ollama is
#                                           OPTIONAL and runs on the host, not in compose; without
#                                           it the app works and the agent panel says why it is off.
#                                           The api reaches the host via extra_hosts host-gateway.
#   Claude key (paid, opt-in; 011 follow-up claude-key, constitution 1.4.0), either of:
#   - Settings -> Claude key, on THIS computer (http://localhost:8080/settings). The api stores
#     the key encrypted (ASP.NET Core Data Protection) in its SQLite database; the key ring that
#     decrypts it is the separate volume api-keys at /keys (StemStudio__DataProtection__KeyRingDir),
#     mounted into api only. NEVER copy api-keys together with the library volume api-data or a
#     backup: whoever has both can decrypt the key. Losing api-keys (docker compose down -v,
#     docker volume rm stemstudio_api-keys) only means "Enter the key again" in Settings.
#     Key entry is accepted from this computer only (loopback, or the web service:
#     StemStudio__Agent__KeyEntry__InternalCaller=web). Until feature 018, a LAN device that
#     forges the host name can overwrite or delete the stored key, never read it (threat T7).
#     Check the volume with scripts/check-key-volume.{sh,ps1}.
#   - ANTHROPIC_API_KEY                     passed through from your shell when set; it WINS over
#                                           a stored key. No value is ever written in a file.
#                                           Set it for one shell session only, never in .env:
#                                             bash:       read -rs ANTHROPIC_API_KEY && export ANTHROPIC_API_KEY
#                                             PowerShell: $env:ANTHROPIC_API_KEY = Read-Host -MaskInput
#                                           then docker compose up -d (api is recreated with it).
#   STEMSTUDIO_AGENT_FAKE_SCRIPT=/scripts/<name>.json   E2E only, with STEMSTUDIO_AGENT_BACKEND=fake:
#                                           scripted model turns from e2e/agent-scripts/ (mounted
#                                           read-only at /scripts; format agent-script.schema.json).
#                                           Git Bash on Windows: prefix MSYS_NO_PATHCONV=1, or the
#                                           /scripts path is rewritten into a Windows path.
# Library care (feature 013; specs/013-library-care/quickstart.md), api only:
#   STEMSTUDIO_BACKUP_HOST_DIR=<host folder>   where backup archives (multi-GB .zip) are written;
#                                           default ./backups next to this file, bind-mounted at
#                                           /backups (StemStudio__BackupDir). Create it BEFORE the
#                                           first start, or Docker creates it owned by root:
#                                             mkdir -p backups                      (all hosts)
#                                             sudo chown 1654:1654 backups          (Linux: api uid)
#                                           Windows: $env:STEMSTUDIO_BACKUP_HOST_DIR = 'D:\StemStudio\backups'
#                                           Check it with scripts/check-backup-folder.{sh,ps1}. The
#                                           api never changes host permissions; backups/ is ignored
#                                           by git and by the image build context.

name: stemstudio

services:
  worker:
    build:
      context: .
      dockerfile: docker/worker.Dockerfile
    image: stemstudio/worker:local
    environment:
      STEMSTUDIO_SEPARATOR: ${STEMSTUDIO_SEPARATOR:-demucs}
      STEMSTUDIO_DEVICE: ${STEMSTUDIO_DEVICE:-cpu}
      STEMSTUDIO_DATA_DIR: /data
      HF_HOME: /models/hf
      TORCH_HOME: /models/torch
      STEMSTUDIO_MODEL_DIR: /models
      STEMSTUDIO_FAKE_DETAIL_STEP_SECONDS: ${STEMSTUDIO_FAKE_DETAIL_STEP_SECONDS:-1}
      STEMSTUDIO_FAKE_DEVICE: ${STEMSTUDIO_FAKE_DEVICE:-cpu}
      # Feature 005 (online lookups): pass-through with the worker's own defaults.
      STEMSTUDIO_ONLINE_LOOKUPS: ${STEMSTUDIO_ONLINE_LOOKUPS:-on}
      STEMSTUDIO_CONTACT_URL: ${STEMSTUDIO_CONTACT_URL:-}
      STEMSTUDIO_WIKIPEDIA_LANGUAGES: ${STEMSTUDIO_WIKIPEDIA_LANGUAGES:-en}
      STEMSTUDIO_FAKE_ONLINE: ${STEMSTUDIO_FAKE_ONLINE:-found}
      # Feature 007 (render lane): the read-only API library and the render block length.
      STEMSTUDIO_LIBRARY_DIR: /library
      STEMSTUDIO_RENDER_BLOCK_SECONDS: ${STEMSTUDIO_RENDER_BLOCK_SECONDS:-10}
      # Feature 006 (synced lyrics): alignment model and auto-start, fake LRCLIB results.
      STEMSTUDIO_ALIGN_MODEL: ${STEMSTUDIO_ALIGN_MODEL:-turbo}
      STEMSTUDIO_ALIGN_AUTO: ${STEMSTUDIO_ALIGN_AUTO:-gpu}
      STEMSTUDIO_FAKE_LYRICS: ${STEMSTUDIO_FAKE_LYRICS:-word}
      # Feature 008 (sheet music): empty = automatic (fake with the fake separator, else real).
      STEMSTUDIO_TRANSCRIBER: ${STEMSTUDIO_TRANSCRIBER:-}
      STEMSTUDIO_TRANSCRIBE_THREADS: ${STEMSTUDIO_TRANSCRIBE_THREADS:-8}
    expose:
      - "8000"
    volumes:
      - worker-data:/data
      - model-cache:/models
      # Read-only: the worker renders exports from the API's stems; the API is the only writer.
      - api-data:/library:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import sys, urllib.request; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=4).status == 200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 90s
      start_interval: 2s
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    image: stemstudio/api:local
    # List form (not a mapping) so the Claude key can be a bare pass-through entry (DELTA.md 7).
    environment:
      - ASPNETCORE_HTTP_PORTS=8081
      - StemStudio__DataDir=/data
      - StemStudio__WorkerBaseUrl=http://worker:8000
      - StemStudio__WebOrigin=http://localhost:8080
      # Feature 011 (AI composer agent): Ollama on the host, initial backend, E2E fake script.
      - StemStudio__Agent__Ollama__BaseUrl=${STEMSTUDIO_OLLAMA_URL:-http://host.docker.internal:11434}
      - StemStudio__Agent__Backend=${STEMSTUDIO_AGENT_BACKEND:-ollama}
      - STEMSTUDIO_AGENT_FAKE_SCRIPT=${STEMSTUDIO_AGENT_FAKE_SCRIPT:-}
      # 011 follow-up claude-key: key ring of the stored Claude key (volume api-keys below) and
      # the trusted internal caller of the local-only key entry (accepted besides loopback).
      - StemStudio__DataProtection__KeyRingDir=/keys
      - StemStudio__Agent__KeyEntry__InternalCaller=web
      # Feature 013 (library care): backups folder (bind mount below) and the host path the UI shows.
      - StemStudio__BackupDir=/backups
      - StemStudio__BackupHostDirHint=${STEMSTUDIO_BACKUP_HOST_DIR:-./backups}
      # Bare name: the host's value when set, otherwise the variable is absent in the container.
      - ANTHROPIC_API_KEY
    # host.docker.internal resolves to the host on Linux too (Docker Desktop has it built in).
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8081:8081"
    volumes:
      - api-data:/data
      # Data Protection key ring (011 follow-up claude-key): api only, never the worker, web or a
      # backup; directory 0700 for the app user (docker/api.Dockerfile).
      - api-keys:/keys
      # E2E fake agent scripts (qa, e2e/agent-scripts/*.json); read-only, ignored unless the
      # backend is fake.
      - ./e2e/agent-scripts:/scripts:ro
      # Feature 013: backup archives on the host (not a named volume, so they survive
      # `docker compose down -v` and can live on another drive); writable for the api user.
      - ${STEMSTUDIO_BACKUP_HOST_DIR:-./backups}:/backups
    depends_on:
      worker:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "--output", "/dev/null", "http://127.0.0.1:8081/health"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
      start_interval: 2s
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    image: stemstudio/web:local
    environment:
      ASPNETCORE_HTTP_PORTS: "8080"
      StemStudio__ApiBaseUrl: http://api:8081
      StemStudio__PublicApiBaseUrl: http://localhost:8081
    ports:
      - "8080:8080"
    volumes:
      - web-keys:/home/app/.aspnet/DataProtection-Keys
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "--output", "/dev/null", "http://127.0.0.1:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
      start_interval: 2s
    restart: unless-stopped

volumes:
  worker-data:
  api-data:
  # Key ring of the stored Claude key (api only); not part of the library or a 013 backup.
  api-keys:
  model-cache:
  web-keys:
