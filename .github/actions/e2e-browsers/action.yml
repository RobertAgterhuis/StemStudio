# Installs the e2e package and Playwright Chromium (full build and headless shell). Firefox was
# dropped from the E2E suite (owner decision 2026-11-23), so no sound server is needed. Used by the
# split E2E jobs of ci.yml (016 T144).
name: E2E browsers
description: npm ci in e2e/, Playwright Chromium with system dependencies.
runs:
  using: composite
  steps:
    - name: Install Playwright browsers
      shell: bash
      working-directory: e2e
      run: |
        npm ci --no-audit --no-fund
        # "chromium" installs the full build next to the headless shell; the recording and fake-mic
        # projects (fake microphone) need the full build via channel 'chromium'.
        npx playwright install --with-deps chromium
