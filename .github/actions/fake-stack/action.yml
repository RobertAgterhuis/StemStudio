# Starts the compose stack with the fake separator for the browser suites (feature 004: visual,
# a11y, lighthouse): uv + Node, ffmpeg, the generated audio fixtures, a temporary backups folder
# owned by the api user and the e2e override via COMPOSE_FILE (013), then `docker compose up --wait`.
# The caller checks out the repository first and stops the stack with `docker compose down -v`.
name: Fake stack
description: Generate the audio fixtures and start worker, api and web with STEMSTUDIO_SEPARATOR=fake.
inputs:
  uv-version:
    description: uv version (the workflow's UV_VERSION)
    required: true
  node-version:
    description: Node.js major version (the workflow's NODE_VERSION)
    required: true
runs:
  using: composite
  steps:
    - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      with:
        version: ${{ inputs.uv-version }}
        enable-cache: true
        cache-dependency-glob: worker/uv.lock
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: ${{ inputs.node-version }}
        cache: npm
        cache-dependency-path: e2e/package-lock.json
    - name: Install ffmpeg (MP3 fixture encoder)
      shell: bash
      run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
    - name: Generate audio fixtures
      shell: bash
      # Every generator (detail, artwork, lyrics, scores, voices, ...) so the e2e suites find their files.
      run: |
        for generator in tests/fixtures/generate_*.py; do
          uv run --project worker --frozen python "${generator}"
        done
        # 015 recording inputs (module run from tests/fixtures) and the 014 practice-flow song.
        (cd tests/fixtures && uv run --project ../../worker --frozen python -m recording.generate_recording_fixtures)
        uv run --project worker --frozen python tests/fixtures/practice-flow/generate_practice_flow_fixture.py
    - name: Backups folder for the api (uid 1654, temporary) and the e2e override (013 FR-005)
      shell: bash
      run: |
        backups="$RUNNER_TEMP/stemstudio-backups"
        mkdir -p "$backups" && sudo chown 1654:1654 "$backups"
        {
          echo "STEMSTUDIO_BACKUP_HOST_DIR=$backups"
          echo "E2E_BACKUP_DIR=$backups"
          echo "E2E_LIBRARY_THROTTLE=1"
          echo "COMPOSE_FILE=docker-compose.yml:docker-compose.e2e.yml"
        } >> "$GITHUB_ENV"
        scripts/check-backup-folder.sh --folder "$backups"
    - name: Start the stack (fake separator) and wait for health
      shell: bash
      env:
        STEMSTUDIO_SEPARATOR: fake
      run: |
        docker compose up -d --build --wait --wait-timeout 300
        curl --fail --silent --show-error http://localhost:8081/health
        curl --fail --silent --show-error http://localhost:8080/health
