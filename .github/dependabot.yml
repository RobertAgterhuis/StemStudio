# Dependabot: weekly, grouped, and only versions at least 14 days old (project supply-chain rule).
version: 2
updates:
  - package-ecosystem: nuget
    directory: "/"
    schedule: { interval: weekly }
    cooldown: { default-days: 14 }
    groups: { nuget-minor-patch: { update-types: [minor, patch] } }
  - package-ecosystem: uv
    directories: ["/worker", "/tools/quality", "/tests/fixtures"]
    schedule: { interval: weekly }
    cooldown: { default-days: 14 }
    groups: { python-minor-patch: { update-types: [minor, patch] } }
  - package-ecosystem: npm
    directories: ["/src/audio-engine", "/src/web-interop", "/e2e", "/tools/docs"]
    schedule: { interval: weekly }
    cooldown: { default-days: 14 }
    groups: { npm-minor-patch: { update-types: [minor, patch] } }
  - package-ecosystem: docker
    directory: "/docker"
    schedule: { interval: weekly }
    cooldown: { default-days: 14 }
  - package-ecosystem: github-actions
    directory: "/"
    schedule: { interval: weekly }
    cooldown: { default-days: 14 }
