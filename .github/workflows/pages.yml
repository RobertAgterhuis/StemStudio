# StemStudio website (GitHub Pages): rebuilt from the repository sources on every push to main, so
# feature status, screenshots, manuals, ADRs and licences on https://robertagterhuis.github.io/StemStudio/
# always match main. Generator: tools/site (see tools/site/README.md).
# Actions are pinned to commit SHAs (tag in the comment). No secrets are used.
name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# One deployment at a time; a newer push waits instead of cancelling a running deployment.
concurrency:
  group: pages
  cancel-in-progress: false

env:
  NODE_VERSION: "22"

jobs:
  build:
    name: Build and check the website
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: tools/docs/package-lock.json
      - name: Install the generator's Markdown renderer (tools/docs lock file)
        working-directory: tools/docs
        run: npm ci --no-audit --no-fund
      - name: Unit tests of the generator
        run: node --test tools/site/test/site.test.mjs
      - name: Build site/dist and validate links, assets, colours and content
        run: node tools/site/check.mjs
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site/dist

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
