# Real-model checks (slow): the single real-Demucs integration test and the @real Playwright flow
# against compose with STEMSTUDIO_SEPARATOR=demucs. Manual, plus a weekly run to catch upstream
# breakage (yt-dlp, model hosting). The Demucs weights are cached with actions/cache.
# CI=true makes a missing model or network FAIL the integration test instead of skipping it (K5).
name: e2e-real

on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * 1"

permissions:
  contents: read

concurrency:
  group: e2e-real-${{ github.ref }}
  cancel-in-progress: false

env:
  UV_VERSION: "0.13.5"
  NODE_VERSION: "22"
  CI: "true"
  MODEL_CACHE_KEY: demucs-models-htdemucs_6s-htdemucs-v1

jobs:
  worker-integration:
    name: Worker integration test (real Demucs)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      HF_HOME: ${{ github.workspace }}/.model-cache/hf
      TORCH_HOME: ${{ github.workspace }}/.model-cache/torch
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: worker/uv.lock
      - name: Install ffmpeg and libsndfile
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg libsndfile1
      - name: Restore model cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .model-cache
          key: ${{ env.MODEL_CACHE_KEY }}
      - name: Sync (frozen lock)
        working-directory: worker
        run: uv sync --frozen
      - name: pytest -m integration
        working-directory: worker
        run: uv run --frozen pytest -m integration -v --timeout=2400

  e2e-real:
    name: Playwright @real (compose, real Demucs)
    needs: worker-integration
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      STEMSTUDIO_SEPARATOR: demucs
      STEMSTUDIO_MODEL_CACHE_DIR: ${{ github.workspace }}/.model-cache
      E2E_BASE_URL: http://localhost:8080
      E2E_API_URL: http://localhost:8081
      COMPOSE_FILE: docker-compose.yml:docker/compose.model-cache-bind.yml
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: worker/uv.lock
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Restore model cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .model-cache
          key: ${{ env.MODEL_CACHE_KEY }}
      - name: Make the model cache writable for the worker user (uid 10001)
        run: |
          mkdir -p .model-cache/hf .model-cache/torch
          sudo chown -R 10001:10001 .model-cache
      - name: Generate audio fixtures
        run: uv run --project worker --frozen python tests/fixtures/generate_fixtures.py
      - name: Build and start the stack
        run: docker compose up -d --build --wait --wait-timeout 600
      - name: Pre-warm the Demucs models (no-op when cached)
        run: >-
          docker compose exec -T worker python -c
          "from demucs.pretrained import get_model; get_model('htdemucs_6s'); get_model('htdemucs')"
      - name: Playwright @real
        working-directory: e2e
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium firefox
          npm run test:real
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: playwright-report-real
          path: |
            e2e/playwright-report/
            e2e/test-results/
          if-no-files-found: warn
      - name: Compose logs on failure
        if: failure()
        run: docker compose logs --no-color --timestamps
      - name: Stop the stack
        if: always()
        run: docker compose down -v
      - name: Give the model cache back to the runner user (for actions/cache save)
        if: always()
        run: sudo chown -R "$(id -u):$(id -g)" .model-cache
