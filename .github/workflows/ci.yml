# StemStudio CI: build, lint, test and gate every component at >= 90 % line AND branch coverage,
# then run the Playwright main flow against the compose stack with the fake separator.
# Actions are pinned to commit SHAs (tag in the comment). No secrets are used: the optional Claude
# key of feature 011 is never set here (scripts/secret_scan.py fails the run if a workflow sets it).
name: ci

on:
  push:
    branches: [main, "0*-**"]
  pull_request:
  workflow_dispatch:
    inputs:
      update-baselines:
        description: Visual job only - regenerate the screenshots and upload them as an artifact for review (commits nothing)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: "1"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "1"
  UV_VERSION: "0.13.5"
  NODE_VERSION: "22"
  REDOCLY_CLI: "@redocly/cli@2.78.0"
  # Round 014+015: CONTRACTS_DIR is the newest full backend document, 015's 1.14.0 (= 014's 1.13.0 +
  # the recording delta) with its delta; the worker document is 014's 1.8.0 (PRACTICE_FLOW_CONTRACTS,
  # 015 changes nothing in the worker). Render vectors 1.1.0 (007's 1.0.0 + the take cases) are 015's.
  CONTRACTS_DIR: specs/015-play-along-recording/contracts
  RENDER_VECTORS: specs/015-play-along-recording/contracts/generate_render_vectors.py
  # Feature 014 (backend 1.13.0 = 1.23.0 + the practice delta; worker 1.8.0 = 1.7.0 + the practice lane).
  PRACTICE_FLOW_CONTRACTS: specs/014-practice-flow/contracts
  # Features 009/010 (generator 1.0.0 / 1.1.0, backend 1.8.0 / 1.9.0); 010's documents contain 009's.
  GENERATIVE_CONTRACTS: specs/009-style-transfer/contracts specs/010-lyrics-to-song/contracts
  # Feature 011 (backend 1.10.0 = 010's 1.9.0 + the agent delta); worker stays 008's, generator 010's.
  AGENT_CONTRACTS: specs/011-ai-composer-agent/contracts
  # 011 follow-up claude-key: full backend 1.21.0 (= 1.10.0 + claude-key delta.2) and the delta.
  CLAUDE_KEY_CONTRACTS: specs/011-ai-composer-agent/followups/claude-key/contracts
  # Feature 012 (backend 1.11.0 = 1.21.0 + the practice settings). CONTRACTS_DIR stays 008's: 012
  # has no worker document, and the .NET contract tests link the 012 document in their csproj.
  PRACTICE_CONTRACTS: specs/012-practice-tempo/contracts
  # Feature 013 (backend 1.12.0 = 1.11.0 + the library-care delta; worker 1.7.0 = 008's 1.6.0 +
  # the storage tag). CONTRACTS_DIR stays 008's for the 1.6.0 lint; the 013 documents are linted
  # here and the superset rule is checked by check_superset.py.
  LIBRARY_CARE_CONTRACTS: specs/013-library-care/contracts
  PYYAML: pyyaml==6.0.3
  # Feature 022 (backend 1.22.0 = 1.12.0 + library folders) and 023 (backend 1.23.0 = 1.22.0 + lyric
  # writing assistant): each directory holds its full document, its delta, merge_full.py and redocly.yaml.
  LIBRARY_FOLDERS_CONTRACTS: specs/022-library-folders/contracts
  LYRIC_ASSIST_CONTRACTS: specs/023-lyric-writing-assistant/contracts
  # Pins of the 023 contract checks (versions as in worker/uv.lock): check_output_schema.py, test_merge_full.py.
  JSONSCHEMA: jsonschema==4.26.0
  PYTEST: pytest==9.2.0

jobs:
  dotnet:
    name: .NET build, format, test (coverage gate)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - name: Restore tools and packages
        run: |
          dotnet tool restore
          dotnet restore StemStudio.slnx
      - name: Build (warnings are errors)
        run: dotnet build StemStudio.slnx -c Release --no-restore
      - name: Format check
        run: dotnet format StemStudio.slnx --verify-no-changes --no-restore
      - name: Test with per-component 90 % line+branch gate (Directory.Build.props, ADR-006)
        run: dotnet test StemStudio.slnx -c Release --no-build -p:CollectCoverage=true
      - name: StemStudio.Agent is in the gate (report present, line and branch >= 90 %; feature 011)
        run: python3 scripts/coverage_floor.py tests/StemStudio.Agent.Tests/TestResults/coverage/coverage.cobertura.xml
      # tools/agent-eval itself is never run in CI (live runs need a model); only its unit tests are.
      - name: StemStudio.AgentEval is in the gate (report present, line and branch >= 90 %; feature 011)
        run: python3 scripts/coverage_floor.py tests/StemStudio.AgentEval.Tests/TestResults/coverage/coverage.cobertura.xml
      # Timing asserts skip under coverlet, so the performance budgets (022 SC-004: folder view, index
      # rebuild, search at 5,000 items) run here without instrumentation: the same Release build, the
      # coverlet run settings off (RunSettingsFilePath is empty) and no CollectCoverage. The coverage run
      # above still runs every test, Category=Perf included, only without the timing asserts.
      - name: Performance budgets, uninstrumented (Category=Perf; 022 SC-004)
        run: dotnet test tests/StemStudio.Api.Tests -c Release --no-build --filter Category=Perf -p:RunSettingsFilePath=
      - name: Coverage summary
        if: always()
        shell: python
        run: |
          # Reads the coverage files this job just produced (trusted input; no external XML).
          import glob, os, xml.etree.ElementTree as ET
          rows = ["| Test project | Line % | Branch % |", "|---|---|---|"]
          for path in sorted(glob.glob("tests/*/TestResults/coverage/coverage.cobertura.xml")):
              root = ET.parse(path).getroot()
              name = path.split("/")[1]
              rows.append(f"| {name} | {float(root.get('line-rate', 0)) * 100:.1f} | {float(root.get('branch-rate', 0)) * 100:.1f} |")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
              summary.write("### .NET coverage\n\n" + "\n".join(rows) + "\n")
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: coverage-dotnet
          # every test project, incl. tests/StemStudio.AgentEval.Tests (coverage.{cobertura,opencover}.xml, feature 011)
          path: tests/*/TestResults/coverage/
          if-no-files-found: warn

  sonar:
    name: SonarQube analysis (.NET; runs only when the SONAR_TOKEN secret exists)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      # Secrets cannot be used in an `if:` directly; expose them as env and test that instead.
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}
    steps:
      - name: Sonar not configured
        if: env.SONAR_TOKEN == ''
        run: echo "::notice::SONAR_TOKEN secret not set; SonarQube analysis skipped"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: env.SONAR_TOKEN != ''
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        if: env.SONAR_TOKEN != ''
        with:
          global-json-file: global.json
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        if: env.SONAR_TOKEN != ''
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: |
            worker/uv.lock
            tools/quality/uv.lock
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: env.SONAR_TOKEN != ''
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install ffmpeg and libsndfile (worker tests)
        if: env.SONAR_TOKEN != ''
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg libsndfile1
      - name: Scan C#, Python and TypeScript (dotnet-sonarscanner from dotnet-tools.json; token only from the secret)
        if: env.SONAR_TOKEN != ''
        run: |
          dotnet tool restore
          # Analysis settings come from sonar-project.properties (quality-gate owned), one /d: arg per line.
          mapfile -t SONAR_ARGS < <(uv run --project tools/quality --frozen python tools/quality/sonar_args.py)
          dotnet sonarscanner begin /k:stemstudio \
            /d:sonar.host.url="${SONAR_HOST_URL:-https://sonarcloud.io}" \
            /d:sonar.token="$SONAR_TOKEN" \
            "${SONAR_ARGS[@]}"
          dotnet build StemStudio.slnx -c Release
          dotnet test StemStudio.slnx -c Release --no-build -p:CollectCoverage=true
          (cd worker && uv sync --frozen && uv run --frozen pytest --cov --cov-branch --cov-report=xml -q)
          (cd src/audio-engine && npm ci --no-audit --no-fund && npm run test:coverage)
          (cd src/web-interop && npm ci --no-audit --no-fund && npm run test:coverage)
          dotnet sonarscanner end /d:sonar.token="$SONAR_TOKEN"

  worker:
    name: Worker lint, types, tests (coverage gate) + fixture generator
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: worker/uv.lock
      - name: Install ffmpeg and libsndfile
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg libsndfile1
      - name: Sync (frozen lock)
        working-directory: worker
        run: |
          uv lock --check
          uv sync --frozen
      - name: Ruff
        working-directory: worker
        run: |
          uv run --frozen ruff check .
          uv run --frozen ruff format --check .
      - name: Mypy (strict)
        working-directory: worker
        run: uv run --frozen mypy src tests
      - name: Pytest with 90 % line+branch gate
        working-directory: worker
        run: uv run --frozen pytest --cov --cov-branch --cov-report=term --cov-report=xml --cov-fail-under=90
      - name: Fixture generator lint, types, tests >= 90 % (qa, docs/testing/TEST-STRATEGY.md section 9)
        env:
          FX: tests/fixtures/pyproject.toml
        run: |
          uv run --project worker --frozen ruff check tests/fixtures
          uv run --project worker --frozen ruff format --check tests/fixtures
          uv run --project worker --frozen mypy --config-file "$FX" --exclude '^tests/fixtures/backup/' tests/fixtures
          uv run --project worker --frozen pytest -c "$FX" --cov --cov-branch --cov-config="$FX" --cov-report=term tests/fixtures/tests
      - name: Backup fixture tools lint, types, tests >= 90 % (qa, 013 tests/fixtures/backup, own pyproject.toml)
        # Present once the qa lane of 013 is merged; until then the step is skipped.
        if: hashFiles('tests/fixtures/backup/pyproject.toml') != ''
        env:
          FX: tests/fixtures/backup/pyproject.toml
        run: |
          uv run --project worker --frozen ruff check --config "$FX" tests/fixtures/backup
          uv run --project worker --frozen ruff format --config "$FX" --check tests/fixtures/backup
          uv run --project worker --frozen mypy --config-file "$FX" tests/fixtures/backup
          uv run --project worker --frozen pytest -c "$FX" --cov --cov-branch --cov-config="$FX" --cov-report=term tests/fixtures/backup/tests
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: coverage-worker
          path: worker/coverage.xml
          if-no-files-found: warn

  generator:
    name: Generator lint, types, tests (coverage gate; base install, no torch)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: generator
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: generator/uv.lock
      - name: Sync (frozen lock; base + dev only, the GPU extras acestep/soulx are never installed in CI)
        run: |
          uv lock --check
          uv sync --frozen
      - name: Ruff
        run: |
          uv run --frozen ruff check .
          uv run --frozen ruff format --check .
      - name: Mypy (strict)
        run: uv run --frozen mypy src tests
      - name: Pytest with 90 % line+branch gate
        run: uv run --frozen pytest --cov --cov-branch --cov-report=term --cov-report=xml --cov-fail-under=90
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: coverage-generator
          path: generator/coverage.xml
          if-no-files-found: warn

  audio-engine:
    name: Audio engine lint, types, tests (coverage gate), build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: src/audio-engine
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: src/audio-engine/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run typecheck
      - name: Tests with 90 % thresholds (vitest.config.ts)
        run: npm run test:coverage
      - run: npm run build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: coverage-audio-engine
          path: src/audio-engine/coverage/
          if-no-files-found: warn

  web-interop:
    name: Web interop lint, types, tests (coverage gate), build (feature 004)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: src/web-interop
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: src/web-interop/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run typecheck
      - name: Tests with 90 % thresholds (vitest.config.ts)
        run: npm run test:coverage
      - name: Build web-interop.js and first-paint.js into wwwroot/js
        run: npm run build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: coverage-web-interop
          path: src/web-interop/coverage/
          if-no-files-found: warn

  contracts:
    name: OpenAPI contracts lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Redocly lint, recording documents (015; backend 1.14.0 and its delta)
        run: >-
          npx --yes "$REDOCLY_CLI" lint --config "$CONTRACTS_DIR/redocly.yaml"
          "$CONTRACTS_DIR/backend-api.openapi.yaml" "$CONTRACTS_DIR/recording-api.openapi.yaml"
      - name: Redocly lint, practice flow documents (014; backend 1.13.0, worker 1.8.0 and both deltas)
        run: >-
          npx --yes "$REDOCLY_CLI" lint --config "$PRACTICE_FLOW_CONTRACTS/redocly.yaml"
          "$PRACTICE_FLOW_CONTRACTS/backend-api.openapi.yaml"
          "$PRACTICE_FLOW_CONTRACTS/worker-api.openapi.yaml"
          "$PRACTICE_FLOW_CONTRACTS/practice-api.openapi.yaml"
          "$PRACTICE_FLOW_CONTRACTS/worker-practice.openapi.yaml"
      - name: Redocly lint, generative documents (009 + 010)
        run: |
          for dir in $GENERATIVE_CONTRACTS; do
            npx --yes "$REDOCLY_CLI" lint --config "$dir/redocly.yaml"               "$dir/generator-api.openapi.yaml" "$dir/backend-api.openapi.yaml"
          done
      - name: Redocly lint, agent documents (011; backend 1.10.0 + agent delta)
        run: >-
          npx --yes "$REDOCLY_CLI" lint --config "$AGENT_CONTRACTS/redocly.yaml"
          "$AGENT_CONTRACTS/backend-api.openapi.yaml" "$AGENT_CONTRACTS/agent-api.openapi.yaml"
      - name: Redocly lint, claude-key follow-up documents (011; backend 1.21.0 + claude-key delta)
        run: >-
          npx --yes "$REDOCLY_CLI" lint --config "$CLAUDE_KEY_CONTRACTS/redocly.yaml"
          "$CLAUDE_KEY_CONTRACTS/backend-api.openapi.yaml" "$CLAUDE_KEY_CONTRACTS/backend-api.claude-key.openapi.yaml"
      - name: Redocly lint, practice tempo document (012; backend 1.11.0)
        run: >-
          npx --yes "$REDOCLY_CLI" lint --config "$PRACTICE_CONTRACTS/redocly.yaml"
          "$PRACTICE_CONTRACTS/backend-api.openapi.yaml"
      - name: Redocly lint, library care documents (013; backend 1.12.0, its delta, worker 1.7.0)
        run: >-
          npx --yes "$REDOCLY_CLI" lint --config "$LIBRARY_CARE_CONTRACTS/redocly.yaml"
          "$LIBRARY_CARE_CONTRACTS/backend-api.openapi.yaml"
          "$LIBRARY_CARE_CONTRACTS/backend-api.delta.openapi.yaml"
          "$LIBRARY_CARE_CONTRACTS/worker-api.openapi.yaml"
      - name: Redocly lint, library folders documents (022; backend 1.22.0 and its delta)
        run: >-
          npx --yes "$REDOCLY_CLI" lint --config "$LIBRARY_FOLDERS_CONTRACTS/redocly.yaml"
          "$LIBRARY_FOLDERS_CONTRACTS/backend-api.openapi.yaml"
          "$LIBRARY_FOLDERS_CONTRACTS/backend-api.library-folders.openapi.yaml"
      - name: Redocly lint, lyric assistant documents (023; backend 1.23.0 and its delta)
        run: >-
          npx --yes "$REDOCLY_CLI" lint --config "$LYRIC_ASSIST_CONTRACTS/redocly.yaml"
          "$LYRIC_ASSIST_CONTRACTS/backend-api.openapi.yaml"
          "$LYRIC_ASSIST_CONTRACTS/backend-api.delta.openapi.yaml"
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
      - name: 012 backend 1.11.0 contains 1.21.0 (check_superset.py, newer contains older)
        run: uv run --no-project --with "$PYYAML" python -I "$PRACTICE_CONTRACTS/check_superset.py"
      - name: 013 backend 1.12.0 contains 1.11.0 and every entry of its delta (check_superset.py)
        run: |
          check=(uv run --no-project --with "$PYYAML" python -I "$LIBRARY_CARE_CONTRACTS/check_superset.py")
          "${check[@]}"
          "${check[@]}" "$LIBRARY_CARE_CONTRACTS/backend-api.delta.openapi.yaml" "$LIBRARY_CARE_CONTRACTS/backend-api.openapi.yaml"
      - name: 022 full backend 1.22.0 is the 013 document plus the 022 delta (merge_full.py --check, freshness and superset)
        run: uv run --no-project --with "$PYYAML" python -I "$LIBRARY_FOLDERS_CONTRACTS/merge_full.py" --check
      - name: 023 full backend 1.23.0 is 1.22.0 plus the 023 changes (merge_full.py --check, freshness and superset)
        run: uv run --no-project --with "$PYYAML" python -I "$LYRIC_ASSIST_CONTRACTS/merge_full.py" --check
      - name: 023 model output schema and the E2E lyric scripts validate (check_output_schema.py)
        run: uv run --no-project --with "$JSONSCHEMA" python -I "$LYRIC_ASSIST_CONTRACTS/check_output_schema.py"
      - name: 023 block merge tests (test_merge_full.py)
        run: uv run --no-project --with "$PYYAML" --with "$PYTEST" python -m pytest "$LYRIC_ASSIST_CONTRACTS"
      - name: 014 backend 1.13.0 contains 1.23.0 and every entry of its delta (check_superset.py)
        run: |
          check=(uv run --no-project --with "$PYYAML" python -I "$PRACTICE_FLOW_CONTRACTS/check_superset.py")
          "${check[@]}"
          "${check[@]}" "$PRACTICE_FLOW_CONTRACTS/practice-api.openapi.yaml" "$PRACTICE_FLOW_CONTRACTS/backend-api.openapi.yaml"
      - name: 014 full backend 1.13.0 is 1.23.0 plus the 014 delta (merge_full.py --check, freshness and superset)
        run: uv run --no-project --with "$PYYAML" python -I "$PRACTICE_FLOW_CONTRACTS/merge_full.py" --check
      - name: 015 backend 1.14.0 contains 1.13.0 and every entry of its delta (check_superset.py)
        run: |
          check=(uv run --no-project --with "$PYYAML" python -I "$CONTRACTS_DIR/check_superset.py")
          "${check[@]}"
          "${check[@]}" "$CONTRACTS_DIR/recording-api.openapi.yaml" "$CONTRACTS_DIR/backend-api.openapi.yaml"
      - name: 015 full backend 1.14.0 is 1.13.0 plus the recording delta (merge_recording_delta.py --check)
        run: uv run --no-project --with "$PYYAML" python -I "$CONTRACTS_DIR/merge_recording_delta.py" --check
      - name: Render vectors are up to date (render-vectors 1.1.0, pure stdlib generator)
        run: python3 "$RENDER_VECTORS" --check

  soundtouch:
    name: SoundTouch WASM (pinned emsdk, two offline builds compared, Node WASM suite; 012)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: The web image pins the lock's emsdk image digest
        run: scripts/build-soundtouch.sh --check-pins
      # Only the verified source archive is cached (the script re-checks its SHA-256 on every use);
      # the module itself is built in this run, twice.
      - name: Source archive cache (keyed by soundtouch.lock)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: third_party/soundtouch/upstream
          key: soundtouch-src-${{ hashFiles('third_party/soundtouch/soundtouch.lock') }}
      - name: Build twice in fresh offline emsdk containers, compare SHA-256, write the module
        run: scripts/build-soundtouch.sh --verify-reproducible
      - name: Module SHA-256 in the job summary
        run: |
          wasm=src/StemStudio.Web/wwwroot/js/soundtouch/soundtouch.wasm
          echo "### soundtouch.wasm" >> "$GITHUB_STEP_SUMMARY"
          echo "\`$(sha256sum "$wasm" | cut -d' ' -f1)\` ($(stat -c %s "$wasm") bytes, reproducible)" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: src/audio-engine/package-lock.json
      - name: Node WASM suite against the real module (npm run test:wasm; the module must exist here)
        working-directory: src/audio-engine
        env:
          SOUNDTOUCH_WASM_REQUIRED: "1"
        run: |
          npm ci --no-audit --no-fund
          npm run test:wasm
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: soundtouch-wasm
          path: src/StemStudio.Web/wwwroot/js/soundtouch/soundtouch.wasm
          if-no-files-found: error

  secret-scan:
    name: Secret scan (no Claude key or key value in the repo, CI never sets it; 011 SC-006)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: The rules fire on planted samples (self-test)
        run: python3 scripts/secret_scan.py --self-test
      - name: Scan the repository (tracked files)
        run: python3 scripts/secret_scan.py

  quality:
    name: Quality gate (SIG checks) and its own tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: tools/quality/uv.lock
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Lint, types and tests of tools/quality (>= 90 % line+branch, fail_under in pyproject)
        working-directory: tools/quality
        run: |
          uv lock --check
          uv run --frozen ruff check .
          uv run --frozen ruff format --check .
          uv run --frozen mypy
          uv run --frozen pytest --cov --cov-branch --cov-report=term --cov-report=xml
      - name: Devops script checks (011 key_volume_checks.py, 013 backup_folder_checks.py, 023 api_image_size_checks.py >= 90 % line+branch, 012 build-soundtouch tests; scripts/pyproject.toml)
        run: |
          cfg=scripts/pyproject.toml
          checks=(scripts/key_volume_checks.py scripts/backup_folder_checks.py scripts/api_image_size_checks.py)
          uv run --project tools/quality --frozen ruff check --config "$cfg" "${checks[@]}" scripts/tests
          uv run --project tools/quality --frozen ruff format --config "$cfg" --check "${checks[@]}" scripts/tests
          uv run --project tools/quality --frozen mypy --config-file "$cfg" "${checks[@]}" scripts/tests
          uv run --project tools/quality --frozen pytest -c "$cfg" --cov --cov-branch --cov-config="$cfg" --cov-report=term scripts/tests
      - name: SIG checks on the whole code base (unit size, complexity, parameters, duplication, dependencies)
        run: uv run --project tools/quality --frozen python tools/quality/run_all.py --report "$RUNNER_TEMP/SIG-REPORT.md"
      - name: Public manuals up to date (docs/public sources vs build-manifest.json, constitution 1.3.1)
        run: node tools/docs/check.mjs
      - name: Website builds from the repository sources (tools/site; links, assets, colours, roadmap coverage)
        run: |
          (cd tools/docs && npm ci --no-audit --no-fund)
          node --test tools/site/test/site.test.mjs
          node tools/site/check.mjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: sig-report
          path: ${{ runner.temp }}/SIG-REPORT.md
          if-no-files-found: warn

  e2e-lint:
    name: E2E suite lint, typecheck, list
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: e2e
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - name: Typecheck (tsc --noEmit, audit finding F3)
        run: npm run typecheck
      - name: List the suite (catches broken imports and tag filters without browsers)
        run: npx playwright test --list

  cpu-image-guard:
    name: CPU worker image has no NVIDIA/CUDA runtime (FR-008, ADR-011), no contact URL (005 FR-010), Leipzig font (008)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build the default (CPU) worker image and run the guard (scripts/cpu_image_guard.py)
        run: scripts/check-cpu-image.sh --build stemstudio/worker:ci-cpu
      - name: The worker image lists the Leipzig and DejaVu fonts and imports verovio, cairosvg, music21, reportlab (008 SC-004, 014 SC-008)
        run: scripts/check-worker-fonts.sh stemstudio/worker:ci-cpu
      - name: The worker image does not set STEMSTUDIO_CONTACT_URL (005 FR-010; only the user's own env may)
        run: |
          image_env="$(docker image inspect --format '{{range .Config.Env}}{{println .}}{{end}}' stemstudio/worker:ci-cpu)"
          if grep -q '^STEMSTUDIO_CONTACT_URL=' <<< "$image_env"; then
            echo "::error::stemstudio/worker:ci-cpu sets STEMSTUDIO_CONTACT_URL; it must come from the user's environment only"
            exit 1
          fi
          echo "stemstudio/worker:ci-cpu does not set STEMSTUDIO_CONTACT_URL"

  generator-image:
    name: Fake generator image has no NVIDIA/CUDA runtime or torch (009/010, ADR-018 D9); compose files valid
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Every compose combination validates (default, GPU, GPU + generative, fake generative)
        run: |
          docker compose -f docker-compose.yml config -q
          docker compose -f docker-compose.yml -f docker-compose.gpu.yml config -q
          docker compose -f docker-compose.yml -f docker-compose.gpu.yml -f docker-compose.generative.yml config -q
          docker compose -f docker-compose.yml -f docker-compose.generative.yml -f docker-compose.generative-fake.yml config -q
          # Feature 011: the agent variables of the fake E2E stack interpolate (no Claude key is set).
          STEMSTUDIO_AGENT_BACKEND=fake STEMSTUDIO_AGENT_FAKE_SCRIPT=/scripts/ci.json docker compose -f docker-compose.yml config -q
          # 013: the backups bind mount follows STEMSTUDIO_BACKUP_HOST_DIR (default ./backups).
          STEMSTUDIO_BACKUP_HOST_DIR=/srv/stemstudio-backups docker compose -f docker-compose.yml config --format json             | jq -e '.services.api | (.volumes[] | select(.target == "/backups") | .type == "bind" and .source == "/srv/stemstudio-backups")
                     and .environment.StemStudio__BackupDir == "/backups"
                     and .environment.StemStudio__BackupHostDirHint == "/srv/stemstudio-backups"'
          # 013 e2e override: only the api gets the library job throttle (default 8 MiB/s).
          docker compose -f docker-compose.yml -f docker-compose.e2e.yml config --format json             | jq -e '.services.api.environment.StemStudio__LibraryCare__ThrottleBytesPerSecond == "8388608"
                     and ([.services[] | select(.environment.StemStudio__LibraryCare__ThrottleBytesPerSecond != null)] | length == 1)'
          docker compose -f docker-compose.yml config --format json             | jq -e --arg dir "$PWD/backups" '[.services[] | .volumes[]? | select(.target == "/backups")] | length == 1 and .[0].source == $dir'
          # 014: the worker gets STEMSTUDIO_STRUCTURE_ANALYZER (empty = automatic), the api the detection switch.
          docker compose -f docker-compose.yml config --format json             | jq -e '.services.worker.environment.STEMSTUDIO_STRUCTURE_ANALYZER == ""
                     and .services.api.environment.StemStudio__Practice__SectionDetectOnComplete == "true"'
          STEMSTUDIO_STRUCTURE_ANALYZER=fake STEMSTUDIO_SECTION_DETECT_ON_COMPLETE=false docker compose -f docker-compose.yml config --format json             | jq -e '.services.worker.environment.STEMSTUDIO_STRUCTURE_ANALYZER == "fake"
                     and .services.api.environment.StemStudio__Practice__SectionDetectOnComplete == "false"'
          # 015: one upload limit for api and web; only the e2e override switches the web's TestLoopback on.
          docker compose -f docker-compose.yml config --format json             | jq -e '.services.api.environment.StemStudio__Recording__MaxUploadBytes == "268435456"
                     and .services.web.environment.StemStudio__Recording__MaxStreamBytes == "268435456"
                     and ([.services[] | select(.environment.StemStudio__Recording__TestLoopback != null)] | length == 0)'
          docker compose -f docker-compose.yml -f docker-compose.e2e.yml config --format json             | jq -e '.services.web.environment.StemStudio__Recording__TestLoopback == "true"
                     and ([.services[] | select(.environment.StemStudio__Recording__TestLoopback != null)] | length == 1)'
      - name: The key ring volume api-keys is at /keys in api only, in every combination (011 claude-key)
        run: |
          scripts/check-key-volume.sh
          scripts/check-key-volume.sh -f docker-compose.yml -f docker-compose.gpu.yml
          scripts/check-key-volume.sh -f docker-compose.yml -f docker-compose.gpu.yml -f docker-compose.generative.yml
          scripts/check-key-volume.sh -f docker-compose.yml -f docker-compose.generative.yml -f docker-compose.generative-fake.yml
      - name: Build the fake generator image (GENERATOR_VARIANT=fake) and run the guard (profile generator)
        run: scripts/check-cpu-image.sh --build --generator stemstudio/generator:ci-fake
      - name: The fake image runs as the non-root user stemstudio (uid 10001)
        run: |
          user="$(docker image inspect --format '{{.Config.User}}' stemstudio/generator:ci-fake)"
          test "$user" = stemstudio || { echo "::error::image user is '$user'"; exit 1; }
          docker run --rm --network none --entrypoint id stemstudio/generator:ci-fake

  licences:
    name: Licence report (NuGet, Python, npm)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: |
            worker/uv.lock
            generator/uv.lock
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Prepare report folder
        run: mkdir -p licence-report
      - name: NuGet (nuget-license 4.0.18, transitive)
        run: |
          dotnet restore StemStudio.slnx
          dotnet dnx nuget-license@4.0.18 --yes -- -i StemStudio.slnx -t -o Markdown -fo licence-report/nuget.md
      - name: Python worker runtime dependencies (pip-licenses 5.5.5)
        working-directory: worker
        run: |
          uv sync --frozen --no-dev
          uv run --frozen --no-dev --with pip-licenses==5.5.5 pip-licenses --from=mixed --with-urls --format=markdown --output-file ../licence-report/python-worker.md
      - name: Python generator runtime dependencies, base install (pip-licenses 5.5.5; the GPU extras come from scripts/image-licences.sh)
        working-directory: generator
        run: |
          uv sync --frozen --no-dev
          uv run --frozen --no-dev --with pip-licenses==5.5.5 pip-licenses --from=mixed --with-urls --format=markdown --output-file ../licence-report/python-generator.md
      - name: npm (license-checker 25.0.1)
        run: |
          (cd src/audio-engine && npm ci --no-audit --no-fund)
          npx --yes license-checker@25.0.1 --start src/audio-engine --markdown --out licence-report/npm-audio-engine.md
          (cd src/web-interop && npm ci --no-audit --no-fund)
          npx --yes license-checker@25.0.1 --start src/web-interop --markdown --out licence-report/npm-web-interop.md
          (cd e2e && npm ci --no-audit --no-fund)
          npx --yes license-checker@25.0.1 --start e2e --markdown --out licence-report/npm-e2e.md
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: licence-report
          path: licence-report/

  e2e:
    name: E2E main flow (compose, fake separator, Playwright)
    needs: [dotnet, worker, generator, audio-engine, web-interop, soundtouch, contracts, secret-scan, quality, e2e-lint]
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      STEMSTUDIO_SEPARATOR: fake
      # The @detail specs expect a fake detail phase of ~25 s (e2e/support/env.ts): long enough
      # to cancel the shared plain track's phase before it completes.
      STEMSTUDIO_FAKE_DETAIL_STEP_SECONDS: 5
      # Feature 011: the default suite runs with the agent off (quickstart A6, SC-005); the agent
      # steps below recreate only the api with fake / none. There is no Ollama and no Claude key here.
      STEMSTUDIO_AGENT_BACKEND: none
      E2E_BASE_URL: http://localhost:8080
      E2E_API_URL: http://localhost:8081
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: worker/uv.lock
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install ffmpeg (MP3 fixture encoder)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Generate audio fixtures
        # Every generator (detail, artwork, lyrics, scores, voices, ...), as in the fake-stack action.
        run: |
          for generator in tests/fixtures/generate_*.py; do
            uv run --project worker --frozen python "${generator}"
          done
          # 015: fake capture inputs, click stem and silence for project `recording` (module run from tests/fixtures).
          (cd tests/fixtures && uv run --project ../../worker --frozen python -m recording.generate_recording_fixtures)
      - name: Backups folder for the api (uid 1654, temporary) and the e2e override (013 FR-005)
        # COMPOSE_FILE adds docker-compose.e2e.yml (library job throttle) to every later
        # `docker compose` call of this job; E2E_BACKUP_DIR / E2E_LIBRARY_THROTTLE are for the specs.
        run: |
          backups="$RUNNER_TEMP/stemstudio-backups"
          mkdir -p "$backups" && sudo chown 1654:1654 "$backups"
          {
            echo "STEMSTUDIO_BACKUP_HOST_DIR=$backups"
            echo "E2E_BACKUP_DIR=$backups"
            echo "E2E_LIBRARY_THROTTLE=1"
            echo "COMPOSE_FILE=docker-compose.yml:docker-compose.e2e.yml"
          } >> "$GITHUB_ENV"
          scripts/check-backup-folder.sh --folder "$backups"
      - name: Start the stack (fake separator) and wait for health
        run: docker compose up -d --build --wait --wait-timeout 300
      - name: Health smoke test
        run: |
          curl --fail --silent --show-error http://localhost:8081/health
          curl --fail --silent --show-error http://localhost:8080/health
          docker compose exec -T worker python -c "import urllib.request as u; print(u.urlopen('http://127.0.0.1:8000/health').read().decode())"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: soundtouch-wasm
          path: ${{ runner.temp }}/soundtouch
      - name: The web serves soundtouch.wasm (application/wasm, equal to the reproducible build) and /third-party/soundtouch complete (012 FR-006)
        run: scripts/check-soundtouch-served.sh --expect-wasm "$RUNNER_TEMP/soundtouch/soundtouch.wasm" "$E2E_BASE_URL"
      - name: The api container has no Claude key (bare pass-through, CI never sets it; 011 SC-006)
        run: docker compose exec -T api sh -c 'test -z "${ANTHROPIC_API_KEY+set}"'
      - name: Worker sees the API library read-only at /library (007 FR-012, ADR-016 D5)
        run: scripts/check-library-mount.sh
      - name: The api writes the backups folder as its own user at /backups (013 FR-005)
        run: |
          docker compose exec -T api sh -c 'test "$StemStudio__BackupDir" = /backups && probe=/backups/.ci-probe && touch "$probe" && rm "$probe"'
          docker compose exec -T worker sh -c 'test ! -e /backups'
          docker compose exec -T api sh -c 'test "$StemStudio__LibraryCare__ThrottleBytesPerSecond" -gt 0'
      - name: The api sees the fake lyric scripts read-only at /lyric-scripts, and the image stays within +15 MB of dictionaries (023 T069)
        run: |
          docker compose exec -T api sh -c 'test "$STEMSTUDIO_LYRIC_ASSIST_FAKE_SCRIPT" = /lyric-scripts && ls /lyric-scripts/*.json >/dev/null && ! touch /lyric-scripts/.ci-probe 2>/dev/null'
          docker compose exec -T worker sh -c 'test ! -e /lyric-scripts'
          scripts/check-api-image-size.sh --image stemstudio/api:local
      - name: Install Playwright browsers
        working-directory: e2e
        run: |
          npm ci --no-audit --no-fund
          # "chromium" installs the full build next to the headless shell; the 010 recording spec
          # (fake microphone) needs the full build via channel 'chromium' (support/fake-microphone.ts).
          npx playwright install --with-deps chromium firefox
      - name: Sound server for Firefox (null sink)
        # Headless Firefox needs a PulseAudio server, or its Web Audio clock never runs (silent
        # meters, no karaoke landings); Chromium does not. The null sink plays into nothing.
        run: |
          sudo apt-get install -y --no-install-recommends pulseaudio
          pulseaudio --start --exit-idle-time=-1
          pactl load-module module-null-sink sink_name=ci_null
          pactl set-default-sink ci_null
      - name: Playwright (retries 0, everything except @real and @restart)
        working-directory: e2e
        run: npm test
      - name: Play-along recording specs, full Chromium build with fake capture and the digital loopback (015 T010; npm run test:recording)
        working-directory: e2e
        env:
          # The e2e override runs the web with StemStudio__Recording__TestLoopback=true.
          E2E_RECORDING_LOOPBACK: "1"
        run: npm run test:recording
      - name: Practice flow without detection on complete, sections scenario 4 (014 T060; npm run test:practice-flow-no-detect)
        run: |
          STEMSTUDIO_SECTION_DETECT_ON_COMPLETE=false docker compose up -d --wait --wait-timeout 180 api
          (cd e2e && E2E_SECTION_DETECT_ON_COMPLETE=false npm run test:practice-flow-no-detect)
          docker compose up -d --wait --wait-timeout 180 api
      - name: Restart api and web, then the @restart persistence spec (FR-022)
        run: |
          docker compose restart api web
          docker compose up -d --wait --wait-timeout 180 api web
          (cd e2e && npm run test:restart)
      - name: Agent specs with the fake backend, one api start per e2e/agent-scripts file (011 T059, A5)
        run: scripts/agent-e2e.sh fake
      - name: Agent unavailable spec with backend none (011 T059, A6, SC-005)
        run: scripts/agent-e2e.sh none
      - name: Lyric assistant specs with the fake model and /lyric-scripts (023 T069/T070, quickstart Q1-Q5; npm run test:lyric-assist)
        run: scripts/lyric-e2e.sh fake
      - name: Lyric assistant unavailable spec with backend none, no outbound request (023 Q6; npm run test:lyric-assist-none)
        run: scripts/lyric-e2e.sh none
      - name: Fake GPU (STEMSTUDIO_FAKE_DEVICE=gpu), then the @gpu specs (003, US3)
        env:
          STEMSTUDIO_FAKE_DEVICE: gpu
        run: |
          # Only the worker's environment changes, so compose recreates just the worker.
          docker compose up -d --wait --wait-timeout 300
          docker compose exec -T worker python -c "import urllib.request as u; print(u.urlopen('http://127.0.0.1:8000/health').read().decode())"
          (cd e2e && npm run test:gpu)
      - name: Fake GPU that runs out of memory (STEMSTUDIO_FAKE_DEVICE=gpu-oom), then the @gpu specs (003, SC-004)
        env:
          STEMSTUDIO_FAKE_DEVICE: gpu-oom
        run: |
          docker compose up -d --wait --wait-timeout 300
          docker compose exec -T worker python -c "import urllib.request as u; print(u.urlopen('http://127.0.0.1:8000/health').read().decode())"
          (cd e2e && npm run test:gpu)
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: playwright-report
          path: |
            e2e/playwright-report/
            e2e/test-results/
          if-no-files-found: warn
      - name: Compose logs on failure
        if: failure()
        run: docker compose logs --no-color --timestamps
      - name: Stop the stack
        if: always()
        run: docker compose down -v

  # Feature 004 browser suites against the fake stack (tasks.md T009). scripts/ci-e2e-suite.sh passes
  # while a suite has no specs yet; once qa adds them these jobs are required checks on PRs.
  visual:
    name: Visual regression (Playwright container, fake stack)
    needs: [web-interop, e2e-lint]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      E2E_BASE_URL: http://localhost:8080
      E2E_API_URL: http://localhost:8081
      # true only on a manual run with "update baselines" ticked; empty on push and PR.
      UPDATE_BASELINES: ${{ inputs.update-baselines }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/fake-stack
        with:
          uv-version: ${{ env.UV_VERSION }}
          node-version: ${{ env.NODE_VERSION }}
      - name: Compare screenshots (image version = @playwright/test pin)
        if: env.UPDATE_BASELINES != 'true'
        run: scripts/playwright-container.sh scripts/ci-e2e-suite.sh test:visual visual
      - name: Regenerate baselines (workflow_dispatch, review only)
        if: env.UPDATE_BASELINES == 'true'
        run: scripts/playwright-container.sh scripts/ci-e2e-suite.sh test:visual visual --update-snapshots
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: env.UPDATE_BASELINES == 'true'
        with:
          name: visual-baselines
          path: e2e/visual/__screenshots__/
          if-no-files-found: warn
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: visual-report
          path: |
            e2e/playwright-report/
            e2e/test-results/
          if-no-files-found: ignore
      - name: Compose logs on failure
        if: failure()
        run: docker compose logs --no-color --timestamps
      - name: Stop the stack
        if: always()
        run: docker compose down -v

  a11y:
    name: Accessibility scans (axe, Playwright container, fake stack)
    needs: [web-interop, e2e-lint]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      E2E_BASE_URL: http://localhost:8080
      E2E_API_URL: http://localhost:8081
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/fake-stack
        with:
          uv-version: ${{ env.UV_VERSION }}
          node-version: ${{ env.NODE_VERSION }}
      - name: axe scans, every screen x level x theme (SC-001)
        run: scripts/playwright-container.sh scripts/ci-e2e-suite.sh test:a11y a11y
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: a11y-report
          path: |
            e2e/playwright-report/
            e2e/test-results/
          if-no-files-found: ignore
      - name: Compose logs on failure
        if: failure()
        run: docker compose logs --no-color --timestamps
      - name: Stop the stack
        if: always()
        run: docker compose down -v

  lighthouse:
    name: Lighthouse CI budgets (fake stack, SC-003)
    needs: [web-interop, e2e-lint]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      E2E_BASE_URL: http://localhost:8080
      E2E_API_URL: http://localhost:8081
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/fake-stack
        with:
          uv-version: ${{ env.UV_VERSION }}
          node-version: ${{ env.NODE_VERSION }}
      - name: Install the e2e package (@lhci/cli; Chrome comes with the runner image)
        working-directory: e2e
        run: npm ci --no-audit --no-fund
      - name: Lighthouse CI (e2e/lighthouserc.json)
        run: scripts/ci-e2e-suite.sh test:lighthouse lighthouserc.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: lighthouse-report
          path: e2e/.lighthouseci/
          if-no-files-found: ignore
          include-hidden-files: true
      - name: Compose logs on failure
        if: failure()
        run: docker compose logs --no-color --timestamps
      - name: Stop the stack
        if: always()
        run: docker compose down -v
