# StemStudio CI: build, lint, test and gate every component at >= 90 % line AND branch coverage,
# then run the Playwright main flow against the compose stack with the fake separator.
# Actions are pinned to commit SHAs (tag in the comment). No secrets are used.
name: ci

on:
  push:
    branches: [main, "0*-**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: "1"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "1"
  UV_VERSION: "0.13.5"
  NODE_VERSION: "22"
  REDOCLY_CLI: "@redocly/cli@2.78.0"
  CONTRACTS_DIR: specs/001-stemstudio-mvp/contracts

jobs:
  dotnet:
    name: .NET build, format, test (coverage gate)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - name: Restore tools and packages
        run: |
          dotnet tool restore
          dotnet restore StemStudio.slnx
      - name: Build (warnings are errors)
        run: dotnet build StemStudio.slnx -c Release --no-restore
      - name: Format check
        run: dotnet format StemStudio.slnx --verify-no-changes --no-restore
      - name: Test with per-component 90 % line+branch gate (Directory.Build.props, ADR-006)
        run: dotnet test StemStudio.slnx -c Release --no-build -p:CollectCoverage=true
      - name: Coverage summary
        if: always()
        shell: python
        run: |
          # Reads the coverage files this job just produced (trusted input; no external XML).
          import glob, os, xml.etree.ElementTree as ET
          rows = ["| Test project | Line % | Branch % |", "|---|---|---|"]
          for path in sorted(glob.glob("tests/*/TestResults/coverage/coverage.cobertura.xml")):
              root = ET.parse(path).getroot()
              name = path.split("/")[1]
              rows.append(f"| {name} | {float(root.get('line-rate', 0)) * 100:.1f} | {float(root.get('branch-rate', 0)) * 100:.1f} |")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
              summary.write("### .NET coverage\n\n" + "\n".join(rows) + "\n")
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: coverage-dotnet
          path: tests/*/TestResults/coverage/
          if-no-files-found: warn

  sonar:
    name: SonarQube analysis (.NET; runs only when the SONAR_TOKEN secret exists)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      # Secrets cannot be used in an `if:` directly; expose them as env and test that instead.
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}
    steps:
      - name: Sonar not configured
        if: env.SONAR_TOKEN == ''
        run: echo "::notice::SONAR_TOKEN secret not set; SonarQube analysis skipped"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: env.SONAR_TOKEN != ''
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        if: env.SONAR_TOKEN != ''
        with:
          global-json-file: global.json
      - name: Scan (sonarscanner from dotnet-tools.json; token only from the secret)
        if: env.SONAR_TOKEN != ''
        run: |
          dotnet tool restore
          dotnet sonarscanner begin /k:stemstudio \
            /d:sonar.host.url="${SONAR_HOST_URL:-https://sonarcloud.io}" \
            /d:sonar.token="$SONAR_TOKEN" \
            /d:sonar.cs.opencover.reportsPaths="tests/**/TestResults/coverage/coverage.opencover.xml"
          dotnet build StemStudio.slnx -c Release
          dotnet test StemStudio.slnx -c Release --no-build -p:CollectCoverage=true
          dotnet sonarscanner end /d:sonar.token="$SONAR_TOKEN"

  worker:
    name: Worker lint, types, tests (coverage gate) + fixture generator
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: worker/uv.lock
      - name: Install ffmpeg and libsndfile
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg libsndfile1
      - name: Sync (frozen lock)
        working-directory: worker
        run: |
          uv lock --check
          uv sync --frozen
      - name: Ruff
        working-directory: worker
        run: |
          uv run --frozen ruff check .
          uv run --frozen ruff format --check .
      - name: Mypy (strict)
        working-directory: worker
        run: uv run --frozen mypy src tests
      - name: Pytest with 90 % line+branch gate
        working-directory: worker
        run: uv run --frozen pytest --cov --cov-branch --cov-report=term --cov-report=xml --cov-fail-under=90
      - name: Fixture generator lint, types, tests (qa, tests/fixtures)
        if: hashFiles('tests/fixtures/tests/**') != ''
        run: |
          uv run --project worker --frozen ruff check tests/fixtures
          uv run --project worker --frozen ruff format --check tests/fixtures
          uv run --project worker --frozen mypy --strict tests/fixtures
          uv run --project worker --frozen pytest tests/fixtures/tests --cov=tests/fixtures --cov-branch --cov-report=term --cov-fail-under=90
      - name: Fixture generator missing
        if: hashFiles('tests/fixtures/tests/**') == ''
        run: echo "::warning::tests/fixtures/tests not found; fixture generator checks skipped"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: coverage-worker
          path: worker/coverage.xml
          if-no-files-found: warn

  audio-engine:
    name: Audio engine lint, types, tests (coverage gate), build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: src/audio-engine
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: src/audio-engine/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run typecheck
      - name: Tests with 90 % thresholds (vitest.config.ts)
        run: npm run test:coverage
      - run: npm run build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: coverage-audio-engine
          path: src/audio-engine/coverage/
          if-no-files-found: warn

  contracts:
    name: OpenAPI contracts lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Redocly lint
        run: >-
          npx --yes "$REDOCLY_CLI" lint --config "$CONTRACTS_DIR/redocly.yaml"
          "$CONTRACTS_DIR/worker-api.openapi.yaml" "$CONTRACTS_DIR/backend-api.openapi.yaml"

  quality:
    name: Quality gate (SIG checks) and its own tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Quality tools missing
        if: hashFiles('tools/quality/run_all.py') == ''
        run: echo "::warning::tools/quality/run_all.py not found; quality gate skipped"
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        if: hashFiles('tools/quality/run_all.py') != ''
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tools/quality/requirements.txt
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: hashFiles('tools/quality/run_all.py') != ''
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install quality tooling
        if: hashFiles('tools/quality/run_all.py') != ''
        run: python -m pip install -r tools/quality/requirements.txt ruff==0.17.5 mypy==2.4.1 pytest==9.2.0 pytest-cov==7.1.0
      - name: Lint, types and tests of tools/quality (>= 90 % line+branch)
        if: hashFiles('tools/quality/run_all.py') != ''
        run: |
          ruff check tools/quality
          ruff format --check tools/quality
          mypy --strict --config-file tools/quality/pyproject.toml tools/quality
          pytest tools/quality/tests --cov=tools/quality --cov-branch --cov-config=tools/quality/pyproject.toml --cov-report=term --cov-fail-under=90
      - name: SIG checks on the whole code base (unit size, complexity, parameters, duplication, dependencies)
        if: hashFiles('tools/quality/run_all.py') != ''
        run: python tools/quality/run_all.py --report "$RUNNER_TEMP/SIG-REPORT.md"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always() && hashFiles('tools/quality/run_all.py') != ''
        with:
          name: sig-report
          path: ${{ runner.temp }}/SIG-REPORT.md
          if-no-files-found: warn

  e2e-lint:
    name: E2E suite lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: E2E suite missing
        if: hashFiles('e2e/package-lock.json') == ''
        run: echo "::warning::e2e/ not found; E2E lint skipped"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: hashFiles('e2e/package-lock.json') != ''
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      - name: npm ci && npm run lint
        if: hashFiles('e2e/package-lock.json') != ''
        working-directory: e2e
        run: |
          npm ci --no-audit --no-fund
          npm run lint

  licences:
    name: Licence report (NuGet, Python, npm)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: worker/uv.lock
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Prepare report folder
        run: mkdir -p licence-report
      - name: NuGet (nuget-license 4.0.18, transitive)
        run: |
          dotnet restore StemStudio.slnx
          dotnet dnx nuget-license@4.0.18 --yes -- -i StemStudio.slnx -t -o Markdown -fo licence-report/nuget.md
      - name: Python worker runtime dependencies (pip-licenses 5.5.5)
        working-directory: worker
        run: |
          uv sync --frozen --no-dev
          uv run --frozen --no-dev --with pip-licenses==5.5.5 pip-licenses --from=mixed --with-urls --format=markdown --output-file ../licence-report/python-worker.md
      - name: npm (license-checker 25.0.1)
        run: |
          (cd src/audio-engine && npm ci --no-audit --no-fund)
          npx --yes license-checker@25.0.1 --start src/audio-engine --markdown --out licence-report/npm-audio-engine.md
          if [ -f e2e/package-lock.json ]; then
            (cd e2e && npm ci --no-audit --no-fund)
            npx --yes license-checker@25.0.1 --start e2e --markdown --out licence-report/npm-e2e.md
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: licence-report
          path: licence-report/

  e2e:
    name: E2E main flow (compose, fake separator, Playwright)
    needs: [dotnet, worker, audio-engine, contracts, quality, e2e-lint]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      STEMSTUDIO_SEPARATOR: fake
      E2E_BASE_URL: http://localhost:8080
      E2E_API_URL: http://localhost:8081
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: E2E suite missing
        if: hashFiles('e2e/package-lock.json') == ''
        run: echo "::warning::e2e/ not found; only the compose health smoke test runs"
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: worker/uv.lock
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Generate audio fixtures
        if: hashFiles('tests/fixtures/generate_fixtures.py') != ''
        run: uv run --project worker --frozen python tests/fixtures/generate_fixtures.py
      - name: Start the stack (fake separator) and wait for health
        run: docker compose up -d --build --wait --wait-timeout 300
      - name: Health smoke test
        run: |
          curl --fail --silent --show-error http://localhost:8081/health
          curl --fail --silent --show-error http://localhost:8080/health
          docker compose exec -T worker python -c "import urllib.request as u; print(u.urlopen('http://127.0.0.1:8000/health').read().decode())"
      - name: Install Playwright browsers
        if: hashFiles('e2e/package-lock.json') != ''
        working-directory: e2e
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium firefox
      - name: Playwright (retries 0)
        if: hashFiles('e2e/package-lock.json') != ''
        working-directory: e2e
        run: npm test
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always() && hashFiles('e2e/package-lock.json') != ''
        with:
          name: playwright-report
          path: |
            e2e/playwright-report/
            e2e/test-results/
          if-no-files-found: warn
      - name: Compose logs on failure
        if: failure()
        run: docker compose logs --no-color --timestamps
      - name: Stop the stack
        if: always()
        run: docker compose down -v
