[project]
name = "stemstudio-worker"
version = "0.1.0"
description = "StemStudio processing worker: ingest, stem separation (Demucs) and beat analysis behind a FastAPI job API."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "MIT"
# Versions are locked in uv.lock; ranges here state what is known to work together (ADR-003, research.md R-03).
dependencies = [
    "fastapi>=0.163,<1",
    "uvicorn[standard]==0.23.2",   # spotdl 4.6 pins uvicorn <0.24
    "python-multipart>=0.0.33,<0.1",
    "pydantic>=2.14,<3",
    "yt-dlp>=2026.10.26",          # keep current: YouTube changes often break older releases
    "spotdl==4.6.0",
    "demucs==4.1.0",               # 4.1.0 drops torchaudio, ships demucs.api; models via huggingface-hub
    "torch==2.15.0",               # CPU wheels from the pytorch-cpu index (see [tool.uv.sources])
    "soundfile>=0.14,<1",
    "librosa>=1.0.1,<2",
    "numpy>=2.5,<3",
]

[project.scripts]
stemstudio-worker = "stemstudio_worker.main:run"

[dependency-groups]
dev = [
    "pytest>=9.2,<10",
    "pytest-cov>=7.1,<8",
    "httpx>=0.28,<1",
    "ruff>=0.17,<0.18",
    "mypy>=2.4,<3",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/stemstudio_worker"]

# CPU-only torch wheels (the MVP defaults to CPU; see ADR-003).
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[tool.uv]
# Supported platforms: Windows (local dev) and Linux x86_64/aarch64 (Docker, CI).
environments = [
    "sys_platform == 'win32'",
    "sys_platform == 'linux'",
]

# ------------------------------------------------------------------ pytest / coverage
[tool.pytest.ini_options]
minversion = "9.0"
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--import-mode=importlib", "-m", "not integration"]
markers = [
    "integration: runs real external tools or models (Demucs, ffmpeg, network); deselected by default",
]

[tool.coverage.run]
source = ["stemstudio_worker"]
branch = true

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = false
exclude_also = [
    "\\.\\.\\.$",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
]

# ------------------------------------------------------------------ ruff
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "N", "UP", "B", "A", "C4", "SIM", "PTH", "RET", "ARG", "PL", "S",
    "D", "C90", "T20", "ERA", "RUF",
]
ignore = [
    "D203",  # one-blank-line-before-class (conflicts with D211)
    "D213",  # multi-line-summary-second-line (conflicts with D212)
]

[tool.ruff.lint.mccabe]
max-complexity = 5

[tool.ruff.lint.pylint]
max-args = 4
max-statements = 15
max-branches = 5
max-returns = 4

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "D", "PLR2004", "ARG"]

[tool.ruff.lint.pydocstyle]
convention = "google"

# ------------------------------------------------------------------ mypy
[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["stemstudio_worker"]
plugins = ["pydantic.mypy"]
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["librosa.*", "soundfile.*", "demucs.*", "yt_dlp.*", "spotdl.*", "julius.*", "numba.*"]
ignore_missing_imports = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true
