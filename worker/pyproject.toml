[project]
name = "stemstudio-worker"
version = "0.1.0"
description = "StemStudio processing worker: ingest, stem separation (Demucs) and beat analysis behind a FastAPI job API."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "MIT"
# Versions are locked in uv.lock; ranges here state what is known to work together (ADR-003, research.md R-03).
dependencies = [
    "fastapi==0.162.0",            # newest before 2026-11-01; 0.162.1+ are < 2 weeks old
    "uvicorn[standard]==0.23.2",   # spotdl 4.6 pins uvicorn <0.24
    "python-multipart>=0.0.33,<0.1",
    "pydantic>=2.14,<3",
    "yt-dlp>=2026.10.26",          # keep current: YouTube changes often break older releases
    "spotdl==4.6.0",
    "demucs==4.1.0",               # 4.1.0 drops torchaudio, ships demucs.api; models via huggingface-hub
    "torch==2.15.0",               # CPU wheels from the pytorch-cpu index (see [tool.uv.sources])
    "soundfile>=0.14,<1",
    "librosa>=1.0.1,<2",
    "numpy>=2.5,<3",
    "onnxruntime==1.32.0",         # UVR MDX-Net KARA 2 (detail vocals, ADR-010), MIT
    "rotary-embedding-torch==0.9.2",  # BS-RoFormer (vendored MSST code, ADR-010), MIT
    "nvidia-ml-py==13.615.71",     # NVML free-memory reads for the GPU policy (ADR-012), BSD-3, pure Python
    "tinytag==2.3.2",              # embedded cover + tags of uploads (feature 005, ADR-014), MIT, no deps
    "pillow==13.0.0",              # artwork normalisation (005); was transitive, MIT-CMU
    "httpx==0.28.1",               # online lookups (005); was a dev dependency, BSD-3-Clause
    "rapidfuzz==3.14.6",           # recording matcher (005); was transitive, MIT
    "lameenc==1.9.0",              # MP3 encoding of exports (feature 007, ADR-016); was transitive, LGPL-3.0-or-later
    # Feature 006 (ADR-015): lyrics alignment with stable-ts + Whisper large-v3-turbo; LRCLIB lyricsfile YAML.
    "stable-ts==2.19.1",           # MIT; needs openai-whisper<=20250625 and torchaudio
    "openai-whisper==20250625",    # MIT; its triton requirement is dropped by the override below (CPU image)
    "torchaudio==2.11.1",          # BSD-2-Clause; newest build, works next to torch 2.15 (006 Phase 0 P0-1)
    "tiktoken==0.14.0",            # MIT (whisper tokenizer)
    "more-itertools==11.2.1",      # MIT (whisper, music21)
    "pyyaml==6.0.3",               # MIT; was a dev dependency; lyricsfile parsing (yaml.safe_load only)
    # Feature 008 (ADR-017): notation and engraving; basic-pitch and the piano CRNN are vendored subsets.
    "music21==10.5.2",             # BSD-3-Clause; matplotlib excluded by the override below (008 Phase 0)
    "verovio==6.4.0",              # LGPL-3.0-only, unmodified wheel; 6.4.1 is < 2 weeks old, same Leipzig.css
    "cairosvg==2.9.1",             # LGPL-3.0-or-later, unmodified (SVG -> PDF)
    "pypdf==7.0.0",               # BSD-3-Clause; 7.x is < 2 weeks old
    "torchlibrosa==0.1.0",         # MIT (piano CRNN feature layers)
    "soxr==1.1.0",
    # Feature 014 (ADR-023): setlist PDFs; pure-Python wheel, deps pillow + charset-normalizer already locked.
    "reportlab==5.1.0",            # BSD-3-Clause-style ReportLab licence; no extras (accel, pycairo, bidi, shaping)
    # Feature 020 (ADR-029 D7): lesson handouts as HTML + CSS paged media; needs system Pango >= 1.44.
    "weasyprint==70.0",            # BSD-3-Clause (2026-09-08); deps pydyf, tinyhtml5, pyphen (MPL-1.1 option), fonttools[woff]
    "jinja2==3.1.6",               # BSD-3-Clause; was transitive, now direct (handout templates, autoescape)
    "fonttools==4.68.0",           # MIT; was transitive (weasyprint), now direct: glyphs.py reads the font cmaps
    "threadpoolctl==3.8.0",        # BSD-3-Clause; was transitive (scikit-learn), now direct: insights lane caps BLAS threads
]

[project.scripts]
stemstudio-worker = "stemstudio_worker.main:run"

[dependency-groups]
dev = [
    "pytest>=9.2,<10",
    "pytest-cov>=7.1,<8",
    "ruff>=0.17,<0.18",
    "mypy>=2.4,<3",
    "jsonschema>=4.26,<5",
    "types-pyyaml>=6.0.12.20261030,<7",
    "types-jsonschema>=4.26.0.20261006,<5",
    "pytest-timeout>=2.4,<2.5",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/stemstudio_worker"]

# CPU-only torch wheels (the MVP defaults to CPU; see ADR-003).
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchaudio = { index = "pytorch-cpu" }

[tool.uv]
# Supported platforms: Windows (local dev) and Linux x86_64/aarch64 (Docker, CI).
environments = [
    "sys_platform == 'win32'",
    "sys_platform == 'linux'",
]
# triton (openai-whisper, Linux x86_64) bundles NVIDIA binaries and is never imported for CPU
# tensors: dropped from the CPU lock so the 003 CPU-image guard holds; the GPU image keeps the
# triton that torch cu132 brings (ADR-011, 006 Phase 0). matplotlib is a music21 dependency
# that music21 imports lazily; key analysis, MusicXML and MIDI work without it (008 Phase 0).
override-dependencies = [
    "triton ; sys_platform == 'never'",
    "matplotlib ; sys_platform == 'never'",
]
# Transitive packages whose newest release is less than two weeks old (supply-chain rule).
constraint-dependencies = [
    "regex==2026.9.29",
]

# ------------------------------------------------------------------ pytest / coverage
[tool.pytest.ini_options]
minversion = "9.0"
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--import-mode=importlib", "-m", "not integration"]
markers = [
    "integration: runs real external tools or models (Demucs, ffmpeg, network); deselected by default",
]

[tool.coverage.run]
source = ["stemstudio_worker"]
branch = true
# Vendored third-party inference code (MIT, ZFTurbo MSST); covered by the detail integration test
# instead (plan.md Complexity Tracking, accepted by CTO 2026-11-15). Feature 008: the vendored
# basic-pitch (Apache-2.0) and piano-transcription (MIT) subsets, same rule (CTO 2026-11-15).
# Feature 016: the vendored BTC subset (MIT), covered by the chords integration test (T063).
omit = ["*/stemstudio_worker/detail/vendor/*", "*/stemstudio_worker/transcription/vendor/*",
        "*/stemstudio_worker/harmony/vendor/*"]

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = false
exclude_also = [
    "\\.\\.\\.$",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
]

# ------------------------------------------------------------------ ruff
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
extend-exclude = ["src/stemstudio_worker/detail/vendor", "src/stemstudio_worker/transcription/vendor",
                  "src/stemstudio_worker/harmony/vendor"]

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "N", "UP", "B", "A", "C4", "SIM", "PTH", "RET", "ARG", "PL", "S",
    "D", "C90", "T20", "ERA", "RUF",
]
ignore = [
    "D203",  # one-blank-line-before-class (conflicts with D211)
    "D213",  # multi-line-summary-second-line (conflicts with D212)
]

[tool.ruff.lint.mccabe]
max-complexity = 5

[tool.ruff.lint.pylint]
max-args = 4
max-statements = 15
max-branches = 5
max-returns = 4

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "D", "PLR2004", "ARG"]

[tool.ruff.lint.pydocstyle]
convention = "google"

# ------------------------------------------------------------------ mypy
[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["stemstudio_worker"]
plugins = ["pydantic.mypy"]
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["librosa.*", "soundfile.*", "demucs.*", "yt_dlp.*", "spotdl.*", "julius.*", "numba.*",
          "sklearn.*",  # sklearn: feature 014 section clusters (a librosa dependency)
          "scipy.*"]  # scipy: feature 020 insights tests (signal, stats); ships no type information
ignore_missing_imports = true

[[tool.mypy.overrides]]
# Vendored third-party code (plan.md Complexity Tracking).
module = ["stemstudio_worker.detail.vendor.*", "stemstudio_worker.transcription.vendor.*",
          "stemstudio_worker.harmony.vendor.*"]
ignore_errors = true

[[tool.mypy.overrides]]
module = ["onnxruntime.*", "rotary_embedding_torch.*", "einops.*", "pynvml.*", "soxr.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# Features 006 and 008: packages without type information (lazy imports in the adapters).
module = [
    "stable_whisper.*", "whisper.*", "torchaudio.*", "music21.*", "verovio.*", "cairosvg.*",
    "torchlibrosa.*", "fontTools.*",
    "reportlab.*",  # feature 014 setlist PDFs (ADR-023); ReportLab ships no type information
    "weasyprint.*",  # feature 020 handouts (ADR-029); WeasyPrint ships no type information
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# Feature 007 MP3 encoder: a C extension without type information (tinytag 2.3.2 ships py.typed).
module = ["lameenc.*"]
ignore_missing_imports = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true
