[project]
name = "stemstudio-quality"
version = "0.1.0"
description = "StemStudio quality gate: SIG unit metrics (lizard), duplication (jscpd) and dependency direction."
requires-python = ">=3.12,<3.13"
license = "MIT"
dependencies = [
    "lizard==1.25.1",
]

[dependency-groups]
dev = [
    "pytest>=9.2,<10",
    "pytest-cov>=7.1,<8",
    "ruff>=0.17,<0.18",
    "mypy>=2.4,<3",
]

[tool.uv]
# Flat scripts (python tools/quality/run_all.py), not an installable package.
package = false
environments = [
    "sys_platform == 'win32'",
    "sys_platform == 'linux'",
]

# ------------------------------------------------------------------ pytest / coverage
[tool.pytest.ini_options]
minversion = "9.0"
testpaths = ["tests"]
pythonpath = [".", "tests"]
addopts = ["-ra", "--strict-markers", "--import-mode=importlib"]

[tool.coverage.run]
branch = true
source = ["."]
omit = ["tests/*"]

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = false
exclude_also = [
    "if __name__ == .__main__.:",
]

# ------------------------------------------------------------------ ruff (same SIG limits as the worker)
[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["tests/samples"]

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "N", "UP", "B", "A", "C4", "SIM", "PTH", "RET", "ARG", "PL", "S",
    "D", "C90", "T20", "ERA", "RUF",
]
ignore = [
    "D203",  # one-blank-line-before-class (conflicts with D211)
    "D213",  # multi-line-summary-second-line (conflicts with D212)
]

[tool.ruff.lint.mccabe]
max-complexity = 5

[tool.ruff.lint.pylint]
max-args = 4
max-statements = 15
max-branches = 5
max-returns = 4

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "D", "PLR2004", "ARG"]

[tool.ruff.lint.pydocstyle]
convention = "google"

# ------------------------------------------------------------------ mypy
[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
files = ["."]
exclude = ["^tests/samples/"]

[[tool.mypy.overrides]]
module = ["lizard", "lizard.*", "lizard_languages.*"]
ignore_missing_imports = true
