# SonarQube configuration for StemStudio (owner: quality-gate; ADR-006 amendment K4).
#
# Single source of truth for analysis settings. Two ways to run an analysis:
#
# 1) Full multi-language analysis (C#, Python, TypeScript) with SonarScanner for .NET.
#    The .NET scanner takes its settings as /d: arguments on the begin step, and multi-language
#    analysis (sonar.scanner.scanAll) is on by default; Python files need scanner v10.0+.
#    sonar.sources/sonar.tests are not supported there, so tools/quality/sonar_args.py turns this
#    file into the begin arguments and leaves those two keys out:
#
#      dotnet tool restore
#      dotnet sonarscanner begin /k:stemstudio $(uv run --project tools/quality python tools/quality/sonar_args.py)
#      dotnet build StemStudio.slnx
#      dotnet test StemStudio.slnx -p:CollectCoverage=true          # -> tests/**/coverage.opencover.xml
#      (cd worker && uv run pytest --cov --cov-branch --cov-report=xml)  # -> worker/coverage.xml
#      (cd generator && uv run pytest --cov --cov-branch --cov-report=xml)  # -> generator/coverage.xml
#      (cd src/audio-engine && npm run test:coverage)               # -> coverage/lcov.info
#      (cd src/web-interop && npm run test:coverage)                # -> coverage/lcov.info
#      dotnet sonarscanner end
#
#    The token is read from the SONAR_TOKEN environment variable (CI secret). Never put it in
#    this file or on a command line. If your scanner version does not read SONAR_TOKEN, take it up
#    with devops (CI secret handling) instead of adding /d:sonar.token to a script.
#
# 2) Non-.NET only (Python + TypeScript) with the generic SonarScanner CLI, which reads this file
#    directly: `sonar-scanner` from the repository root (SONAR_TOKEN in the environment).

sonar.projectKey=stemstudio
sonar.projectName=StemStudio
sonar.sourceEncoding=UTF-8

# ---------------------------------------------------------------- sources and tests per component
sonar.sources=src,worker/src,generator/src,tools/quality
sonar.tests=tests,worker/tests,generator/tests,src/audio-engine/tests,src/web-interop/tests,tools/quality/tests
sonar.test.inclusions=tests/**,worker/tests/**,generator/tests/**,src/audio-engine/tests/**,src/web-interop/tests/**,tools/quality/tests/**,**/*.test.ts,**/*.spec.ts

# ---------------------------------------------------------------- exclusions (same as tools/quality/common.py)
sonar.exclusions=**/bin/**,**/obj/**,**/node_modules/**,**/.venv/**,**/Migrations/**,**/TestResults/**,**/coverage/**,**/dist/**,**/*.g.cs,**/*.generated.cs,**/*.Designer.cs,**/*.d.ts,src/StemStudio.Web/wwwroot/js/audio-engine.js,src/StemStudio.Web/wwwroot/js/audio-engine.js.map,src/StemStudio.Web/wwwroot/js/web-interop.js,src/StemStudio.Web/wwwroot/js/web-interop.js.map,src/StemStudio.Web/wwwroot/js/first-paint.js,src/StemStudio.Web/wwwroot/js/first-paint.js.map,tools/quality/tests/samples/**,worker/src/stemstudio_worker/detail/vendor/**,worker/src/stemstudio_worker/transcription/vendor/**
sonar.coverage.exclusions=**/Migrations/**,**/*.g.cs,**/*.generated.cs,tools/quality/tests/**,src/audio-engine/vite.config.ts,src/audio-engine/vitest.config.ts,src/audio-engine/eslint.config.js,src/web-interop/vite.config.ts,src/web-interop/vitest.config.ts,src/web-interop/eslint.config.js
# Deliberate SIG-breaching samples must not count as duplication either.
sonar.cpd.exclusions=tools/quality/tests/samples/**

# ---------------------------------------------------------------- coverage reports
# .NET: coverlet.msbuild OpenCover output per test project (Directory.Build.props, ADR-006)
sonar.cs.opencover.reportsPaths=tests/**/TestResults/coverage/coverage.opencover.xml
# Python worker and generator: pytest-cov XML (each run from its own folder)
sonar.python.coverage.reportPaths=worker/coverage.xml,generator/coverage.xml
sonar.python.version=3.12
# TypeScript audio engine and web-interop: Vitest v8 lcov
sonar.javascript.lcov.reportPaths=src/audio-engine/coverage/lcov.info,src/web-interop/coverage/lcov.info
