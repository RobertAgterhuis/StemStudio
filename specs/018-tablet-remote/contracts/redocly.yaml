# Lint configuration for the StemStudio OpenAPI 3.1 contracts of feature 018.
# Run from the repo root:
#   npx @redocly/cli@2.78.0 lint --config specs/018-tablet-remote/contracts/redocly.yaml \
#     specs/018-tablet-remote/contracts/backend-api.remote.openapi.yaml \
#     specs/018-tablet-remote/contracts/remote-lan.openapi.yaml
# (Phase 0 adds the full backend-api.openapi.yaml 1.17.0 = 017's 1.16.0 + the remote delta.)
extends:
  - recommended
rules:
  # GET settings/devices/info have no client-error cases; every other operation lists its 4XX responses.
  operation-4xx-response: warn
  # The WebSocket upgrade answers 101, not 2XX (1 known warning).
  operation-2xx-response: warn
  no-server-example.com: off
  no-unused-components: warn
