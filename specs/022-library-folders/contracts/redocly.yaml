# Lint configuration for the StemStudio OpenAPI 3.1 contracts (feature 022).
# Run from the repo root (the delta and the full 1.22.0; the full document has the 9 inherited 1.11.0 warnings):
#   npx @redocly/cli@2.78.0 lint --config specs/022-library-folders/contracts/redocly.yaml specs/022-library-folders/contracts/backend-api.library-folders.openapi.yaml specs/022-library-folders/contracts/backend-api.openapi.yaml
# Merge freshness and superset (newer contains older): python -I specs/022-library-folders/contracts/merge_full.py --check
extends:
  - recommended
rules:
  # The 022 operations all list their 4XX responses; the full document inherits 9 warnings of 1.11.0 (health, device, lists, status).
  operation-4xx-response: warn
  no-server-example.com: off
  no-unused-components: warn
