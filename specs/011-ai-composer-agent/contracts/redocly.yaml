# Lint configuration for the StemStudio OpenAPI 3.1 contracts of feature 011.
# Run from the repo root: npx @redocly/cli@2.78.0 lint --config specs/011-ai-composer-agent/contracts/redocly.yaml #   specs/011-ai-composer-agent/contracts/agent-api.openapi.yaml
# (Phase 0 part 2 adds backend-api.openapi.yaml 1.10.0 = 010's 1.9.0 + this delta.)
extends:
  - recommended
rules:
  # GET /api/agent/status and GET /api/agent/settings have no client-error cases; every other operation lists its 4XX responses.
  operation-4xx-response: warn
  no-server-example.com: off
  no-unused-components: warn
