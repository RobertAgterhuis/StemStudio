# Lint configuration for the StemStudio OpenAPI 3.1 contracts of feature 011.
# Run from the repo root: npx @redocly/cli@2.78.0 lint --config specs/011-ai-composer-agent/contracts/redocly.yaml #   specs/011-ai-composer-agent/contracts/backend-api.openapi.yaml specs/011-ai-composer-agent/contracts/agent-api.openapi.yaml
# backend-api.openapi.yaml 1.10.0 = 010's 1.9.0 + agent-api.openapi.yaml (1.10.0-delta.1). The worker (1.6.0, 008) and
# generator (1.1.0, 010) contracts are unchanged by 011.
extends:
  - recommended
rules:
  # GET /health, GET /api/device, GET /api/tracks, GET /api/generation/status, GET /api/agent/status and GET /api/agent/settings have no client-error cases; every other operation lists its 4XX responses.
  operation-4xx-response: warn
  no-server-example.com: off
  no-unused-components: warn
