openapi: 3.1.0
info:
  title: StemStudio Backend API - agent delta (feature 011)
  version: 1.10.0-delta.1
  summary: Additive delta of the backend API for the AI composer agent (/api/agent/*).
  description: |
    * **Standalone, additive delta, merged.** This document contains only the `agent` tag of the
      backend API. It was merged unchanged into the full `backend-api.openapi.yaml` **1.10.0** of
      this folder (011 Phase 0 part 2, 2026-11-16; 1.10.0 = 010's 1.9.0 + this delta, proven by
      `AgentContractTests`). The full document is the binding one; this file is kept for the
      review history and the merge test. No existing operation, schema or behaviour changes. C# DTOs:
      `src/StemStudio.Contracts/Agent`, routes `ApiRoutes.Agent*`.
    * Conventions of the backend API apply: JSON camelCase, enums lower-case strings (here
      snake_case where the value has two words, e.g. `awaiting_approval`), UTC ISO 8601 times,
      RFC 9457 problem details with `type` = `https://stemstudio.local/problems/<code>`.
    * **No endpoint ever returns, logs or echoes `ANTHROPIC_API_KEY` or any part of it**; the
      Claude backend is paid, opt-in and off by default (constitution 1.3.0, principle IV
      exception). Only presence is reported (`claude.keyConfigured`).
    * One active run globally and per conversation (409 `run-active`). Runs execute in the API's
      hosted run executor; the panel follows them over the SSE stream of
      `GET /api/agent/runs/{runId}/events` (`id` = event seq, replay with `after` or
      `Last-Event-ID`, `: keep-alive` comment every 15 s, the stream closes after a terminal
      event). The decoded events are described by the schema `AgentRunEvent`.
    * Approvals are bound to the step and the SHA-256 of its canonical arguments (`argumentsHash`);
      the agent can never approve its own steps (ADR-020 D5).
    * Changelog: 1.10.0-delta.1 (additive, feature 011 Phase 0 part 1) - status, settings,
      connection test, tool registry view, conversations, messages, undo, runs, SSE events,
      approvals, UI tool results and cancel. See ADR-020 and contracts/DELTA.md.
  license:
    name: MIT
    identifier: MIT
servers:
  - url: http://localhost:8081
    description: local development and docker compose (published port)
security: []  # single local user; no authentication (spec Assumptions)
tags:
  - name: agent
    description: The AI composer agent - chat commands executed as StemStudio actions (1.10.0, feature 011).
paths:
  /api/agent/status:
    get:
      tags: [agent]
      operationId: getAgentStatus
      summary: Readiness of the selected backend (always 200; each probe at most 2 s).
      responses:
        '200':
          description: The status; never contains the key.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentStatus'
  /api/agent/settings:
    get:
      tags: [agent]
      operationId: getAgentSettings
      summary: The agent settings (defaults when never saved).
      responses:
        '200':
          description: The settings.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentSettings'
    put:
      tags: [agent]
      operationId: updateAgentSettings
      summary: Change the backend, models, effort or limits.
      description: |
        Omitted fields keep their value. `backend: claude` needs `ANTHROPIC_API_KEY` (409
        `claude-not-configured`) and the acknowledged notice (422 `notice-not-acknowledged`; send
        `acknowledgeClaudeNotice: true` in the same or an earlier request). Ollama models must be
        installed with the `tools` capability (422 `model-unavailable`). `fake` cannot be selected
        here (environment only).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateAgentSettingsRequest'
      responses:
        '200':
          description: The saved settings.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentSettings'
        '400':
          $ref: '#/components/responses/ValidationProblem'
        '409':
          $ref: '#/components/responses/AgentConflict'
        '422':
          $ref: '#/components/responses/AgentUnprocessable'
  /api/agent/settings/test:
    post:
      tags: [agent]
      operationId: testAgentBackend
      summary: Test the connection to a backend without generating text.
      description: |
        Ollama: version and model capabilities. Claude: only the free model lookup
        `GET /v1/models/{id}`, and only on this explicit call; never in CI.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TestAgentBackendRequest'
      responses:
        '200':
          description: The test result (also when the backend failed; see `ok`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BackendTestResult'
        '400':
          $ref: '#/components/responses/ValidationProblem'
  /api/agent/tools:
    get:
      tags: [agent]
      operationId: listAgentTools
      summary: Registry view of the tools for a page context, sorted by name.
      parameters:
        - name: page
          in: query
          required: false
          schema:
            type: string
            maxLength: 40
        - name: trackId
          in: query
          required: false
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Available and unavailable tools (contracts/tool-catalogue.md).
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AgentToolInfo'
        '400':
          $ref: '#/components/responses/ValidationProblem'
  /api/agent/conversations:
    get:
      tags: [agent]
      operationId: listConversations
      summary: Conversations, newest first.
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
        - name: before
          in: query
          required: false
          description: Only conversations updated before this time (paging).
          schema:
            type: string
            format: date-time
      responses:
        '200':
          description: One page of conversations.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ConversationSummary'
        '400':
          $ref: '#/components/responses/ValidationProblem'
    post:
      tags: [agent]
      operationId: createConversation
      summary: Start a new conversation.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateConversationRequest'
      responses:
        '201':
          description: Created.
          headers:
            Location:
              description: URL of the new conversation.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Conversation'
        '400':
          $ref: '#/components/responses/ValidationProblem'
  /api/agent/conversations/{conversationId}:
    parameters:
      - $ref: '#/components/parameters/ConversationId'
    get:
      tags: [agent]
      operationId: getConversation
      summary: A conversation with its messages and run summaries.
      responses:
        '200':
          description: The conversation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Conversation'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [agent]
      operationId: renameConversation
      summary: Rename a conversation.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RenameConversationRequest'
      responses:
        '200':
          description: Renamed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConversationSummary'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/AgentUnprocessable'
    delete:
      tags: [agent]
      operationId: deleteConversation
      summary: Delete a conversation with its runs, steps, approvals, undo entries and events.
      responses:
        '204':
          description: Deleted.
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/AgentConflict'
  /api/agent/conversations/{conversationId}/messages:
    parameters:
      - $ref: '#/components/parameters/ConversationId'
    post:
      tags: [agent]
      operationId: sendAgentMessage
      summary: Send a command; stores the message and queues a run.
      description: |
        503 `backend-unavailable` carries the `AgentStatus` in the extension member `agentStatus`
        (the RFC 9457 member `status` stays the HTTP status; DELTA.md draft said `status`).
        409 `run-active` while another run is active; 422 for an empty text or more than 4,000
        characters.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendAgentMessageRequest'
      responses:
        '202':
          description: Message stored, run queued; follow `GET /api/agent/runs/{runId}/events`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentMessageAccepted'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/AgentConflict'
        '422':
          $ref: '#/components/responses/AgentUnprocessable'
        '503':
          description: The selected backend is not ready (`backend-unavailable`).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/BackendUnavailableProblem'
  /api/agent/conversations/{conversationId}/undo:
    parameters:
      - $ref: '#/components/parameters/ConversationId'
    post:
      tags: [agent]
      operationId: undoLastAgentAction
      summary: Undo the newest undoable command of the conversation as a new run.
      responses:
        '202':
          description: Undo run queued.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentRunAccepted'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/AgentConflict'
  /api/agent/runs/{runId}:
    parameters:
      - $ref: '#/components/parameters/RunId'
    get:
      tags: [agent]
      operationId: getAgentRun
      summary: Snapshot of a run (status, plan, steps, pending approval, usage).
      responses:
        '200':
          description: The run.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentRun'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/agent/runs/{runId}/events:
    parameters:
      - $ref: '#/components/parameters/RunId'
    get:
      tags: [agent]
      operationId: streamAgentRunEvents
      summary: Server-sent events of a run, with replay.
      description: |
        Each event is `id: <seq>`, `event: <type>`, `data: <JSON>` (decoded form: schema
        `AgentRunEvent`). Every stored event with a seq larger than `after` (or `Last-Event-ID`) is
        replayed first, then live events follow. A `: keep-alive` comment is sent every 15 s. The
        stream ends after `run.completed`, `run.failed`, `run.cancelled` or `run.interrupted`.
      parameters:
        - name: after
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
        - name: Last-Event-ID
          in: header
          required: false
          schema:
            type: string
            pattern: '^[0-9]+$'
      responses:
        '200':
          description: The event stream (`text/event-stream`, UTF-8).
          content:
            text/event-stream:
              schema:
                $ref: '#/components/schemas/AgentRunEvent'
              example: |
                id: 1
                event: run.started
                data: {"runId":"0b9d3c6e-2f4a-4c8b-9e1d-7a6b5c4d3e2f","backend":"ollama","model":"qwen3.5:9b","usingFallback":false}

                id: 2
                event: text.delta
                data: {"text":"Muting the drums."}

                : keep-alive

        '404':
          $ref: '#/components/responses/NotFound'
  /api/agent/runs/{runId}/approvals/{stepId}:
    parameters:
      - $ref: '#/components/parameters/RunId'
      - $ref: '#/components/parameters/StepId'
    post:
      tags: [agent]
      operationId: decideAgentApproval
      summary: Approve or reject a pending step (idempotent; the first decision wins).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DecideApprovalRequest'
      responses:
        '200':
          description: The stored approval state (also for a repeated decision).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApprovalState'
        '400':
          $ref: '#/components/responses/ValidationProblem'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/AgentConflict'
  /api/agent/runs/{runId}/ui-results/{stepId}:
    parameters:
      - $ref: '#/components/parameters/RunId'
      - $ref: '#/components/parameters/StepId'
    post:
      tags: [agent]
      operationId: submitAgentUiResult
      summary: Result of a UI tool executed by the open page (UI tool round trip).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubmitUiResultRequest'
      responses:
        '204':
          description: Accepted; the run continues.
        '400':
          $ref: '#/components/responses/ValidationProblem'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/AgentConflict'
  /api/agent/runs/{runId}/cancel:
    parameters:
      - $ref: '#/components/parameters/RunId'
    post:
      tags: [agent]
      operationId: cancelAgentRun
      summary: Cancel a run, optionally with the jobs it started.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CancelAgentRunRequest'
      responses:
        '202':
          description: Cancellation accepted; the snapshot after cancelling.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentRun'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/AgentConflict'
components:
  parameters:
    ConversationId:
      name: conversationId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    RunId:
      name: runId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    StepId:
      name: stepId
      in: path
      required: true
      schema:
        type: string
        format: uuid
  responses:
    ValidationProblem:
      description: Invalid input; `errors` names the offending fields.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ValidationProblemDetails'
    NotFound:
      description: Unknown conversation, run or step.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          example:
            title: Not found
            status: 404
    AgentConflict:
      description: |
        Conflict with the current state; `type` ends in one of `claude-not-configured`,
        `run-active`, `approval-not-pending`, `arguments-changed`, `ui-result-not-expected`,
        `nothing-to-undo`, `run-ended`.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          example:
            type: https://stemstudio.local/problems/run-active
            title: A command is already running
            status: 409
            detail: Wait for the current command to finish or cancel it.
    AgentUnprocessable:
      description: |
        Well-formed but not acceptable; `type` ends in `notice-not-acknowledged`,
        `model-unavailable` or `validation` (with `errors`).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          example:
            type: https://stemstudio.local/problems/model-unavailable
            title: Model not available
            status: 422
            detail: qwen3.5:9b is not installed in Ollama. Run "ollama pull qwen3.5:9b" (6.6 GB).
  schemas:
    ProblemDetails:
      type: object
      description: RFC 9457 problem details. Extension members are allowed.
      required: [title, status]
      properties:
        type:
          type: string
          default: about:blank
        title:
          type: string
        status:
          type: integer
          minimum: 400
          maximum: 599
        detail:
          type: [string, 'null']
        instance:
          type: [string, 'null']
      additionalProperties: true
    ValidationProblemDetails:
      allOf:
        - $ref: '#/components/schemas/ProblemDetails'
        - type: object
          required: [errors]
          properties:
            errors:
              type: object
              additionalProperties:
                type: array
                items:
                  type: string
    BackendUnavailableProblem:
      description: 503 `backend-unavailable`; the extension member `agentStatus` says why and how to fix it.
      allOf:
        - $ref: '#/components/schemas/ProblemDetails'
        - type: object
          required: [agentStatus]
          properties:
            agentStatus:
              $ref: '#/components/schemas/AgentStatus'
    AgentBackend:
      type: string
      enum: [ollama, claude, none, fake]
      description: ollama (local, default), claude (paid, opt-in), none (agent off), fake (tests/E2E, environment only).
    ClaudeModel:
      type: string
      enum: [claude-opus-5-5, claude-sonnet-5-5, claude-haiku-5-5]
    ClaudeEffort:
      type: string
      enum: [low, medium, high]
    AgentRunStatus:
      type: string
      enum: [queued, running, awaiting_approval, awaiting_ui, waiting_job, completed, failed, cancelled, interrupted]
      description: completed, failed, cancelled and interrupted are terminal.
    AgentStepStatus:
      type: string
      enum: [planned, awaiting_approval, running, awaiting_ui, waiting_job, succeeded, failed, rejected, rejected_invalid, skipped, expired, undone]
    StepDecision:
      type: string
      enum: [auto, approval_required, denied]
    ToolKind:
      type: string
      enum: [server, ui, meta]
    ToolRisk:
      type: string
      enum: [read, change, job, heavy, destructive]
    UndoKind:
      type: string
      enum: [none, inverse, compensate]
    PlanItemStatus:
      type: string
      enum: [pending, running, done, failed, skipped]
    ApprovalDecision:
      type: string
      enum: [approve, reject]
    ApprovalScope:
      type: string
      enum: [once, plan_heavy]
    ApprovalStatus:
      type: string
      enum: [pending, approved, rejected, expired]
    MessageRole:
      type: string
      enum: [user, assistant]
    JobPhase:
      type: string
      enum: [standard, detail, lyrics, export, transcription, restyle, generation]
      description: restyle and generation are used once features 009 and 010 are delivered.
    DecisionReason:
      type: string
      enum: [risk-heavy, risk-destructive, tainted, url-not-from-user, lyrics-not-from-user, artist-imitation, undo-compensation]
    ArgumentsHash:
      type: string
      pattern: '^[0-9a-f]{64}$'
      description: SHA-256 (lower-case hex) of the canonical arguments (sorted keys, no whitespace).
    JsonObject:
      type: object
      description: A JSON object (tool arguments or a compact result projection, at most 8 KB / 4 KB).
      additionalProperties: true
    OllamaModelInfo:
      type: object
      required: [name, sizeBytes, tools]
      additionalProperties: false
      properties:
        name:
          type: string
        sizeBytes:
          type: integer
          minimum: 0
        tools:
          type: boolean
    OllamaStatus:
      type: object
      required: [reachable, version, models, defaultPresent, fallbackPresent]
      additionalProperties: false
      properties:
        reachable:
          type: boolean
        version:
          type: [string, 'null']
        models:
          type: array
          items:
            $ref: '#/components/schemas/OllamaModelInfo'
        defaultPresent:
          type: boolean
        fallbackPresent:
          type: boolean
    ClaudeStatus:
      type: object
      description: Never contains the key or any part of it.
      required: [keyConfigured, noticeAcknowledged, model]
      additionalProperties: false
      properties:
        keyConfigured:
          type: boolean
        noticeAcknowledged:
          type: boolean
        model:
          $ref: '#/components/schemas/ClaudeModel'
    AgentStatus:
      type: object
      required: [backend, ready, activeModel, usingFallback, reason, fix, ollama, claude]
      additionalProperties: false
      properties:
        backend:
          $ref: '#/components/schemas/AgentBackend'
        ready:
          type: boolean
        activeModel:
          type: [string, 'null']
        usingFallback:
          type: boolean
        reason:
          type: [string, 'null']
          examples: ['Ollama not reachable at http://host.docker.internal:11434']
        fix:
          type: [string, 'null']
          examples: ['ollama pull qwen3.5:9b (6.6 GB)']
        ollama:
          $ref: '#/components/schemas/OllamaStatus'
        claude:
          $ref: '#/components/schemas/ClaudeStatus'
    AgentLimits:
      type: object
      required: [maxModelTurns, maxToolCalls, maxInvalidCalls, turnTimeoutSeconds, claudeTurnTimeoutSeconds, claudeMaxInputTokensPerRun, claudeMaxOutputTokensPerRun, maxJobWaitMinutes]
      additionalProperties: false
      properties:
        maxModelTurns:
          type: integer
          minimum: 1
          maximum: 30
          default: 12
        maxToolCalls:
          type: integer
          minimum: 1
          maximum: 50
          default: 20
        maxInvalidCalls:
          type: integer
          minimum: 1
          maximum: 10
          default: 3
        turnTimeoutSeconds:
          type: integer
          minimum: 10
          maximum: 600
          default: 120
        claudeTurnTimeoutSeconds:
          type: integer
          minimum: 10
          maximum: 600
          default: 180
        claudeMaxInputTokensPerRun:
          type: integer
          minimum: 1000
          maximum: 1000000
          default: 60000
        claudeMaxOutputTokensPerRun:
          type: integer
          minimum: 500
          maximum: 128000
          default: 8000
        maxJobWaitMinutes:
          type: integer
          minimum: 1
          maximum: 180
          default: 45
    AgentSettings:
      type: object
      required: [backend, ollamaModel, ollamaFallbackModel, ollamaThink, claudeModel, claudeEffort, claudeNoticeAcknowledged, limits, updatedAt]
      additionalProperties: false
      properties:
        backend:
          $ref: '#/components/schemas/AgentBackend'
        ollamaModel:
          type: string
          maxLength: 100
          default: qwen3.5:9b
        ollamaFallbackModel:
          type: string
          maxLength: 100
          default: qwen3.5:4b
        ollamaThink:
          type: boolean
          default: false
        claudeModel:
          $ref: '#/components/schemas/ClaudeModel'
        claudeEffort:
          $ref: '#/components/schemas/ClaudeEffort'
        claudeNoticeAcknowledged:
          type: boolean
        limits:
          $ref: '#/components/schemas/AgentLimits'
        updatedAt:
          type: string
          format: date-time
    UpdateAgentSettingsRequest:
      type: object
      additionalProperties: false
      properties:
        backend:
          oneOf:
            - type: string
              enum: [ollama, claude, none]
            - type: 'null'
        ollamaModel:
          type: [string, 'null']
          minLength: 1
          maxLength: 100
        ollamaFallbackModel:
          type: [string, 'null']
          minLength: 1
          maxLength: 100
        ollamaThink:
          type: [boolean, 'null']
        claudeModel:
          oneOf:
            - $ref: '#/components/schemas/ClaudeModel'
            - type: 'null'
        claudeEffort:
          oneOf:
            - $ref: '#/components/schemas/ClaudeEffort'
            - type: 'null'
        limits:
          oneOf:
            - $ref: '#/components/schemas/AgentLimits'
            - type: 'null'
        acknowledgeClaudeNotice:
          type: boolean
          default: false
    TestAgentBackendRequest:
      type: object
      required: [backend]
      additionalProperties: false
      properties:
        backend:
          type: string
          enum: [ollama, claude]
    BackendTestResult:
      type: object
      required: [backend, ok, latencyMs, detail]
      additionalProperties: false
      properties:
        backend:
          $ref: '#/components/schemas/AgentBackend'
        ok:
          type: boolean
        latencyMs:
          type: integer
          minimum: 0
        detail:
          type: string
    AgentToolInfo:
      type: object
      required: [name, feature, kind, risk, undo, available, unavailableReason, title, description]
      additionalProperties: false
      properties:
        name:
          type: string
          pattern: '^[a-z][a-z0-9_]*$'
        feature:
          type: string
          pattern: '^0[0-9]{2}$'
        kind:
          $ref: '#/components/schemas/ToolKind'
        risk:
          $ref: '#/components/schemas/ToolRisk'
        undo:
          $ref: '#/components/schemas/UndoKind'
        available:
          type: boolean
        unavailableReason:
          type: [string, 'null']
        title:
          type: string
        description:
          type: string
    PageContext:
      type: object
      required: [page]
      additionalProperties: false
      properties:
        page:
          type: string
          minLength: 1
          maxLength: 40
          description: import, tracks, track, mixer, mixes, library, styles, generations, lyrics, songs, voices, settings, help (selects the tool groups, tool catalogue 1.0.0).
        trackId:
          type: [string, 'null']
          format: uuid
        mixId:
          type: [string, 'null']
          format: uuid
    ConversationSummary:
      type: object
      required: [conversationId, title, createdAt, updatedAt, lastRunStatus]
      properties:
        conversationId:
          type: string
          format: uuid
        title:
          type: string
          maxLength: 120
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        lastRunStatus:
          oneOf:
            - $ref: '#/components/schemas/AgentRunStatus'
            - type: 'null'
    Conversation:
      allOf:
        - $ref: '#/components/schemas/ConversationSummary'
        - type: object
          required: [messages, runs]
          properties:
            messages:
              type: array
              items:
                $ref: '#/components/schemas/AgentMessage'
            runs:
              type: array
              items:
                $ref: '#/components/schemas/AgentRunSummary'
    AgentMessage:
      type: object
      required: [messageId, seq, role, text, context, runId, createdAt]
      additionalProperties: false
      properties:
        messageId:
          type: string
          format: uuid
        seq:
          type: integer
          minimum: 1
        role:
          $ref: '#/components/schemas/MessageRole'
        text:
          type: string
          maxLength: 16000
        context:
          $ref: '#/components/schemas/PageContext'
        runId:
          type: [string, 'null']
          format: uuid
        createdAt:
          type: string
          format: date-time
    AgentRunSummary:
      type: object
      required: [runId, messageId, status, startedAt, endedAt]
      additionalProperties: false
      properties:
        runId:
          type: string
          format: uuid
        messageId:
          type: string
          format: uuid
        status:
          $ref: '#/components/schemas/AgentRunStatus'
        startedAt:
          type: string
          format: date-time
        endedAt:
          type: [string, 'null']
          format: date-time
    CreateConversationRequest:
      type: object
      additionalProperties: false
      properties:
        title:
          type: [string, 'null']
          maxLength: 120
    RenameConversationRequest:
      type: object
      required: [title]
      additionalProperties: false
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 120
    SendAgentMessageRequest:
      type: object
      required: [text, context]
      additionalProperties: false
      properties:
        text:
          type: string
          minLength: 1
          maxLength: 4000
        context:
          $ref: '#/components/schemas/PageContext'
    AgentMessageAccepted:
      type: object
      required: [runId, messageId]
      additionalProperties: false
      properties:
        runId:
          type: string
          format: uuid
        messageId:
          type: string
          format: uuid
    AgentRunAccepted:
      type: object
      required: [runId]
      additionalProperties: false
      properties:
        runId:
          type: string
          format: uuid
    TokenUsage:
      type: object
      required: [inputTokens, outputTokens, cachedInputTokens]
      additionalProperties: false
      properties:
        inputTokens:
          type: integer
          minimum: 0
        outputTokens:
          type: integer
          minimum: 0
        cachedInputTokens:
          type: integer
          minimum: 0
    RunFailure:
      type: object
      required: [code, message, fix]
      additionalProperties: false
      properties:
        code:
          type: string
          enum: [backend-unavailable, limit-reached, invalid-calls, timeout, refusal, budget-exhausted, internal]
        message:
          type: string
          maxLength: 500
        fix:
          type: [string, 'null']
    PlanItem:
      type: object
      required: [index, title, tool, status]
      additionalProperties: false
      properties:
        index:
          type: integer
          minimum: 0
        title:
          type: string
          maxLength: 120
        tool:
          type: [string, 'null']
        status:
          $ref: '#/components/schemas/PlanItemStatus'
    JobRef:
      type: object
      required: [trackId, jobId, phase]
      additionalProperties: false
      properties:
        trackId:
          type: [string, 'null']
          format: uuid
        jobId:
          type: [string, 'null']
        phase:
          $ref: '#/components/schemas/JobPhase'
    AgentStep:
      type: object
      required: [stepId, seq, tool, kind, risk, undo, arguments, argumentsHash, planIndex, decision, decisionReasons, status, resultSummary, error, job, progress, estimatedMinutes, startedAt, endedAt]
      additionalProperties: false
      properties:
        stepId:
          type: string
          format: uuid
        seq:
          type: integer
          minimum: 1
        tool:
          type: string
          maxLength: 100
        kind:
          $ref: '#/components/schemas/ToolKind'
        risk:
          $ref: '#/components/schemas/ToolRisk'
        undo:
          $ref: '#/components/schemas/UndoKind'
        arguments:
          $ref: '#/components/schemas/JsonObject'
        argumentsHash:
          $ref: '#/components/schemas/ArgumentsHash'
        planIndex:
          type: [integer, 'null']
          minimum: 0
        decision:
          $ref: '#/components/schemas/StepDecision'
        decisionReasons:
          type: array
          items:
            $ref: '#/components/schemas/DecisionReason'
        status:
          $ref: '#/components/schemas/AgentStepStatus'
        resultSummary:
          oneOf:
            - $ref: '#/components/schemas/JsonObject'
            - type: 'null'
        error:
          type: [string, 'null']
          maxLength: 500
        job:
          oneOf:
            - $ref: '#/components/schemas/JobRef'
            - type: 'null'
        progress:
          type: [integer, 'null']
          minimum: 0
          maximum: 100
        estimatedMinutes:
          type: [number, 'null']
          minimum: 0
        startedAt:
          type: [string, 'null']
          format: date-time
        endedAt:
          type: [string, 'null']
          format: date-time
    ApprovalRequest:
      type: object
      description: A pending confirmation card (also the data of `approval.requested`).
      required: [stepId, tool, risk, arguments, argumentsHash, reasons, effect, undoable, estimatedMinutes, device, allowPlanScope]
      additionalProperties: false
      properties:
        stepId:
          type: string
          format: uuid
        tool:
          type: string
        risk:
          $ref: '#/components/schemas/ToolRisk'
        arguments:
          $ref: '#/components/schemas/JsonObject'
        argumentsHash:
          $ref: '#/components/schemas/ArgumentsHash'
        reasons:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/DecisionReason'
        effect:
          type: string
          maxLength: 500
        undoable:
          type: boolean
        estimatedMinutes:
          type: [number, 'null']
          minimum: 0
        device:
          type: [string, 'null']
        allowPlanScope:
          type: boolean
    ApprovalState:
      type: object
      required: [stepId, status, scope, decidedAt]
      additionalProperties: false
      properties:
        stepId:
          type: string
          format: uuid
        status:
          $ref: '#/components/schemas/ApprovalStatus'
        scope:
          $ref: '#/components/schemas/ApprovalScope'
        decidedAt:
          type: [string, 'null']
          format: date-time
    AgentRun:
      type: object
      required: [runId, conversationId, status, backend, model, tainted, plan, steps, pendingApproval, usage, failure, startedAt, endedAt]
      additionalProperties: false
      properties:
        runId:
          type: string
          format: uuid
        conversationId:
          type: string
          format: uuid
        status:
          $ref: '#/components/schemas/AgentRunStatus'
        backend:
          $ref: '#/components/schemas/AgentBackend'
        model:
          type: string
        tainted:
          type: boolean
        plan:
          type: array
          maxItems: 10
          items:
            $ref: '#/components/schemas/PlanItem'
        steps:
          type: array
          items:
            $ref: '#/components/schemas/AgentStep'
        pendingApproval:
          oneOf:
            - $ref: '#/components/schemas/ApprovalRequest'
            - type: 'null'
        usage:
          $ref: '#/components/schemas/TokenUsage'
        failure:
          oneOf:
            - $ref: '#/components/schemas/RunFailure'
            - type: 'null'
        startedAt:
          type: string
          format: date-time
        endedAt:
          type: [string, 'null']
          format: date-time
    DecideApprovalRequest:
      type: object
      required: [decision, argumentsHash]
      additionalProperties: false
      properties:
        decision:
          $ref: '#/components/schemas/ApprovalDecision'
        scope:
          oneOf:
            - $ref: '#/components/schemas/ApprovalScope'
            - type: 'null'
        argumentsHash:
          $ref: '#/components/schemas/ArgumentsHash'
    SubmitUiResultRequest:
      type: object
      required: [ok]
      additionalProperties: false
      properties:
        ok:
          type: boolean
        result:
          oneOf:
            - $ref: '#/components/schemas/JsonObject'
            - type: 'null'
        error:
          type: [string, 'null']
          maxLength: 500
    CancelAgentRunRequest:
      type: object
      additionalProperties: false
      properties:
        cancelJobs:
          type: boolean
          default: false
    RunStartedEvent:
      type: object
      required: [runId, backend, model, usingFallback]
      additionalProperties: false
      properties:
        runId:
          type: string
          format: uuid
        backend:
          $ref: '#/components/schemas/AgentBackend'
        model:
          type: string
        usingFallback:
          type: boolean
    ModelChangedEvent:
      type: object
      required: [model, usingFallback, reason]
      additionalProperties: false
      properties:
        model:
          type: string
        usingFallback:
          type: boolean
        reason:
          type: string
    PlanUpdatedEvent:
      type: object
      required: [plan]
      additionalProperties: false
      properties:
        plan:
          type: array
          maxItems: 10
          items:
            $ref: '#/components/schemas/PlanItem'
    TextDeltaEvent:
      type: object
      required: [text]
      additionalProperties: false
      properties:
        text:
          type: string
    StepUpdatedEvent:
      type: object
      required: [stepId, status, progress, resultSummary, error]
      additionalProperties: false
      properties:
        stepId:
          type: string
          format: uuid
        status:
          $ref: '#/components/schemas/AgentStepStatus'
        progress:
          type: [integer, 'null']
          minimum: 0
          maximum: 100
        resultSummary:
          oneOf:
            - $ref: '#/components/schemas/JsonObject'
            - type: 'null'
        error:
          type: [string, 'null']
          maxLength: 500
    UiRequestedEvent:
      type: object
      required: [stepId, tool, arguments, timeoutSeconds]
      additionalProperties: false
      properties:
        stepId:
          type: string
          format: uuid
        tool:
          type: string
        arguments:
          $ref: '#/components/schemas/JsonObject'
        timeoutSeconds:
          type: integer
          const: 15
    RunCompletedEvent:
      type: object
      required: [runId, messageId]
      additionalProperties: false
      properties:
        runId:
          type: string
          format: uuid
        messageId:
          type: string
          format: uuid
    RunCancelledEvent:
      type: object
      required: [runId, cancelledJobs]
      additionalProperties: false
      properties:
        runId:
          type: string
          format: uuid
        cancelledJobs:
          type: array
          items:
            type: string
    RunInterruptedEvent:
      type: object
      required: [runId]
      additionalProperties: false
      properties:
        runId:
          type: string
          format: uuid
    AgentRunEvent:
      description: |
        One decoded server-sent event: `id` is the SSE `id:` line, `event` the `event:` line and
        `data` the parsed `data:` line. On the wire the stream is plain `text/event-stream`.
      oneOf:
        - $ref: '#/components/schemas/RunStartedEnvelope'
        - $ref: '#/components/schemas/ModelChangedEnvelope'
        - $ref: '#/components/schemas/PlanUpdatedEnvelope'
        - $ref: '#/components/schemas/TextDeltaEnvelope'
        - $ref: '#/components/schemas/StepCreatedEnvelope'
        - $ref: '#/components/schemas/StepUpdatedEnvelope'
        - $ref: '#/components/schemas/ApprovalRequestedEnvelope'
        - $ref: '#/components/schemas/ApprovalResolvedEnvelope'
        - $ref: '#/components/schemas/UiRequestedEnvelope'
        - $ref: '#/components/schemas/UsageUpdatedEnvelope'
        - $ref: '#/components/schemas/RunCompletedEnvelope'
        - $ref: '#/components/schemas/RunFailedEnvelope'
        - $ref: '#/components/schemas/RunCancelledEnvelope'
        - $ref: '#/components/schemas/RunInterruptedEnvelope'
      discriminator:
        propertyName: event
        mapping:
          run.started: '#/components/schemas/RunStartedEnvelope'
          model.changed: '#/components/schemas/ModelChangedEnvelope'
          plan.updated: '#/components/schemas/PlanUpdatedEnvelope'
          text.delta: '#/components/schemas/TextDeltaEnvelope'
          step.created: '#/components/schemas/StepCreatedEnvelope'
          step.updated: '#/components/schemas/StepUpdatedEnvelope'
          approval.requested: '#/components/schemas/ApprovalRequestedEnvelope'
          approval.resolved: '#/components/schemas/ApprovalResolvedEnvelope'
          ui.requested: '#/components/schemas/UiRequestedEnvelope'
          usage.updated: '#/components/schemas/UsageUpdatedEnvelope'
          run.completed: '#/components/schemas/RunCompletedEnvelope'
          run.failed: '#/components/schemas/RunFailedEnvelope'
          run.cancelled: '#/components/schemas/RunCancelledEnvelope'
          run.interrupted: '#/components/schemas/RunInterruptedEnvelope'
    EventId:
      type: integer
      minimum: 1
      description: Event sequence number within the run (SSE `id:`).
    RunStartedEnvelope:
      type: object
      required: [id, event, data]
      properties:
        id:
          $ref: '#/components/schemas/EventId'
        event:
          const: run.started
        data:
          $ref: '#/components/schemas/RunStartedEvent'
    ModelChangedEnvelope:
      type: object
      required: [id, event, data]
      properties:
        id:
          $ref: '#/components/schemas/EventId'
        event:
          const: model.changed
        data:
          $ref: '#/components/schemas/ModelChangedEvent'
    PlanUpdatedEnvelope:
      type: object
      required: [id, event, data]
      properties:
        id:
          $ref: '#/components/schemas/EventId'
        event:
          const: plan.updated
        data:
          $ref: '#/components/schemas/PlanUpdatedEvent'
    TextDeltaEnvelope:
      type: object
      required: [id, event, data]
      properties:
        id:
          $ref: '#/components/schemas/EventId'
        event:
          const: text.delta
        data:
          $ref: '#/components/schemas/TextDeltaEvent'
    StepCreatedEnvelope:
      type: object
      required: [id, event, data]
      properties:
        id:
          $ref: '#/components/schemas/EventId'
        event:
          const: step.created
        data:
          $ref: '#/components/schemas/AgentStep'
    StepUpdatedEnvelope:
      type: object
      required: [id, event, data]
      properties:
        id:
          $ref: '#/components/schemas/EventId'
        event:
          const: step.updated
        data:
          $ref: '#/components/schemas/StepUpdatedEvent'
    ApprovalRequestedEnvelope:
      type: object
      required: [id, event, data]
      properties:
        id:
          $ref: '#/components/schemas/EventId'
        event:
          const: approval.requested
        data:
          $ref: '#/components/schemas/ApprovalRequest'
    ApprovalResolvedEnvelope:
      type: object
      required: [id, event, data]
      properties:
        id:
          $ref: '#/components/schemas/EventId'
        event:
          const: approval.resolved
        data:
          $ref: '#/components/schemas/ApprovalState'
    UiRequestedEnvelope:
      type: object
      required: [id, event, data]
      properties:
        id:
          $ref: '#/components/schemas/EventId'
        event:
          const: ui.requested
        data:
          $ref: '#/components/schemas/UiRequestedEvent'
    UsageUpdatedEnvelope:
      type: object
      required: [id, event, data]
      properties:
        id:
          $ref: '#/components/schemas/EventId'
        event:
          const: usage.updated
        data:
          $ref: '#/components/schemas/TokenUsage'
    RunCompletedEnvelope:
      type: object
      required: [id, event, data]
      properties:
        id:
          $ref: '#/components/schemas/EventId'
        event:
          const: run.completed
        data:
          $ref: '#/components/schemas/RunCompletedEvent'
    RunFailedEnvelope:
      type: object
      required: [id, event, data]
      properties:
        id:
          $ref: '#/components/schemas/EventId'
        event:
          const: run.failed
        data:
          $ref: '#/components/schemas/RunFailure'
    RunCancelledEnvelope:
      type: object
      required: [id, event, data]
      properties:
        id:
          $ref: '#/components/schemas/EventId'
        event:
          const: run.cancelled
        data:
          $ref: '#/components/schemas/RunCancelledEvent'
    RunInterruptedEnvelope:
      type: object
      required: [id, event, data]
      properties:
        id:
          $ref: '#/components/schemas/EventId'
        event:
          const: run.interrupted
        data:
          $ref: '#/components/schemas/RunInterruptedEvent'
