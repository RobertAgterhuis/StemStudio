# Lint configuration for the StemStudio OpenAPI 3.1 contracts of feature 014.
# Run from the repo root:
#   npx @redocly/cli@2.78.0 lint --config specs/014-practice-flow/contracts/redocly.yaml \
#     specs/014-practice-flow/contracts/backend-api.openapi.yaml specs/014-practice-flow/contracts/worker-api.openapi.yaml \
#     specs/014-practice-flow/contracts/practice-api.openapi.yaml specs/014-practice-flow/contracts/worker-practice.openapi.yaml
# Superset check ("newer contains older"): python -I specs/014-practice-flow/contracts/check_superset.py
extends:
  - recommended
rules:
  # A few reads have no client-error cases (GET /health, /api/device, listTracks, ..., listSetlists, getPracticeLogSettings,
  # worker GET /v1/storage and two render/transcription deletes); every other operation lists its 4XX responses.
  operation-4xx-response: warn
  no-server-example.com: off
  # The deltas re-declare shared components (LoopRegion, ProblemDetails, ...) for the merge.
  no-unused-components: warn
