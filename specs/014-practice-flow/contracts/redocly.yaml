# Lint configuration for the StemStudio OpenAPI 3.1 contract deltas of feature 014.
# Run from the repo root:
#   npx @redocly/cli@2.78.0 lint --config specs/014-practice-flow/contracts/redocly.yaml \
#     specs/014-practice-flow/contracts/practice-api.openapi.yaml specs/014-practice-flow/contracts/worker-practice.openapi.yaml
# (Phase 0 part 2 adds backend-api.openapi.yaml 1.13.0 and worker-api.openapi.yaml 1.8.0 = 012/013 documents + these deltas.)
extends:
  - recommended
rules:
  # A few reads have no client-error cases (listSetlists, getPracticeSettings); every other operation lists its 4XX responses.
  operation-4xx-response: warn
  no-server-example.com: off
  # LoopRegion is re-declared for the merge (it is used by MixSettings in the full document).
  no-unused-components: warn
