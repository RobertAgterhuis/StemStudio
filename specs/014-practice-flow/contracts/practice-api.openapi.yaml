openapi: 3.1.0
info:
  title: StemStudio Backend API - practice flow delta (feature 014)
  version: 1.13.0-delta.1
  summary: Additive delta of the backend API for song sections, score follow, setlists and the practice log.
  description: |
    * **Standalone, additive delta.** This document contains only the operations and schemas that
      feature 014 adds. It is merged unchanged into the full
      `specs/014-practice-flow/contracts/backend-api.openapi.yaml` **1.13.0** after features 012
      (1.11.0) and 013 (1.12.0) have fixed their own minors (014 Phase 0 part 2). No existing
      operation or behaviour changes; the only change to an existing schema is the optional
      `LoopRegion.sectionId` (re-declared below in full; it replaces the 1.12.0 `LoopRegion` at
      the merge).
    * Conventions of the backend API apply: JSON camelCase, enums lower-case kebab strings, UTC
      ISO 8601 times, times in seconds as numbers, RFC 9457 problem details with
      `type` = `https://stemstudio.local/problems/<code>`.
    * **Practice data is local.** Nothing in this document causes any request to a host other than
      the local worker; the practice endpoints are read and written only by the local Web app
      (and the local 011 agent). See ADR-023 D6.
    * Long work runs in the worker lane `practice` (worker-api 1.8.0): section detection and score
      views are asynchronous (`202`, then poll the resource); the setlist PDF waits for its short
      job (at most `StemStudio:Practice:SetlistPdfTimeoutSeconds`, default 30 s).
    * Changelog: 1.13.0-delta.1 (additive, feature 014 planning) - sections (read, replace,
      detect), score list per track and score views (bar map + SVG pages), setlists (CRUD,
      entries, PDF), practice log (settings, sessions, summary, overview, delete),
      `LoopRegion.sectionId`. See ADR-023 and contracts/DELTA.md.
  license:
    name: MIT
    identifier: MIT
servers:
  - url: http://localhost:8081
    description: local development and docker compose (published port)
security: []  # single local user; no authentication (001 spec Assumptions)
tags:
  - name: sections
    description: Song sections of a track (1.13.0, feature 014).
  - name: score-follow
    description: Sheet music that follows playback - score list per track and score views (1.13.0, feature 014).
  - name: setlists
    description: Ordered song lists with notes and a PDF export (1.13.0, feature 014).
  - name: practice
    description: The local practice log (1.13.0, feature 014).
paths:
  /api/tracks/{trackId}/sections:
    parameters:
      - $ref: '#/components/parameters/TrackId'
    get:
      tags: [sections]
      operationId: getSections
      summary: The section set of a track (status `none` when never detected).
      responses:
        '200':
          description: The section set.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SectionSet'
              examples:
                detected:
                  $ref: '#/components/examples/SectionSetReady'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [sections]
      operationId: replaceSections
      summary: Replace the whole ordered list (user edit); sets origin `edited`.
      description: |
        Section ids that are sent are kept; sections without `id` get a new id. `revision` must
        equal the stored revision, otherwise `409 sections-changed` (another window saved first).
        Rules: 1..64 sections, sorted by start, non-overlapping, `0 <= start < end <= duration`,
        `end - start >= 1`, label 1..40 characters, `instrument` only for `solo` and only a channel
        of this track.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SectionsUpdate'
      responses:
        '200':
          description: The stored section set (revision + 1).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SectionSet'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/SectionsConflict'
        '422':
          $ref: '#/components/responses/ValidationProblem'
  /api/tracks/{trackId}/sections/detect:
    parameters:
      - $ref: '#/components/parameters/TrackId'
    post:
      tags: [sections]
      operationId: detectSections
      summary: Start (re-)detection on the worker.
      description: |
        Replaces the sections when the job completes (new ids, origin `detected`). Edited sections
        are only replaced with `overwrite: true` (else `409 sections-edited`). Also called by the
        mixer when the status is `none` (tracks imported before 014).
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DetectSectionsRequest'
      responses:
        '202':
          description: Detection queued; poll `getSections`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SectionSet'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/SectionsConflict'
        '503':
          $ref: '#/components/responses/WorkerUnavailable'
  /api/tracks/{trackId}/scores:
    parameters:
      - $ref: '#/components/parameters/TrackId'
    get:
      tags: [score-follow]
      operationId: listTrackScores
      summary: Ready sheet-music items of this track (directly or through an exported audio item), newest first.
      responses:
        '200':
          description: The score items with their view status.
          content:
            application/json:
              schema:
                type: array
                maxItems: 500
                items:
                  $ref: '#/components/schemas/TrackScore'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/assets/{assetId}/score-view:
    parameters:
      - $ref: '#/components/parameters/AssetId'
    get:
      tags: [score-follow]
      operationId: getScoreView
      summary: The score view of a score item (status `none` when never made).
      responses:
        '200':
          description: The view; `bars` and `pages` are filled when `status` is `ready`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScoreView'
              examples:
                ready:
                  $ref: '#/components/examples/ScoreViewReady'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/ScoreViewConflict'
    post:
      tags: [score-follow]
      operationId: createScoreView
      summary: Make the view (older score items); idempotent while queued or rendering.
      responses:
        '202':
          description: Queued (or already queued/rendering/ready); poll `getScoreView`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScoreView'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/ScoreViewConflict'
        '503':
          $ref: '#/components/responses/WorkerUnavailable'
  /api/assets/{assetId}/score-view/pages/{page}:
    parameters:
      - $ref: '#/components/parameters/AssetId'
      - name: page
        in: path
        required: true
        description: 1-based page number.
        schema:
          type: integer
          minimum: 1
          maximum: 200
    get:
      tags: [score-follow]
      operationId: getScoreViewPage
      summary: One page as SVG, for use as an image (`<img src>`).
      description: |
        Headers: `Content-Type: image/svg+xml`, `Cache-Control: private, max-age=31536000,
        immutable` (the URL carries `?v=<revision>` from `ScoreView.pages[].url`),
        `Content-Security-Policy: default-src 'none'; style-src 'unsafe-inline'; font-src data:`,
        `X-Content-Type-Options: nosniff`.
      responses:
        '200':
          description: The SVG page.
          content:
            image/svg+xml:
              schema:
                type: string
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/ScoreViewConflict'
  /api/setlists:
    get:
      tags: [setlists]
      operationId: listSetlists
      summary: All setlists, most recently updated first.
      responses:
        '200':
          description: The setlists.
          content:
            application/json:
              schema:
                type: array
                maxItems: 1000
                items:
                  $ref: '#/components/schemas/SetlistSummary'
    post:
      tags: [setlists]
      operationId: createSetlist
      summary: Create an empty setlist.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetlistCreate'
      responses:
        '201':
          description: Created; `Location` header points at the setlist.
          headers:
            Location:
              description: URL of the new setlist.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Setlist'
        '422':
          $ref: '#/components/responses/ValidationProblem'
  /api/setlists/{setlistId}:
    parameters:
      - $ref: '#/components/parameters/SetlistId'
    get:
      tags: [setlists]
      operationId: getSetlist
      summary: A setlist with its entries.
      parameters:
        - name: acknowledgeRemoved
          in: query
          required: false
          description: True resets `removedEntries` to 0 after the UI showed the notice.
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: The setlist.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Setlist'
              examples:
                rehearsal:
                  $ref: '#/components/examples/SetlistRehearsal'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [setlists]
      operationId: updateSetlist
      summary: Rename and/or change the note.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetlistUpdate'
      responses:
        '200':
          description: The updated setlist.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Setlist'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationProblem'
    delete:
      tags: [setlists]
      operationId: deleteSetlist
      summary: Delete a setlist (tracks and mixes are not touched).
      responses:
        '204':
          description: Deleted.
        '404':
          $ref: '#/components/responses/NotFound'
  /api/setlists/{setlistId}/entries:
    parameters:
      - $ref: '#/components/parameters/SetlistId'
    put:
      tags: [setlists]
      operationId: replaceSetlistEntries
      summary: Replace the ordered entries (add, remove, reorder, edit notes in one call).
      description: |
        0..100 entries in play order. Entry ids that are sent are kept. Each `trackId` must exist
        (field error `track-not-found`); a `mixId` must belong to that track (field error
        `mix-track-mismatch`). A track may appear more than once.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetlistEntriesUpdate'
      responses:
        '200':
          description: The updated setlist.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Setlist'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationProblem'
  /api/setlists/{setlistId}/pdf:
    parameters:
      - $ref: '#/components/parameters/SetlistId'
    get:
      tags: [setlists]
      operationId: getSetlistPdf
      summary: Render the setlist as an A4 PDF (download).
      description: |
        The API collects the content (titles, artist, tempo, length, mix name, notes, sections,
        lyrics as plain lines, at most 10,000 characters per song) and renders it with the worker's
        `setlist-document` job, waiting at most the configured timeout. Response header
        `Content-Disposition: attachment; filename="<setlist name>.pdf"` (sanitised name).
        Feature 016 adds `chords`.
      parameters:
        - name: lyrics
          in: query
          required: false
          schema:
            type: boolean
            default: true
        - name: sections
          in: query
          required: false
          schema:
            type: boolean
            default: true
        - name: notes
          in: query
          required: false
          schema:
            type: boolean
            default: true
        - name: pageBreakPerSong
          in: query
          required: false
          schema:
            type: boolean
            default: true
      responses:
        '200':
          description: The PDF.
          content:
            application/pdf:
              schema:
                type: string
                contentMediaType: application/pdf
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/SetlistConflict'
        '503':
          $ref: '#/components/responses/WorkerUnavailable'
        '504':
          $ref: '#/components/responses/DocumentTimeout'
  /api/practice/settings:
    get:
      tags: [practice]
      operationId: getPracticeSettings
      summary: Whether the practice log is on, and its size.
      responses:
        '200':
          description: The settings (defaults when never saved).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PracticeSettings'
    put:
      tags: [practice]
      operationId: updatePracticeSettings
      summary: Switch the log on or off; acknowledge the first-use notice.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PracticeSettingsUpdate'
      responses:
        '200':
          description: The stored settings.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PracticeSettings'
        '422':
          $ref: '#/components/responses/ValidationProblem'
  /api/practice/sessions:
    get:
      tags: [practice]
      operationId: listPracticeSessions
      summary: Sessions, newest first (Expert view, agent).
      parameters:
        - name: trackId
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: before
          in: query
          required: false
          description: Only sessions that started before this time (paging).
          schema:
            type: string
            format: date-time
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
      responses:
        '200':
          description: The sessions.
          content:
            application/json:
              schema:
                type: array
                maxItems: 200
                items:
                  $ref: '#/components/schemas/PracticeSession'
        '422':
          $ref: '#/components/responses/ValidationProblem'
    delete:
      tags: [practice]
      operationId: deletePracticeSessions
      summary: Delete the practice log of one track, or all of it when `trackId` is absent.
      parameters:
        - name: trackId
          in: query
          required: false
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: How many sessions were deleted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeletedCount'
        '422':
          $ref: '#/components/responses/ValidationProblem'
  /api/practice/sessions/{sessionId}:
    parameters:
      - name: sessionId
        in: path
        required: true
        description: UUID made by the browser when the session starts.
        schema:
          type: string
          format: uuid
    put:
      tags: [practice]
      operationId: upsertPracticeSession
      summary: Create or replace a session with cumulative values (every 30 s while playing and at the end).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PracticeSessionInput'
      responses:
        '200':
          description: The stored session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PracticeSession'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/PracticeConflict'
        '422':
          $ref: '#/components/responses/ValidationProblem'
    delete:
      tags: [practice]
      operationId: deletePracticeSession
      summary: Delete one session.
      responses:
        '204':
          description: Deleted.
        '404':
          $ref: '#/components/responses/NotFound'
  /api/practice/summary:
    get:
      tags: [practice]
      operationId: getPracticeSummary
      summary: Totals, minutes per day, per section and tempo reached for one track.
      parameters:
        - name: trackId
          in: query
          required: true
          schema:
            type: string
            format: uuid
        - name: days
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 365
            default: 30
        - $ref: '#/components/parameters/UtcOffsetMinutes'
      responses:
        '200':
          description: The summary (zeros when nothing was recorded).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PracticeSummary'
              examples:
                week:
                  $ref: '#/components/examples/PracticeSummaryWeek'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationProblem'
  /api/practice/overview:
    get:
      tags: [practice]
      operationId: getPracticeOverview
      summary: Totals per track, most recently practised first.
      parameters:
        - $ref: '#/components/parameters/UtcOffsetMinutes'
      responses:
        '200':
          description: One entry per track with at least one session.
          content:
            application/json:
              schema:
                type: array
                maxItems: 10000
                items:
                  $ref: '#/components/schemas/PracticeTrackTotal'
        '422':
          $ref: '#/components/responses/ValidationProblem'
components:
  parameters:
    TrackId:
      name: trackId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    AssetId:
      name: assetId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    SetlistId:
      name: setlistId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    UtcOffsetMinutes:
      name: utcOffsetMinutes
      in: query
      required: false
      description: The browser's offset from UTC for day buckets (e.g. 60 for CET, 120 for CEST).
      schema:
        type: integer
        minimum: -840
        maximum: 840
        default: 0
  responses:
    ValidationProblem:
      description: Invalid input; `errors` names the offending fields.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ValidationProblemDetails'
    NotFound:
      description: Unknown track, asset, setlist or session.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          example:
            title: Not found
            status: 404
    SectionsConflict:
      description: |
        `type` ends in `sections-changed` (revision mismatch: "The sections were changed in another
        window"), `sections-edited` (detect without `overwrite` after edits), `detection-running`,
        or `track-not-ready` (the track has not completed separation).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          example:
            type: https://stemstudio.local/problems/sections-changed
            title: The sections were changed in another window
            status: 409
            detail: Reload the sections and make your change again.
    ScoreViewConflict:
      description: '`type` ends in `not-a-score`, `score-not-ready` or `score-view-not-ready`.'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          example:
            type: https://stemstudio.local/problems/score-view-not-ready
            title: The score view is not ready yet
            status: 409
    SetlistConflict:
      description: '`type` ends in `setlist-empty` (nothing to print).'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          example:
            type: https://stemstudio.local/problems/setlist-empty
            title: The setlist has no songs
            status: 409
    PracticeConflict:
      description: '`type` ends in `practice-log-off`: the log is switched off, nothing was stored.'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          example:
            type: https://stemstudio.local/problems/practice-log-off
            title: The practice log is off
            status: 409
    WorkerUnavailable:
      description: The worker could not be reached; nothing was queued.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          example:
            type: https://stemstudio.local/problems/worker-unavailable
            title: The processing service is not available
            status: 503
    DocumentTimeout:
      description: The PDF was not ready within the timeout; try again.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          example:
            type: https://stemstudio.local/problems/document-timeout
            title: The PDF took too long
            status: 504
  schemas:
    ProblemDetails:
      type: object
      description: RFC 9457 problem details. Extension members are allowed.
      required: [title, status]
      properties:
        type:
          type: string
          default: about:blank
        title:
          type: string
        status:
          type: integer
          minimum: 400
          maximum: 599
        detail:
          type: [string, 'null']
        instance:
          type: [string, 'null']
      additionalProperties: true
    ValidationProblemDetails:
      allOf:
        - $ref: '#/components/schemas/ProblemDetails'
        - type: object
          required: [errors]
          properties:
            errors:
              type: object
              additionalProperties:
                type: array
                items:
                  type: string
    ChannelId:
      type: string
      description: A standard stem (`bass`) or a detail stem `<parent>.<detail>` (`guitar.electric-guitar`), as in 002.
      pattern: '^(vocals|drums|bass|guitar|piano|other)(\.[a-z][a-z-]{0,31})?$'
    SectionKind:
      type: string
      enum: [intro, verse, pre-chorus, chorus, bridge, solo, instrumental, outro, other]
    SectionSetStatus:
      type: string
      enum: [none, queued, detecting, ready, failed]
    SectionWarning:
      type: object
      additionalProperties: false
      required: [code, message]
      properties:
        code:
          type: string
          enum: [grid-unreliable, no-grid, few-repetitions, no-vocals, merged-to-limit]
        message:
          type: string
          maxLength: 300
    Section:
      type: object
      additionalProperties: false
      required: [id, kind, label, startSeconds, endSeconds, instrument, confidence, origin]
      properties:
        id:
          type: string
          format: uuid
        kind:
          $ref: '#/components/schemas/SectionKind'
        label:
          type: string
          minLength: 1
          maxLength: 40
        startSeconds:
          type: number
          minimum: 0
        endSeconds:
          type: number
          exclusiveMinimum: 0
        startBar:
          type: [integer, 'null']
          minimum: 0
          description: Bar number of the start when the track has a reliable grid (bar 1 = first downbeat; 0 = lead-in); null otherwise.
        instrument:
          oneOf:
            - $ref: '#/components/schemas/ChannelId'
            - type: 'null'
          description: The leading instrument of a solo; null for other kinds.
        confidence:
          type: [number, 'null']
          minimum: 0
          maximum: 1
          description: Detected sections only; null once the user created or changed the section.
        origin:
          type: string
          enum: [detected, user]
    SectionSet:
      type: object
      additionalProperties: false
      required: [trackId, status, origin, revision, analyzer, snap, warnings, error, sections, updatedAt]
      properties:
        trackId:
          type: string
          format: uuid
        status:
          $ref: '#/components/schemas/SectionSetStatus'
        origin:
          type: string
          enum: [detected, edited]
        revision:
          type: integer
          minimum: 0
        analyzer:
          type: [string, 'null']
          description: Name and version of the analyser, e.g. `stems-novelty/1.0.0`.
          maxLength: 80
        snap:
          type: [string, 'null']
          enum: [downbeat, beat, time, null]
          description: What boundaries were snapped to by the analyser.
        warnings:
          type: array
          maxItems: 10
          items:
            $ref: '#/components/schemas/SectionWarning'
        error:
          type: [string, 'null']
          maxLength: 500
        sections:
          type: array
          maxItems: 64
          items:
            $ref: '#/components/schemas/Section'
        updatedAt:
          type: [string, 'null']
          format: date-time
    SectionInput:
      type: object
      additionalProperties: false
      required: [kind, label, startSeconds, endSeconds]
      properties:
        id:
          type: [string, 'null']
          format: uuid
          description: Keep an existing section (and its references); null or absent = new.
        kind:
          $ref: '#/components/schemas/SectionKind'
        label:
          type: string
          minLength: 1
          maxLength: 40
        startSeconds:
          type: number
          minimum: 0
        endSeconds:
          type: number
          exclusiveMinimum: 0
        instrument:
          oneOf:
            - $ref: '#/components/schemas/ChannelId'
            - type: 'null'
    SectionsUpdate:
      type: object
      additionalProperties: false
      required: [revision, sections]
      properties:
        revision:
          type: integer
          minimum: 0
        sections:
          type: array
