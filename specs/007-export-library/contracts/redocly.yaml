# Lint configuration for the StemStudio OpenAPI 3.1 contracts.
# Run from the repo root: npx @redocly/cli@2.78.0 lint --config specs/007-export-library/contracts/redocly.yaml #   specs/007-export-library/contracts/worker-api.openapi.yaml specs/007-export-library/contracts/backend-api.openapi.yaml
extends:
  - recommended
rules:
  # GET /health, GET /api/device and GET /api/tracks have no client-error cases; every other operation lists its 4XX responses.
  operation-4xx-response: warn
  no-server-example.com: off
  # AudioSource (backend 1.5.0) is defined for features 008-011 before any operation uses it.
  no-unused-components: warn
