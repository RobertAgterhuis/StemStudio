openapi: 3.1.0
info:
  title: StemStudio Backend API - lyric writing assistant delta (feature 023)
  version: 1.23.0-delta.1
  summary: Additive delta of the backend API for the on-demand lyric writing assistant.
  description: |
    * **Standalone, additive delta.** Contains only the operations and schemas that feature 023
      adds. It is merged unchanged into the full `backend-api.openapi.yaml` **1.23.0** on top of
      the newest full document at build time (1.22.0 of feature 022 when it is merged first;
      otherwise 1.21.0 of the 011 claude-key follow-up, keeping the label 1.23.0, ROADMAP rule).
      No existing operation or behaviour changes.
    * Base schemas of 010 (`LyricsSheet`, `LyricsInput`, `LyricsSnapshot`) and 011 (`PageContext`
      of `SendMessageRequest`, `Step.decisionReasons`, `JobPhase`) are extended at the merge as
      listed under "Schema additions at the merge"; this delta defines the new members as their
      own schemas so it validates standalone.
    * Conventions of the backend API apply: JSON camelCase, enum values camelCase or kebab-case
      strings as listed, UTC ISO 8601 times, RFC 9457 problem details with
      `type` = `https://stemstudio.local/problems/<code>`.
    * **Schema additions at the merge** (additive):
      `LyricsSheet` gains `revision` (integer >= 1, required in responses) and `assist`
      (`SheetAssistInfo`, required in responses); `LyricsInput` gains optional `expectedRevision`
      (integer; a mismatch returns `409 revision-conflict`; absent = 010 behaviour);
      `LyricsSnapshot` gains `assistedLineCount` (integer >= 0, default 0);
      `SendMessageRequest.context` (011 `PageContext`) gains optional `lyricsId` (uuid);
      `Step.decisionReasons` items gain `lyrics-edit`; `JobPhase` gains `lyricAssist`.
    * **Privacy**: no operation sends text off the machine unless the agent backend is `claude`
      and `LyricAssistSettings.claudeNoticeAcknowledged` is true (spec FR-026, SC-006).
    * **Own lyrics only**: every operation that takes `lyricsId` works on 010 lyrics sheets;
      006 track lyrics are never accepted (spec FR-003).
    * Changelog: 1.23.0-delta.1 (additive, feature 023 design) - lyric assistant status and
      settings, assists (check, devices, alternatives, continue, titles) with an SSE event stream,
      suggestions (list, accept, reject, mark intentional), intentional marks, sheet assist
      settings (sensitivity, rhythm target), undo and revisions, syllables, rhymes, personal word
      list, language guess. See ADR-037 and contracts/DELTA.md.
  license:
    name: MIT
    identifier: MIT
servers:
  - url: http://localhost:8081
    description: local development and docker compose (published port)
security: []  # single local user; no authentication
tags:
  - name: lyric-assist
    description: On-demand lyric writing assistant for own lyrics sheets (1.23.0, feature 023).
paths:
  /api/lyric-assist/status:
    get:
      tags: [lyric-assist]
      operationId: getLyricAssistStatus
      summary: Availability of the assistant layers (dictionary, model) and the Claude notice state.
      description: |
        Always 200. The model layer mirrors the 011 agent status (backend, ready, active model,
        fallback, reason, fix); probes are cached for 2 s like `GET /api/agent/status`. Assistant resources that are not scoped to one sheet live under `/api/lyric-assist/*` and `/api/lyric-assists/{assistId}` (no path ambiguity with the 010 `/api/lyrics/{lyricsId}` routes).
      responses:
        '200':
          description: The status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LyricAssistStatus'
  /api/lyric-assist/settings:
    put:
      tags: [lyric-assist]
      operationId: updateLyricAssistSettings
      summary: Acknowledge (or withdraw) the lyric-assistant Claude notice.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LyricAssistSettingsUpdate'
      responses:
        '200':
          description: The stored settings.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LyricAssistSettings'
        '400':
          $ref: '#/components/responses/ValidationProblem'
  /api/lyrics/{lyricsId}/assists:
    parameters:
      - $ref: '#/components/parameters/LyricsId'
    post:
      tags: [lyric-assist]
      operationId: createLyricAssist
      summary: Start an assistant action on the saved sheet (on demand; nothing runs otherwise).
      description: |
        Checks, in this order: sheet exists (404); `expectedRevision` equals the sheet revision
        (409 `revision-conflict`); language `nl` or `en` (409 `language-unsupported`); own lyrics
        (409 `not-own-lyrics`, the matching track title in `matchedTrackTitle`); `instruction`
        passes the imitation guard (400 `imitation`); no other assist running (409
        `assist-active`, its id in `activeAssistId`); for `devices`, `alternatives`, `continue`
        and `titles` a usable model layer (409 `model-unavailable` with `reason` and `fix`); with
        backend `claude` the notice is acknowledged (409 `claude-notice-required`). `check` with
        no usable model runs the dictionary layer only (the assist lists the model layer as
        unavailable). Returns at once; progress and suggestions stream on the events endpoint.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateLyricAssistRequest'
            example:
              kind: check
              expectedRevision: 7
              categories: [spelling, grammar, flow]
      responses:
        '202':
          description: The assist was created (status `queued`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LyricAssist'
        '400':
          $ref: '#/components/responses/ValidationOrImitation'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/AssistConflict'
    get:
      tags: [lyric-assist]
      operationId: listLyricAssists
      summary: The newest assists of a sheet (at most 20), newest first, without suggestions.
      responses:
        '200':
          description: Assist summaries.
          content:
            application/json:
              schema:
                type: array
                maxItems: 20
                items:
                  $ref: '#/components/schemas/LyricAssistSummary'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/lyric-assists/{assistId}:
    parameters:
      - $ref: '#/components/parameters/AssistId'
    get:
      tags: [lyric-assist]
      operationId: getLyricAssist
      summary: Snapshot of one assist with its suggestions.
      responses:
        '200':
          description: The assist.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LyricAssist'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/lyric-assists/{assistId}/events:
    parameters:
      - $ref: '#/components/parameters/AssistId'
    get:
      tags: [lyric-assist]
      operationId: streamLyricAssistEvents
      summary: Server-sent events of one assist (replayable).
      description: |
        `text/event-stream` with `id: <seq>`, `event: <type>`, `data: <JSON>` and a
        `: keep-alive` comment every 15 s; replay with `after` or `Last-Event-ID`; the stream
        closes after `assist.completed`, `assist.failed` or `assist.cancelled`. Event types and
        payloads: `LyricAssistEvent` (data-model section 10).
      parameters:
        - name: after
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
        - name: Last-Event-ID
          in: header
          required: false
          schema:
            type: string
            maxLength: 20
      responses:
        '200':
          description: The event stream.
          content:
            text/event-stream:
              schema:
                type: string
                description: Framed events; each `data` line is a `LyricAssistEvent` payload.
        '404':
          $ref: '#/components/responses/NotFound'
  /api/lyric-assists/{assistId}/cancel:
    parameters:
      - $ref: '#/components/parameters/AssistId'
    post:
      tags: [lyric-assist]
      operationId: cancelLyricAssist
      summary: Cancel a queued or running assist; suggestions already shown stay open.
      responses:
        '202':
          description: Cancelled (or cancelling).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LyricAssist'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/AssistEnded'
  /api/lyrics/{lyricsId}/suggestions:
    parameters:
      - $ref: '#/components/parameters/LyricsId'
    get:
      tags: [lyric-assist]
      operationId: listLyricSuggestions
      summary: Suggestions of the sheet, anchored to the current revision.
      parameters:
        - name: status
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/SuggestionStatus'
        - name: category
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/SuggestionCategory'
      responses:
        '200':
          description: The suggestions (default filter `status=open`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuggestionList'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/lyrics/{lyricsId}/suggestions/accept:
    parameters:
      - $ref: '#/components/parameters/LyricsId'
    post:
      tags: [lyric-assist]
      operationId: acceptLyricSuggestions
      summary: Apply one or more open suggestions as one revision and one undo step.
      description: |
        The server copies the stored proposals (never text from the request). Stale suggestions
        are skipped and reported in `stale`; overlapping suggestions in one request are refused
        (409 `overlapping-suggestions`); a result over 4,096 characters is refused (422
        `too-long`). Accepting an alternative supersedes its group. Lines produced by an accepted
        suggestion are recorded as assisted lines.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SuggestionDecisionRequest'
      responses:
        '200':
          description: The new sheet state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AcceptResult'
        '400':
          $ref: '#/components/responses/ValidationProblem'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/SheetConflict'
        '422':
          $ref: '#/components/responses/TooLong'
  /api/lyrics/{lyricsId}/suggestions/reject:
    parameters:
      - $ref: '#/components/parameters/LyricsId'
    post:
      tags: [lyric-assist]
      operationId: rejectLyricSuggestions
      summary: Reject one or more open suggestions (the text does not change).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SuggestionDecisionRequest'
      responses:
        '200':
          description: The decided suggestions.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuggestionList'
        '400':
          $ref: '#/components/responses/ValidationProblem'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/SheetConflict'
  /api/lyrics/{lyricsId}/suggestions/{suggestionId}/intentional:
    parameters:
      - $ref: '#/components/parameters/LyricsId'
      - $ref: '#/components/parameters/SuggestionId'
    post:
      tags: [lyric-assist]
      operationId: markSuggestionIntentional
      summary: Close a correction as intentional and store a mark for its text (word, phrase or line).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MarkSuggestionIntentionalRequest'
      responses:
        '201':
          description: The created (or existing, identical) mark.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IntentionalMark'
        '400':
          $ref: '#/components/responses/ValidationProblem'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/SheetConflict'
  /api/lyrics/{lyricsId}/intentional-marks:
    parameters:
      - $ref: '#/components/parameters/LyricsId'
    get:
      tags: [lyric-assist]
      operationId: listIntentionalMarks
      summary: Intentional marks of the sheet, with whether each text currently occurs.
      responses:
        '200':
          description: The marks.
          content:
            application/json:
              schema:
                type: array
                maxItems: 200
                items:
                  $ref: '#/components/schemas/IntentionalMark'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags: [lyric-assist]
      operationId: createIntentionalMark
      summary: Mark a word, phrase or line of the sheet as intentional (also from a selection in the editor).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IntentionalMarkInput'
      responses:
        '201':
          description: The created (or existing, identical) mark.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IntentionalMark'
        '400':
          $ref: '#/components/responses/ValidationProblem'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/MarkLimit'
  /api/lyrics/{lyricsId}/intentional-marks/{markId}:
    parameters:
      - $ref: '#/components/parameters/LyricsId'
      - $ref: '#/components/parameters/MarkId'
    delete:
      tags: [lyric-assist]
      operationId: deleteIntentionalMark
      summary: Remove an intentional mark.
      responses:
        '204':
          description: Removed.
        '404':
          $ref: '#/components/responses/NotFound'
  /api/lyrics/{lyricsId}/assist-settings:
    parameters:
      - $ref: '#/components/parameters/LyricsId'
    put:
      tags: [lyric-assist]
      operationId: updateSheetAssistSettings
      summary: Set the sheet's sensitivity and rhythm target (does not change the text or revision).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SheetAssistSettingsUpdate'
      responses:
        '200':
          description: The sheet's assist information.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SheetAssistInfo'
        '400':
          $ref: '#/components/responses/ValidationProblem'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/lyrics/{lyricsId}/undo:
    parameters:
      - $ref: '#/components/parameters/LyricsId'
    post:
      tags: [lyric-assist]
      operationId: undoLyricSuggestions
      summary: Undo the newest accept action (restores the previous revision and reopens its suggestions).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RevisionRequest'
      responses:
        '200':
          description: The restored sheet state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AcceptResult'
        '400':
          $ref: '#/components/responses/ValidationProblem'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/UndoConflict'
  /api/lyrics/{lyricsId}/revisions:
    parameters:
      - $ref: '#/components/parameters/LyricsId'
    get:
      tags: [lyric-assist]
      operationId: listLyricsRevisions
      summary: Stored revisions of the sheet (newest first, at most 50; Expert revision list).
      responses:
        '200':
          description: The revisions (without text).
          content:
            application/json:
              schema:
                type: array
                maxItems: 50
                items:
                  $ref: '#/components/schemas/LyricsRevisionSummary'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/lyrics/{lyricsId}/revisions/{revision}/restore:
    parameters:
      - $ref: '#/components/parameters/LyricsId'
      - $ref: '#/components/parameters/Revision'
    post:
      tags: [lyric-assist]
      operationId: restoreLyricsRevision
      summary: Restore a stored revision as a new revision (cause `undo`).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RevisionRequest'
      responses:
        '200':
          description: The restored sheet state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AcceptResult'
        '400':
          $ref: '#/components/responses/ValidationProblem'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/SheetConflict'
  /api/lyrics/{lyricsId}/syllables:
    parameters:
      - $ref: '#/components/parameters/LyricsId'
    get:
      tags: [lyric-assist]
      operationId: getSheetSyllables
      summary: Syllable report of the saved sheet (deterministic, local).
      responses:
        '200':
          description: The report.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SyllableReport'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/LanguageUnsupported'
  /api/lyric-assist/syllables:
    post:
      tags: [lyric-assist]
      operationId: countSyllables
      summary: Syllable report of unsaved editor text (deterministic, local; for the syllable gutter).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SyllableRequest'
      responses:
        '200':
          description: The report.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SyllableReport'
        '400':
          $ref: '#/components/responses/ValidationProblem'
  /api/lyric-assist/rhymes:
    get:
      tags: [lyric-assist]
      operationId: findRhymes
      summary: Perfect and near rhymes from local data (no model), within 500 ms.
      parameters:
        - name: word
          in: query
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 40
        - name: language
          in: query
          required: true
          schema:
            $ref: '#/components/schemas/AssistLanguage'
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 60
            default: 30
      responses:
        '200':
          description: The rhymes.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RhymeResult'
        '400':
          $ref: '#/components/responses/ValidationProblem'
  /api/lyric-assist/words:
    get:
      tags: [lyric-assist]
      operationId: listLyricWords
      summary: The personal word list of one language.
      parameters:
        - name: language
          in: query
          required: true
          schema:
            $ref: '#/components/schemas/AssistLanguage'
      responses:
        '200':
          description: The words, alphabetical.
          content:
            application/json:
              schema:
                type: array
                maxItems: 5000
                items:
                  $ref: '#/components/schemas/LyricWord'
        '400':
          $ref: '#/components/responses/ValidationProblem'
    post:
      tags: [lyric-assist]
      operationId: addLyricWord
      summary: Add a word to the personal word list ("Add to my words").
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LyricWordInput'
      responses:
        '201':
          description: The created (or existing) word.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LyricWord'
        '400':
          $ref: '#/components/responses/ValidationProblem'
        '409':
          $ref: '#/components/responses/WordLimit'
  /api/lyric-assist/words/{wordId}:
    parameters:
      - $ref: '#/components/parameters/WordId'
    delete:
      tags: [lyric-assist]
      operationId: deleteLyricWord
      summary: Remove a word from the personal word list.
      responses:
        '204':
          description: Removed.
        '404':
          $ref: '#/components/responses/NotFound'
  /api/lyric-assist/language-guess:
    post:
      tags: [lyric-assist]
      operationId: guessLyricsLanguage
      summary: Deterministic Dutch/English guess for a sheet with language `unknown` (dictionary hit ratio).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LanguageGuessRequest'
      responses:
        '200':
          description: The guess.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LanguageGuess'
        '400':
          $ref: '#/components/responses/ValidationProblem'
components:
  parameters:
    LyricsId:
      name: lyricsId
      in: path
      required: true
      description: Id of a 010 lyrics sheet.
      schema:
        type: string
        format: uuid
    AssistId:
      name: assistId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    SuggestionId:
      name: suggestionId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    MarkId:
      name: markId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    WordId:
      name: wordId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    Revision:
      name: revision
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
  responses:
    NotFound:
      description: Unknown sheet, assist, suggestion, mark, revision or word.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          example:
            title: Not found
            status: 404
    ValidationProblem:
      description: Invalid input; `errors` names the offending fields.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ValidationProblemDetails'
    ValidationOrImitation:
      description: Invalid input (`errors` present), or `imitation` - the instruction names an artist or asks to write like someone (ADR-018 D8, ADR-037 D7).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          example:
            type: https://stemstudio.local/problems/imitation
            title: Writing like a real artist is not supported. Describe a mood, theme or style instead.
            status: 400
    AssistConflict:
      description: |
        `revision-conflict` (the sheet changed; reload), `language-unsupported` (not `nl`/`en`),
        `not-own-lyrics` (matches library track lyrics; `matchedTrackTitle`), `assist-active`
        (`activeAssistId`), `model-unavailable` (`reason`, `fix`), `claude-notice-required`.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/AssistProblem'
          example:
            type: https://stemstudio.local/problems/not-own-lyrics
            title: This text matches the lyrics of "Hero of the Day". The assistant works on your own lyrics only.
            status: 409
            code: not-own-lyrics
            matchedTrackTitle: Hero of the Day
    AssistEnded:
      description: '`assist-ended` - the assist is already completed, failed or cancelled.'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    SheetConflict:
      description: '`revision-conflict` (the sheet changed since `expectedRevision`), `overlapping-suggestions` (`suggestionIds`), `suggestion-not-open` (`suggestionIds`).'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/AssistProblem'
    UndoConflict:
      description: '`revision-conflict`, `nothing-to-undo` (the newest revision is not an accept), `undo-blocked-by-edit` (`changedLines`: user edits were saved after the accept).'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/AssistProblem'
    TooLong:
      description: '`too-long` - the result would exceed 4,096 characters after normalisation.'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    LanguageUnsupported:
      description: '`language-unsupported` - the sheet language is not `nl` or `en`.'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/AssistProblem'
    MarkLimit:
      description: '`mark-limit` - the sheet already has 200 intentional marks.'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    WordLimit:
      description: '`word-limit` - the personal word list of this language has 5,000 words.'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
  schemas:
    ProblemDetails:
      type: object
      description: RFC 9457 problem details. Extension members are allowed.
      required: [title, status]
      properties:
        type:
          type: string
          default: about:blank
        title:
          type: string
        status:
          type: integer
          minimum: 400
          maximum: 599
        detail:
          type: [string, 'null']
        instance:
          type: [string, 'null']
    ValidationProblemDetails:
      allOf:
        - $ref: '#/components/schemas/ProblemDetails'
        - type: object
          required: [errors]
          properties:
            errors:
              type: object
              additionalProperties:
                type: array
                items:
                  type: string
    AssistProblem:
      description: Problem details of the lyric assistant with its extension members.
      allOf:
        - $ref: '#/components/schemas/ProblemDetails'
        - type: object
          required: [code]
          properties:
            code:
              type: string
              enum: [revision-conflict, language-unsupported, not-own-lyrics, assist-active, model-unavailable, claude-notice-required, overlapping-suggestions, suggestion-not-open, nothing-to-undo, undo-blocked-by-edit]
            currentRevision:
              type: [integer, 'null']
            matchedTrackTitle:
              type: [string, 'null']
              maxLength: 200
            activeAssistId:
              type: [string, 'null']
              format: uuid
            reason:
              type: [string, 'null']
              maxLength: 500
            fix:
              type: [string, 'null']
              maxLength: 500
            suggestionIds:
              type: array
              maxItems: 100
              items:
                type: string
                format: uuid
            changedLines:
              type: [integer, 'null']
              minimum: 0
    AssistLanguage:
      type: string
      description: Languages of the assistant (a subset of 010 `LyricsLanguage`).
      enum: [nl, en]
    Sensitivity:
      type: string
      description: '`loose` = errors only; `balanced` (default) = errors and improvements; `strict` = also recognised licences as ideas.'
      enum: [loose, balanced, strict]
    AssistKind:
      type: string
      enum: [check, devices, alternatives, continue, titles]
    SuggestionCategory:
      type: string
      enum: [spelling, grammar, flow, licence, device, alternative, continuation, title]
    SuggestionType:
      type: string
      description: Closed list (data-model section 4).
      enum:
        - spelling.typo
        - spelling.unknown-word
        - spelling.capitalisation
        - grammar.agreement
        - grammar.verb-form
        - grammar.word-order
        - grammar.homophone
        - grammar.other
        - flow.stress
        - flow.awkward
        - flow.repetition
        - flow.clarity
        - flow.syllable-count
        - licence.elision
        - licence.inversion
        - licence.archaism
        - licence.sound-spelling
        - licence.slang
        - licence.code-switch
        - device.end-rhyme
        - device.internal-rhyme
        - device.assonance
        - device.alliteration
        - device.imagery
        - device.syllable-fit
        - device.rhythm
        - write.alternative
        - write.continuation
        - write.title
    SuggestionSeverity:
      type: string
      enum: [error, improvement, idea]
    SuggestionStatus:
      type: string
      enum: [open, accepted, rejected, intentional, stale, superseded]
    SuggestionSource:
      type: string
      enum: [dictionary, rules, model]
    SuggestionOperation:
      type: string
      enum: [replace, insertAfter, setTitle, none]
    AssistStatus:
      type: string
      enum: [queued, running, completed, failed, cancelled]
    LayerInfo:
      type: object
      additionalProperties: false
      required: [layer, name, available]
      properties:
        layer:
          type: string
          enum: [dictionary, rules, model]
        name:
          type: string
          maxLength: 100
          description: e.g. "OpenTaal (nl)", "SCOWL + CMUdict (en)", "qwen3.5:9b (local)", "Claude (claude-opus-5-5)".
        available:
          type: boolean
        reason:
          type: [string, 'null']
          maxLength: 500
        fix:
          type: [string, 'null']
          maxLength: 500
    LyricAssistStatus:
      type: object
      additionalProperties: false
      required: [languages, dictionary, model, claudeNoticeRequired, assistActive]
      properties:
        languages:
          type: array
          items:
            $ref: '#/components/schemas/AssistLanguage'
        dictionary:
          $ref: '#/components/schemas/LayerInfo'
        model:
          type: object
          additionalProperties: false
          required: [backend, ready, usingFallback]
          properties:
            backend:
              type: string
              enum: [ollama, claude, none, fake]
            ready:
              type: boolean
            activeModel:
              type: [string, 'null']
            usingFallback:
              type: boolean
            reason:
              type: [string, 'null']
              maxLength: 500
            fix:
              type: [string, 'null']
              maxLength: 500
            qualityNote:
              type: [string, 'null']
              maxLength: 300
              description: Standing quality note, e.g. Dutch grammar with the local model (SC-001).
        claudeNoticeRequired:
          type: boolean
          description: True when the backend is `claude` and the current notice version is not acknowledged.
        assistActive:
          type: [string, 'null']
          format: uuid
          description: Id of the running assist, if any.
    LyricAssistSettings:
      type: object
      additionalProperties: false
      required: [claudeNoticeAcknowledged, claudeNoticeVersion, claudeNoticeText]
      properties:
        claudeNoticeAcknowledged:
          type: boolean
        claudeNoticeAcknowledgedAt:
          type: [string, 'null']
          format: date-time
        claudeNoticeVersion:
          type: string
          example: lyric-claude-notice.v1
        claudeNoticeText:
          type: string
          maxLength: 1000
    LyricAssistSettingsUpdate:
      type: object
      additionalProperties: false
      required: [acknowledgeClaudeNotice]
      properties:
        acknowledgeClaudeNotice:
          type: boolean
          description: true acknowledges the current notice version; false withdraws the acknowledgement.
    CreateLyricAssistRequest:
      type: object
      additionalProperties: false
      required: [kind, expectedRevision]
      properties:
        kind:
          $ref: '#/components/schemas/AssistKind'
        expectedRevision:
          type: integer
          minimum: 1
        categories:
          type: array
          description: '`check`: subset of spelling, grammar, flow, licence; `devices`: subset of device, licence; ignored for writing kinds.'
          maxItems: 5
          uniqueItems: true
          items:
            $ref: '#/components/schemas/SuggestionCategory'
        lineFrom:
          type: [integer, 'null']
          minimum: 1
        lineTo:
          type: [integer, 'null']
          minimum: 1
        count:
          type: [integer, 'null']
          minimum: 1
          maximum: 5
          description: alternatives 1-5 (3), continue 1-4 (2), titles 1-5 (5).
        instruction:
          type: [string, 'null']
          maxLength: 200
          description: Optional mood/theme hint for devices and writing kinds; imitation guard.
    Anchor:
      type: object
      additionalProperties: false
      required: [line, start, length, original]
      properties:
        line:
          type: integer
          minimum: 0
          description: 1-based line in the normalised text; 0 for titles.
        start:
          type: integer
          minimum: 0
          description: UTF-16 offset within the line.
        length:
          type: integer
          minimum: 0
        original:
          type: string
          maxLength: 400
    LyricSuggestion:
      type: object
      additionalProperties: false
      required: [suggestionId, assistId, category, type, severity, anchor, operation, explanation, source, status]
      properties:
        suggestionId:
          type: string
          format: uuid
        assistId:
          type: string
          format: uuid
        category:
          $ref: '#/components/schemas/SuggestionCategory'
        type:
          $ref: '#/components/schemas/SuggestionType'
        severity:
          $ref: '#/components/schemas/SuggestionSeverity'
        anchor:
          $ref: '#/components/schemas/Anchor'
        operation:
          $ref: '#/components/schemas/SuggestionOperation'
        proposal:
          type: [string, 'null']
          maxLength: 400
        groupId:
          type: [string, 'null']
          format: uuid
        explanation:
          type: string
          minLength: 1
          maxLength: 300
        source:
          $ref: '#/components/schemas/SuggestionSource'
        model:
          type: [string, 'null']
          maxLength: 100
        syllablesBefore:
          type: [integer, 'null']
          minimum: 0
        syllablesAfter:
          type: [integer, 'null']
          minimum: 0
        rhymeWith:
          oneOf:
            - type: 'null'
            - type: object
              additionalProperties: false
              required: [line, word]
              properties:
                line:
                  type: integer
                  minimum: 1
                word:
                  type: string
                  maxLength: 40
        status:
          $ref: '#/components/schemas/SuggestionStatus'
        decidedAt:
          type: [string, 'null']
          format: date-time
    CategoryCounts:
      type: object
      additionalProperties: false
      required: [spelling, grammar, flow, licence, device, alternative, continuation, title]
      properties:
        spelling:
          type: integer
          minimum: 0
        grammar:
          type: integer
          minimum: 0
        flow:
          type: integer
          minimum: 0
        licence:
          type: integer
          minimum: 0
        device:
          type: integer
          minimum: 0
        alternative:
          type: integer
          minimum: 0
        continuation:
          type: integer
          minimum: 0
        title:
          type: integer
          minimum: 0
    DiscardedCounts:
      type: object
      additionalProperties: false
      required: [invalidAnchor, invalidSchema, failedVerification, filtered, verbatim]
      properties:
        invalidAnchor:
          type: integer
          minimum: 0
        invalidSchema:
          type: integer
          minimum: 0
        failedVerification:
          type: integer
          minimum: 0
        filtered:
          type: integer
          minimum: 0
        verbatim:
          type: integer
          minimum: 0
          description: Withheld because too close to library lyrics (shown to every level).
    TokenUsage:
      type: object
      additionalProperties: false
      required: [inputTokens, outputTokens, cachedInputTokens]
      properties:
        inputTokens:
          type: integer
          minimum: 0
        outputTokens:
          type: integer
          minimum: 0
        cachedInputTokens:
          type: integer
          minimum: 0
    LyricAssistSummary:
      type: object
      additionalProperties: false
      required: [assistId, lyricsId, sheetRevision, kind, status, language, sensitivity, layers, usingFallback, blocksTotal, blocksDone, blocksSkipped, counts, discarded, origin, createdAt]
      properties:
        assistId:
          type: string
          format: uuid
        lyricsId:
          type: string
          format: uuid
        sheetRevision:
          type: integer
          minimum: 1
        kind:
          $ref: '#/components/schemas/AssistKind'
        status:
          $ref: '#/components/schemas/AssistStatus'
        language:
          $ref: '#/components/schemas/AssistLanguage'
        sensitivity:
          $ref: '#/components/schemas/Sensitivity'
        layers:
          type: array
          maxItems: 3
          items:
            $ref: '#/components/schemas/LayerInfo'
        backend:
          type: [string, 'null']
          enum: [ollama, claude, fake, null]
        model:
          type: [string, 'null']
          maxLength: 100
        usingFallback:
          type: boolean
        blocksTotal:
          type: integer
          minimum: 0
        blocksDone:
          type: integer
          minimum: 0
        blocksSkipped:
          type: integer
          minimum: 0
        counts:
          $ref: '#/components/schemas/CategoryCounts'
        discarded:
          $ref: '#/components/schemas/DiscardedCounts'
        usage:
          oneOf:
            - type: 'null'
            - $ref: '#/components/schemas/TokenUsage'
        origin:
          type: string
          enum: [editor, agent]
        agentRunId:
          type: [string, 'null']
          format: uuid
        failure:
          oneOf:
            - type: 'null'
            - type: object
              additionalProperties: false
              required: [code, message]
              properties:
                code:
                  type: string
                  enum: [backend-unavailable, budget-exhausted, refusal, timeout, interrupted, internal]
                message:
                  type: string
                  maxLength: 500
                fix:
                  type: [string, 'null']
                  maxLength: 500
        estimatedSeconds:
          type: [number, 'null']
          minimum: 0
        createdAt:
          type: string
          format: date-time
        startedAt:
          type: [string, 'null']
          format: date-time
        endedAt:
          type: [string, 'null']
          format: date-time
    LyricAssist:
      allOf:
        - $ref: '#/components/schemas/LyricAssistSummary'
        - type: object
          required: [suggestions]
          properties:
            suggestions:
              type: array
              maxItems: 400
              items:
                $ref: '#/components/schemas/LyricSuggestion'
    LyricAssistEvent:
      description: '`data` of one SSE event; the SSE `event` field names the variant (data-model section 10), so the variants are listed with `anyOf` (selected by the event name, not by shape).'
      anyOf:
        - title: assist.started
          type: object
          required: [assistId, layers, usingFallback, blocksTotal]
          properties:
            assistId:
              type: string
              format: uuid
            layers:
              type: array
              items:
                $ref: '#/components/schemas/LayerInfo'
            backend:
              type: [string, 'null']
            model:
              type: [string, 'null']
            usingFallback:
              type: boolean
            blocksTotal:
              type: integer
              minimum: 0
            estimatedSeconds:
              type: [number, 'null']
        - title: assist.progress
          type: object
          required: [blocksDone, blocksSkipped, blocksTotal]
          properties:
            blocksDone:
              type: integer
              minimum: 0
            blocksSkipped:
              type: integer
              minimum: 0
            blocksTotal:
              type: integer
              minimum: 0
        - title: suggestion.added
          $ref: '#/components/schemas/LyricSuggestion'
        - title: assist.note
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              enum: [block-skipped, fallback-model, quality-note, verbatim-withheld]
            message:
              type: string
              maxLength: 300
        - title: usage.updated
          $ref: '#/components/schemas/TokenUsage'
        - title: assist.completed
          type: object
          required: [counts, discarded, durationMs]
          properties:
            counts:
              $ref: '#/components/schemas/CategoryCounts'
            discarded:
              $ref: '#/components/schemas/DiscardedCounts'
            durationMs:
              type: integer
              minimum: 0
        - title: assist.failed
          type: object
          required: [code, message]
          properties:
            code:
              type: string
            message:
              type: string
              maxLength: 500
            fix:
              type: [string, 'null']
        - title: assist.cancelled
          type: object
          required: [assistId]
          properties:
            assistId:
              type: string
              format: uuid
    SuggestionList:
      type: object
      additionalProperties: false
      required: [lyricsId, revision, suggestions]
      properties:
        lyricsId:
          type: string
          format: uuid
        revision:
          type: integer
          minimum: 1
        suggestions:
          type: array
          maxItems: 400
          items:
            $ref: '#/components/schemas/LyricSuggestion'
    SuggestionDecisionRequest:
      type: object
      additionalProperties: false
      required: [suggestionIds, expectedRevision]
      properties:
        suggestionIds:
          type: array
          minItems: 1
          maxItems: 100
          uniqueItems: true
          items:
            type: string
            format: uuid
        expectedRevision:
          type: integer
          minimum: 1
    RevisionRequest:
      type: object
      additionalProperties: false
      required: [expectedRevision]
      properties:
        expectedRevision:
          type: integer
          minimum: 1
    AssistedLine:
      type: object
      additionalProperties: false
      required: [line, suggestionId]
      properties:
        line:
          type: integer
          minimum: 1
        suggestionId:
          type: string
          format: uuid
    RhythmTarget:
      type: object
      additionalProperties: false
      required: [bpm, beatsPerBar, barsPerLine, syllablesPerBeat]
      properties:
        bpm:
          type: integer
          minimum: 40
          maximum: 220
        beatsPerBar:
          type: integer
          minimum: 2
          maximum: 7
        barsPerLine:
          type: integer
          minimum: 1
          maximum: 8
        syllablesPerBeat:
          type: number
          minimum: 0.5
          maximum: 4
          multipleOf: 0.25
    SheetAssistInfo:
      type: object
      additionalProperties: false
      description: Member `assist` of `LyricsSheet` at the merge.
      required: [sensitivity, openSuggestions, assistedLines, intentionalMarkCount, canUndo]
      properties:
        sensitivity:
          $ref: '#/components/schemas/Sensitivity'
        rhythmTarget:
          oneOf:
            - type: 'null'
            - $ref: '#/components/schemas/RhythmTarget'
        openSuggestions:
          type: integer
          minimum: 0
        assistedLines:
          type: array
          maxItems: 400
          items:
            $ref: '#/components/schemas/AssistedLine'
        intentionalMarkCount:
          type: integer
          minimum: 0
        canUndo:
          type: boolean
          description: The newest revision is an accept action.
    SheetAssistSettingsUpdate:
      type: object
      additionalProperties: false
      properties:
        sensitivity:
          $ref: '#/components/schemas/Sensitivity'
        rhythmTarget:
          oneOf:
            - type: 'null'
            - $ref: '#/components/schemas/RhythmTarget'
          description: null clears the target; absent keeps it.
    AcceptResult:
      type: object
      additionalProperties: false
      required: [lyricsId, revision, title, text, assist, applied, stale]
      properties:
        lyricsId:
          type: string
          format: uuid
        revision:
          type: integer
          minimum: 1
        title:
          type: string
          minLength: 1
          maxLength: 80
        text:
          type: string
          maxLength: 4096
        assist:
          $ref: '#/components/schemas/SheetAssistInfo'
        applied:
          type: array
          items:
            type: string
            format: uuid
        stale:
          type: array
          items:
            type: string
            format: uuid
        reopened:
          type: array
          description: Suggestions reopened by an undo or restore.
          items:
            type: string
            format: uuid
    IntentionalScope:
      type: string
      enum: [word, phrase, line]
    IntentionalMarkInput:
      type: object
      additionalProperties: false
      required: [scope, text]
      properties:
        scope:
          $ref: '#/components/schemas/IntentionalScope'
        text:
          type: string
          minLength: 1
          maxLength: 400
          description: word 1-40 without spaces; phrase 1-200; line 1-400; must occur in the current sheet text.
        note:
          type: [string, 'null']
          maxLength: 120
    MarkSuggestionIntentionalRequest:
      type: object
      additionalProperties: false
      required: [scope, expectedRevision]
      properties:
        scope:
          $ref: '#/components/schemas/IntentionalScope'
          description: '`word`/`phrase` = the anchor text; `line` = the whole anchor line.'
        expectedRevision:
          type: integer
          minimum: 1
        note:
          type: [string, 'null']
          maxLength: 120
    IntentionalMark:
      type: object
      additionalProperties: false
      required: [markId, scope, text, inText, createdAt]
      properties:
        markId:
          type: string
          format: uuid
        scope:
          $ref: '#/components/schemas/IntentionalScope'
        text:
          type: string
          maxLength: 400
        note:
          type: [string, 'null']
          maxLength: 120
        inText:
          type: boolean
          description: The marked text currently occurs in the sheet.
        createdAt:
          type: string
          format: date-time
    LyricsRevisionSummary:
      type: object
      additionalProperties: false
      required: [revision, cause, createdAt]
      properties:
        revision:
          type: integer
          minimum: 1
        cause:
          type: string
          enum: [created, userSave, accept, undo]
        acceptGroupId:
          type: [string, 'null']
          format: uuid
        changedLines:
          type: integer
          minimum: 0
        createdAt:
          type: string
          format: date-time
    SyllableRequest:
      type: object
      additionalProperties: false
      required: [language, text]
      properties:
        language:
          $ref: '#/components/schemas/AssistLanguage'
        text:
          type: string
          minLength: 1
          maxLength: 65536
          description: Raw editor text; normalised like a 010 save (not stored).
        rhythmTarget:
          oneOf:
            - type: 'null'
            - $ref: '#/components/schemas/RhythmTarget'
    SyllableLine:
      type: object
      additionalProperties: false
      required: [line, syllables, isMarker, deviates]
      properties:
        line:
          type: integer
          minimum: 1
        syllables:
          type: integer
          minimum: 0
        isMarker:
          type: boolean
          description: Section marker or blank line (not counted).
        section:
          type: [string, 'null']
          maxLength: 40
        sectionMedian:
          type: [number, 'null']
        target:
          type: [integer, 'null']
        deviates:
          type: boolean
          description: More than 2 from the target, or from the section median when there is no target.
    SyllableReport:
      type: object
      additionalProperties: false
      required: [language, lines]
      properties:
        language:
          $ref: '#/components/schemas/AssistLanguage'
        lines:
          type: array
          maxItems: 4096
          items:
            $ref: '#/components/schemas/SyllableLine'
        targetDurationSeconds:
          type: [number, 'null']
          minimum: 0
        wordsPerSecond:
          type: [number, 'null']
          minimum: 0
          description: 010 density at the target duration; the UI warns above 4.0.
    Rhyme:
      type: object
      additionalProperties: false
      required: [word, kind, syllables]
      properties:
        word:
          type: string
          maxLength: 40
        kind:
          type: string
          enum: [perfect, near]
        syllables:
          type: integer
          minimum: 1
    RhymeResult:
      type: object
      additionalProperties: false
      required: [word, language, rhymes, source]
      properties:
        word:
          type: string
          maxLength: 40
        language:
          $ref: '#/components/schemas/AssistLanguage'
        rhymes:
          type: array
          maxItems: 60
          items:
            $ref: '#/components/schemas/Rhyme'
        source:
          type: string
          description: e.g. "CMU Pronouncing Dictionary" or "OpenTaal word list, spelling rhyme rules".
          maxLength: 100
    LyricWordInput:
      type: object
      additionalProperties: false
      required: [language, word]
      properties:
        language:
          $ref: '#/components/schemas/AssistLanguage'
        word:
          type: string
          minLength: 1
          maxLength: 40
          pattern: '^\S+$'
    LyricWord:
      type: object
      additionalProperties: false
      required: [wordId, language, word, createdAt]
      properties:
        wordId:
          type: string
          format: uuid
        language:
          $ref: '#/components/schemas/AssistLanguage'
        word:
          type: string
          maxLength: 40
        createdAt:
          type: string
          format: date-time
    LanguageGuessRequest:
      type: object
      additionalProperties: false
      required: [text]
      properties:
        text:
          type: string
          minLength: 1
          maxLength: 65536
    LanguageGuess:
      type: object
      additionalProperties: false
      required: [confidence]
      properties:
        language:
          oneOf:
            - type: 'null'
            - $ref: '#/components/schemas/AssistLanguage'
          description: null when neither language reaches 60 % dictionary hits.
        confidence:
          type: number
          minimum: 0
          maximum: 1
