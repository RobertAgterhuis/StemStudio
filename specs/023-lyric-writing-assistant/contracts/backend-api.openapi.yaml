              file:
                contentType: text/plain, text/markdown, application/octet-stream
      responses:
        '201':
          description: Saved (normalised).
          headers:
            Location:
              $ref: '#/components/headers/LyricsLocation'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LyricsSheet'
        '400':
          $ref: '#/components/responses/ValidationProblem'
        '413':
          $ref: '#/components/responses/LyricsTooLarge'
        '415':
          $ref: '#/components/responses/LyricsUnsupportedMediaType'
  /api/lyrics/sections:
    post:
      tags: [songs]
      operationId: proposeSections
      summary: Propose section markers for lyrics text (pure helper, nothing is stored) (1.9.0).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SectionsRequest'
            example:
              text: "Sing it loud, sing it free\nEvery note is part of me\n\nThis little song belongs to me\n\nPaper planes and a borrowed tune\n\nThis little song belongs to me"
      responses:
        '200':
          description: The text with markers and the sections found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SectionProposal'
              examples:
                proposal:
                  $ref: '#/components/examples/SectionProposalExample'
        '400':
          $ref: '#/components/responses/ValidationProblem'
  /api/lyrics/{lyricsId}:
    parameters:
      - $ref: '#/components/parameters/LyricsId'
    get:
      tags: [songs]
      operationId: getLyricsSheet
      summary: One lyrics sheet (1.9.0).
      responses:
        '200':
          description: The sheet.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LyricsSheet'
              examples:
                sheet:
                  $ref: '#/components/examples/LyricsSheetExample'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [songs]
      operationId: updateLyricsSheet
      summary: Replace a lyrics sheet; songs keep their lyrics snapshot (1.9.0).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LyricsInput'
      responses:
        '200':
          description: Updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LyricsSheet'
        '400':
          $ref: '#/components/responses/ValidationProblem'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/AssistConflict'
    delete:
      tags: [songs]
      operationId: deleteLyricsSheet
      summary: Delete a lyrics sheet; songs keep their lyrics snapshot (1.9.0).
      x-stemstudio-write-gate: backupRunning
      responses:
        '204':
          description: Deleted.
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/BackupRunning'
        '503':
          $ref: '#/components/responses/Maintenance'
  /api/songs:
    post:
      tags: [songs]
      operationId: createSong
      summary: Generate a song from own lyrics with an AI voice or as an instrumental (1.9.0).
      description: |
        Exactly one of `lyricsId` and `lyricsText` (normalised like `createLyricsSheet`); unless
        `instrumental`, the lyrics must not be empty. Exactly one of `styleId` and `freeCaption`
        may be given (neither: a neutral pop caption); `freeCaption`, `delivery` and the style
        texts pass the artist-imitation guard (`400`, problem type `imitation`). The caption is
        the 009 style caption plus the lead voice and delivery (at most 512 characters). A lyrics
        density above 4 words per second is **not** an error: the generation is created and
        `warnings` says so. `409` (`not-installed`, `gpu-required`) when the generator cannot run.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SongRequest'
            examples:
              withStyle:
                $ref: '#/components/examples/SongRequestExample'
              instrumental:
                $ref: '#/components/examples/InstrumentalSongRequestExample'
      responses:
        '202':
          description: Generation created and queued.
          headers:
            Location:
              $ref: '#/components/headers/GenerationLocation'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Generation'
              examples:
                queued:
                  $ref: '#/components/examples/QueuedSongGeneration'
        '400':
          $ref: '#/components/responses/StyleValidationProblem'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/GenerationConflict'
        '503':
          $ref: '#/components/responses/GeneratorUnavailable'
  /api/voice-profiles:
    get:
      tags: [voices]
      operationId: listVoiceProfiles
      summary: Own-voice profiles (1.9.0).
      responses:
        '200':
          description: All profiles, by display name.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/VoiceProfile'
              examples:
                profiles:
                  $ref: '#/components/examples/VoiceProfileList'
    post:
      tags: [voices]
      operationId: createVoiceProfile
      summary: Create a voice profile from an own recording or upload with consent (1.9.0).
      description: |
        Order of checks (ADR-019 D3): consent first, before any file is written
        (`consentConfirmed` must be true -> else `400 consent-required`; the statement version
        must be the current one -> else `400 consent-outdated`; `personName` 1-80); display
        name unique (`409 voice-name-taken`); singer ready (`409 voice-not-installed` /
        `voice-unavailable`); the file-byte SHA-256 of the sample must not equal any stored
        stem, detail stem, take, take vocal, export or upload (`422 library-audio`; an
        exact-copy guard, not a similarity check); the singer checks duration and voiced ratio
        (`422 too-short`, `too-long`, `unvoiced`). Only then the normalised sample and the
        consent record are stored.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CreateVoiceProfileRequest'
            encoding:
              sample:
                contentType: audio/webm, audio/wav, audio/x-wav, audio/flac, audio/mpeg, application/octet-stream
      responses:
        '201':
          description: Profile created.
          headers:
            Location:
              $ref: '#/components/headers/VoiceProfileLocation'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VoiceProfile'
              examples:
                profile:
                  $ref: '#/components/examples/VoiceProfileExample'
        '400':
          $ref: '#/components/responses/ConsentProblem'
        '409':
          $ref: '#/components/responses/VoiceConflict'
        '413':
          $ref: '#/components/responses/SampleTooLarge'
        '422':
          $ref: '#/components/responses/SampleRejected'
        '503':
          $ref: '#/components/responses/GeneratorUnavailable'
  /api/voice-profiles/{profileId}:
    parameters:
      - $ref: '#/components/parameters/ProfileId'
    get:
      tags: [voices]
      operationId: getVoiceProfile
      summary: One voice profile with its consent record (1.9.0).
      responses:
        '200':
          description: The profile.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VoiceProfile'
              examples:
                profile:
                  $ref: '#/components/examples/VoiceProfileExample'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [voices]
      operationId: deleteVoiceProfile
      summary: Delete a voice profile and every file derived from its sample (1.9.0).
      description: |
        Cancels queued and running conversions with the profile, removes the sample and every
        temporary file, and keeps converted takes labelled "converted to <name> (profile
        deleted)" unless `deleteTakes=true` (then their files and library items are removed too).
      parameters:
        - name: deleteTakes
          in: query
          required: false
          schema:
            type: boolean
            default: false
      x-stemstudio-write-gate: backupRunning
      responses:
        '204':
          description: Deleted.
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/BackupRunning'
        '503':
          $ref: '#/components/responses/Maintenance'
  /api/voice-profiles/{profileId}/sample:
    parameters:
      - $ref: '#/components/parameters/ProfileId'
    get:
      tags: [voices]
      operationId: getVoiceSample
      summary: Play the normalised sample of a profile (48 kHz mono FLAC) (1.9.0).
      parameters:
        - $ref: '#/components/parameters/RangeHeader'
        - $ref: '#/components/parameters/IfNoneMatchHeader'
        - $ref: '#/components/parameters/IfModifiedSinceHeader'
        - $ref: '#/components/parameters/IfRangeHeader'
      responses:
        '200':
          $ref: '#/components/responses/AudioFile'
        '206':
          $ref: '#/components/responses/AudioFilePart'
        '304':
          $ref: '#/components/responses/AudioNotModified'
        '404':
          $ref: '#/components/responses/NotFound'
        '416':
          $ref: '#/components/responses/RangeNotSatisfiable'
  /api/consent/voice:
    get:
      tags: [voices]
      operationId: getVoiceConsentStatement
      summary: The current consent statement for voice profiles (English and Dutch) (1.9.0).
      responses:
        '200':
          description: The statement shown next to the consent checkbox.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConsentStatement'
              examples:
                v1:
                  $ref: '#/components/examples/ConsentStatementV1'
  /api/generations/{generationId}/takes/{index}/voice-conversions:
    parameters:
      - $ref: '#/components/parameters/GenerationId'
      - $ref: '#/components/parameters/TakeIndex'
    post:
      tags: [voices]
      operationId: createVoiceConversion
      summary: '"Use my voice": convert the vocal of a song take to a voice profile (1.9.0).'
      description: |
        Only for a completed `song` take with `vocal: synthetic` (`409 no-vocals` otherwise).
        When the take is not imported yet it is imported first (as `importTake`) and the
        generation waits in `waitingForStems` until the track's separation is completed; then the
        `vocals` stem (target), the other five stems (accompaniment) and the profile sample
        (prompt) are sent to the singer service. `409` (`voice-not-installed`,
        `voice-unavailable`) when the singer cannot run.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VoiceConversionRequest'
            example:
              profileId: 4b6d8f0a-1c3e-4a5b-9d7f-2e4c6a8b0d1f
              pitchShift: 0
              autoShift: true
      responses:
        '202':
          description: Conversion created (`queued` or `waitingForStems`).
          headers:
            Location:
              $ref: '#/components/headers/GenerationLocation'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Generation'
              examples:
                waitingForStems:
                  $ref: '#/components/examples/WaitingForStemsConversion'
        '400':
          $ref: '#/components/responses/ValidationProblem'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/VoiceConflict'
        '503':
          $ref: '#/components/responses/GeneratorUnavailable'
  /api/generations/{generationId}/takes/{index}/vocal:
    parameters:
      - $ref: '#/components/parameters/GenerationId'
      - $ref: '#/components/parameters/TakeIndex'
    get:
      tags: [voices]
      operationId: getTakeVocal
      summary: Play or download the converted vocal of a voice-conversion take (1.9.0).
      parameters:
        - $ref: '#/components/parameters/RangeHeader'
        - $ref: '#/components/parameters/IfNoneMatchHeader'
        - $ref: '#/components/parameters/IfModifiedSinceHeader'
        - $ref: '#/components/parameters/IfRangeHeader'
      responses:
        '200':
          $ref: '#/components/responses/AudioFile'
        '206':
          $ref: '#/components/responses/AudioFilePart'
        '304':
          $ref: '#/components/responses/AudioNotModified'
        '404':
          $ref: '#/components/responses/NotFound'
        '416':
          $ref: '#/components/responses/RangeNotSatisfiable'
  /api/agent/status:
    get:
      tags: [agent]
      operationId: getAgentStatus
      summary: Readiness of the selected backend (always 200; each probe at most 2 s).
      description: Unchanged operation; its `claude` member now carries `key` (ClaudeKeyStatus). Never contacts Anthropic.
      responses:
        '200':
          description: The status; never contains the key.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentStatus'
  /api/agent/settings:
    get:
      tags: [agent]
      operationId: getAgentSettings
      summary: The agent settings (defaults when never saved).
      responses:
        '200':
          description: The settings.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentSettings'
    put:
      tags: [agent]
      operationId: updateAgentSettings
      summary: Change the backend, models, effort or limits.
      description: |
        Omitted fields keep their value. `backend: claude` needs a usable Claude key - the
        `ANTHROPIC_API_KEY` environment variable or a readable key stored in Settings
        (`/api/agent/settings/claude-key`); otherwise 409 `claude-not-configured` - and the
        acknowledged notice (422 `notice-not-acknowledged`; send `acknowledgeClaudeNotice: true` in
        the same or an earlier request). Ollama models must be
        installed with the `tools` capability (422 `model-unavailable`). `fake` cannot be selected
        here (environment only).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateAgentSettingsRequest'
      responses:
        '200':
          description: The saved settings.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentSettings'
        '400':
          $ref: '#/components/responses/ValidationProblem'
        '409':
          $ref: '#/components/responses/AgentConflict'
        '422':
          $ref: '#/components/responses/AgentUnprocessable'
  /api/agent/settings/claude-key:
    get:
      tags: [agent]
      operationId: getClaudeKeyStatus
      summary: Status of the Claude key (sources, last four, save time); never the key.
      description: Not local-only (it reveals nothing secret). Never contacts Anthropic.
      responses:
        '200':
          description: The key status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClaudeKeyStatus'
    put:
      tags: [agent]
      operationId: storeClaudeKey
      summary: Store or replace the Claude key, encrypted (local-only, write-only).
      description: |
        The key is trimmed, format-checked (prefix `sk-ant-`, 40-256 characters of `A-Z a-z 0-9 - _`,
        not an admin key), encrypted with ASP.NET Core Data Protection and stored; an existing
        stored key is replaced in the same transaction. Does **not** contact Anthropic and does not
        change the selected backend or the notice acknowledgement. Bodies over 1 KiB: 413. The
        value never appears in any response, including validation problems. When
        `ANTHROPIC_API_KEY` is set, the stored key is kept but the environment key stays active
        (`state: environment`, `stored: readable`).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StoreClaudeKeyRequest'
      responses:
        '200':
          description: Stored; the resulting key status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClaudeKeyStatus'
        '400':
          $ref: '#/components/responses/InvalidBody'
        '403':
          $ref: '#/components/responses/LocalOnly'
        '413':
          $ref: '#/components/responses/ClaudeKeyTooLarge'
        '422':
          $ref: '#/components/responses/ClaudeKeyInvalid'
        '503':
          $ref: '#/components/responses/KeyStoreUnavailable'
    delete:
      tags: [agent]
      operationId: deleteClaudeKey
      summary: Delete the stored Claude key (local-only, idempotent).
      description: |
        Removes the stored ciphertext; the environment variable is not affected. Does not change the
        selected backend; when Claude is selected and no key remains, `GET /api/agent/status`
        reports it not ready with "Switch to Local". An unreadable stored key can be deleted too.
      responses:
        '200':
          description: Deleted (or nothing was stored); the resulting key status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClaudeKeyStatus'
        '403':
          $ref: '#/components/responses/LocalOnly'
  /api/agent/settings/test:
    post:
      tags: [agent]
      operationId: testAgentBackend
      summary: Test the connection to a backend without generating text.
      description: |
        Ollama: version and model capabilities. Claude: only the free model lookup
        `GET /v1/models/{id}`, and only on this explicit call; never in CI. 1.21.0: for Claude the
        optional `claudeKeySource` picks the key to test (`active` default); the Claude case is
        local-only (`403 local-only`). The result's `keySource` names the key that was tested.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TestAgentBackendRequest'
      responses:
        '200':
          description: The test result (also when the backend failed; see `ok`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BackendTestResult'
        '400':
          $ref: '#/components/responses/ValidationProblem'
        '403':
          $ref: '#/components/responses/LocalOnly'
  /api/agent/tools:
    get:
      tags: [agent]
      operationId: listAgentTools
      summary: Registry view of the tools for a page context, sorted by name.
      parameters:
        - name: page
          in: query
          required: false
          schema:
            type: string
            maxLength: 40
        - name: trackId
          in: query
          required: false
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Available and unavailable tools (contracts/tool-catalogue.md).
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AgentToolInfo'
        '400':
          $ref: '#/components/responses/ValidationProblem'
  /api/agent/conversations:
    get:
      tags: [agent]
      operationId: listConversations
      summary: Conversations, newest first.
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
        - name: before
          in: query
          required: false
          description: Only conversations updated before this time (paging).
          schema:
            type: string
            format: date-time
      responses:
        '200':
          description: One page of conversations.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ConversationSummary'
        '400':
          $ref: '#/components/responses/ValidationProblem'
    post:
      tags: [agent]
      operationId: createConversation
      summary: Start a new conversation.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateConversationRequest'
      responses:
        '201':
          description: Created.
          headers:
            Location:
              description: URL of the new conversation.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Conversation'
        '400':
          $ref: '#/components/responses/ValidationProblem'
  /api/agent/conversations/{conversationId}:
    parameters:
      - $ref: '#/components/parameters/ConversationId'
    get:
      tags: [agent]
      operationId: getConversation
      summary: A conversation with its messages and run summaries.
      responses:
        '200':
          description: The conversation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Conversation'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [agent]
      operationId: renameConversation
      summary: Rename a conversation.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RenameConversationRequest'
      responses:
        '200':
          description: Renamed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConversationSummary'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/AgentUnprocessable'
    delete:
      tags: [agent]
      operationId: deleteConversation
      summary: Delete a conversation with its runs, steps, approvals, undo entries and events.
      x-stemstudio-write-gate: backupRunning
      responses:
        '204':
          description: Deleted.
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/AgentConflict'
        '503':
          $ref: '#/components/responses/Maintenance'
  /api/agent/conversations/{conversationId}/messages:
    parameters:
      - $ref: '#/components/parameters/ConversationId'
    post:
      tags: [agent]
      operationId: sendAgentMessage
      summary: Send a command; stores the message and queues a run.
      description: |
        503 `backend-unavailable` carries the `AgentStatus` in the extension member `agentStatus`
        (the RFC 9457 member `status` stays the HTTP status; DELTA.md draft said `status`).
        409 `run-active` while another run is active; 422 for an empty text or more than 4,000
        characters.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendAgentMessageRequest'
      responses:
        '202':
          description: Message stored, run queued; follow `GET /api/agent/runs/{runId}/events`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentMessageAccepted'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/AgentConflict'
        '422':
          $ref: '#/components/responses/AgentUnprocessable'
        '503':
          description: The selected backend is not ready (`backend-unavailable`).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/BackendUnavailableProblem'
  /api/agent/conversations/{conversationId}/undo:
    parameters:
      - $ref: '#/components/parameters/ConversationId'
    post:
      tags: [agent]
      operationId: undoLastAgentAction
      summary: Undo the newest undoable command of the conversation as a new run.
      responses:
        '202':
          description: Undo run queued.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentRunAccepted'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/AgentConflict'
  /api/agent/runs/{runId}:
    parameters:
      - $ref: '#/components/parameters/RunId'
    get:
      tags: [agent]
      operationId: getAgentRun
      summary: Snapshot of a run (status, plan, steps, pending approval, usage).
      responses:
        '200':
          description: The run.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentRun'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/agent/runs/{runId}/events:
    parameters:
      - $ref: '#/components/parameters/RunId'
    get:
      tags: [agent]
      operationId: streamAgentRunEvents
      summary: Server-sent events of a run, with replay.
      description: |
        Each event is `id: <seq>`, `event: <type>`, `data: <JSON>` (decoded form: schema
        `AgentRunEvent`). Every stored event with a seq larger than `after` (or `Last-Event-ID`) is
        replayed first, then live events follow. A `: keep-alive` comment is sent every 15 s. The
        stream ends after `run.completed`, `run.failed`, `run.cancelled` or `run.interrupted`.
      parameters:
        - name: after
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
        - name: Last-Event-ID
          in: header
          required: false
          schema:
            type: string
            pattern: '^[0-9]+$'
      responses:
        '200':
          description: The event stream (`text/event-stream`, UTF-8).
          content:
            text/event-stream:
              schema:
                $ref: '#/components/schemas/AgentRunEvent'
              example: |
                id: 1
                event: run.started
                data: {"runId":"0b9d3c6e-2f4a-4c8b-9e1d-7a6b5c4d3e2f","backend":"ollama","model":"qwen3.5:9b","usingFallback":false}

                id: 2
                event: text.delta
                data: {"text":"Muting the drums."}

                : keep-alive

        '404':
          $ref: '#/components/responses/NotFound'
  /api/agent/runs/{runId}/approvals/{stepId}:
    parameters:
      - $ref: '#/components/parameters/RunId'
      - $ref: '#/components/parameters/StepId'
    post:
      tags: [agent]
      operationId: decideAgentApproval
      summary: Approve or reject a pending step (idempotent; the first decision wins).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DecideApprovalRequest'
      responses:
        '200':
          description: The stored approval state (also for a repeated decision).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApprovalState'
        '400':
          $ref: '#/components/responses/ValidationProblem'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/AgentConflict'
  /api/agent/runs/{runId}/ui-results/{stepId}:
    parameters:
      - $ref: '#/components/parameters/RunId'
      - $ref: '#/components/parameters/StepId'
    post:
      tags: [agent]
      operationId: submitAgentUiResult
      summary: Result of a UI tool executed by the open page (UI tool round trip).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubmitUiResultRequest'
      responses:
        '204':
          description: Accepted; the run continues.
        '400':
          $ref: '#/components/responses/ValidationProblem'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/AgentConflict'
  /api/agent/runs/{runId}/cancel:
    parameters:
      - $ref: '#/components/parameters/RunId'
    post:
      tags: [agent]
      operationId: cancelAgentRun
      summary: Cancel a run, optionally with the jobs it started.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CancelAgentRunRequest'
      responses:
        '202':
          description: Cancellation accepted; the snapshot after cancelling.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentRun'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/AgentConflict'
  /api/library-care/status:
    get:
      tags: [library-care]
      operationId: getLibraryCareStatus
      summary: Gate mode, the active library job, the backups folder state and blockers for a restore.
      description: Always answers, also during maintenance (the UI polls it to leave the maintenance screen).
      responses:
        '200':
          description: Current state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LibraryCareStatus'
              examples:
                idle:
                  $ref: '#/components/examples/StatusIdle'
                backupRunning:
                  $ref: '#/components/examples/StatusBackupRunning'
  /api/backups:
    get:
      tags: [library-care]
      operationId: listBackups
      summary: Archives in the backups folder, newest first, with their manifest summary.
      description: |
        Lists every `*.zip` file (not `*.partial`) in the backups folder. A file without a readable
        manifest is listed with `recognised: false` and the reason. Manifests are read from the
        central directory (no full read); results are cached per file name, size and modification
        time.
      responses:
        '200':
          description: The folder state and the archives.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BackupList'
              examples:
                twoArchives:
                  $ref: '#/components/examples/BackupListTwo'
    post:
      tags: [library-care]
      operationId: createBackup
      summary: Start a backup of the library into the backups folder.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BackupOptions'
            example:
              detailStems: false
              exports: true
              scores: true
              generations: true
              voiceProfiles: true
      responses:
        '202':
          description: Backup job accepted.
          headers:
            Location:
              description: URL of the library job.
              schema:
                type: string
              example: /api/library-jobs/8e0c1f2a-3b4d-4e5f-8a6b-7c8d9e0f1a2b
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LibraryJob'
              examples:
                queued:
                  $ref: '#/components/examples/BackupJobQueued'
        '400':
          $ref: '#/components/responses/ValidationProblem'
        '409':
          description: |
            `library-job-running` (another library job is active), `backups-folder-unavailable`
            (missing or not writable; `detail` has the reason), `insufficient-disk-space`
            (extension members `requiredBytes`, `freeBytes`).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: https://stemstudio.local/problems/insufficient-disk-space
                title: Not enough free space in the backups folder
                status: 409
                detail: The backup needs about 21.4 GB; 12.0 GB is free.
                requiredBytes: 21474836480
                freeBytes: 12884901888
        '503':
          $ref: '#/components/responses/Maintenance'
  /api/backups/estimate:
    get:
      tags: [library-care]
      operationId: estimateBackup
      summary: Size per category and free space for the given options.
      parameters:
        - $ref: '#/components/parameters/IncludeDetailStems'
        - $ref: '#/components/parameters/IncludeExports'
        - $ref: '#/components/parameters/IncludeScores'
        - $ref: '#/components/parameters/IncludeGenerations'
        - $ref: '#/components/parameters/IncludeRecordings'
        - $ref: '#/components/parameters/IncludeVoiceProfiles'
      responses:
        '200':
          description: The estimate (from a storage walk, at most 30 s old).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BackupEstimate'
              examples:
                defaults:
                  $ref: '#/components/examples/EstimateDefaults'
        '400':
          $ref: '#/components/responses/ValidationProblem'
  /api/backups/{fileName}:
    parameters:
      - $ref: '#/components/parameters/FileName'
    get:
      tags: [library-care]
      operationId: getBackup
      summary: Details of one archive (manifest summary, consent proofs, compatibility).
      responses:
        '200':
          description: The archive details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BackupDetails'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          description: '`archive-invalid`: not a ZIP or no valid manifest.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
    delete:
      tags: [library-care]
      operationId: deleteBackup
      summary: Delete an archive from the backups folder.
      responses:
        '204':
          description: Deleted.
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: '`archive-in-use`: a library job reads or writes this archive.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '503':
          $ref: '#/components/responses/Maintenance'
  /api/backups/{fileName}/file:
    parameters:
      - $ref: '#/components/parameters/FileName'
    get:
      tags: [library-care]
      operationId: downloadBackup
      summary: Download the archive (resumable).
      description: Served from disk with `Content-Disposition attachment`, `Accept-Ranges bytes`, `ETag`, `Last-Modified` (same semantics as stems, 1.0.1).
      parameters:
        - name: Range
          in: header
          required: false
          schema:
            type: string
          example: bytes=0-1048575
      responses:
        '200':
          description: The whole archive.
          headers:
            Content-Disposition:
              schema:
                type: string
              example: attachment; filename="stemstudio-backup-20261116-142233.zip"
            ETag:
              schema:
                type: string
          content:
            application/zip:
              schema:
                type: string
                contentMediaType: application/zip
        '206':
          description: A byte range.
          content:
            application/zip:
              schema:
                type: string
                contentMediaType: application/zip
        '404':
          $ref: '#/components/responses/NotFound'
        '416':
          description: Range not satisfiable.
  /api/backups/{fileName}/verify:
    parameters:
      - $ref: '#/components/parameters/FileName'
    post:
      tags: [library-care]
      operationId: verifyBackup
      summary: Check every entry of an archive (structure, layout, hashes, database integrity) without restoring it.
      responses:
        '202':
          description: Verify job accepted; the report is in `LibraryJob.report` (`VerifyReport`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LibraryJob'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/LibraryJobRunning'
        '503':
          $ref: '#/components/responses/Maintenance'
  /api/backups/{fileName}/restore:
    parameters:
      - $ref: '#/components/parameters/FileName'
    post:
      tags: [library-care]
      operationId: restoreBackup
      summary: Restore an archive (empty library, replace or merge).
      description: |
        Validates the whole archive before any change (data-model 3.4), migrates an older schema
        in staging, then switches the library in one journalled step. `mode: replace` on a
        non-empty library needs `confirmation: "REPLACE"` and keeps the current library as the
        previous library (at most one may exist). `mode: merge` adds what is missing (P3).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RestoreOptions'
            examples:
              replace:
                value:
                  mode: replace
                  voiceProfiles: true
                  confirmation: REPLACE
              merge:
                value:
                  mode: merge
                  voiceProfiles: false
      responses:
        '202':
          description: Restore job accepted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LibraryJob'
              examples:
                running:
                  $ref: '#/components/examples/RestoreJobExtracting'
        '400':
          $ref: '#/components/responses/ValidationProblem'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: |
            `library-job-running`; `backup-running`; `jobs-active` (extension member `activeWork`:
            `ActiveWork[]`); `previous-library-exists` (discard or undo it first);
            `insufficient-disk-space` (`requiredBytes`, `freeBytes`).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: https://stemstudio.local/problems/jobs-active
                title: Jobs are running
                status: 409
                detail: Wait for 2 jobs to finish or cancel them, then restore.
                activeWork:
                  - kind: export
                    id: 2f6d8a0c-1b3e-4f5a-9c7d-8e9f0a1b2c3d
                    title: Song title - vocals
                  - kind: generation
                    id: 9a8b7c6d-5e4f-4a3b-8c2d-1e0f9a8b7c6d
                    title: Restyle of Song title
        '422':
          description: |
            `confirmation-required` (replace without `confirmation: "REPLACE"`),
            `archive-incompatible` (format major or newer migrations; extension members
            `archiveBackendApi`, `unknownMigrations`), `archive-invalid`.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '503':
          $ref: '#/components/responses/Maintenance'
  /api/library-jobs:
    get:
      tags: [library-care]
      operationId: listLibraryJobs
      summary: Recent library jobs, newest first (at most 50 are kept).
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 10
      responses:
        '200':
          description: The jobs.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/LibraryJob'
        '400':
          $ref: '#/components/responses/ValidationProblem'
  /api/library-jobs/{jobId}:
    parameters:
      - $ref: '#/components/parameters/JobId'
    get:
      tags: [library-care]
      operationId: getLibraryJob
      summary: Status of a library job (also during maintenance).
      responses:
        '200':
          description: The job.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LibraryJob'
              examples:
                backupRunning:
                  $ref: '#/components/examples/BackupJobRunning'
                backupCompleted:
                  $ref: '#/components/examples/BackupJobCompleted'
                restoreCompleted:
                  $ref: '#/components/examples/RestoreJobCompleted'
                restoreFailed:
                  $ref: '#/components/examples/RestoreJobFailedUnsafe'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/library-jobs/{jobId}/cancel:
    parameters:
      - $ref: '#/components/parameters/JobId'
    post:
      tags: [library-care]
      operationId: cancelLibraryJob
      summary: Cancel a queued or running library job.
      description: 'A backup removes its partial file, a restore its staging folder; within 5 seconds the job is `cancelled`. A restore cannot be cancelled once it switches the library (`cancellable` false).'
      responses:
        '202':
          description: Cancellation requested; the job is returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LibraryJob'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: '`not-cancellable`: terminal, or a restore in the switch or reconcile stage.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /api/library-care/previous:
    get:
      tags: [library-care]
      operationId: getPreviousLibrary
      summary: The library kept aside by the last replace restore.
      responses:
        '200':
          description: The previous library.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PreviousLibrary'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/library-care/previous/revert:
    post:
      tags: [library-care]
      operationId: revertRestore
      summary: Undo the last replace restore (switch back to the previous library).
      description: Runs an `undoRestore` library job with the same journal; the restored library becomes the previous library. Refused while jobs are active.
      responses:
        '202':
          description: Undo job accepted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LibraryJob'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: '`library-job-running`, `backup-running`, `jobs-active` (with `activeWork`).'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '503':
          $ref: '#/components/responses/Maintenance'
  /api/library-care/previous/discard:
    post:
      tags: [library-care]
      operationId: discardPreviousLibrary
      summary: Permanently delete the previous library.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Confirmation'
            example:
              confirmation: DISCARD
      responses:
        '204':
          description: Deleted.
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: '`library-job-running`, `backup-running`.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '422':
          description: '`confirmation-required`: the confirmation is not `DISCARD`.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '503':
          $ref: '#/components/responses/Maintenance'
  /api/storage:
    get:
      tags: [storage]
      operationId: getStorageOverview
      summary: Disk use per category, per track, per model cache, and free space.
      parameters:
        - name: refresh
          in: query
          required: false
          description: Bypass the 30-second cache.
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: The overview. Parts that cannot be measured carry `reason` instead of numbers.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StorageOverview'
              examples:
                small:
                  $ref: '#/components/examples/StorageSmall'
        '400':
          $ref: '#/components/responses/ValidationProblem'
        '503':
          $ref: '#/components/responses/Maintenance'
  /api/storage/cleanup/preview:
    post:
      tags: [storage]
      operationId: previewCleanup
      summary: Plan a clean-up of regenerable data; nothing is removed.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CleanupRequest'
            example:
              actions:
                - kind: detailStems
                  trackIds: null
                - kind: leftovers
      responses:
        '200':
          description: The plan, valid for 10 minutes.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CleanupPlan'
              examples:
                detail:
                  $ref: '#/components/examples/CleanupPlanDetail'
        '400':
          $ref: '#/components/responses/ValidationProblem'
        '409':
          description: '`backup-running`, `library-job-running`.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '503':
          $ref: '#/components/responses/Maintenance'
  /api/storage/cleanup:
    post:
      tags: [storage]
      operationId: executeCleanup
      summary: Execute a previewed clean-up plan.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExecuteCleanupRequest'
            example:
              planId: 3c5e7a9b-1d2f-4a6b-8c0d-2e4f6a8b0c1d
      responses:
        '200':
          description: What was removed and what failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CleanupResult'
        '400':
          $ref: '#/components/responses/ValidationProblem'
        '409':
          description: '`plan-expired` (unknown or older than 10 minutes), `plan-stale` (library changed since the preview), `backup-running`, `library-job-running`.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '503':
          $ref: '#/components/responses/Maintenance'
  /api/library/folders:
    get:
