    get:
      tags: [library]
      operationId: getLibraryFolder
      summary: An artist, album or song folder with its breadcrumb, child folders and (song level) items.
      parameters:
        - $ref: '#/components/parameters/FolderSort'
        - $ref: '#/components/parameters/KindFilter'
        - $ref: '#/components/parameters/StatusFilter'
        - $ref: '#/components/parameters/FolderLimit'
        - $ref: '#/components/parameters/FolderOffset'
