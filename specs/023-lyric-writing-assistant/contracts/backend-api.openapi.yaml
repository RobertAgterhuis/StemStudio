        '404':
          $ref: '#/components/responses/FolderNotFound'
        '422':
          $ref: '#/components/responses/LibraryQueryInvalid'
  /api/library/search:
    get:
      tags: [library]
      operationId: searchLibrary
      summary: Live search over artist, album, song, stem/instrument and item name.
      description: |
        Case- and accent-insensitive. The text is split into words (at most 8, from the first 100
        characters); every word must occur in at least one field. Folders are hits when at least one
        word occurs in their own name; items when all words occur across their fields. Groups are
        ordered by relevance (whole field, start of a word, inside a word), then name.
      parameters:
        - name: q
          in: query
          required: true
          description: The search text (1..100 characters after trimming).
          schema:
            type: string
            minLength: 1
            maxLength: 100
        - name: within
          in: query
          required: false
          description: Only folders and items inside this folder.
          schema:
            $ref: '#/components/schemas/FolderId'
        - name: limit
          in: query
          required: false
          description: Hits per group.
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 20
        - $ref: '#/components/parameters/IfNoneMatch'
      responses:
        '200':
          description: Grouped hits; `totals` count every hit of a group.
          headers:
            ETag:
              $ref: '#/components/headers/LibraryETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LibrarySearchResult'
              examples:
                noMatches:
                  $ref: '#/components/examples/EmptySearch'
        '304':
          description: Same query, unchanged library.
        '404':
          $ref: '#/components/responses/FolderNotFound'
        '422':
          $ref: '#/components/responses/LibraryQueryInvalid'
  /api/tracks/{trackId}/library-info:
