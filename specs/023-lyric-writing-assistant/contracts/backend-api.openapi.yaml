  /api/lyric-assist/status:
    get:
      tags: [lyric-assist]
      operationId: getLyricAssistStatus
      summary: Availability of the assistant layers (dictionary, model) and the Claude notice state.
      description: |
        Always 200. The model layer mirrors the 011 agent status (backend, ready, active model,
        fallback, reason, fix); probes are cached for 2 s like `GET /api/agent/status`. Assistant resources that are not scoped to one sheet live under `/api/lyric-assist/*` and `/api/lyric-assists/{assistId}` (no path ambiguity with the 010 `/api/lyrics/{lyricsId}` routes).
      responses:
        '200':
          description: The status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LyricAssistStatus'
  /api/lyric-assist/settings:
    get:
      tags: [lyric-assist]
      operationId: getLyricAssistSettings
      summary: Read the lyric-assistant settings, the Claude notice text and the own-work statement.
      description: |
        Read-only. The UI shows `claudeNoticeText` and `ownWorkStatementText` (with their versions)
        from here; it never uses the PUT to read them. Added in integration of round 022+023 (pre-release
        editorial, label unchanged).
      responses:
        '200':
          description: The stored settings.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LyricAssistSettings'
    put:
      tags: [lyric-assist]
      operationId: updateLyricAssistSettings
      summary: Acknowledge (or withdraw) the lyric-assistant Claude notice.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LyricAssistSettingsUpdate'
      responses:
        '200':
          description: The stored settings.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LyricAssistSettings'
        '400':
          $ref: '#/components/responses/ValidationProblem'
  /api/lyrics/{lyricsId}/assists:
    parameters:
      - $ref: '#/components/parameters/LyricsId'
    post:
      tags: [lyric-assist]
      operationId: createLyricAssist
      summary: Start an assistant action on the saved sheet (on demand; nothing runs otherwise).
      description: |
        Checks, in this order: sheet exists (404); `expectedRevision` equals the sheet revision
        (409 `revision-conflict`); language `nl` or `en` (409 `language-unsupported`); own lyrics
        (409 `not-own-lyrics`, the matching track title in `matchedTrackTitle`); `instruction`
        passes the imitation guard (400 `imitation`); no other assist running (409
        `assist-active`, its id in `activeAssistId`); for `devices`, `alternatives`, `continue`
        and `titles` a usable model layer (409 `model-unavailable` with `reason` and `fix`); with
        backend `claude` the notice is acknowledged (409 `claude-notice-required`). `check` with
        no usable model runs the dictionary layer only (the assist lists the model layer as
        unavailable). Returns at once; progress and suggestions stream on the events endpoint.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateLyricAssistRequest'
            example:
              kind: check
              expectedRevision: 7
              categories: [spelling, grammar, flow]
      responses:
        '202':
          description: The assist was created (status `queued`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LyricAssist'
        '400':
          $ref: '#/components/responses/ValidationOrImitation'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/AssistConflict'
    get:
      tags: [lyric-assist]
      operationId: listLyricAssists
      summary: The newest assists of a sheet (at most 20), newest first, without suggestions.
      responses:
        '200':
          description: Assist summaries.
          content:
            application/json:
              schema:
                type: array
                maxItems: 20
                items:
                  $ref: '#/components/schemas/LyricAssistSummary'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/lyric-assists/{assistId}:
    parameters:
      - $ref: '#/components/parameters/AssistId'
    get:
      tags: [lyric-assist]
      operationId: getLyricAssist
      summary: Snapshot of one assist with its suggestions.
      responses:
        '200':
          description: The assist.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LyricAssist'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/lyric-assists/{assistId}/events:
    parameters:
      - $ref: '#/components/parameters/AssistId'
    get:
      tags: [lyric-assist]
      operationId: streamLyricAssistEvents
      summary: Server-sent events of one assist (replayable).
      description: |
        `text/event-stream` with `id: <seq>`, `event: <type>`, `data: <JSON>` and a
        `: keep-alive` comment every 15 s; replay with `after` or `Last-Event-ID`; the stream
        closes after `assist.completed`, `assist.failed` or `assist.cancelled`. Event types and
        payloads: `LyricAssistEvent` (data-model section 10).
      parameters:
        - name: after
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
        - name: Last-Event-ID
          in: header
          required: false
          schema:
            type: string
            maxLength: 20
      responses:
        '200':
          description: The event stream.
          content:
            text/event-stream:
              schema:
                type: string
                description: Framed events; each `data` line is a `LyricAssistEvent` payload.
        '404':
          $ref: '#/components/responses/NotFound'
  /api/lyric-assists/{assistId}/cancel:
    parameters:
      - $ref: '#/components/parameters/AssistId'
    post:
      tags: [lyric-assist]
      operationId: cancelLyricAssist
      summary: Cancel a queued or running assist; suggestions already shown stay open.
      responses:
        '202':
          description: Cancelled (or cancelling).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LyricAssist'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/AssistEnded'
  /api/lyrics/{lyricsId}/suggestions:
    parameters:
      - $ref: '#/components/parameters/LyricsId'
    get:
      tags: [lyric-assist]
      operationId: listLyricSuggestions
      summary: Suggestions of the sheet, anchored to the current revision.
      parameters:
        - name: status
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/SuggestionStatus'
        - name: category
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/SuggestionCategory'
      responses:
        '200':
          description: The suggestions (default filter `status=open`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuggestionList'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/lyrics/{lyricsId}/suggestions/accept:
    parameters:
      - $ref: '#/components/parameters/LyricsId'
    post:
      tags: [lyric-assist]
      operationId: acceptLyricSuggestions
      summary: Apply one or more open suggestions as one revision and one undo step.
      description: |
        The server copies the stored proposals (never text from the request). Stale suggestions
        are skipped and reported in `stale`; overlapping suggestions in one request are refused
        (409 `overlapping-suggestions`); a result over 4,096 characters is refused (422
        `too-long`). Accepting an alternative supersedes its group. Lines produced by an accepted
        suggestion are recorded as assisted lines.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SuggestionDecisionRequest'
      responses:
        '200':
          description: The new sheet state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AcceptResult'
        '400':
          $ref: '#/components/responses/ValidationProblem'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/SheetConflict'
        '422':
          $ref: '#/components/responses/TooLong'
  /api/lyrics/{lyricsId}/suggestions/reject:
    parameters:
      - $ref: '#/components/parameters/LyricsId'
    post:
      tags: [lyric-assist]
      operationId: rejectLyricSuggestions
      summary: Reject one or more open suggestions (the text does not change).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SuggestionDecisionRequest'
      responses:
        '200':
          description: The decided suggestions.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuggestionList'
        '400':
          $ref: '#/components/responses/ValidationProblem'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/SheetConflict'
  /api/lyrics/{lyricsId}/suggestions/{suggestionId}/intentional:
    parameters:
      - $ref: '#/components/parameters/LyricsId'
      - $ref: '#/components/parameters/SuggestionId'
    post:
      tags: [lyric-assist]
      operationId: markSuggestionIntentional
      summary: Close a correction as intentional and store a mark for its text (word, phrase or line).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MarkSuggestionIntentionalRequest'
      responses:
        '201':
          description: The created (or existing, identical) mark.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IntentionalMark'
        '400':
          $ref: '#/components/responses/ValidationProblem'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/SheetConflict'
  /api/lyrics/{lyricsId}/intentional-marks:
    parameters:
      - $ref: '#/components/parameters/LyricsId'
    get:
      tags: [lyric-assist]
      operationId: listIntentionalMarks
      summary: Intentional marks of the sheet, with whether each text currently occurs.
      responses:
        '200':
          description: The marks.
          content:
            application/json:
              schema:
                type: array
                maxItems: 200
                items:
                  $ref: '#/components/schemas/IntentionalMark'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags: [lyric-assist]
      operationId: createIntentionalMark
      summary: Mark a word, phrase or line of the sheet as intentional (also from a selection in the editor).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IntentionalMarkInput'
      responses:
        '201':
          description: The created (or existing, identical) mark.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IntentionalMark'
        '400':
          $ref: '#/components/responses/ValidationProblem'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/MarkLimit'
  /api/lyrics/{lyricsId}/intentional-marks/{markId}:
    parameters:
      - $ref: '#/components/parameters/LyricsId'
      - $ref: '#/components/parameters/MarkId'
    delete:
      tags: [lyric-assist]
      operationId: deleteIntentionalMark
      summary: Remove an intentional mark.
      responses:
        '204':
          description: Removed.
        '404':
          $ref: '#/components/responses/NotFound'
  /api/lyrics/{lyricsId}/assist-settings:
    parameters:
      - $ref: '#/components/parameters/LyricsId'
    put:
      tags: [lyric-assist]
      operationId: updateSheetAssistSettings
      summary: Set the sheet's sensitivity and rhythm target (does not change the text or revision).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SheetAssistSettingsUpdate'
      responses:
        '200':
          description: The sheet's assist information.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SheetAssistInfo'
        '400':
          $ref: '#/components/responses/ValidationProblem'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/lyrics/{lyricsId}/own-work-override:
    parameters:
      - $ref: '#/components/parameters/LyricsId'
    put:
      tags: [lyric-assist]
      operationId: confirmOwnWork
      summary: Confirm that the sheet is the user's own work although it matches one library track (owner decision Q1).
      description: |
        For a false positive of the `not-own-lyrics` guard (e.g. a song of the user's own band that
        was imported). Requires the current statement version (`LyricAssistSettings.ownWorkStatementVersion`),
        the typed name and `confirm: true`. `matchedTrackId` must be a track the sheet currently
        matches (409 `override-not-applicable` otherwise, also when there is no match at all).
        Replaces an existing override. The override covers only that track; it never disables the
        verbatim hold-back on generated text or the imitation refusal. Not an agent tool.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OwnWorkConfirmRequest'
      responses:
        '200':
          description: The stored override.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OwnWorkOverride'
        '400':
          $ref: '#/components/responses/ValidationProblem'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/OverrideConflict'
    delete:
      tags: [lyric-assist]
      operationId: revokeOwnWork
      summary: Revoke the own-work override of the sheet.
      responses:
        '204':
          description: Revoked.
        '404':
          $ref: '#/components/responses/NotFound'
  /api/lyrics/{lyricsId}/undo:
    parameters:
      - $ref: '#/components/parameters/LyricsId'
    post:
      tags: [lyric-assist]
      operationId: undoLyricSuggestions
      summary: Undo the newest accept action (restores the previous revision and reopens its suggestions).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RevisionRequest'
      responses:
        '200':
          description: The restored sheet state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AcceptResult'
        '400':
          $ref: '#/components/responses/ValidationProblem'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/UndoConflict'
  /api/lyrics/{lyricsId}/revisions:
    parameters:
      - $ref: '#/components/parameters/LyricsId'
    get:
      tags: [lyric-assist]
      operationId: listLyricsRevisions
      summary: Stored revisions of the sheet (newest first, at most 50; Expert revision list).
      responses:
        '200':
          description: The revisions (without text).
          content:
            application/json:
              schema:
                type: array
                maxItems: 50
                items:
                  $ref: '#/components/schemas/LyricsRevisionSummary'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/lyrics/{lyricsId}/revisions/{revision}/restore:
    parameters:
      - $ref: '#/components/parameters/LyricsId'
      - $ref: '#/components/parameters/Revision'
    post:
      tags: [lyric-assist]
      operationId: restoreLyricsRevision
      summary: Restore a stored revision as a new revision (cause `undo`).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RevisionRequest'
      responses:
        '200':
          description: The restored sheet state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AcceptResult'
        '400':
          $ref: '#/components/responses/ValidationProblem'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/SheetConflict'
  /api/lyrics/{lyricsId}/syllables:
    parameters:
      - $ref: '#/components/parameters/LyricsId'
    get:
      tags: [lyric-assist]
      operationId: getSheetSyllables
      summary: Syllable report of the saved sheet (deterministic, local).
      responses:
        '200':
          description: The report.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SyllableReport'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/LanguageUnsupported'
  /api/lyric-assist/syllables:
    post:
      tags: [lyric-assist]
      operationId: countSyllables
      summary: Syllable report of unsaved editor text (deterministic, local; for the syllable gutter).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SyllableRequest'
      responses:
        '200':
          description: The report.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SyllableReport'
        '400':
          $ref: '#/components/responses/ValidationProblem'
  /api/lyric-assist/rhymes:
    get:
      tags: [lyric-assist]
      operationId: findRhymes
      summary: Perfect and near rhymes from local data (no model), within 500 ms.
      parameters:
        - name: word
          in: query
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 40
        - name: language
          in: query
          required: true
          schema:
            $ref: '#/components/schemas/AssistLanguage'
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 60
            default: 30
      responses:
        '200':
          description: The rhymes.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RhymeResult'
        '400':
          $ref: '#/components/responses/ValidationProblem'
  /api/lyric-assist/words:
    get:
      tags: [lyric-assist]
      operationId: listLyricWords
      summary: The personal word list of one language.
      parameters:
        - name: language
          in: query
          required: true
          schema:
            $ref: '#/components/schemas/AssistLanguage'
      responses:
        '200':
          description: The words, alphabetical.
          content:
            application/json:
              schema:
                type: array
                maxItems: 5000
                items:
                  $ref: '#/components/schemas/LyricWord'
        '400':
          $ref: '#/components/responses/ValidationProblem'
    post:
      tags: [lyric-assist]
      operationId: addLyricWord
      summary: Add a word to the personal word list ("Add to my words").
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LyricWordInput'
      responses:
        '201':
          description: The created (or existing) word.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LyricWord'
        '400':
          $ref: '#/components/responses/ValidationProblem'
        '409':
          $ref: '#/components/responses/WordLimit'
  /api/lyric-assist/words/{wordId}:
    parameters:
      - $ref: '#/components/parameters/WordId'
    delete:
      tags: [lyric-assist]
      operationId: deleteLyricWord
      summary: Remove a word from the personal word list.
      responses:
        '204':
          description: Removed.
        '404':
          $ref: '#/components/responses/NotFound'
  /api/lyric-assist/language-guess:
    post:
      tags: [lyric-assist]
      operationId: guessLyricsLanguage
      summary: Deterministic Dutch/English guess for a sheet with language `unknown` (dictionary hit ratio).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LanguageGuessRequest'
      responses:
        '200':
          description: The guess.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LanguageGuess'
        '400':
          $ref: '#/components/responses/ValidationProblem'
components:
  parameters:
    LyricsId:
      name: lyricsId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ProfileId:
      name: profileId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    StyleId:
      name: styleId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    GenerationId:
      name: generationId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    TakeIndex:
      name: index
      in: path
      required: true
      description: Take number, starting at 1.
      schema:
        type: integer
        minimum: 1
        maximum: 2
    RangeHeader:
      name: Range
      in: header
      required: false
      schema:
        type: string
      example: bytes=0-1048575
    IfNoneMatchHeader:
      name: If-None-Match
      in: header
      required: false
      schema:
        type: string
    IfModifiedSinceHeader:
      name: If-Modified-Since
      in: header
      required: false
      schema:
        type: string
    IfRangeHeader:
      name: If-Range
      in: header
      required: false
      schema:
        type: string
    TrackId:
      name: trackId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    MixId:
      name: mixId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    AssetId:
      name: assetId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ConversationId:
      name: conversationId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    RunId:
      name: runId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    StepId:
      name: stepId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    FileName:
      name: fileName
      in: path
      required: true
      description: Archive file name in the backups folder.
      schema:
        type: string
        pattern: '^[A-Za-z0-9][A-Za-z0-9._-]{0,119}\.zip$'
      example: stemstudio-backup-20261116-142233.zip
    JobId:
      name: jobId
      in: path
      required: true
      schema:
        type: string
        format: uuid
      example: 8e0c1f2a-3b4d-4e5f-8a6b-7c8d9e0f1a2b
    IncludeDetailStems:
      name: detailStems
      in: query
      required: false
      schema:
        type: boolean
        default: true
    IncludeExports:
      name: exports
      in: query
      required: false
      schema:
        type: boolean
        default: true
    IncludeScores:
      name: scores
      in: query
      required: false
      schema:
        type: boolean
        default: true
    IncludeGenerations:
      name: generations
      in: query
      required: false
      schema:
        type: boolean
        default: true
    IncludeRecordings:
      name: recordings
      in: query
      required: false
      schema:
        type: boolean
        default: true
    IncludeVoiceProfiles:
      name: voiceProfiles
      in: query
      required: false
      schema:
        type: boolean
        default: true
    FolderId:
      name: folderId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/FolderId'
    FolderSort:
      name: sort
      in: query
      required: false
      description: Order of the child folders. Default `name` for artists and songs, `year` for albums. `year` is accepted only for an artist folder (its albums).
      schema:
        $ref: '#/components/schemas/FolderSort'
    KindFilter:
      name: kind
      in: query
      required: false
      description: Count and list only items of this kind (folders without such items are left out).
      schema:
        $ref: '#/components/schemas/AssetKind'
    StatusFilter:
      name: status
      in: query
      required: false
      description: Count and list only items with this status.
      schema:
        $ref: '#/components/schemas/AssetStatus'
    FolderLimit:
      name: limit
      in: query
      required: false
      description: Child folders per page.
      schema:
        type: integer
        minimum: 1
        maximum: 500
        default: 200
    FolderOffset:
      name: offset
      in: query
      required: false
      schema:
        type: integer
        minimum: 0
        default: 0
    IfNoneMatch:
      name: If-None-Match
      in: header
      required: false
      description: A previously received `ETag`.
      schema:
        type: string
    AssistId:
      name: assistId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    SuggestionId:
      name: suggestionId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    MarkId:
      name: markId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    WordId:
      name: wordId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    Revision:
      name: revision
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
  headers:
    LyricsLocation:
      description: URL of the lyrics sheet.
      schema:
        type: string
      example: /api/lyrics/2c4e6a8b-0d1f-4a3b-8c5d-7e9f1a3b5c7d
    VoiceProfileLocation:
      description: URL of the voice profile.
      schema:
        type: string
      example: /api/voice-profiles/4b6d8f0a-1c3e-4a5b-9d7f-2e4c6a8b0d1f
    StyleLocation:
      description: URL of the style resource.
      schema:
        type: string
      example: /api/styles/7d1f3a5c-2b4e-4c6a-9e8f-0a1b2c3d4e5f
    GenerationLocation:
      description: URL of the generation resource to poll.
      schema:
        type: string
      example: /api/generations/1a2b3c4d-5e6f-4a7b-8c9d-0e1f2a3b4c5d
    AcceptRanges:
      schema:
        type: string
        const: bytes
    ETag:
      description: Entity tag of the stem file.
      schema:
        type: string
      example: '"1db3f0a2c4e5"'
    LastModified:
      description: HTTP-date of the stem file's last write.
      schema:
        type: string
      example: Sat, 14 Nov 2026 12:06:30 GMT
    TrackLocation:
      description: URL of the track resource to poll.
      schema:
        type: string
      example: /api/tracks/0b7e4c1a-9d2f-4e8b-a1c3-5f6e7d8c9b0a
    ArtworkETag:
      description: Entity tag of the picture (quoted artwork version).
      schema:
        type: string
      example: '"2c26b46b68ff"'
    AssetLocation:
      description: URL of the library item to poll.
      schema:
        type: string
      example: /api/assets/3c9a1e7b-5d2f-4a6c-8e0b-1f2a3b4c5d6e
    ContentDisposition:
      description: '`attachment` (or `inline` with `inline=true`) with the sanitised item name (RFC 6266/5987).'
      schema:
        type: string
      example: attachment; filename="Never Gonna Give You Up - drums.flac"; filename*=UTF-8''Never%20Gonna%20Give%20You%20Up%20-%20drums.flac
    NoStore:
      description: Lyrics are never cached (ADR-015 D6).
      schema:
        type: string
        const: no-store
    LibraryETag:
      description: '`"lib-<revision>"`, the library revision (16 hex).'
      schema:
        type: string
        pattern: '^"lib-[0-9a-f]{16}"$'
  schemas:
    HealthResponse:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
          const: ok
    ImportUrlRequest:
      type: object
      additionalProperties: false
      required: [url]
      properties:
        url:
          type: string
          minLength: 1
          maxLength: 2048
          description: |
            YouTube video URL (youtube.com, www.youtube.com, m.youtube.com, music.youtube.com,
            youtu.be; `watch?v=`, `youtu.be/<id>`, `shorts/<id>`) or Spotify track URL
            (`https://open.spotify.com/track/<id>`, optional `intl-xx/` segment). Playlists,
            albums, podcasts and other hosts are rejected.
    UploadRequest:
      type: object
      required: [file]
      properties:
        file:
          type: string
          contentMediaType: application/octet-stream
          description: .mp3, .wav or .flac file, at most 209715200 bytes.
    SourceType:
      type: string
      enum: [youtube, spotify, upload]
    TrackStatus:
      type: string
      description: '`completed` and `failed` are terminal; see data-model.md for transitions.'
      enum: [queued, downloading, separating, analysing, completed, failed]
    StemName:
      type: string
      enum: [vocals, drums, bass, guitar, piano, other]
    Stem:
      type: object
      additionalProperties: false
      required: [name, url]
      properties:
        name:
          $ref: '#/components/schemas/StemName'
        url:
          type: string
          description: Relative URL /api/tracks/{trackId}/stems/{name}; resolve against the public API base URL.
    BeatGrid:
      type: object
      additionalProperties: false
      required: [bpm, beats, downbeats, beatsPerBar, confidence, reliable]
      properties:
        bpm:
          type: number
          minimum: 0
          maximum: 400
        beats:
          type: array
          items:
            type: number
            minimum: 0
        downbeats:
          type: array
          items:
            type: number
            minimum: 0
        beatsPerBar:
          type: integer
          minimum: 1
          maximum: 12
        confidence:
          type: number
          minimum: 0
          maximum: 1
        reliable:
          type: boolean
    Track:
      type: object
      additionalProperties: false
      required: [id, title, sourceType, sourceKey, status, progress, stems, detail, metadata, lyricsStatus, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
          minLength: 1
          maxLength: 500
        artist:
          type: [string, 'null']
          maxLength: 500
        sourceType:
          $ref: '#/components/schemas/SourceType'
        sourceKey:
          type: string
          pattern: '^(youtube|spotify|upload):[A-Za-z0-9_-]{1,64}$'
        sourceUrl:
          type: [string, 'null']
        status:
          $ref: '#/components/schemas/TrackStatus'
        stage:
          type: [string, 'null']
          maxLength: 200
        progress:
          type: integer
          minimum: 0
          maximum: 100
        error:
          type: [string, 'null']
          maxLength: 1000
        durationSeconds:
          type: [number, 'null']
          exclusiveMinimum: 0
          maximum: 900
        model:
          type: [string, 'null']
          enum: [htdemucs_6s, htdemucs, fake, null]
        stems:
          type: array
          description: |
            Empty until completed. Stem set by model: `htdemucs_6s` and `fake` = vocals, drums, bass,
            guitar, piano, other (6); `htdemucs` = vocals, drums, bass, other (4).
          items:
            $ref: '#/components/schemas/Stem'
        beatGrid:
          oneOf:
            - $ref: '#/components/schemas/BeatGrid'
            - type: 'null'
        detail:
          $ref: '#/components/schemas/DetailPhase'
        device:
          oneOf:
            - $ref: '#/components/schemas/JobDevice'
            - type: 'null'
          description: |
            Where the standard separation ran (1.3.0); set from the worker job while separating and
            kept when completed. Null before the separation, for results that came from the cache,
            and for tracks processed before 1.3.0.
        artwork:
          oneOf:
            - $ref: '#/components/schemas/Artwork'
            - type: 'null'
          description: The picture shown (1.4.0); null when there is none (the UI shows a placeholder).
        metadata:
          $ref: '#/components/schemas/TrackMetadata'
        lyricsStatus:
          $ref: '#/components/schemas/LyricsStatus'
          description: Lyrics state (1.6.0); the lyrics themselves are only served by `GET /api/tracks/{trackId}/lyrics`.
        origin:
          $ref: '#/components/schemas/TrackOrigin'
          description: Where the track came from (1.8.0); absent (never null) on imported tracks.
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    ProcessingDeviceKind:
      type: string
      enum: [cpu, gpu]
      description: The CPU, or the NVIDIA GPU (CUDA).
    JobDevice:
      type: object
      additionalProperties: false
      required: [kind, cpuFallback]
      description: |
        Where a job ran (1.3.0; copied from the worker's `JobDevice`). `kind` is `gpu` when at
        least one model step ran on the GPU. `cpuFallback` is true when at least one model step
        ran on the CPU on a GPU worker (too little free GPU memory, or out of GPU memory and
        retried once on the CPU); the UI then shows `fallbackReason`.
      properties:
        kind:
          $ref: '#/components/schemas/ProcessingDeviceKind'
        name:
          type: [string, 'null']
          maxLength: 200
          description: GPU name when kind is gpu, else null.
        cpuFallback:
          type: boolean
        fallbackReason:
          type: [string, 'null']
          maxLength: 500
    ProcessingDevice:
      type: object
      additionalProperties: false
      required: [reachable]
      description: The worker's active processing device (1.3.0, `GET /api/device`).
      properties:
        reachable:
          type: boolean
          description: False when the worker could not be asked; every other field is then null.
        kind:
          oneOf:
            - $ref: '#/components/schemas/ProcessingDeviceKind'
            - type: 'null'
        name:
          type: [string, 'null']
          maxLength: 200
        totalMemoryMiB:
          type: [integer, 'null']
          minimum: 0
        reason:
          type: [string, 'null']
          maxLength: 500
          description: Why the GPU is not used although it was requested; null otherwise.
    ParentStemName:
      type: string
      description: A standard stem that can be split further (`bass` is never split).
      enum: [vocals, drums, guitar, piano, other]
    DetailStemName:
      type: string
      description: Same closed set as worker contract 1.1.0; `rest` is always the last stem of a group.
      enum: [kick, snare, toms, hihat, cymbals, lead, backing, strings, brass, woodwinds, keys, synth, acoustic-guitar, electric-guitar, percussion, rest]
    DetailPhaseStatus:
      type: string
      description: |
        `none` = never requested (tracks imported before feature 002, or standard separation not
        completed yet). `completed`, `failed`, `cancelled` are terminal (data-model.md 4.1).
      enum: [none, queued, running, completed, failed, cancelled]
    ParentOutcomeKind:
      type: string
      description: |
        UI texts: `split` "Split into <names>", `skipped-silent` "Skipped: (almost) silent",
        `nothing-further` "Nothing further to separate", `not-reliable` "Split was not reliable",
        `not-supported` "Not split".
      enum: [split, skipped-silent, nothing-further, not-reliable, not-supported]
    DetailStem:
      type: object
      additionalProperties: false
      required: [name, url]
      properties:
        name:
          $ref: '#/components/schemas/DetailStemName'
        url:
          type: string
          description: Relative URL /api/tracks/{trackId}/detail-stems/{parent}/{name}; resolve against the public API base URL.
    ParentOutcome:
      type: object
      additionalProperties: false
      required: [parent, outcome, stems]
      properties:
        parent:
          $ref: '#/components/schemas/StemName'
        outcome:
          $ref: '#/components/schemas/ParentOutcomeKind'
        stems:
          type: array
          maxItems: 10
          description: Detail stems in display order, `rest` last; empty unless outcome is split.
          items:
            $ref: '#/components/schemas/DetailStem'
    DetailPhase:
      type: object
      additionalProperties: false
      required: [status, progress, parents]
      properties:
        status:
          $ref: '#/components/schemas/DetailPhaseStatus'
        stage:
          type: [string, 'null']
          maxLength: 200
          description: e.g. "Queued", "Waiting for standard separations", "Splitting drums (1 of 3)".
        currentParent:
          oneOf:
            - $ref: '#/components/schemas/ParentStemName'
            - type: 'null'
        progress:
          type: integer
          minimum: 0
          maximum: 100
        error:
          type: [string, 'null']
          maxLength: 1000
          description: Set iff status is failed (e.g. "interrupted by restart").
        parents:
          type: array
          maxItems: 6
          description: One outcome per standard stem once completed (standard display order); empty otherwise.
          items:
            $ref: '#/components/schemas/ParentOutcome'
        device:
          oneOf:
            - $ref: '#/components/schemas/JobDevice'
            - type: 'null'
          description: |
            Where the detail steps ran (1.3.0), updated while running; null before the first parent
            step, for cached results and for phases completed before 1.3.0.
        updatedAt:
          type: [string, 'null']
          format: date-time
        filesRemovedAt:
          type: [string, 'null']
          format: date-time
          description: |
            1.12.0 (feature 013). When set, the detail stems were removed by a clean-up or left out
            of a restored backup; `parents[].stems` still lists their names, their URLs answer 404,
            and `POST /api/tracks/{trackId}/detail` ("Split further") is accepted for this completed
            phase (the field is cleared when the new phase completes). Absent or null otherwise.
    DetailChannelSettings:
      type: object
      additionalProperties: false
      required: [parent, stem, volume, pan, mute, solo]
      properties:
        parent:
          $ref: '#/components/schemas/ParentStemName'
        stem:
          $ref: '#/components/schemas/DetailStemName'
        volume:
          type: number
          minimum: 0
          maximum: 1
          default: 0.8
        pan:
          type: number
          minimum: -1
          maximum: 1
          default: 0
        mute:
          type: boolean
          default: false
        solo:
          type: boolean
          default: false
    ChannelSettings:
      type: object
      additionalProperties: false
      required: [stem, volume, pan, mute, solo]
      properties:
        stem:
          $ref: '#/components/schemas/StemName'
        volume:
          type: number
          minimum: 0
          maximum: 1
          default: 0.8
        pan:
          type: number
          minimum: -1
          maximum: 1
          default: 0
        mute:
          type: boolean
          default: false
        solo:
          type: boolean
          default: false
    MetronomeSettings:
      type: object
      additionalProperties: false
      required: [enabled, volume, bpmOverride, offsetMs, beatsPerBar]
      properties:
        enabled:
          type: boolean
        volume:
          type: number
          minimum: 0
          maximum: 1
          default: 0.7
        bpmOverride:
          type: [number, 'null']
          minimum: 30
          maximum: 300
          description: Null follows the detected beat grid.
        offsetMs:
          type: integer
          minimum: -2000
          maximum: 2000
          default: 0
        beatsPerBar:
          type: integer
          minimum: 1
          maximum: 12
          default: 4
    LoopRegion:
      type: object
      additionalProperties: false
      required: [start, end, enabled]
      description: Requires 0 <= start < end <= track duration.
      properties:
        start:
          type: number
          minimum: 0
        end:
          type: number
          exclusiveMinimum: 0
        enabled:
          type: boolean
    MixSettings:
      type: object
      additionalProperties: false
      required: [name, masterVolume, channels, metronome, loop]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
          description: Trimmed; unique per track, compared case-insensitively.
        masterVolume:
          type: number
          minimum: 0
          maximum: 1
          default: 1
        channels:
          type: array
          maxItems: 6
          description: At most one entry per stem of the track; stems without an entry use defaults.
          items:
            $ref: '#/components/schemas/ChannelSettings'
        metronome:
          $ref: '#/components/schemas/MetronomeSettings'
        loop:
          oneOf:
            - $ref: '#/components/schemas/LoopRegion'
            - type: 'null'
        expanded:
          type: array
          uniqueItems: true
          maxItems: 5
          default: []
          description: |
            Parents shown expanded (their detail stems replace the parent audio); each must have
            outcome `split` on the track. Absent or empty = all collapsed (mixes saved before 1.2.0).
          items:
            $ref: '#/components/schemas/ParentStemName'
        detailChannels:
          type: array
          maxItems: 50
          default: []
          description: |
            At most one entry per (parent, stem); each detail stem must exist on the track; detail
            stems without an entry use defaults. Kept while the parent is collapsed.
          items:
            $ref: '#/components/schemas/DetailChannelSettings'
        practice:
          $ref: '#/components/schemas/PracticeSettings'
    PracticeSettings:
      type: object
      additionalProperties: false
      description: |
        Practice tempo of a mix (1.11.0, feature 012). Optional in requests: absent = the defaults
        shown here. Always present in responses; mixes saved before 1.11.0 return the defaults.
        Never applied to exports. The trainer and `countIn.everyPass` have an effect only while
        the mix has an enabled loop region; saving them without a loop is allowed.
      required: [speedPercent, transposeSemitones, trainer, countIn]
      properties:
        speedPercent:
          type: integer
          minimum: 50
          maximum: 120
          default: 100
          description: Playback speed in percent of the original tempo; the pitch is kept.
        transposeSemitones:
          type: integer
          minimum: -12
          maximum: 12
          default: 0
          description: Pitch shift of the whole mix in semitones; the speed is kept.
        trainer:
          $ref: '#/components/schemas/SpeedTrainerSettings'
        countIn:
          $ref: '#/components/schemas/CountInSettings'
    SpeedTrainerSettings:
      type: object
      additionalProperties: false
      description: |
        Speed trainer for the A-B loop: the first pass plays at `startPercent`; after every
        `passesPerStep` completed passes the speed rises by `stepPercent`, never above
        `targetPercent`, where it stays. Requires `startPercent < targetPercent`.
      required: [enabled, startPercent, stepPercent, targetPercent, passesPerStep]
      properties:
        enabled:
          type: boolean
          default: false
        startPercent:
          type: integer
          minimum: 50
          maximum: 119
          default: 70
        stepPercent:
          type: integer
          minimum: 1
          maximum: 20
          default: 5
        targetPercent:
          type: integer
          minimum: 51
          maximum: 120
          default: 100
        passesPerStep:
          type: integer
          minimum: 1
          maximum: 8
          default: 1
    CountInSettings:
      type: object
      additionalProperties: false
      description: |
        Count-in clicks (metronome sound and volume) before playback starts and, with
        `everyPass`, before every pass of an enabled loop. `bars: 0` = off.
      required: [bars, everyPass]
      properties:
        bars:
          type: integer
          minimum: 0
          maximum: 2
          default: 0
        everyPass:
          type: boolean
          default: false
    CreateMixRequest:
      type: object
      additionalProperties: false
      required: [trackId, settings]
      properties:
        trackId:
          type: string
          format: uuid
        settings:
          $ref: '#/components/schemas/MixSettings'
    Mix:
      type: object
      additionalProperties: false
      required: [id, trackId, settings, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        trackId:
          type: string
          format: uuid
        settings:
          $ref: '#/components/schemas/MixSettings'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    MixSummary:
      type: object
      additionalProperties: false
      required: [id, trackId, trackTitle, name, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        trackId:
          type: string
          format: uuid
        trackTitle:
          type: string
        name:
          type: string
        updatedAt:
          type: string
          format: date-time
    ArtworkSource:
      type: string
      description: |
        Where the shown picture came from (1.4.0). Precedence of automatic pictures: `spotify` >
        `embedded` > `coverartarchive` > `youtube`; an own picture (`user`) always wins.
      enum: [user, spotify, embedded, coverartarchive, youtube]
    ArtworkVariant:
      type: string
      description: '`cover` = 600 x 600 JPEG, `thumb` = 160 x 160 JPEG.'
      enum: [cover, thumb]
    Artwork:
      type: object
      additionalProperties: false
      required: [source, version, coverUrl, thumbUrl]
      description: The picture shown for a track (1.4.0).
      properties:
        source:
          $ref: '#/components/schemas/ArtworkSource'
        version:
          type: string
          pattern: '^[0-9a-f]{12}$'
          description: First 12 hex characters of the cover's SHA-256; changes with the picture.
        coverUrl:
          type: string
          description: /api/tracks/{trackId}/artwork/cover?v={version}
        thumbUrl:
          type: string
          description: /api/tracks/{trackId}/artwork/thumb?v={version}
    MetadataStatus:
      type: string
      description: |
        Lookup state (1.4.0): `none` (never looked up, e.g. tracks from before 1.4.0), `pending`
        (scheduled), `searching`, `found`, `notFound` (no reliable match; nothing is guessed),
        `failed` (services unreachable; `reason` says why), `disabled` (online lookups off).
      enum: [none, pending, searching, found, notFound, failed, disabled]
    TrackMetadata:
      type: object
      additionalProperties: false
      required: [status, correctedByUser]
      properties:
        status:
          $ref: '#/components/schemas/MetadataStatus'
        reason:
          type: [string, 'null']
          maxLength: 1000
          description: Failure reason or warnings of the last lookup.
        album:
          type: [string, 'null']
          maxLength: 500
        year:
          type: [integer, 'null']
          minimum: 1000
          maximum: 2999
          description: First release year of the album.
        artistName:
          type: [string, 'null']
          maxLength: 500
        correctedByUser:
          type: boolean
          description: True when the user corrected title or artist for the lookup.
    MetadataLookupRequest:
      type: object
      additionalProperties: false
      description: Both optional; an empty object retries with the current names.
      properties:
        title:
          type: [string, 'null']
          minLength: 1
          maxLength: 500
        artist:
          type: [string, 'null']
          minLength: 1
          maxLength: 500
    ArtworkUploadRequest:
      type: object
      required: [file]
      properties:
        file:
          type: string
          contentMediaType: application/octet-stream
          description: JPEG, PNG or WebP picture, at most 10,485,760 bytes.
    RecordingInfo:
      type: object
      additionalProperties: false
      required: [title]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 500
        album:
          type: [string, 'null']
          maxLength: 500
        year:
          type: [integer, 'null']
          minimum: 1000
          maximum: 2999
    ArtistType:
      type: string
      enum: [group, person, orchestra, choir, character, other]
    ArtistMember:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 500
        fromYear:
          type: [integer, 'null']
          minimum: 1000
          maximum: 2999
        toYear:
          type: [integer, 'null']
          minimum: 1000
          maximum: 2999
    WikipediaSummary:
      type: object
      additionalProperties: false
      required: [language, title, extract, pageUrl, historyUrl, licence, licenceUrl]
      description: |
        Shown with: the article title linked to `pageUrl`, "Wikipedia contributors" linked to
        `historyUrl`, the licence linked to `licenceUrl`, and the note "Excerpt, unmodified".
      properties:
        language:
          type: string
          pattern: '^[a-z]{2,3}$'
        title:
          type: string
          minLength: 1
          maxLength: 500
        extract:
          type: string
          minLength: 1
          maxLength: 2000
        pageUrl:
          type: string
          pattern: '^https://'
        historyUrl:
          type: string
          pattern: '^https://'
        licence:
          type: string
          const: CC BY-SA 4.0
        licenceUrl:
          type: string
          const: https://creativecommons.org/licenses/by-sa/4.0/
    ArtistInfo:
      type: object
      additionalProperties: false
      required: [mbid, name, genres, members]
      properties:
        mbid:
          type: string
          format: uuid
          description: MusicBrainz artist id.
        name:
          type: string
          minLength: 1
          maxLength: 500
        type:
          oneOf:
            - $ref: '#/components/schemas/ArtistType'
            - type: 'null'
        country:
          type: [string, 'null']
          pattern: '^[A-Z]{2}$'
        beginYear:
          type: [integer, 'null']
          minimum: 1000
          maximum: 2999
        endYear:
          type: [integer, 'null']
          minimum: 1000
          maximum: 2999
          description: Null while active.
        genres:
          type: array
          maxItems: 8
          items:
            type: string
            maxLength: 100
        members:
          type: array
          maxItems: 12
          description: Only for groups.
          items:
            $ref: '#/components/schemas/ArtistMember'
        website:
          type: [string, 'null']
          pattern: '^https://'
        summary:
          oneOf:
            - $ref: '#/components/schemas/WikipediaSummary'
            - type: 'null'
    DataSource:
      type: object
      additionalProperties: false
      required: [name, url]
      properties:
        name:
          type: string
          enum: [MusicBrainz, Wikidata, Wikipedia, Cover Art Archive]
        url:
          type: string
          pattern: '^https://'
          description: The record or article the facts came from.
        licence:
          type: [string, 'null']
          description: '`CC0` (MusicBrainz core data, Wikidata), `CC BY-SA 4.0` (Wikipedia); null for Cover Art Archive (no licence stated; shown in the app only).'
    BandInfo:
      type: object
      additionalProperties: false
      required: [status, sources]
      properties:
        status:
          $ref: '#/components/schemas/MetadataStatus'
        reason:
          type: [string, 'null']
          maxLength: 1000
        recording:
          oneOf:
            - $ref: '#/components/schemas/RecordingInfo'
            - type: 'null'
        artist:
          oneOf:
            - $ref: '#/components/schemas/ArtistInfo'
            - type: 'null'
        sources:
          type: array
          maxItems: 4
          items:
            $ref: '#/components/schemas/DataSource'
    AssetKind:
      type: string
      description: '`audio` (1.5.0) and `score` (sheet music, 1.7.0).'
      enum: [audio, score]
    AssetStatus:
      type: string
      description: '`ready` and `failed` are terminal.'
      enum: [queued, rendering, ready, failed]
    AssetFileRole:
      type: string
      description: '`audio` (1.5.0); `pdf`, `musicxml` and `midi` of score items (1.7.0).'
      enum: [audio, pdf, musicxml, midi]
    ChannelId:
      type: string
      pattern: '^(vocals|drums|bass|guitar|piano|other)(\.[a-z][a-z-]{0,31})?$'
      description: A standard stem (`drums`) or a detail stem `<parent>.<detail>` (`drums.kick`); the engine's ChannelId.
      example: drums.kick
    ExportMode:
      type: string
      description: '`raw`: gain 1, pan 0, master 1, mute/solo ignored. `mix`: fader, pan and master of the mix.'
      enum: [raw, mix]
    AudioFileFormat:
      type: string
      enum: [flac, wav, mp3]
    ExportFormat:
      type: object
      additionalProperties: false
      required: [format]
      properties:
        format:
          $ref: '#/components/schemas/AudioFileFormat'
        bitDepth:
          type: [integer, 'null']
          enum: [16, 24, null]
          description: FLAC/WAV only; null = 16 for one raw channel, else 24.
        mp3BitrateKbps:
          type: [integer, 'null']
          enum: [192, 256, 320, null]
          description: MP3 only (constant bit rate); null = 320.
    ExportRange:
      type: object
      additionalProperties: false
      required: [startSeconds, endSeconds]
      description: Requires 0 <= startSeconds < endSeconds <= track duration and a length of at least 0.5 s.
      properties:
        startSeconds:
          type: number
          minimum: 0
        endSeconds:
          type: number
          exclusiveMinimum: 0
          maximum: 900
    ExportMix:
      type: object
      additionalProperties: false
      required: [masterVolume, channels]
      description: The mixer state used for an export (`MixSettings` without name, metronome and loop, which never affect an export).
      properties:
        masterVolume:
          type: number
          minimum: 0
          maximum: 1
        channels:
          type: array
          maxItems: 6
          items:
            $ref: '#/components/schemas/ChannelSettings'
        expanded:
          type: array
          uniqueItems: true
          maxItems: 5
          default: []
          items:
            $ref: '#/components/schemas/ParentStemName'
        detailChannels:
          type: array
          maxItems: 50
          default: []
          items:
            $ref: '#/components/schemas/DetailChannelSettings'
    CreateAudioExportRequest:
      type: object
      additionalProperties: false
      required: [trackId, mode, format]
      properties:
        trackId:
          type: string
          format: uuid
          description: A completed track.
        mode:
          $ref: '#/components/schemas/ExportMode'
        channels:
          type: [array, 'null']
          minItems: 1
          maxItems: 56
          uniqueItems: true
          description: |
            Explicit selection (each a standard stem of the track or a kept detail stem of a split
            parent), or null = every audible channel (mode `mix` only). Required in mode `raw`.
          items:
            $ref: '#/components/schemas/ChannelId'
        mix:
          oneOf:
            - $ref: '#/components/schemas/ExportMix'
            - type: 'null'
          description: Current mixer state (mode `mix`; exactly one of `mix` and `mixId`).
        mixId:
          type: [string, 'null']
          format: uuid
          description: A saved mix of the track (mode `mix`; exactly one of `mix` and `mixId`).
        range:
          oneOf:
            - $ref: '#/components/schemas/ExportRange'
            - type: 'null'
        format:
          $ref: '#/components/schemas/ExportFormat'
        name:
          type: [string, 'null']
          minLength: 1
          maxLength: 120
          description: Null = "<track title> - <contents>", made unique with " (2)", " (3)", ...
    CreateStemPackRequest:
      type: object
      additionalProperties: false
      required: [trackId, format]
      properties:
        trackId:
          type: string
          format: uuid
        includeDetail:
          type: boolean
          default: false
        format:
          $ref: '#/components/schemas/ExportFormat'
    StemPack:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          minItems: 1
          maxItems: 56
          items:
            $ref: '#/components/schemas/Asset'
    RenameAssetRequest:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
          description: Trimmed; no control characters.
    AssetFile:
      type: object
      additionalProperties: false
      required: [role, contentType, sizeBytes, sha256, url]
      properties:
        role:
          $ref: '#/components/schemas/AssetFileRole'
        contentType:
          type: string
          enum: [audio/flac, audio/wav, audio/mpeg, application/pdf, application/vnd.recordare.musicxml+xml, audio/midi]
        sizeBytes:
          type: integer
          minimum: 1
        sha256:
          type: string
          pattern: '^[0-9a-f]{64}$'
        url:
          type: string
          description: /api/assets/{assetId}/files/{role}
    AudioFacts:
      type: object
      additionalProperties: false
      required: [format, bitDepth, mp3BitrateKbps, sampleRate, channels, durationSeconds, peakDbfs, appliedGainDb]
      properties:
        format:
          $ref: '#/components/schemas/AudioFileFormat'
        bitDepth:
          type: [integer, 'null']
          enum: [16, 24, null]
        mp3BitrateKbps:
          type: [integer, 'null']
          enum: [192, 256, 320, null]
        sampleRate:
          type: integer
          enum: [44100, 48000]
          description: 44100 for exports; 48000 for generated takes (1.8.0).
        channels:
          type: integer
          const: 2
        durationSeconds:
          type: number
          exclusiveMinimum: 0
          maximum: 900
        peakDbfs:
          type: number
          maximum: 0
        appliedGainDb:
          type: number
          maximum: 0
          description: Negative when the export was lowered to avoid clipping ("Lowered by X dB").
    ExportRecipe:
      type: object
      additionalProperties: false
      required: [trackId, mode, channels, mix, range, format]
      description: The normalised export request (stored; used by retry and by the agent).
      properties:
        trackId:
          type: string
          format: uuid
        mode:
          $ref: '#/components/schemas/ExportMode'
        channels:
          type: [array, 'null']
          items:
            $ref: '#/components/schemas/ChannelId'
        mix:
          oneOf:
            - $ref: '#/components/schemas/ExportMix'
            - type: 'null'
          description: Snapshot of the mix used (mode `mix`; a `mixId` is resolved and copied at creation).
        range:
          oneOf:
            - $ref: '#/components/schemas/ExportRange'
            - type: 'null'
        format:
          $ref: '#/components/schemas/ExportFormat'
    AssetOrigin:
      type: string
      description: '`export` (1.5.0), `transcription` (1.7.0), `generation` (a take of a generation, 1.8.0).'
      enum: [export, transcription, generation]
    Provenance:
      type: object
      additionalProperties: false
      required: [origin, trackId, trackTitle, trackArtist, trackAvailable, sourceAssetIds, contents, recipe, scoreRecipe]
      properties:
        origin:
          $ref: '#/components/schemas/AssetOrigin'
        trackId:
          type: [string, 'null']
          format: uuid
        trackTitle:
          type: string
          maxLength: 300
          description: Snapshot taken at creation; kept when the track is deleted.
        trackArtist:
          type: [string, 'null']
          maxLength: 500
        trackAvailable:
          type: boolean
          description: Whether the track still exists (computed on read).
        sourceAssetIds:
          type: array
          description: Library items this item was made from (empty for exports).
          items:
            type: string
            format: uuid
        contents:
          type: string
          maxLength: 200
          description: e.g. "drums, raw", "vocals + bass + drums.kick, mixed, 0:30-1:15", "6 channels, mixed".
        recipe:
          oneOf:
            - $ref: '#/components/schemas/ExportRecipe'
            - type: 'null'
          description: How an export was made (origin `export`); null for score items (1.7.0).
        scoreRecipe:
          oneOf:
            - $ref: '#/components/schemas/ScoreRecipe'
            - type: 'null'
          description: How a score item was made (origin `transcription`, 1.7.0); null for exports.
        generation:
          oneOf:
            - $ref: '#/components/schemas/GenerationProvenance'
            - type: 'null'
          description: The generation of a take item (origin `generation`, 1.8.0); absent or null otherwise.
    Asset:
      type: object
      additionalProperties: false
      required: [id, kind, name, status, progress, error, files, audio, score, provenance, placement, sizeBytes, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        kind:
          $ref: '#/components/schemas/AssetKind'
        name:
          type: string
          minLength: 1
          maxLength: 120
        status:
          $ref: '#/components/schemas/AssetStatus'
        progress:
          type: integer
          minimum: 0
          maximum: 100
        error:
          type: [string, 'null']
          maxLength: 500
          description: Readable reason; set exactly when status is failed.
        files:
          type: array
          maxItems: 4
          description: Empty until ready.
          items:
            $ref: '#/components/schemas/AssetFile'
        audio:
          oneOf:
            - $ref: '#/components/schemas/AudioFacts'
            - type: 'null'
          description: Set when a kind `audio` item is ready.
        score:
          oneOf:
            - $ref: '#/components/schemas/ScoreFacts'
            - type: 'null'
          description: Set when a kind `score` item is ready (1.7.0).
        provenance:
          $ref: '#/components/schemas/Provenance'
        placement:
          oneOf:
            - $ref: '#/components/schemas/Placement'
            - type: 'null'
        sizeBytes:
          type: integer
          minimum: 0
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    AssetList:
      type: object
      additionalProperties: false
      required: [items, total, totalSizeBytes]
      properties:
        items:
          type: array
          maxItems: 200
          items:
            $ref: '#/components/schemas/Asset'
        total:
          type: integer
          minimum: 0
        totalSizeBytes:
          type: integer
          minimum: 0
    AudioSource:
      description: |
        An audio input of later features (008 transcription, 009 style transfer, 011 agent): a
        channel of a track or a library item. Not used by a 1.5.0 operation.
      oneOf:
        - type: object
          additionalProperties: false
          required: [trackId, channel]
          properties:
            trackId:
              type: string
              format: uuid
            channel:
              $ref: '#/components/schemas/ChannelId'
        - type: object
          additionalProperties: false
          required: [assetId]
          properties:
            assetId:
              type: string
              format: uuid
    LyricsStatus:
      type: string
      description: |
        Lyrics state of a track (1.6.0, data-model.md 3.2). `none`: never looked up (older tracks
        or before the duration is known); `found`: timed lyrics available (banner); `alignPending`:
        text without timing, alignment not started (CPU worker); `removed`: removed by the user (no
        automatic lookup any more).
      enum: [none, searching, found, instrumental, notFound, alignPending, aligning, failed, disabled, removed]
    SyncLevel:
      type: string
      enum: [word, line, plain]
    WordOrigin:
      type: string
      enum: [source, interpolated, aligned]
    LyricsOrigin:
      type: string
      enum: [source, interpolated, aligned, none]
    LyricsSource:
      type: string
      enum: [lrclib, user]
    LyricsWord:
      type: object
      additionalProperties: false
      required: [text, startMs, endMs, origin, lowConfidence]
      description: Integer milliseconds from the start of the track audio; null in a plain document.
      properties:
        text:
          type: string
          minLength: 1
          maxLength: 100
        startMs:
          type: [integer, 'null']
          minimum: 0
        endMs:
          type: [integer, 'null']
          minimum: 1
        origin:
          oneOf:
            - $ref: '#/components/schemas/WordOrigin'
            - type: 'null'
        lowConfidence:
          type: boolean
    LyricsLine:
      type: object
      additionalProperties: false
      required: [startMs, endMs, text, words]
      properties:
        startMs:
          type: [integer, 'null']
          minimum: 0
        endMs:
          type: [integer, 'null']
          minimum: 1
        text:
          type: string
          minLength: 1
          maxLength: 500
        words:
          type: array
          minItems: 1
          maxItems: 40
          items:
            $ref: '#/components/schemas/LyricsWord'
    LyricsAlignment:
      type: object
      additionalProperties: false
      required: [estimateSeconds, device, progress]
      description: The alignment of the track's text (status `alignPending` or `aligning`).
      properties:
        estimateSeconds:
          type: [integer, 'null']
          minimum: 0
          description: Expected duration on the worker's device (shown before a CPU alignment is started).
        device:
          oneOf:
            - $ref: '#/components/schemas/JobDevice'
            - type: 'null'
        progress:
          type: [integer, 'null']
          minimum: 0
          maximum: 100
          description: Set while aligning.
    Lyrics:
      type: object
      additionalProperties: false
      required: [status, reason, syncLevel, origin, language, source, credit, offsetMs, instrumental, lines, alignment]
      description: |
        The lyrics of a track (1.6.0). `lines` carry the text also for plain documents (times
        null), so the track page can show it while alignment is pending. `credit` is built by the
        backend: "Lyrics: LRCLIB" or "Lyrics: entered by you", plus "; word timing estimated"
        (interpolated) or "; timing: automatic alignment" (aligned).
      properties:
        status:
          $ref: '#/components/schemas/LyricsStatus'
        reason:
          type: [string, 'null']
          maxLength: 1000
          description: Readable reason for failed, notFound, disabled and the alignPending estimate.
        syncLevel:
          oneOf:
            - $ref: '#/components/schemas/SyncLevel'
            - type: 'null'
        origin:
          oneOf:
            - $ref: '#/components/schemas/LyricsOrigin'
            - type: 'null'
        language:
          type: [string, 'null']
          pattern: '^[a-z]{2,3}$'
        source:
          oneOf:
            - $ref: '#/components/schemas/LyricsSource'
            - type: 'null'
        credit:
          type: [string, 'null']
          maxLength: 200
        offsetMs:
          type: integer
          minimum: -5000
          maximum: 5000
          multipleOf: 10
        instrumental:
          type: boolean
        lines:
          type: array
          maxItems: 400
          items:
            $ref: '#/components/schemas/LyricsLine'
        alignment:
          oneOf:
            - $ref: '#/components/schemas/LyricsAlignment'
            - type: 'null'
    SetLyricsRequest:
      type: object
      additionalProperties: false
      required: [text]
      properties:
        text:
          type: string
          minLength: 1
          maxLength: 20000
        language:
          type: [string, 'null']
          pattern: '^[a-z]{2,3}$'
          description: Language hint for the alignment; null = detect.
    LyricsOffsetRequest:
      type: object
      additionalProperties: false
      required: [offsetMs]
      properties:
        offsetMs:
          type: integer
          minimum: -5000
          maximum: 5000
          multipleOf: 10
          description: Positive = the lyrics come later.
    ScoreProfile:
      type: string
      description: Instrument profile (data-model.md 2.1).
      enum: [vocals, bass, guitar, keys, piano, drums]
    ScoreQuality:
      type: string
      description: Piano only - `accurate` (piano model, GPU when available) or `fast` (basic-pitch).
      enum: [accurate, fast]
    ScoreResolution:
      type: string
      description: '`eighth` is shown as "simplified".'
      enum: [sixteenth, eighth]
    KeyName:
      type: string
      description: One of the 30 key signatures in music21 spelling (`-` = flat).
      enum: ['C major', 'G major', 'D major', 'A major', 'E major', 'B major', 'F# major', 'C# major',
             'F major', 'B- major', 'E- major', 'A- major', 'D- major', 'G- major', 'C- major',
             'A minor', 'E minor', 'B minor', 'F# minor', 'C# minor', 'G# minor', 'D# minor', 'A# minor',
             'D minor', 'G minor', 'C minor', 'F minor', 'B- minor', 'E- minor', 'A- minor']
    ScoreTempo:
      type: object
      additionalProperties: false
      required: [bpm, beatsPerBar, firstDownbeatSeconds]
      description: A manual tempo; overrides the beat grid when given.
      properties:
        bpm:
          type: number
          minimum: 30
          maximum: 300
        beatsPerBar:
          type: integer
          minimum: 1
          maximum: 12
        firstDownbeatSeconds:
          type: number
          minimum: 0
          maximum: 900
    ScoreRange:
      type: object
      additionalProperties: false
      required: [startSeconds, endSeconds]
      description: Part of the source; at least 2 s long (`ContractLimits.MinScoreRangeSeconds`).
      properties:
        startSeconds:
          type: number
          minimum: 0
        endSeconds:
          type: number
          exclusiveMinimum: 0
    CreateScoreRequest:
      type: object
      additionalProperties: false
      required: [source]
      properties:
        source:
          $ref: '#/components/schemas/AudioSource'
        profile:
          oneOf:
            - $ref: '#/components/schemas/ScoreProfile'
            - type: 'null'
          description: Null = the suggested profile of the channel.
        quality:
          oneOf:
            - $ref: '#/components/schemas/ScoreQuality'
            - type: 'null'
          description: Null = `accurate` on a GPU worker, else `fast` (piano only).
        resolution:
          oneOf:
            - $ref: '#/components/schemas/ScoreResolution'
            - type: 'null'
          description: Null = the profile's default.
        keyOverride:
          oneOf:
            - $ref: '#/components/schemas/KeyName'
            - type: 'null'
        tempo:
          oneOf:
            - $ref: '#/components/schemas/ScoreTempo'
            - type: 'null'
          description: Required when the grid is unreliable or absent (`422 tempo-required`).
        range:
          oneOf:
            - $ref: '#/components/schemas/ScoreRange'
            - type: 'null'
        name:
          type: [string, 'null']
          minLength: 1
          maxLength: 120
          description: Null = "<track title> - <channel> (sheet music)".
    ScoreRecipe:
      type: object
      additionalProperties: false
      required: [kind, source, profile, quality, resolution, keyOverride, tempo, range]
      description: The normalised request of a score item (defaults resolved).
      properties:
        kind:
          type: string
          const: score
        source:
          $ref: '#/components/schemas/AudioSource'
        profile:
          $ref: '#/components/schemas/ScoreProfile'
        quality:
          oneOf:
            - $ref: '#/components/schemas/ScoreQuality'
            - type: 'null'
          description: Set for piano only.
        resolution:
          $ref: '#/components/schemas/ScoreResolution'
        keyOverride:
          oneOf:
            - $ref: '#/components/schemas/KeyName'
            - type: 'null'
        tempo:
          oneOf:
            - $ref: '#/components/schemas/ScoreTempo'
            - type: 'null'
        range:
          oneOf:
            - $ref: '#/components/schemas/ScoreRange'
            - type: 'null'
    KeyInfo:
      type: object
      additionalProperties: false
      required: [tonic, mode, confidence, source]
      properties:
        tonic:
          type: string
          pattern: '^[A-G](#|-)?$'
        mode:
          type: string
          enum: [major, minor]
        confidence:
          type: number
          minimum: 0
          maximum: 1
        source:
          type: string
          enum: [estimated, override]
    ScoreWarningCode:
      type: string
      enum: [manual-tempo, low-key-confidence, notes-cleaned, dense-capped, detail-bleed, cpu-piano, few-notes, missing-drum-piece]
    ScoreWarning:
      type: object
      additionalProperties: false
      required: [code, text]
      properties:
        code:
          $ref: '#/components/schemas/ScoreWarningCode'
        text:
          type: string
          minLength: 1
          maxLength: 300
    ScoreEngine:
      type: string
      enum: [basic-pitch, piano-crnn, drum-onsets, fake]
    ScoreFacts:
      type: object
      additionalProperties: false
      required: [profile, engine, quality, key, bpm, timeSignature, bars, notes, pages, resolution, warnings, attribution, device]
      description: The worker's score summary plus where the model ran (1.7.0).
      properties:
        profile:
          $ref: '#/components/schemas/ScoreProfile'
        engine:
          $ref: '#/components/schemas/ScoreEngine'
        quality:
          oneOf:
            - $ref: '#/components/schemas/ScoreQuality'
            - type: 'null'
        key:
          oneOf:
            - $ref: '#/components/schemas/KeyInfo'
            - type: 'null'
          description: Null for drums.
        bpm:
          type: integer
          minimum: 30
          maximum: 300
        timeSignature:
          type: string
          pattern: '^([1-9]|1[0-2])/4$'
        bars:
          type: integer
          minimum: 1
        notes:
          type: integer
          minimum: 1
        pages:
          type: integer
          minimum: 1
        resolution:
          $ref: '#/components/schemas/ScoreResolution'
        warnings:
          type: array
          maxItems: 8
          items:
            $ref: '#/components/schemas/ScoreWarning'
        attribution:
          type: [string, 'null']
          maxLength: 300
        device:
          oneOf:
            - $ref: '#/components/schemas/JobDevice'
            - type: 'null'
    GridStatus:
      type: string
      description: '`reliable`: the track beat grid is used; `unreliable`/`none`: a manual tempo is required.'
      enum: [reliable, unreliable, none]
    ScoreEstimate:
      type: object
      additionalProperties: false
      required: [profile, quality, seconds]
      properties:
        profile:
          $ref: '#/components/schemas/ScoreProfile'
        quality:
          oneOf:
            - $ref: '#/components/schemas/ScoreQuality'
            - type: 'null'
          description: Set for the two piano estimates.
        seconds:
          type: integer
          minimum: 0
    ProfileLimit:
      type: object
      additionalProperties: false
      required: [profile, text]
      properties:
        profile:
          $ref: '#/components/schemas/ScoreProfile'
        text:
          type: string
          minLength: 1
          maxLength: 500
    ScoreOptions:
      type: object
      additionalProperties: false
      required: [source, durationSeconds, suggestedProfile, allowedProfiles, drumsRequireSplit, gridStatus, defaultQuality, estimates, limits, attribution]
      properties:
        source:
          $ref: '#/components/schemas/AudioSource'
        durationSeconds:
          type: number
          exclusiveMinimum: 0
          maximum: 900
        suggestedProfile:
          oneOf:
            - $ref: '#/components/schemas/ScoreProfile'
            - type: 'null'
          description: Null for channels without a suggestion (single drum pieces).
        allowedProfiles:
          type: array
          maxItems: 6
          items:
            $ref: '#/components/schemas/ScoreProfile'
        drumsRequireSplit:
          type: boolean
          description: True for the `drums` channel while the drums are not split into detail stems.
        gridStatus:
          $ref: '#/components/schemas/GridStatus'
        defaultQuality:
          $ref: '#/components/schemas/ScoreQuality'
        estimates:
          type: array
          maxItems: 8
          items:
            $ref: '#/components/schemas/ScoreEstimate'
        limits:
          type: array
          maxItems: 6
          items:
            $ref: '#/components/schemas/ProfileLimit'
        attribution:
          type: string
          maxLength: 300
          description: Credit of the piano model (CC BY 4.0), shown with the piano quality choice.
    ProblemDetails:
      type: object
      description: RFC 9457 problem details. Extension members are allowed.
      required: [title, status]
      properties:
        type:
          type: string
          default: about:blank
        title:
          type: string
        status:
          type: integer
          minimum: 400
          maximum: 599
        detail:
          type: [string, 'null']
        instance:
          type: [string, 'null']
      additionalProperties: true
    ValidationProblemDetails:
      allOf:
        - $ref: '#/components/schemas/ProblemDetails'
        - type: object
          required: [errors]
          properties:
            errors:
              type: object
              additionalProperties:
                type: array
                items:
                  type: string
    GenerationAvailability:
      type: string
      description: '`notInstalled` no generator configured or reachable; `unavailable` running without a usable GPU (reason set); `ready` generation possible (1.8.0).'
      enum: [notInstalled, unavailable, ready]
    GenerationModel:
      type: object
      additionalProperties: false
      required: [id, present, bytes]
      properties:
        id:
          type: string
          maxLength: 64
          example: acestep-v15-turbo
        present:
          type: boolean
        bytes:
          type: integer
          minimum: 0
    GenerationStatus:
      type: object
      additionalProperties: false
      required: [state, reason, device, models, downloadBytesNeeded, voice]
      description: Availability of the generative features (1.8.0, `GET /api/generation/status`).
      properties:
        state:
          $ref: '#/components/schemas/GenerationAvailability'
        reason:
          type: [string, 'null']
          maxLength: 500
          description: Readable reason when not ready (the generator's probe reason, or "The generator service is not installed.").
        device:
          oneOf:
            - $ref: '#/components/schemas/ProcessingDevice'
            - type: 'null'
          description: The generator's device (`reachable` true); null when not installed.
        models:
          type: array
          maxItems: 16
          items:
            $ref: '#/components/schemas/GenerationModel'
        downloadBytesNeeded:
          type: integer
          minimum: 0
          description: Sum of `bytes` of the models that are not present (generator and singer).
        voice:
          $ref: '#/components/schemas/VoiceServiceStatus'
    VoiceServiceStatus:
      type: object
      additionalProperties: false
      required: [state, reason]
      description: Availability of the voice features (the singer service, `StemStudio:SingerBaseUrl`) (1.9.0).
      properties:
        state:
          $ref: '#/components/schemas/GenerationAvailability'
        reason:
          type: [string, 'null']
          maxLength: 500
    StyleKind:
      type: string
      description: '`preset` curated and read-only; `user` created by the user.'
      enum: [preset, user]
    GenreFamily:
      type: string
      enum: [rock, pop, jazz, blues, electronic, hipHop, latin, folk, classical, world, country, metal, soul, ambient]
    TempoFeel:
      type: string
      description: '`keep` follows the source; the others steer the caption.'
      enum: [keep, laidback, driving, halfTime, swing]
    VocalHandling:
      type: string
      description: '`keep` the vocals stay in the source mix; `instrumental` the vocal stem is excluded and the caption says "instrumental".'
      enum: [keep, instrumental]
    Strength:
      type: string
      description: How far the take may move from the source; cover strength 0.85 / 0.70 / 0.55 / 0.40 / 0.25 (ADR-018 D7). UI slider position 0-4.
      enum: [subtle, light, balanced, strong, free]
    StyleTag:
      type: string
      minLength: 1
      maxLength: 30
    StyleInput:
      type: object
      additionalProperties: false
      required: [name, genreFamily, tempoFeel, instrumentation, moods, vocalHandling, defaultStrength]
      description: A user style as written by the editor; every text passes the imitation guard.
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 60
          description: Unique across the library (case-insensitive).
        genreFamily:
          $ref: '#/components/schemas/GenreFamily'
        subGenre:
          type: [string, 'null']
          maxLength: 40
        tempoFeel:
          $ref: '#/components/schemas/TempoFeel'
        instrumentation:
          type: array
          maxItems: 8
          items:
            $ref: '#/components/schemas/StyleTag'
        moods:
          type: array
          maxItems: 8
          items:
            $ref: '#/components/schemas/StyleTag'
        vocalHandling:
          $ref: '#/components/schemas/VocalHandling'
        defaultStrength:
          $ref: '#/components/schemas/Strength'
        description:
          type: [string, 'null']
          maxLength: 300
          description: Shown in the library; part of the caption for user styles only.
    Style:
      type: object
      additionalProperties: false
      required: [id, kind, presetKey, name, genreFamily, subGenre, tempoFeel, instrumentation, moods, vocalHandling, defaultStrength, description, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        kind:
          $ref: '#/components/schemas/StyleKind'
        presetKey:
          type: [string, 'null']
          pattern: '^[a-z0-9]+(-[a-z0-9]+)*$'
          maxLength: 40
          description: Stable key of a preset (e.g. `jazz-trio`); null for user styles.
        name:
          type: string
          minLength: 1
          maxLength: 60
        genreFamily:
          $ref: '#/components/schemas/GenreFamily'
        subGenre:
          type: [string, 'null']
          maxLength: 40
        tempoFeel:
          $ref: '#/components/schemas/TempoFeel'
        instrumentation:
          type: array
          maxItems: 8
          items:
            $ref: '#/components/schemas/StyleTag'
        moods:
          type: array
          maxItems: 8
          items:
            $ref: '#/components/schemas/StyleTag'
        vocalHandling:
          $ref: '#/components/schemas/VocalHandling'
        defaultStrength:
          $ref: '#/components/schemas/Strength'
        description:
          type: [string, 'null']
          maxLength: 300
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    StyleSnapshot:
      type: object
      additionalProperties: false
      required: [styleId, kind, presetKey, name, genreFamily, subGenre, tempoFeel, instrumentation, moods, vocalHandling, defaultStrength, description]
      description: The style as it was when the generation was created (kept when the style changes or is deleted).
      properties:
        styleId:
          type: string
          format: uuid
        kind:
          $ref: '#/components/schemas/StyleKind'
        presetKey:
          type: [string, 'null']
          maxLength: 40
        name:
          type: string
          minLength: 1
          maxLength: 60
        genreFamily:
          $ref: '#/components/schemas/GenreFamily'
        subGenre:
          type: [string, 'null']
          maxLength: 40
        tempoFeel:
          $ref: '#/components/schemas/TempoFeel'
        instrumentation:
          type: array
          maxItems: 8
          items:
            $ref: '#/components/schemas/StyleTag'
        moods:
          type: array
          maxItems: 8
          items:
            $ref: '#/components/schemas/StyleTag'
        vocalHandling:
          $ref: '#/components/schemas/VocalHandling'
        defaultStrength:
          $ref: '#/components/schemas/Strength'
        description:
          type: [string, 'null']
          maxLength: 300
    RestyleMode:
      type: string
      description: '`range` the range becomes the take; `inPlace` the whole track is kept and only the range is restyled (take length = track length).'
      enum: [range, inPlace]
    RestyleRequest:
      type: object
      additionalProperties: false
      required: [styleId, mode]
      description: |
        Range defaults: start 0, end min(track duration, start + 480). `rangeEndSeconds -
        rangeStartSeconds` must be 10-480 s and inside the track. `includedStems` defaults to all
        stems of the track (minus `vocals` for an `instrumental` style); `strength` to the style's
        default; `takes` 1-2.
      properties:
        styleId:
          type: string
          format: uuid
        mode:
          $ref: '#/components/schemas/RestyleMode'
        rangeStartSeconds:
          type: [number, 'null']
          minimum: 0
        rangeEndSeconds:
          type: [number, 'null']
          exclusiveMinimum: 0
        includedStems:
          type: [array, 'null']
          minItems: 1
          maxItems: 6
          uniqueItems: true
          items:
            $ref: '#/components/schemas/StemName'
        strength:
          oneOf:
            - $ref: '#/components/schemas/Strength'
            - type: 'null'
        takes:
          type: integer
          minimum: 1
          maximum: 2
          default: 1
    GenerationKind:
      type: string
      description: '`restyle` (1.8.0); `song`, `voiceConversion` (1.9.0).'
      enum: [restyle, song, voiceConversion]
    GenerationState:
      type: string
      description: |
        Mirrors the generator job (`queued`, `waitingForGpu`, `downloadingModel`, `running`) and
        the terminal states `completed`, `failed`, `cancelled`. `waitingForStems` (1.9.0, voice
        conversions only, API side): the source take is being imported and separated.
      enum: [queued, waitingForStems, waitingForGpu, downloadingModel, running, completed, failed, cancelled]
    GenerationErrorCode:
      type: string
      description: Same codes as the generator contract 1.1.0 (`unvoicedTarget`, `promptInvalid` from 1.9.0).
      enum: [gpuRequired, gpuBusy, outOfMemory, modelDownloadFailed, interrupted, invalidInput, engineError, unvoicedTarget, promptInvalid]
    GenerationError:
      type: object
      additionalProperties: false
      required: [code, message]
      properties:
        code:
          $ref: '#/components/schemas/GenerationErrorCode'
        message:
          type: string
          maxLength: 500
    SourceRange:
      type: object
      additionalProperties: false
      required: [startSeconds, endSeconds, mode]
      properties:
        startSeconds:
          type: number
          minimum: 0
        endSeconds:
          type: number
          exclusiveMinimum: 0
        mode:
          $ref: '#/components/schemas/RestyleMode'
    RestyleDetails:
      type: object
      additionalProperties: false
      required: [sourceTrackId, sourceTrackTitle, range, includedStems, style, strength, caption]
      description: What a restyle was made from (snapshots, kept when the track or style is deleted).
      properties:
        sourceTrackId:
          type: [string, 'null']
          format: uuid
          description: Null after the source track was deleted.
        sourceTrackTitle:
          type: string
          minLength: 1
          maxLength: 500
        range:
          $ref: '#/components/schemas/SourceRange'
        includedStems:
          type: array
          minItems: 1
          maxItems: 6
          items:
            $ref: '#/components/schemas/StemName'
        style:
          $ref: '#/components/schemas/StyleSnapshot'
        strength:
          $ref: '#/components/schemas/Strength'
        caption:
          type: string
          minLength: 1
          maxLength: 512
          description: The caption sent to the model (stored for reproducibility).
    GenerationTakeModel:
      type: object
      additionalProperties: false
      required: [id, revision]
      properties:
        id:
          type: string
          maxLength: 64
          example: acestep-v15-turbo
        revision:
          type: string
          maxLength: 64
    GenerationTake:
      type: object
      additionalProperties: false
      required: [index, seed, durationSeconds, audioUrl, libraryAssetId, importedTrackId, model, aiGenerated, vocal, voiceProfileName, vocalAudioUrl]
      properties:
        index:
          type: integer
          minimum: 1
          maximum: 2
        seed:
          type: integer
          minimum: 0
          maximum: 2147483647
        durationSeconds:
          type: number
          exclusiveMinimum: 0
        audioUrl:
          type: string
          example: /api/generations/1a2b3c4d-5e6f-4a7b-8c9d-0e1f2a3b4c5d/takes/1/audio
        libraryAssetId:
          type: [string, 'null']
          format: uuid
          description: The take's item in the asset library (origin `generation`).
        importedTrackId:
          type: [string, 'null']
          format: uuid
          description: Set once the take was imported as a track.
        model:
          $ref: '#/components/schemas/GenerationTakeModel'
        aiGenerated:
          type: boolean
          const: true
          description: Always true; the UI shows the AI badge.
        vocal:
          oneOf:
            - $ref: '#/components/schemas/VocalLabel'
            - type: 'null'
          description: AI voice label (1.9.0); null for restyle takes.
        voiceProfileName:
          type: [string, 'null']
          maxLength: 100
          description: Voice profile of a converted take (1.9.0).
        vocalAudioUrl:
          type: [string, 'null']
          description: The converted vocal of a voice-conversion take (1.9.0).
    Generation:
      type: object
      additionalProperties: false
      required: [id, kind, status, progress, stage, takes, warnings, device, error, createdAt, updatedAt, completedAt]
      description: A generation (1.8.0). The details member named by `kind` is set (`restyle`; `song`, `voiceConversion` from 1.9.0); the others are absent or null.
      properties:
        id:
          type: string
          format: uuid
        kind:
          $ref: '#/components/schemas/GenerationKind'
        status:
          $ref: '#/components/schemas/GenerationState'
        progress:
          type: integer
          minimum: 0
          maximum: 100
        stage:
          type: [string, 'null']
          maxLength: 200
        restyle:
          oneOf:
            - $ref: '#/components/schemas/RestyleDetails'
            - type: 'null'
        song:
          oneOf:
            - $ref: '#/components/schemas/SongDetails'
            - type: 'null'
        voiceConversion:
          oneOf:
            - $ref: '#/components/schemas/VoiceConversionDetails'
            - type: 'null'
        takes:
          type: array
          maxItems: 2
          description: Empty until completed.
          items:
            $ref: '#/components/schemas/GenerationTake'
        warnings:
          type: array
          maxItems: 5
          items:
            type: string
            maxLength: 300
        device:
          oneOf:
            - $ref: '#/components/schemas/JobDevice'
            - type: 'null'
        error:
          oneOf:
            - $ref: '#/components/schemas/GenerationError'
            - type: 'null'
          description: Set iff `status` is `failed`.
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        completedAt:
          type: [string, 'null']
          format: date-time
    TrackOriginKind:
      type: string
      enum: [imported, generated]
    TrackOrigin:
      type: object
      additionalProperties: false
      required: [kind, generationId, takeIndex, sourceTrackId, aiGenerated, vocal, voiceProfileName, lyricsSheetId]
      description: Where a track came from (1.8.0). Absent on imported tracks.
      properties:
        kind:
          $ref: '#/components/schemas/TrackOriginKind'
        generationId:
          type: [string, 'null']
          format: uuid
        takeIndex:
          type: [integer, 'null']
          minimum: 1
          maximum: 2
        sourceTrackId:
          type: [string, 'null']
          format: uuid
          description: The track the generation was made from (restyles), for the source link; null when deleted or not applicable.
        aiGenerated:
          type: boolean
        vocal:
          oneOf:
            - $ref: '#/components/schemas/VocalLabel'
            - type: 'null'
          description: AI voice label of the take (1.9.0); null for restyles.
        voiceProfileName:
          type: [string, 'null']
          maxLength: 100
        lyricsSheetId:
          type: [string, 'null']
          format: uuid
          description: The lyrics sheet of a song (1.9.0), for the lyrics link.
    GenerationProvenance:
      type: object
      additionalProperties: false
      required: [generationId, takeIndex, kind]
      description: The generation a library item came from (origin `generation`, 1.8.0).
      properties:
        generationId:
          type: string
          format: uuid
        takeIndex:
          type: integer
          minimum: 1
          maximum: 2
        kind:
          $ref: '#/components/schemas/GenerationKind'
    LyricsLanguage:
      type: string
      description: Lyrics language (ISO 639-1 plus `yue`, the 50 languages of ACE-Step 1.5), or `unknown` (1.9.0).
      enum: [ar, az, bg, bn, ca, cs, da, de, el, en, es, fa, fi, fr, he, hi, hr, ht, hu, id, is, it, ja, ko, la, lt, ms, ne, nl, 'no', pa, pl, pt, ro, ru, sa, sk, sr, sv, sw, ta, te, th, tl, tr, uk, ur, vi, yue, zh, unknown]
    LyricsInput:
      type: object
      additionalProperties: false
      required: [title, language, text]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 80
        language:
          $ref: '#/components/schemas/LyricsLanguage'
        text:
          type: string
          minLength: 1
          maxLength: 65536
          description: Raw text; 1-4,096 characters after normalisation.
        expectedRevision:
          type: integer
          minimum: 1
          description: |
            1.23.0 (feature 023), optional. The sheet revision the client edited; a different current
            revision returns `409 revision-conflict`. Absent = 010 behaviour (last write wins).
    LyricsSheet:
      type: object
      additionalProperties: false
      required: [id, title, language, text, createdAt, updatedAt, revision, assist]
      description: Own lyrics, normalised (1.9.0); `revision` and `assist` since 1.23.0 (feature 023).
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
          minLength: 1
          maxLength: 80
        language:
          $ref: '#/components/schemas/LyricsLanguage'
        text:
          type: string
          minLength: 1
          maxLength: 4096
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        revision:
          type: integer
          minimum: 1
          description: 1.23.0 (feature 023). Incremented by every save, accept, undo and restore; sheets created before 1.23.0 start at 1.
        assist:
          $ref: '#/components/schemas/SheetAssistInfo'
    LyricsUploadRequest:
      type: object
      required: [file]
      properties:
        file:
          type: string
          contentMediaType: application/octet-stream
          description: .txt, .lrc or .md, UTF-8, at most 64 KiB (65,536 bytes).
        title:
          type: [string, 'null']
          maxLength: 80
          description: Defaults to the file name without extension.
        language:
          oneOf:
            - $ref: '#/components/schemas/LyricsLanguage'
            - type: 'null'
          description: Defaults to `unknown`.
    SectionsRequest:
      type: object
      additionalProperties: false
      required: [text]
      properties:
        text:
          type: string
          minLength: 1
          maxLength: 65536
    SectionMarker:
      type: string
      description: Recognised section markers (case-insensitive in the text, optionally numbered, `[verse 2]`).
      enum: [intro, verse, pre-chorus, chorus, bridge, outro, instrumental]
    LyricsSection:
      type: object
      additionalProperties: false
      required: [marker, number, lineCount]
      properties:
        marker:
          $ref: '#/components/schemas/SectionMarker'
        number:
          type: [integer, 'null']
          minimum: 1
          maximum: 99
        lineCount:
          type: integer
          minimum: 0
    SectionProposal:
      type: object
      additionalProperties: false
      required: [text, sections, wordsPerSecondAt120s]
      properties:
        text:
          type: string
          maxLength: 4096
          description: The normalised text with proposed markers (existing markers are kept).
        sections:
          type: array
          items:
            $ref: '#/components/schemas/LyricsSection'
        wordsPerSecondAt120s:
          type: number
          minimum: 0
          description: Lyrics density for a 120 s song; above 4.0 the UI warns.
    LeadVoice:
      type: string
      enum: [female, male, any]
    SongRequest:
      type: object
      additionalProperties: false
      required: [language, leadVoice]
      description: |
        One of `lyricsId` / `lyricsText`; at most one of `styleId` / `freeCaption`. Defaults:
        `instrumental` false, `durationSeconds` 120, `takes` 1, BPM/key/time signature chosen by
        the model (or 120 BPM 4/4 when the language-model planner does not run).
      properties:
        lyricsId:
          type: [string, 'null']
          format: uuid
        lyricsText:
          type: [string, 'null']
          maxLength: 65536
        title:
          type: [string, 'null']
          maxLength: 80
          description: Song title; defaults to the lyrics sheet title or "Untitled song".
        language:
          $ref: '#/components/schemas/LyricsLanguage'
        styleId:
          type: [string, 'null']
          format: uuid
        freeCaption:
          type: [string, 'null']
          maxLength: 300
        leadVoice:
          $ref: '#/components/schemas/LeadVoice'
        delivery:
          type: [string, 'null']
          maxLength: 40
          example: breathy, soft
        instrumental:
          type: boolean
          default: false
        bpm:
          type: [integer, 'null']
          minimum: 40
          maximum: 220
        keyScale:
          type: [string, 'null']
          pattern: '^[A-G](#|b)? (major|minor)$'
        timeSignature:
          type: [string, 'null']
          enum: ['2', '3', '4', '6', null]
        durationSeconds:
          type: number
          minimum: 10
          maximum: 480
          default: 120
        takes:
          type: integer
          minimum: 1
          maximum: 2
          default: 1
    LyricsSnapshot:
      type: object
      additionalProperties: false
      required: [lyricsId, title, language, text]
      properties:
        lyricsId:
          type: [string, 'null']
          format: uuid
          description: The saved sheet; null for inline text or after the sheet was deleted.
        title:
          type: string
          minLength: 1
          maxLength: 80
        language:
          $ref: '#/components/schemas/LyricsLanguage'
        text:
          type: string
          maxLength: 4096
        assistedLineCount:
          type: integer
          minimum: 0
          default: 0
          description: 1.23.0 (feature 023). Lines of the snapshot that came from accepted assistant text (take details).
    SongVoice:
      type: object
      additionalProperties: false
      required: [leadVoice, delivery]
      properties:
        leadVoice:
          $ref: '#/components/schemas/LeadVoice'
        delivery:
          type: [string, 'null']
          maxLength: 40
    SongDetails:
      type: object
      additionalProperties: false
      required: [lyrics, style, freeCaption, voice, instrumental, bpm, keyScale, timeSignature, durationSeconds, caption]
      description: What a song was made from (snapshots) (1.9.0).
      properties:
        lyrics:
          $ref: '#/components/schemas/LyricsSnapshot'
        style:
          oneOf:
            - $ref: '#/components/schemas/StyleSnapshot'
            - type: 'null'
        freeCaption:
          type: [string, 'null']
          maxLength: 300
        voice:
          $ref: '#/components/schemas/SongVoice'
        instrumental:
          type: boolean
        bpm:
          type: [integer, 'null']
          minimum: 40
          maximum: 220
        keyScale:
          type: [string, 'null']
        timeSignature:
          type: [string, 'null']
          enum: ['2', '3', '4', '6', null]
        durationSeconds:
          type: number
          minimum: 10
          maximum: 480
        caption:
          type: string
          minLength: 1
          maxLength: 512
    VoiceConversionRequest:
      type: object
      additionalProperties: false
      required: [profileId]
      properties:
        profileId:
          type: string
          format: uuid
        pitchShift:
          type: integer
          minimum: -12
          maximum: 12
          default: 0
        autoShift:
          type: boolean
          default: true
    VoiceConversionDetails:
      type: object
      additionalProperties: false
      required: [sourceGenerationId, sourceTakeIndex, voiceProfileId, voiceProfileName, importedTrackId, pitchShift, autoShift]
      description: What a voice conversion was made from (1.9.0).
      properties:
        sourceGenerationId:
          type: string
          format: uuid
        sourceTakeIndex:
          type: integer
          minimum: 1
          maximum: 2
        voiceProfileId:
          type: [string, 'null']
          format: uuid
          description: Null after the profile was deleted (the name snapshot ends with "(profile deleted)").
        voiceProfileName:
          type: string
          minLength: 1
          maxLength: 80
        importedTrackId:
          type: [string, 'null']
          format: uuid
          description: The track of the source take whose stems are converted.
        pitchShift:
          type: integer
          minimum: -12
          maximum: 12
        autoShift:
          type: boolean
    VocalLabel:
      type: string
      description: AI voice label (1.9.0). `none` no vocals; `synthetic` an AI voice from the song model; `converted` converted to a voice profile.
      enum: [none, synthetic, converted]
    VoiceSampleSource:
      type: string
      enum: [recorded, uploaded]
    VoiceConsent:
      type: object
      additionalProperties: false
      required: [statementVersion, personName, consentedAt]
      properties:
        statementVersion:
          type: string
          const: consent.v1
        personName:
          type: string
          minLength: 1
          maxLength: 80
        consentedAt:
          type: string
          format: date-time
    VoiceProfile:
      type: object
      additionalProperties: false
      required: [id, displayName, consent, source, durationSeconds, voicedRatio, sampleUrl, createdAt, convertedTakeCount]
      description: An own-voice profile with its consent record (1.9.0). Voice data never leaves this computer.
      properties:
        id:
          type: string
          format: uuid
        displayName:
          type: string
          minLength: 1
          maxLength: 60
        consent:
          $ref: '#/components/schemas/VoiceConsent'
        source:
          $ref: '#/components/schemas/VoiceSampleSource'
        durationSeconds:
          type: number
          minimum: 10
          maximum: 60
        voicedRatio:
          type: number
          minimum: 0.5
          maximum: 1
        sampleUrl:
          type: string
          example: /api/voice-profiles/4b6d8f0a-1c3e-4a5b-9d7f-2e4c6a8b0d1f/sample
        createdAt:
          type: string
          format: date-time
        convertedTakeCount:
          type: integer
          minimum: 0
    CreateVoiceProfileRequest:
      type: object
      required: [sample, displayName, personName, consentConfirmed, consentStatementVersion, source]
      properties:
        sample:
          type: string
          contentMediaType: application/octet-stream
          description: WAV, FLAC, MP3 or WebM/Opus (browser recorder), at most 20 MiB, 10-60 s of own singing.
        displayName:
          type: string
          minLength: 1
          maxLength: 60
        personName:
          type: string
          minLength: 1
          maxLength: 80
        consentConfirmed:
          type: boolean
          description: Must be true.
        consentStatementVersion:
          type: string
          description: Must be the current version (`consent.v1`).
        source:
          $ref: '#/components/schemas/VoiceSampleSource'
    ConsentStatement:
      type: object
      additionalProperties: false
      required: [version, text, textNl]
      properties:
        version:
          type: string
          const: consent.v1
        text:
          type: string
          maxLength: 1000
        textNl:
          type: string
          maxLength: 1000
    BackendUnavailableProblem:
      description: 503 `backend-unavailable`; the extension member `agentStatus` says why and how to fix it.
      allOf:
        - $ref: '#/components/schemas/ProblemDetails'
        - type: object
          required: [agentStatus]
          properties:
            agentStatus:
              $ref: '#/components/schemas/AgentStatus'
    AgentBackend:
      type: string
      enum: [ollama, claude, none, fake]
      description: ollama (local, default), claude (paid, opt-in), none (agent off), fake (tests/E2E, environment only).
    ClaudeModel:
      type: string
      enum: [claude-opus-5-5, claude-sonnet-5-5, claude-haiku-5-5]
    ClaudeEffort:
      type: string
      enum: [low, medium, high]
    AgentRunStatus:
      type: string
      enum: [queued, running, awaiting_approval, awaiting_ui, waiting_job, completed, failed, cancelled, interrupted]
      description: completed, failed, cancelled and interrupted are terminal.
    AgentStepStatus:
      type: string
      enum: [planned, awaiting_approval, running, awaiting_ui, waiting_job, succeeded, failed, rejected, rejected_invalid, skipped, expired, undone]
    StepDecision:
      type: string
      enum: [auto, approval_required, denied]
    ToolKind:
      type: string
      enum: [server, ui, meta]
    ToolRisk:
      type: string
      enum: [read, change, job, heavy, destructive]
    UndoKind:
      type: string
      enum: [none, inverse, compensate]
    PlanItemStatus:
      type: string
      enum: [pending, running, done, failed, skipped]
    ApprovalDecision:
      type: string
      enum: [approve, reject]
    ApprovalScope:
      type: string
      enum: [once, plan_heavy]
    ApprovalStatus:
      type: string
      enum: [pending, approved, rejected, expired]
    MessageRole:
      type: string
      enum: [user, assistant]
    JobPhase:
      type: string
      enum: [standard, detail, lyrics, export, transcription, restyle, generation, lyricAssist]
      description: restyle and generation are used once features 009 and 010 are delivered; `lyricAssist` (1.23.0, feature 023) is a lyric assist run.
    DecisionReason:
      type: string
      enum: [risk-heavy, risk-destructive, tainted, url-not-from-user, lyrics-not-from-user, artist-imitation, undo-compensation, risk-check-failed, lyrics-edit]
      description: |
        `lyrics-edit` (1.23.0, feature 023): `apply_lyric_suggestions` changes a lyrics sheet; approval
        is always required and never covered by a plan approval.
        Why a step needs approval or was denied (data-model 4.2, 6). `risk-check-failed`: the tool's
        dynamic heavy-risk check (e.g. the size of an export) could not be evaluated, so the step is
        escalated to heavy and requires approval; such a step is never covered by a `plan_heavy`
        approval.
    ArgumentsHash:
      type: string
      pattern: '^[0-9a-f]{64}$'
      description: SHA-256 (lower-case hex) of the canonical arguments (sorted keys, no whitespace).
    JsonObject:
      type: object
      description: A JSON object (tool arguments or a compact result projection, at most 8 KB / 4 KB).
      additionalProperties: true
    OllamaModelInfo:
      type: object
      required: [name, sizeBytes, tools]
      additionalProperties: false
      properties:
        name:
          type: string
        sizeBytes:
          type: integer
          minimum: 0
        tools:
          type: boolean
    OllamaStatus:
      type: object
      required: [reachable, version, models, defaultPresent, fallbackPresent]
      additionalProperties: false
      properties:
        reachable:
          type: boolean
        version:
          type: [string, 'null']
        models:
          type: array
          items:
            $ref: '#/components/schemas/OllamaModelInfo'
        defaultPresent:
          type: boolean
        fallbackPresent:
          type: boolean
    ClaudeKeyInvalidProblem:
      description: 422 `claude-key-invalid`; `reason` names the failed rule. Never contains the value.
      allOf:
        - $ref: '#/components/schemas/ProblemDetails'
        - type: object
          required: [reason]
          properties:
            reason:
              type: string
              enum: [empty, prefix, length, characters, admin-key]
    ClaudeKeySource:
      type: string
      enum: [environment, stored]
      description: environment = `ANTHROPIC_API_KEY` of the API (wins); stored = saved in Settings, encrypted.
    ClaudeKeyState:
      type: string
      enum: [not-configured, environment, stored, stored-unreadable]
      description: |
        Summary for the UI (data-model 3): `environment` whenever the variable is set;
        else `stored` when the stored key decrypts; else `stored-unreadable` when a stored key
        exists but cannot be decrypted on this installation; else `not-configured`.
    StoredClaudeKeyState:
      type: string
      enum: [absent, readable, unreadable]
      description: State of the stored key, independent of the environment variable.
    ClaudeKeyStatus:
      type: object
      description: |
        Never contains the key. `lastFour` is the last four characters of the **active** key
        (null when none is usable); `storedLastFour` those of the stored key (also when it is
        overridden or unreadable). `reason`/`fix` are readable texts for `stored-unreadable` and
        an unavailable key store, else null.
      required: [configured, source, state, lastFour, stored, storedLastFour, storedAt, storeAvailable, reason, fix]
      additionalProperties: false
      properties:
        configured:
          type: boolean
          description: A usable key is available (same value as `ClaudeStatus.keyConfigured`).
        source:
          oneOf:
            - $ref: '#/components/schemas/ClaudeKeySource'
            - type: 'null'
        state:
          $ref: '#/components/schemas/ClaudeKeyState'
        lastFour:
          type: [string, 'null']
          pattern: '^[A-Za-z0-9_-]{4}$'
        stored:
          $ref: '#/components/schemas/StoredClaudeKeyState'
        storedLastFour:
          type: [string, 'null']
          pattern: '^[A-Za-z0-9_-]{4}$'
        storedAt:
          type: [string, 'null']
          format: date-time
        storeAvailable:
          type: boolean
          description: False when the key ring directory cannot be used; storing then answers 503.
        reason:
          type: [string, 'null']
          examples: ['The stored key cannot be read on this installation (the encryption keys are missing or different, e.g. after a restore on another computer).']
        fix:
          type: [string, 'null']
          examples: ['Enter the key again.']
      examples:
        - configured: true
          source: stored
          state: stored
          lastFour: wXyZ
          stored: readable
          storedLastFour: wXyZ
          storedAt: '2026-11-16T15:40:00Z'
          storeAvailable: true
          reason: null
          fix: null
        - configured: false
          source: null
          state: stored-unreadable
          lastFour: null
          stored: unreadable
          storedLastFour: wXyZ
          storedAt: '2026-11-02T09:12:00Z'
          storeAvailable: true
          reason: The stored key cannot be read on this installation (the encryption keys are missing or different, e.g. after a restore on another computer).
          fix: Enter the key again.
    StoreClaudeKeyRequest:
      type: object
      description: Write-only. The server trims whitespace; the value is never echoed or logged.
      required: [apiKey]
      additionalProperties: false
      properties:
        apiKey:
          type: string
          writeOnly: true
          minLength: 1
          maxLength: 512
          description: The Anthropic API key (prefix `sk-ant-`). 40-256 characters after trimming; the stricter rules are checked by the server (422 `claude-key-invalid`).
    ClaudeKeyTestSource:
      type: string
      enum: [active, stored, environment]
      description: Which key a Claude test uses; `active` follows the precedence (environment first).
    ClaudeStatus:
      type: object
      description: Never contains the key; `key` (1.21.0) gives its sources and last four characters.
      required: [keyConfigured, noticeAcknowledged, model, key]
      additionalProperties: false
      properties:
        keyConfigured:
          type: boolean
          description: A usable key is available (environment, or a readable stored key since 1.21.0).
        noticeAcknowledged:
          type: boolean
        model:
          $ref: '#/components/schemas/ClaudeModel'
        key:
          $ref: '#/components/schemas/ClaudeKeyStatus'
