        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [library]
      operationId: resetTrackLibraryInfo
      summary: Use automatic names for every level of the track again.
      responses:
        '200':
          description: Reset; the items are re-filed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LibraryInfoState'
        '404':
          $ref: '#/components/responses/NotFound'
