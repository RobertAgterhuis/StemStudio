          type: string
          format: uuid
    AgentRunEvent:
      description: |
        One decoded server-sent event: `id` is the SSE `id:` line, `event` the `event:` line and
        `data` the parsed `data:` line. On the wire the stream is plain `text/event-stream`.
      oneOf:
        - $ref: '#/components/schemas/RunStartedEnvelope'
        - $ref: '#/components/schemas/ModelChangedEnvelope'
        - $ref: '#/components/schemas/PlanUpdatedEnvelope'
        - $ref: '#/components/schemas/TextDeltaEnvelope'
        - $ref: '#/components/schemas/StepCreatedEnvelope'
        - $ref: '#/components/schemas/StepUpdatedEnvelope'
        - $ref: '#/components/schemas/ApprovalRequestedEnvelope'
        - $ref: '#/components/schemas/ApprovalResolvedEnvelope'
        - $ref: '#/components/schemas/UiRequestedEnvelope'
        - $ref: '#/components/schemas/UsageUpdatedEnvelope'
        - $ref: '#/components/schemas/RunCompletedEnvelope'
        - $ref: '#/components/schemas/RunFailedEnvelope'
        - $ref: '#/components/schemas/RunCancelledEnvelope'
        - $ref: '#/components/schemas/RunInterruptedEnvelope'
      discriminator:
        propertyName: event
        mapping:
          run.started: '#/components/schemas/RunStartedEnvelope'
          model.changed: '#/components/schemas/ModelChangedEnvelope'
          plan.updated: '#/components/schemas/PlanUpdatedEnvelope'
          text.delta: '#/components/schemas/TextDeltaEnvelope'
          step.created: '#/components/schemas/StepCreatedEnvelope'
          step.updated: '#/components/schemas/StepUpdatedEnvelope'
          approval.requested: '#/components/schemas/ApprovalRequestedEnvelope'
          approval.resolved: '#/components/schemas/ApprovalResolvedEnvelope'
          ui.requested: '#/components/schemas/UiRequestedEnvelope'
          usage.updated: '#/components/schemas/UsageUpdatedEnvelope'
          run.completed: '#/components/schemas/RunCompletedEnvelope'
          run.failed: '#/components/schemas/RunFailedEnvelope'
          run.cancelled: '#/components/schemas/RunCancelledEnvelope'
          run.interrupted: '#/components/schemas/RunInterruptedEnvelope'
    EventId:
      type: integer
      minimum: 1
      description: Event sequence number within the run (SSE `id:`).
    RunStartedEnvelope:
      type: object
      required: [id, event, data]
      properties:
        id:
          $ref: '#/components/schemas/EventId'
        event:
          const: run.started
        data:
          $ref: '#/components/schemas/RunStartedEvent'
    ModelChangedEnvelope:
      type: object
      required: [id, event, data]
      properties:
        id:
          $ref: '#/components/schemas/EventId'
        event:
          const: model.changed
        data:
          $ref: '#/components/schemas/ModelChangedEvent'
    PlanUpdatedEnvelope:
      type: object
      required: [id, event, data]
      properties:
        id:
          $ref: '#/components/schemas/EventId'
        event:
          const: plan.updated
        data:
          $ref: '#/components/schemas/PlanUpdatedEvent'
    TextDeltaEnvelope:
      type: object
      required: [id, event, data]
      properties:
        id:
          $ref: '#/components/schemas/EventId'
        event:
          const: text.delta
        data:
          $ref: '#/components/schemas/TextDeltaEvent'
    StepCreatedEnvelope:
      type: object
      required: [id, event, data]
      properties:
        id:
          $ref: '#/components/schemas/EventId'
        event:
          const: step.created
        data:
          $ref: '#/components/schemas/AgentStep'
    StepUpdatedEnvelope:
      type: object
      required: [id, event, data]
      properties:
        id:
          $ref: '#/components/schemas/EventId'
        event:
          const: step.updated
        data:
          $ref: '#/components/schemas/StepUpdatedEvent'
    ApprovalRequestedEnvelope:
      type: object
      required: [id, event, data]
      properties:
        id:
          $ref: '#/components/schemas/EventId'
        event:
          const: approval.requested
        data:
          $ref: '#/components/schemas/ApprovalRequest'
    ApprovalResolvedEnvelope:
      type: object
      required: [id, event, data]
      properties:
        id:
          $ref: '#/components/schemas/EventId'
        event:
          const: approval.resolved
        data:
          $ref: '#/components/schemas/ApprovalState'
    UiRequestedEnvelope:
      type: object
      required: [id, event, data]
      properties:
        id:
          $ref: '#/components/schemas/EventId'
        event:
          const: ui.requested
        data:
          $ref: '#/components/schemas/UiRequestedEvent'
    UsageUpdatedEnvelope:
      type: object
      required: [id, event, data]
      properties:
        id:
          $ref: '#/components/schemas/EventId'
        event:
          const: usage.updated
        data:
          $ref: '#/components/schemas/TokenUsage'
    RunCompletedEnvelope:
      type: object
      required: [id, event, data]
      properties:
        id:
          $ref: '#/components/schemas/EventId'
        event:
          const: run.completed
        data:
          $ref: '#/components/schemas/RunCompletedEvent'
    RunFailedEnvelope:
      type: object
      required: [id, event, data]
      properties:
        id:
          $ref: '#/components/schemas/EventId'
        event:
          const: run.failed
        data:
          $ref: '#/components/schemas/RunFailure'
    RunCancelledEnvelope:
      type: object
      required: [id, event, data]
      properties:
        id:
          $ref: '#/components/schemas/EventId'
        event:
          const: run.cancelled
        data:
          $ref: '#/components/schemas/RunCancelledEvent'
    RunInterruptedEnvelope:
      type: object
      required: [id, event, data]
      properties:
        id:
          $ref: '#/components/schemas/EventId'
        event:
          const: run.interrupted
        data:
          $ref: '#/components/schemas/RunInterruptedEvent'
    Category:
      type: string
      description: Archive and storage categories (backup-archive 1.0.0).
      enum: [database, stems, artwork, pendingUploads, detailStems, exports, scores, generations, recordings, voiceProfiles]
    StorageCategory:
      type: string
      enum: [database, stems, artwork, pendingUploads, detailStems, exports, scores, generations, recordings, voiceProfiles, leftovers, restoreStaging, previousLibrary, workerSeparationCache, workerDetailCache, workerJobFiles, workerScratch]
    Regenerability:
      type: string
      description: '`original` = StemStudio cannot recreate it; `regenerable` = one action (or automatic use) recreates it.'
      enum: [original, regenerable]
    LibraryJobKind:
      type: string
      enum: [backup, verify, restore, undoRestore]
    LibraryJobStatus:
      type: string
      description: '`completed`, `failed` and `cancelled` are terminal.'
      enum: [queued, running, completed, failed, cancelled]
    GateMode:
      type: string
      enum: [open, backupRunning, maintenance]
    FolderState:
      type: object
      additionalProperties: false
      required: [available, writable, hostPathHint, freeBytes, totalBytes, reason]
      properties:
        available:
          type: boolean
        writable:
          type: boolean
        hostPathHint:
          type: [string, 'null']
          maxLength: 260
          description: Display only (`StemStudio:BackupHostDirHint`), e.g. `./backups`.
        freeBytes:
          type: [integer, 'null']
        totalBytes:
          type: [integer, 'null']
        reason:
          type: [string, 'null']
          maxLength: 300
          description: Why the folder is not available or not writable, with the fix.
    ActiveWork:
      type: object
      additionalProperties: false
      required: [kind, id, title]
      properties:
        kind:
          type: string
          enum: [import, detail, export, score, lyricsAlignment, generation, agentRun]
        id:
          type: string
          maxLength: 64
        title:
          type: string
          maxLength: 300
    LibraryCareStatus:
      type: object
      additionalProperties: false
      required: [gate, activeJob, backupFolder, previousLibrary, activeWork, libraryEmpty]
      properties:
        gate:
          $ref: '#/components/schemas/GateMode'
        activeJob:
          oneOf:
            - $ref: '#/components/schemas/LibraryJob'
            - type: 'null'
        backupFolder:
          $ref: '#/components/schemas/FolderState'
        previousLibrary:
          oneOf:
            - $ref: '#/components/schemas/PreviousLibrary'
            - type: 'null'
        activeWork:
          type: array
          description: Queued or running jobs that block a restore.
          items:
            $ref: '#/components/schemas/ActiveWork'
        libraryEmpty:
          type: boolean
          description: True when a restore needs no replace (research R-07 definition).
    BackupOptions:
      type: object
      additionalProperties: false
      description: Optional categories; `database`, `stems`, `artwork` and `pendingUploads` are always included.
      properties:
        detailStems:
          type: boolean
          default: true
        exports:
          type: boolean
          default: true
        scores:
          type: boolean
          default: true
        generations:
          type: boolean
          default: true
        recordings:
          type: boolean
          default: true
          description: Play-along takes of feature 015 (user-created originals; empty before 015).
        voiceProfiles:
          type: boolean
          default: true
    CategorySize:
      type: object
      additionalProperties: false
      required: [category, included, optional, bytes, files, regenerability]
      properties:
        category:
          $ref: '#/components/schemas/Category'
        included:
          type: boolean
        optional:
          type: boolean
        bytes:
          type: integer
          minimum: 0
        files:
          type: integer
          minimum: 0
        regenerability:
          $ref: '#/components/schemas/Regenerability'
    BackupEstimate:
      type: object
      additionalProperties: false
      required: [totalBytes, categories, folder, enough]
      properties:
        totalBytes:
          type: integer
          minimum: 0
          description: Uncompressed size of the archive (audio is stored; the archive is about this size).
        categories:
          type: array
          items:
            $ref: '#/components/schemas/CategorySize'
        folder:
          $ref: '#/components/schemas/FolderState'
        enough:
          type: boolean
          description: Free space >= totalBytes + 64 MiB.
    Compatibility:
      type: object
      additionalProperties: false
      required: [restorable, reason, migrationNeeded]
      properties:
        restorable:
          type: boolean
        reason:
          type: [string, 'null']
          maxLength: 300
        migrationNeeded:
          type: boolean
          description: The archive's schema is older; it is migrated in staging.
    BackupSummary:
      type: object
      additionalProperties: false
      required: [fileName, sizeBytes, modifiedAt, recognised, reason, backupId, createdAt, appVersion, backendApi, formatVersion, included, counts, compatibility]
      properties:
        fileName:
          type: string
          pattern: '^[A-Za-z0-9][A-Za-z0-9._-]{0,119}\.zip$'
        sizeBytes:
          type: integer
        modifiedAt:
          type: string
          format: date-time
        recognised:
          type: boolean
        reason:
          type: [string, 'null']
          description: Why the file is not recognised (no manifest, not a ZIP).
        backupId:
          type: [string, 'null']
          format: uuid
        createdAt:
          type: [string, 'null']
          format: date-time
        appVersion:
          type: [string, 'null']
        backendApi:
          type: [string, 'null']
        formatVersion:
          type: [string, 'null']
        included:
          type: array
          items:
            $ref: '#/components/schemas/Category'
        counts:
          oneOf:
            - $ref: '#/components/schemas/ArchiveCounts'
            - type: 'null'
        compatibility:
          $ref: '#/components/schemas/Compatibility'
    ArchiveCounts:
      type: object
      additionalProperties: false
      required: [tracks, mixes, assets, generations, styles, lyricsSheets, voiceProfiles]
      properties:
        tracks:
          type: integer
        mixes:
          type: integer
        assets:
          type: integer
        generations:
          type: integer
        styles:
          type: integer
        lyricsSheets:
          type: integer
        voiceProfiles:
          type: integer
    BackupList:
      type: object
      additionalProperties: false
      required: [folder, archives]
      properties:
        folder:
          $ref: '#/components/schemas/FolderState'
        archives:
          type: array
          items:
            $ref: '#/components/schemas/BackupSummary'
    VoiceProfileProof:
      type: object
      additionalProperties: false
      description: Consent proof from the manifest (010); shown before a restore.
      required: [id, displayName, statementVersion, personName, consentedAt, valid, reason]
      properties:
        id:
          type: string
          format: uuid
        displayName:
          type: string
          maxLength: 60
        statementVersion:
          type: string
        personName:
          type: string
          maxLength: 80
        consentedAt:
          type: string
          format: date-time
        valid:
          type: boolean
          description: Statement version known and statement SHA-256 matching (the full check runs during restore).
        reason:
          type: [string, 'null']
    ArchiveWarning:
      type: object
      additionalProperties: false
      required: [code, message]
      properties:
        code:
          type: string
          enum: [missing-file, changed-after-snapshot, voice-profile-without-consent, interrupted-entity]
        message:
          type: string
          maxLength: 500
    BackupDetails:
      type: object
      additionalProperties: false
      description: Every member of `BackupSummary` plus the manifest details (one closed object; `BackupSummary` is closed, so it cannot be extended with `allOf`).
      required: [fileName, sizeBytes, modifiedAt, recognised, reason, backupId, createdAt, appVersion, backendApi, formatVersion, included, counts, compatibility, excluded, entries, totalBytes, schemaLastMigration, voiceProfiles, warnings]
      properties:
        fileName:
          type: string
          pattern: '^[A-Za-z0-9][A-Za-z0-9._-]{0,119}\.zip$'
        sizeBytes:
          type: integer
        modifiedAt:
          type: string
          format: date-time
        recognised:
          type: boolean
        reason:
          type: [string, 'null']
          description: Why the file is not recognised (no manifest, not a ZIP).
        backupId:
          type: [string, 'null']
          format: uuid
        createdAt:
          type: [string, 'null']
          format: date-time
        appVersion:
          type: [string, 'null']
        backendApi:
          type: [string, 'null']
        formatVersion:
          type: [string, 'null']
        included:
          type: array
          items:
            $ref: '#/components/schemas/Category'
        counts:
          oneOf:
            - $ref: '#/components/schemas/ArchiveCounts'
            - type: 'null'
        compatibility:
          $ref: '#/components/schemas/Compatibility'
        excluded:
          type: array
          items:
            $ref: '#/components/schemas/Category'
        entries:
          type: integer
        totalBytes:
          type: integer
        schemaLastMigration:
          type: string
        voiceProfiles:
          type: array
          items:
            $ref: '#/components/schemas/VoiceProfileProof'
        warnings:
          type: array
          items:
            $ref: '#/components/schemas/ArchiveWarning'
    RestoreOptions:
      type: object
      additionalProperties: false
      required: [mode]
      properties:
        mode:
          type: string
          enum: [replace, merge]
          description: '`replace` also covers an empty library (nothing is moved aside). `merge` is P3.'
        voiceProfiles:
          type: boolean
          default: true
          description: false = no voice profile is restored (their converted takes are kept with the name snapshot).
        confirmation:
          type: [string, 'null']
          description: Must be `REPLACE` for `replace` on a non-empty library.
    Confirmation:
      type: object
      additionalProperties: false
      required: [confirmation]
      properties:
        confirmation:
          type: string
          maxLength: 16
    JobError:
      type: object
      additionalProperties: false
      required: [code, message]
      properties:
        code:
          type: string
          enum: [interrupted, insufficient-disk-space, backups-folder-unavailable, archive-invalid, archive-incompatible, archive-unsafe, archive-corrupt, migration-failed, io-error]
        message:
          type: string
          maxLength: 500
    CategoryCount:
      type: object
      additionalProperties: false
      required: [category, items, files, bytes]
      properties:
        category:
          $ref: '#/components/schemas/Category'
        items:
          type: integer
        files:
          type: integer
        bytes:
          type: integer
    SkippedItem:
      type: object
      additionalProperties: false
      required: [category, id, name, reason]
      properties:
        category:
          type: string
        id:
          type: string
        name:
          type: [string, 'null']
        reason:
          type: string
          enum: [same-id, same-source, dependency-skipped, consent-invalid, option, missing-file]
        renamedTo:
          type: [string, 'null']
    BackupReport:
      type: object
      additionalProperties: false
      required: [type, fileName, included, entries, bytes, warnings]
      properties:
        type:
          const: backup
        fileName:
          type: string
        included:
          type: array
          items:
            $ref: '#/components/schemas/CategoryCount'
        entries:
          type: integer
        bytes:
          type: integer
          description: Archive file size.
        warnings:
          type: array
          items:
            $ref: '#/components/schemas/ArchiveWarning'
    VerifyReport:
      type: object
      additionalProperties: false
      required: [type, ok, entriesChecked, bytesChecked, problem]
      properties:
        type:
          const: verify
        ok:
          type: boolean
        entriesChecked:
          type: integer
        bytesChecked:
          type: integer
        problem:
          oneOf:
            - $ref: '#/components/schemas/JobError'
            - type: 'null'
    RestoreReport:
      type: object
      additionalProperties: false
      required: [type, mode, restored, skipped, migratedFrom, warnings, previousLibraryKept]
      properties:
        type:
          const: restore
        mode:
          type: string
          enum: [empty, replace, merge, undo]
        restored:
          type: array
          items:
            $ref: '#/components/schemas/CategoryCount'
        skipped:
          type: array
          items:
            $ref: '#/components/schemas/SkippedItem'
        migratedFrom:
          type: [string, 'null']
          description: Last migration of the archive when it was migrated.
        warnings:
          type: array
          items:
            type: string
            maxLength: 500
        previousLibraryKept:
          type: boolean
    LibraryJob:
      type: object
      additionalProperties: false
      required: [jobId, kind, status, stage, stageText, progress, bytesDone, bytesTotal, currentItem, etaSeconds, archiveFileName, cancellable, report, error, createdAt, startedAt, finishedAt]
      properties:
        jobId:
          type: string
          format: uuid
        kind:
          $ref: '#/components/schemas/LibraryJobKind'
        status:
          $ref: '#/components/schemas/LibraryJobStatus'
        stage:
          type: [string, 'null']
          enum: [snapshot, scrub, files, manifest, check, validate, extract, database, switch, reconcile, null]
        stageText:
          type: [string, 'null']
          maxLength: 200
        progress:
          type: integer
          minimum: 0
          maximum: 100
        bytesDone:
          type: integer
          minimum: 0
        bytesTotal:
          type: integer
          minimum: 0
        currentItem:
          type: [string, 'null']
          maxLength: 300
          description: e.g. "Song title - stems"; never a file path or personal content.
        etaSeconds:
          type: [integer, 'null']
        archiveFileName:
          type: [string, 'null']
        cancellable:
          type: boolean
        report:
          oneOf:
            - $ref: '#/components/schemas/BackupReport'
            - $ref: '#/components/schemas/VerifyReport'
            - $ref: '#/components/schemas/RestoreReport'
            - type: 'null'
        error:
          oneOf:
            - $ref: '#/components/schemas/JobError'
            - type: 'null'
        createdAt:
          type: string
          format: date-time
        startedAt:
          type: [string, 'null']
          format: date-time
        finishedAt:
          type: [string, 'null']
          format: date-time
    PreviousLibrary:
      type: object
      additionalProperties: false
      required: [restoreId, movedAsideAt, sizeBytes, counts, restoredArchive]
      properties:
        restoreId:
          type: string
          format: uuid
        movedAsideAt:
          type: string
          format: date-time
        sizeBytes:
          type: integer
        counts:
          $ref: '#/components/schemas/ArchiveCounts'
        restoredArchive:
          type: [string, 'null']
    Volume:
      type: object
      additionalProperties: false
      required: [id, label, freeBytes, totalBytes, sharedWith, reason]
      properties:
        id:
          type: string
          enum: [library, backups, workerData, modelCache]
        label:
          type: string
        freeBytes:
          type: [integer, 'null']
        totalBytes:
          type: [integer, 'null']
        sharedWith:
          type: array
          description: Other volume ids on the same disk (same total and free bytes).
          items:
            type: string
        reason:
          type: [string, 'null']
    StorageCategoryUsage:
      type: object
      additionalProperties: false
      required: [category, bytes, files, regenerability, howToRegenerate, costHint]
      properties:
        category:
          $ref: '#/components/schemas/StorageCategory'
        bytes:
          type: [integer, 'null']
        files:
          type: [integer, 'null']
        regenerability:
          $ref: '#/components/schemas/Regenerability'
        howToRegenerate:
          type: [string, 'null']
          maxLength: 200
        costHint:
          type: [string, 'null']
          maxLength: 120
    WorkerCacheEntryStorage:
      type: object
      additionalProperties: false
      required: [audioSha256Prefix, bytes, inUse, fromLibrary, trackId]
      properties:
        audioSha256Prefix:
          type: string
          pattern: '^[0-9a-f]{12}$'
          description: First 12 hex characters of the worker's cache key (the audio SHA-256).
        bytes:
          type: integer
          minimum: 0
          description: Standard result, detail result, unfinished detail checkpoints and artwork of the entry.
        inUse:
          type: boolean
          description: A queued or running worker job uses the entry (it is never cleaned while in use).
        fromLibrary:
          type: boolean
          description: Created by a rehydration from the library stems (FR-019).
        trackId:
          type: [string, 'null']
          format: uuid
          description: The library track whose standard job uses the entry, or null.
    TrackStorage:
      type: object
      additionalProperties: false
      required: [trackId, title, artist, totalBytes, sourceBytes, stemsBytes, detailStemsBytes, detailFilesRemoved, artworkBytes, exportsBytes, scoresBytes, generationsBytes, recordingsBytes, workerCacheBytes]
      properties:
        trackId:
          type: string
          format: uuid
        title:
          type: string
        artist:
          type: [string, 'null']
        totalBytes:
          type: integer
        sourceBytes:
          type: [integer, 'null']
          description: Pending upload plus the worker separation cache of the track (null when the worker is unavailable and nothing is pending).
        stemsBytes:
          type: integer
        detailStemsBytes:
          type: integer
        detailFilesRemoved:
          type: boolean
        artworkBytes:
          type: integer
        exportsBytes:
          type: integer
        scoresBytes:
          type: integer
        generationsBytes:
          type: integer
        recordingsBytes:
          type: integer
          description: Play-along takes of the track (feature 015; original, never in a clean-up).
        workerCacheBytes:
          type: [integer, 'null']
    ModelCacheUsage:
      type: object
      additionalProperties: false
      required: [id, bytes, models]
      properties:
        id:
          type: string
          description: Folder under the model cache, e.g. torch, hf, whisper, acestep, soulx.
        bytes:
          type: integer
        models:
          type: array
          items:
            type: string
    StorageOverview:
      type: object
      additionalProperties: false
      required: [measuredAt, volumes, categories, tracks, unattached, modelCaches, workerEntries, backups, worker]
      properties:
        measuredAt:
          type: string
          format: date-time
        volumes:
          type: array
          items:
            $ref: '#/components/schemas/Volume'
        categories:
          type: array
          items:
            $ref: '#/components/schemas/StorageCategoryUsage'
        tracks:
          type: array
          description: Sorted by totalBytes descending.
          items:
            $ref: '#/components/schemas/TrackStorage'
        unattached:
          type: object
          additionalProperties: false
          required: [exportsBytes, scoresBytes, generationsBytes, voiceProfilesBytes, lyricsSheets]
          properties:
            exportsBytes:
              type: integer
            scoresBytes:
              type: integer
            generationsBytes:
              type: integer
            voiceProfilesBytes:
              type: integer
            lyricsSheets:
              type: integer
        modelCaches:
          type: array
          items:
            $ref: '#/components/schemas/ModelCacheUsage'
        workerEntries:
          type: array
          description: |
            Worker cache entries (one per audio file), largest first; empty when the worker is not
            reachable. Shown at Expert (`storage-worker-entries`). Added editorially before the
            1.12.0 release (CTO integration 013).
          items:
            $ref: '#/components/schemas/WorkerCacheEntryStorage'
        backups:
          type: object
          additionalProperties: false
          required: [count, bytes, folderAvailable, reason]
          properties:
            count:
              type: integer
            bytes:
              type: integer
            folderAvailable:
              type: boolean
            reason:
              type: [string, 'null']
        worker:
          type: object
          additionalProperties: false
          required: [available, reason]
          properties:
            available:
              type: boolean
            reason:
              type: [string, 'null']
    CleanupKind:
      type: string
      enum: [detailStems, workerCache, leftovers]
    CleanupAction:
      type: object
      additionalProperties: false
      required: [kind]
      properties:
        kind:
          $ref: '#/components/schemas/CleanupKind'
        trackIds:
          type: [array, 'null']
          description: null or absent = all tracks (ignored for leftovers).
          maxItems: 10000
          items:
            type: string
            format: uuid
    CleanupRequest:
      type: object
      additionalProperties: false
      required: [actions]
      properties:
        actions:
          type: array
          minItems: 1
          maxItems: 3
          items:
            $ref: '#/components/schemas/CleanupAction'
    CleanupItem:
      type: object
      additionalProperties: false
      required: [kind, trackId, title, files, bytes, howToRegenerate]
      properties:
        kind:
          $ref: '#/components/schemas/CleanupKind'
        trackId:
          type: [string, 'null']
          format: uuid
        title:
          type: [string, 'null']
        files:
          type: integer
        bytes:
          type: integer
        howToRegenerate:
          type: string
          maxLength: 200
    CleanupSkip:
      type: object
      additionalProperties: false
      required: [kind, trackId, title, reason]
      properties:
        kind:
          $ref: '#/components/schemas/CleanupKind'
        trackId:
          type: [string, 'null']
          format: uuid
        title:
          type: [string, 'null']
        reason:
          type: string
          enum: [detail-active, job-active, export-active, worker-unavailable, nothing-to-remove]
    CleanupPlan:
      type: object
      additionalProperties: false
      required: [planId, createdAt, expiresAt, items, skipped, totalBytes]
      properties:
        planId:
          type: string
          format: uuid
        createdAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
        items:
          type: array
          items:
            $ref: '#/components/schemas/CleanupItem'
        skipped:
          type: array
          items:
            $ref: '#/components/schemas/CleanupSkip'
        totalBytes:
          type: integer
    ExecuteCleanupRequest:
      type: object
      additionalProperties: false
      required: [planId]
      properties:
        planId:
          type: string
          format: uuid
    CleanupResult:
      type: object
      additionalProperties: false
      required: [planId, freedBytes, removed, failed]
      properties:
        planId:
          type: string
          format: uuid
        freedBytes:
          type: integer
        removed:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [kind, trackId, files, bytes]
            properties:
              kind:
                $ref: '#/components/schemas/CleanupKind'
              trackId:
                type: [string, 'null']
                format: uuid
              files:
                type: integer
              bytes:
                type: integer
        failed:
          type: array
          items:
            $ref: '#/components/schemas/CleanupSkip'
    FolderId:
      type: string
      pattern: '^(ar|al|so)[0-9a-f]{16}$'
      description: Derived folder id; the prefix is the level (`ar` artist, `al` album, `so` song).
    FolderLevel:
      type: string
      enum: [artist, album, song]
    FolderSort:
      type: string
      enum: [name, year, recent, size, items]
      description: '`name` A-Z (leading "The" ignored; unknown folders last), `year` (albums; unknown last), `recent` (newest item first), `size` (largest first), `items` (most items first).'
    PlacementSource:
      type: string
      enum: [item, track, match, import, fallback]
      description: |
        Where a name comes from: `item` (set by the user for this item), `track` (set by the user
        for its track), `match` (band info, feature 005), `import` (names reported by the import),
        `fallback` ("Unknown artist", "Unknown album", the track title, "My songs").
    FolderRef:
      type: object
      additionalProperties: false
      required: [id, level, name]
      properties:
        id:
          $ref: '#/components/schemas/FolderId'
        level:
          $ref: '#/components/schemas/FolderLevel'
        name:
          type: string
          minLength: 1
          maxLength: 200
    FolderCounts:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        albums:
          type: integer
          minimum: 1
          description: Artist folders only.
        songs:
          type: integer
          minimum: 1
          description: Artist and album folders.
        items:
          type: integer
          minimum: 0
          description: Items counted with the `kind`/`status` filters; 0 only for the root of an empty library.
    ArtImage:
      type: object
      additionalProperties: false
      required: [thumbUrl, coverUrl]
      properties:
        thumbUrl:
          type: string
          description: '`/api/tracks/{trackId}/artwork/thumb?v={version}` (160 px, immutable, 1.4.0).'
        coverUrl:
          type: string
          description: '`/api/tracks/{trackId}/artwork/cover?v={version}` (600 px, immutable, 1.4.0).'
    ArtPlaceholder:
      type: object
      additionalProperties: false
      required: [glyph, tone]
      properties:
        glyph:
          type: string
          minLength: 1
          maxLength: 8
          description: One grapheme (first letter of the name, upper case where the script has case; `?` for unknown folders; a note sign for "My songs").
        tone:
          type: integer
          minimum: 0
          maximum: 7
          description: Index of the design-system art colour token, derived from the folder key.
    FolderArtKind:
      type: string
      enum: [cover, mosaic, placeholder]
    FolderArt:
      type: object
      additionalProperties: false
      required: [kind, images, placeholder]
      description: |
        Song: the track's picture. Album: the best picture among its songs (005 precedence).
        Artist: up to 4 album covers (`mosaic` with 2-4 images, `cover` with 1). No picture:
        `placeholder` with an empty `images`. The placeholder is always given (fallback when an
        image fails to load). Pictures are shown in the app only (feature 005).
      properties:
        kind:
          $ref: '#/components/schemas/FolderArtKind'
        images:
          type: array
          maxItems: 4
          items:
            $ref: '#/components/schemas/ArtImage'
        placeholder:
          $ref: '#/components/schemas/ArtPlaceholder'
    LibraryFolder:
      type: object
      additionalProperties: false
      required: [id, level, name, nameSource, year, counts, sizeBytes, latestAt, art, trackIds]
      properties:
        id:
          $ref: '#/components/schemas/FolderId'
        level:
          $ref: '#/components/schemas/FolderLevel'
        name:
          type: string
          minLength: 1
          maxLength: 200
          description: Display name (band info spelling when any item was filed from a match, else the most used spelling).
        nameSource:
          $ref: '#/components/schemas/PlacementSource'
        year:
          type: [integer, 'null']
          minimum: 1000
          maximum: 2999
          description: Album folders only (first release year from band info); null otherwise.
        counts:
          $ref: '#/components/schemas/FolderCounts'
        sizeBytes:
          type: integer
          minimum: 0
        latestAt:
          type: string
          format: date-time
          description: '`createdAt` of the newest item inside.'
        art:
          $ref: '#/components/schemas/FolderArt'
        trackIds:
          type: array
          maxItems: 10
          description: Song folders only - existing tracks whose items are inside (to open the track or its mixer); empty otherwise.
          items:
            type: string
            format: uuid
    LibraryFolderView:
      type: object
      additionalProperties: false
      required: [revision, folder, breadcrumb, children, childrenTotal, items, totalItems, totalSizeBytes, pendingFiling]
      properties:
        revision:
          type: string
          pattern: '^[0-9a-f]{16}$'
        folder:
          oneOf:
            - $ref: '#/components/schemas/LibraryFolder'
            - type: 'null'
          description: Null at the root.
        breadcrumb:
          type: array
          maxItems: 3
          description: Parent folders from the artist down, excluding the folder itself and the root.
          items:
            $ref: '#/components/schemas/FolderRef'
        children:
          type: array
          maxItems: 500
          description: Child folders (artists at the root, albums in an artist, songs in an album); empty for a song.
          items:
            $ref: '#/components/schemas/LibraryFolder'
        childrenTotal:
          type: integer
          minimum: 0
        items:
          type: array
          maxItems: 500
          description: Song level only - its items in instrument order (standard stems, detail stems, mixes, sheet music, generated takes), then newest first.
          items:
            $ref: '#/components/schemas/Asset'
        totalItems:
          type: integer
          minimum: 0
        totalSizeBytes:
          type: integer
          minimum: 0
        pendingFiling:
          type: integer
          minimum: 0
          description: Items not filed yet by the start-up step (the UI shows "Sorting your library").
    SearchField:
      type: string
      enum: [artist, album, song, name, instrument]
    Highlight:
      type: object
      additionalProperties: false
      required: [field, start, length]
      properties:
        field:
          $ref: '#/components/schemas/SearchField'
        start:
          type: integer
          minimum: 0
          description: UTF-16 offset in the displayed text of the field (folder name, item name, or the instrument label).
        length:
          type: integer
          minimum: 1
        label:
          type: [string, 'null']
          maxLength: 60
          description: For `instrument` - the label the offsets refer to (e.g. "Snare").
    FolderHit:
      type: object
      additionalProperties: false
      required: [folder, path, highlights]
      properties:
        folder:
          $ref: '#/components/schemas/LibraryFolder'
        path:
          type: array
          maxItems: 2
          description: Parent folders (artist for an album; artist and album for a song).
          items:
            $ref: '#/components/schemas/FolderRef'
        highlights:
          type: array
          maxItems: 32
          items:
            $ref: '#/components/schemas/Highlight'
    ItemHit:
      type: object
      additionalProperties: false
      required: [asset, path, highlights, matchedInstruments]
      properties:
        asset:
          $ref: '#/components/schemas/Asset'
        path:
          type: array
          minItems: 3
          maxItems: 3
          description: Artist, album and song folder of the item.
          items:
            $ref: '#/components/schemas/FolderRef'
        highlights:
          type: array
          maxItems: 32
          items:
            $ref: '#/components/schemas/Highlight'
        matchedInstruments:
          type: array
          maxItems: 8
          description: Instrument labels that matched a word (e.g. ["Snare"]).
          items:
            type: string
            maxLength: 60
    SearchTotals:
      type: object
      additionalProperties: false
      required: [artists, albums, songs, items]
      properties:
        artists:
          type: integer
          minimum: 0
        albums:
          type: integer
          minimum: 0
        songs:
          type: integer
          minimum: 0
        items:
          type: integer
          minimum: 0
    LibrarySearchResult:
      type: object
      additionalProperties: false
      required: [query, tokens, revision, artists, albums, songs, items, totals]
      properties:
        query:
          type: string
          maxLength: 100
          description: The text that was searched (trimmed, cut to 100 characters).
        tokens:
          type: array
          minItems: 1
          maxItems: 8
          description: The folded words that were matched.
          items:
            type: string
        revision:
          type: string
          pattern: '^[0-9a-f]{16}$'
        artists:
          type: array
          maxItems: 200
          items:
            $ref: '#/components/schemas/FolderHit'
        albums:
          type: array
          maxItems: 200
          items:
            $ref: '#/components/schemas/FolderHit'
        songs:
          type: array
          maxItems: 200
          items:
            $ref: '#/components/schemas/FolderHit'
        items:
          type: array
          maxItems: 200
          items:
            $ref: '#/components/schemas/ItemHit'
        totals:
          $ref: '#/components/schemas/SearchTotals'
    LibraryName:
      type: [string, 'null']
      minLength: 1
      maxLength: 200
      description: A user name for filing (trimmed, no control characters); null = automatic.
    LibraryInfoRequest:
      type: object
      additionalProperties: false
      required: [artist, album, song]
      properties:
        artist:
          $ref: '#/components/schemas/LibraryName'
        album:
          $ref: '#/components/schemas/LibraryName'
        song:
          $ref: '#/components/schemas/LibraryName'
    LibraryInfoLevel:
      type: object
      additionalProperties: false
      required: [value, effective, source, automatic]
      properties:
        value:
          type: [string, 'null']
          maxLength: 200
          description: The name the user set at this scope (track or item); null = automatic.
        effective:
          type: string
          minLength: 1
          maxLength: 200
          description: The name used for filing now.
        source:
          $ref: '#/components/schemas/PlacementSource'
        automatic:
          type: string
          minLength: 1
          maxLength: 200
          description: The name automatic filing would use at this scope (shown next to the "Automatic" box).
    LibraryInfoState:
      type: object
      additionalProperties: false
      required: [artist, album, song, placement, movedItems]
      properties:
        artist:
          $ref: '#/components/schemas/LibraryInfoLevel'
        album:
          $ref: '#/components/schemas/LibraryInfoLevel'
        song:
          $ref: '#/components/schemas/LibraryInfoLevel'
        placement:
          oneOf:
            - $ref: '#/components/schemas/Placement'
            - type: 'null'
          description: The item's placement (item scope); null for a track.
        movedItems:
          type: integer
          minimum: 0
          description: Items that changed folder (0 for GET).
    PlacementLevel:
      type: object
      additionalProperties: false
      required: [folderId, name, source]
      properties:
        folderId:
          $ref: '#/components/schemas/FolderId'
        name:
          type: string
          minLength: 1
          maxLength: 200
          description: The name this item is filed under (the folder may display another spelling of the same key).
        source:
          $ref: '#/components/schemas/PlacementSource'
    Placement:
      type: object
      additionalProperties: false
      required: [artist, album, song, year, filed]
      description: Where a library item is filed (1.22.0).
      properties:
        artist:
          $ref: '#/components/schemas/PlacementLevel'
        album:
          $ref: '#/components/schemas/PlacementLevel'
        song:
          $ref: '#/components/schemas/PlacementLevel'
        year:
          type: [integer, 'null']
          minimum: 1000
          maximum: 2999
        filed:
          type: boolean
          description: False only until the start-up step filed an older item; the names are then the automatic preview.
    AssistProblem:
      description: Problem details of the lyric assistant with its extension members.
      allOf:
        - $ref: '#/components/schemas/ProblemDetails'
        - type: object
          required: [code]
          properties:
            code:
              type: string
              enum: [revision-conflict, language-unsupported, not-own-lyrics, assist-active, model-unavailable, claude-notice-required, overlapping-suggestions, suggestion-not-open, nothing-to-undo, undo-blocked-by-edit, override-not-applicable, statement-outdated]
            currentRevision:
              type: [integer, 'null']
            matchedTrackTitle:
              type: [string, 'null']
              maxLength: 200
            matchedTrackId:
              type: [string, 'null']
              format: uuid
              description: '`not-own-lyrics`: the first matching track not covered by an override.'
            overridable:
              type: [boolean, 'null']
              description: '`not-own-lyrics`: true; the editor offers the own-work confirmation (owner decision Q1).'
            activeAssistId:
              type: [string, 'null']
              format: uuid
            reason:
              type: [string, 'null']
              maxLength: 500
            fix:
              type: [string, 'null']
              maxLength: 500
            suggestionIds:
              type: array
              maxItems: 100
              items:
                type: string
                format: uuid
            changedLines:
              type: [integer, 'null']
              minimum: 0
    AssistLanguage:
      type: string
      description: Languages of the assistant (a subset of 010 `LyricsLanguage`).
      enum: [nl, en]
    Sensitivity:
      type: string
      description: '`loose` = errors only; `balanced` (default) = errors and improvements; `strict` = also recognised licences as ideas.'
      enum: [loose, balanced, strict]
    AssistKind:
      type: string
      enum: [check, devices, alternatives, continue, titles]
    SuggestionCategory:
      type: string
      enum: [spelling, grammar, flow, licence, device, alternative, continuation, title]
    SuggestionType:
      type: string
      description: Closed list (data-model section 4).
      enum:
        - spelling.typo
        - spelling.unknown-word
        - spelling.capitalisation
        - grammar.agreement
        - grammar.verb-form
        - grammar.word-order
        - grammar.homophone
        - grammar.other
        - flow.stress
        - flow.awkward
        - flow.repetition
        - flow.clarity
        - flow.syllable-count
        - licence.elision
        - licence.inversion
        - licence.archaism
        - licence.sound-spelling
        - licence.slang
        - licence.code-switch
        - device.end-rhyme
        - device.internal-rhyme
        - device.assonance
        - device.alliteration
        - device.imagery
        - device.syllable-fit
        - device.rhythm
        - write.alternative
        - write.continuation
        - write.title
    SuggestionSeverity:
      type: string
      enum: [error, improvement, idea]
    SuggestionStatus:
      type: string
      enum: [open, accepted, rejected, intentional, stale, superseded]
    SuggestionSource:
      type: string
      enum: [dictionary, rules, model]
    SuggestionOperation:
      type: string
      enum: [replace, insertAfter, setTitle, none]
    AssistStatus:
      type: string
      enum: [queued, running, completed, failed, cancelled]
    LayerInfo:
      type: object
      additionalProperties: false
      required: [layer, name, available]
      properties:
        layer:
          type: string
          enum: [dictionary, rules, model]
        name:
          type: string
          maxLength: 100
          description: e.g. "OpenTaal (nl)", "SCOWL + CMUdict (en)", "qwen3.5:9b (local)", "Claude (claude-opus-5-5)".
        available:
          type: boolean
        reason:
          type: [string, 'null']
          maxLength: 500
        fix:
          type: [string, 'null']
          maxLength: 500
    LyricAssistStatus:
      type: object
      additionalProperties: false
      required: [languages, dictionary, model, claudeNoticeRequired, assistActive]
      properties:
        languages:
          type: array
          items:
            $ref: '#/components/schemas/AssistLanguage'
        dictionary:
          $ref: '#/components/schemas/LayerInfo'
        model:
          type: object
          additionalProperties: false
          required: [backend, ready, usingFallback]
          properties:
            backend:
              type: string
              enum: [ollama, claude, none, fake]
            ready:
              type: boolean
            activeModel:
              type: [string, 'null']
            usingFallback:
              type: boolean
            reason:
              type: [string, 'null']
              maxLength: 500
            fix:
              type: [string, 'null']
              maxLength: 500
            qualityNote:
              type: [string, 'null']
              maxLength: 300
              description: Standing quality note, e.g. Dutch grammar with the local model (SC-001).
        claudeNoticeRequired:
          type: boolean
          description: True when the backend is `claude` and the current notice version is not acknowledged.
        assistActive:
          type: [string, 'null']
          format: uuid
          description: Id of the running assist, if any.
    LyricAssistSettings:
      type: object
      additionalProperties: false
      required: [claudeNoticeAcknowledged, claudeNoticeVersion, claudeNoticeText, ownWorkStatementVersion, ownWorkStatementText]
      properties:
        claudeNoticeAcknowledged:
          type: boolean
        claudeNoticeAcknowledgedAt:
          type: [string, 'null']
          format: date-time
        claudeNoticeVersion:
          type: string
          example: lyric-claude-notice.v1
        claudeNoticeText:
          type: string
          maxLength: 1000
        ownWorkStatementVersion:
          type: string
          example: own-work.v1
        ownWorkStatementText:
          type: string
          maxLength: 1000
    LyricAssistSettingsUpdate:
      type: object
      additionalProperties: false
      required: [acknowledgeClaudeNotice]
      properties:
        acknowledgeClaudeNotice:
          type: boolean
          description: true acknowledges the current notice version; false withdraws the acknowledgement.
    CreateLyricAssistRequest:
      type: object
      additionalProperties: false
      required: [kind, expectedRevision]
      properties:
        kind:
          $ref: '#/components/schemas/AssistKind'
        expectedRevision:
          type: integer
          minimum: 1
        categories:
          type: array
          description: '`check`: subset of spelling, grammar, flow, licence; `devices`: subset of device, licence; ignored for writing kinds.'
          maxItems: 5
          uniqueItems: true
          items:
            $ref: '#/components/schemas/SuggestionCategory'
        lineFrom:
          type: [integer, 'null']
          minimum: 1
        lineTo:
          type: [integer, 'null']
          minimum: 1
        count:
          type: [integer, 'null']
          minimum: 1
          maximum: 5
          description: alternatives 1-5 (3), continue 1-4 (2), titles 1-5 (5).
        instruction:
          type: [string, 'null']
          maxLength: 200
          description: Optional mood/theme hint for devices and writing kinds; imitation guard.
        origin:
          type: string
          enum: [editor, agent]
          default: editor
          description: Who starts the assist (`LyricAssistSummary.origin`). The editor omits it; the agent loopback sends `agent`.
        agentRunId:
          type: [string, 'null']
          format: uuid
          description: The agent run that starts the assist; only with `origin` = `agent` (otherwise 400 on `agentRunId`).
    Anchor:
      type: object
      additionalProperties: false
      required: [line, start, length, original]
      properties:
        line:
          type: integer
          minimum: 0
          description: 1-based line in the normalised text; 0 for titles.
        start:
          type: integer
          minimum: 0
          description: UTF-16 offset within the line.
        length:
          type: integer
          minimum: 0
        original:
          type: string
          maxLength: 400
    LyricSuggestion:
      type: object
      additionalProperties: false
      required: [suggestionId, assistId, category, type, severity, anchor, operation, explanation, source, status]
      properties:
        suggestionId:
          type: string
          format: uuid
        assistId:
          type: string
          format: uuid
        category:
          $ref: '#/components/schemas/SuggestionCategory'
        type:
          $ref: '#/components/schemas/SuggestionType'
        severity:
          $ref: '#/components/schemas/SuggestionSeverity'
        anchor:
          $ref: '#/components/schemas/Anchor'
        operation:
          $ref: '#/components/schemas/SuggestionOperation'
        proposal:
          type: [string, 'null']
          maxLength: 400
        groupId:
          type: [string, 'null']
          format: uuid
        explanation:
          type: string
          minLength: 1
          maxLength: 300
        source:
          $ref: '#/components/schemas/SuggestionSource'
        model:
          type: [string, 'null']
          maxLength: 100
        syllablesBefore:
          type: [integer, 'null']
          minimum: 0
        syllablesAfter:
          type: [integer, 'null']
          minimum: 0
        rhymeWith:
          oneOf:
            - type: 'null'
            - type: object
              additionalProperties: false
              required: [line, word]
              properties:
                line:
                  type: integer
                  minimum: 1
                word:
                  type: string
                  maxLength: 40
        status:
          $ref: '#/components/schemas/SuggestionStatus'
        decidedAt:
          type: [string, 'null']
          format: date-time
    CategoryCounts:
      type: object
      additionalProperties: false
      required: [spelling, grammar, flow, licence, device, alternative, continuation, title]
      properties:
        spelling:
          type: integer
          minimum: 0
        grammar:
          type: integer
          minimum: 0
        flow:
          type: integer
          minimum: 0
        licence:
          type: integer
          minimum: 0
        device:
          type: integer
          minimum: 0
        alternative:
          type: integer
          minimum: 0
        continuation:
          type: integer
          minimum: 0
        title:
          type: integer
          minimum: 0
    DiscardedCounts:
      type: object
      additionalProperties: false
      required: [invalidAnchor, invalidSchema, failedVerification, filtered, verbatim]
      properties:
        invalidAnchor:
          type: integer
          minimum: 0
        invalidSchema:
          type: integer
          minimum: 0
        failedVerification:
          type: integer
          minimum: 0
        filtered:
          type: integer
          minimum: 0
        verbatim:
          type: integer
          minimum: 0
          description: Withheld because too close to library lyrics (shown to every level).
    LyricAssistSummary:
      type: object
      description: |
        An assist without its suggestions. Not closed with `additionalProperties: false`, because `LyricAssist` extends it
        with `allOf` (a closed base would reject `suggestions`); `LyricAssist` is closed with `unevaluatedProperties: false`
        and responses carry exactly the listed members (pre-release fix, 023 Phase 0).
      required: [assistId, lyricsId, sheetRevision, kind, status, language, sensitivity, layers, usingFallback, blocksTotal, blocksDone, blocksSkipped, counts, discarded, origin, createdAt]
      properties:
        assistId:
          type: string
          format: uuid
        lyricsId:
          type: string
          format: uuid
        sheetRevision:
          type: integer
          minimum: 1
        kind:
          $ref: '#/components/schemas/AssistKind'
        status:
          $ref: '#/components/schemas/AssistStatus'
        language:
          $ref: '#/components/schemas/AssistLanguage'
        sensitivity:
          $ref: '#/components/schemas/Sensitivity'
        layers:
          type: array
          maxItems: 3
          items:
            $ref: '#/components/schemas/LayerInfo'
        backend:
          type: [string, 'null']
          enum: [ollama, claude, fake, null]
        model:
          type: [string, 'null']
          maxLength: 100
        usingFallback:
          type: boolean
        blocksTotal:
          type: integer
          minimum: 0
        blocksDone:
          type: integer
          minimum: 0
        blocksSkipped:
          type: integer
          minimum: 0
        counts:
          $ref: '#/components/schemas/CategoryCounts'
        discarded:
          $ref: '#/components/schemas/DiscardedCounts'
        usage:
          oneOf:
            - type: 'null'
            - $ref: '#/components/schemas/TokenUsage'
        origin:
          type: string
          enum: [editor, agent]
        agentRunId:
          type: [string, 'null']
          format: uuid
        failure:
          oneOf:
            - type: 'null'
            - type: object
              additionalProperties: false
              required: [code, message]
              properties:
                code:
                  type: string
                  enum: [backend-unavailable, budget-exhausted, refusal, timeout, interrupted, internal]
                message:
                  type: string
                  maxLength: 500
                fix:
                  type: [string, 'null']
                  maxLength: 500
        estimatedSeconds:
          type: [number, 'null']
          minimum: 0
        createdAt:
          type: string
          format: date-time
        startedAt:
          type: [string, 'null']
          format: date-time
        endedAt:
          type: [string, 'null']
          format: date-time
    LyricAssist:
      unevaluatedProperties: false
      allOf:
        - $ref: '#/components/schemas/LyricAssistSummary'
        - type: object
          required: [suggestions]
          properties:
            suggestions:
              type: array
              maxItems: 400
              items:
                $ref: '#/components/schemas/LyricSuggestion'
    LyricAssistEvent:
      description: '`data` of one SSE event; the SSE `event` field names the variant (data-model section 10), so the variants are listed with `anyOf` (selected by the event name, not by shape).'
      anyOf:
        - title: assist.started
          type: object
          required: [assistId, layers, usingFallback, blocksTotal]
          properties:
            assistId:
              type: string
              format: uuid
            layers:
              type: array
              items:
                $ref: '#/components/schemas/LayerInfo'
            backend:
              type: [string, 'null']
            model:
              type: [string, 'null']
            usingFallback:
              type: boolean
            blocksTotal:
              type: integer
              minimum: 0
            estimatedSeconds:
              type: [number, 'null']
        - title: assist.progress
          type: object
          required: [blocksDone, blocksSkipped, blocksTotal]
          properties:
            blocksDone:
              type: integer
              minimum: 0
            blocksSkipped:
              type: integer
              minimum: 0
            blocksTotal:
              type: integer
              minimum: 0
        - title: suggestion.added
          $ref: '#/components/schemas/LyricSuggestion'
        - title: assist.note
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              enum: [block-skipped, fallback-model, quality-note, verbatim-withheld]
            message:
              type: string
              maxLength: 300
        - title: usage.updated
          $ref: '#/components/schemas/TokenUsage'
        - title: assist.completed
          type: object
          required: [counts, discarded, durationMs]
          properties:
            counts:
              $ref: '#/components/schemas/CategoryCounts'
            discarded:
              $ref: '#/components/schemas/DiscardedCounts'
            durationMs:
              type: integer
              minimum: 0
        - title: assist.failed
          type: object
          required: [code, message]
          properties:
            code:
              type: string
            message:
              type: string
              maxLength: 500
            fix:
              type: [string, 'null']
        - title: assist.cancelled
          type: object
          required: [assistId]
          properties:
            assistId:
              type: string
              format: uuid
    SuggestionList:
      type: object
      additionalProperties: false
      required: [lyricsId, revision, suggestions]
      properties:
        lyricsId:
          type: string
          format: uuid
        revision:
          type: integer
          minimum: 1
        suggestions:
          type: array
          maxItems: 400
          items:
            $ref: '#/components/schemas/LyricSuggestion'
    SuggestionDecisionRequest:
      type: object
      additionalProperties: false
      required: [suggestionIds, expectedRevision]
      properties:
        suggestionIds:
          type: array
          minItems: 1
          maxItems: 100
          uniqueItems: true
          items:
            type: string
            format: uuid
        expectedRevision:
          type: integer
          minimum: 1
    RevisionRequest:
      type: object
      additionalProperties: false
      required: [expectedRevision]
      properties:
        expectedRevision:
          type: integer
          minimum: 1
    AssistedLine:
      type: object
      additionalProperties: false
      required: [line, suggestionId]
      properties:
        line:
          type: integer
          minimum: 1
        suggestionId:
          type: string
          format: uuid
    RhythmTarget:
      type: object
      additionalProperties: false
      required: [bpm, beatsPerBar, barsPerLine, syllablesPerBeat]
      properties:
        bpm:
          type: integer
          minimum: 40
          maximum: 220
        beatsPerBar:
          type: integer
          minimum: 2
          maximum: 7
        barsPerLine:
          type: integer
          minimum: 1
          maximum: 8
        syllablesPerBeat:
          type: number
          minimum: 0.5
          maximum: 4
          multipleOf: 0.25
    SheetAssistInfo:
      type: object
      additionalProperties: false
      description: Member `assist` of `LyricsSheet` at the merge.
      required: [sensitivity, openSuggestions, assistedLines, intentionalMarkCount, canUndo, ownWorkOverride]
      properties:
        sensitivity:
          $ref: '#/components/schemas/Sensitivity'
        rhythmTarget:
          oneOf:
            - type: 'null'
            - $ref: '#/components/schemas/RhythmTarget'
        openSuggestions:
          type: integer
          minimum: 0
        assistedLines:
          type: array
          maxItems: 400
          items:
            $ref: '#/components/schemas/AssistedLine'
        intentionalMarkCount:
          type: integer
          minimum: 0
        canUndo:
          type: boolean
          description: The newest revision is an accept action.
        ownWorkOverride:
          oneOf:
            - type: 'null'
            - $ref: '#/components/schemas/OwnWorkOverride'
    SheetAssistSettingsUpdate:
      type: object
      additionalProperties: false
      properties:
        sensitivity:
          $ref: '#/components/schemas/Sensitivity'
        rhythmTarget:
          oneOf:
            - type: 'null'
            - $ref: '#/components/schemas/RhythmTarget'
          description: null clears the target; absent keeps it.
    AcceptResult:
      type: object
      additionalProperties: false
      required: [lyricsId, revision, title, text, assist, applied, stale]
      properties:
        lyricsId:
          type: string
          format: uuid
        revision:
          type: integer
          minimum: 1
        title:
          type: string
          minLength: 1
          maxLength: 80
        text:
          type: string
          maxLength: 4096
        assist:
          $ref: '#/components/schemas/SheetAssistInfo'
        applied:
          type: array
          items:
            type: string
            format: uuid
        stale:
          type: array
          items:
            type: string
            format: uuid
        reopened:
          type: array
          description: Suggestions reopened by an undo or restore.
          items:
            type: string
            format: uuid
    OwnWorkConfirmRequest:
      type: object
      additionalProperties: false
      required: [matchedTrackId, confirmedBy, statementVersion, confirm]
      properties:
        matchedTrackId:
          type: string
          format: uuid
        confirmedBy:
          type: string
          minLength: 1
          maxLength: 80
          description: The typed name of the person confirming.
        statementVersion:
          type: string
          maxLength: 40
        confirm:
          type: boolean
          const: true
    OwnWorkOverride:
      type: object
      additionalProperties: false
      required: [statementVersion, confirmedBy, confirmedAt, matchedTrackId, matchedTrackTitle]
      properties:
        statementVersion:
          type: string
          maxLength: 40
        confirmedBy:
          type: string
          maxLength: 80
        confirmedAt:
          type: string
          format: date-time
        matchedTrackId:
          type: string
          format: uuid
        matchedTrackTitle:
          type: string
          maxLength: 200
    IntentionalScope:
      type: string
      enum: [word, phrase, line]
    IntentionalMarkInput:
      type: object
      additionalProperties: false
      required: [scope, text]
      properties:
        scope:
          $ref: '#/components/schemas/IntentionalScope'
        text:
          type: string
          minLength: 1
          maxLength: 400
          description: word 1-40 without spaces; phrase 1-200; line 1-400; must occur in the current sheet text.
        note:
          type: [string, 'null']
          maxLength: 120
    MarkSuggestionIntentionalRequest:
      type: object
      additionalProperties: false
      required: [scope, expectedRevision]
      properties:
        scope:
          $ref: '#/components/schemas/IntentionalScope'
          description: '`word`/`phrase` = the anchor text; `line` = the whole anchor line.'
        expectedRevision:
          type: integer
          minimum: 1
        note:
          type: [string, 'null']
          maxLength: 120
    IntentionalMark:
      type: object
      additionalProperties: false
      required: [markId, scope, text, inText, createdAt]
      properties:
        markId:
          type: string
          format: uuid
        scope:
          $ref: '#/components/schemas/IntentionalScope'
        text:
          type: string
          maxLength: 400
        note:
          type: [string, 'null']
          maxLength: 120
        inText:
          type: boolean
          description: The marked text currently occurs in the sheet.
        createdAt:
          type: string
          format: date-time
    LyricsRevisionSummary:
      type: object
      additionalProperties: false
      required: [revision, cause, createdAt]
      properties:
        revision:
          type: integer
          minimum: 1
        cause:
          type: string
          enum: [created, userSave, accept, undo]
        acceptGroupId:
          type: [string, 'null']
          format: uuid
        changedLines:
          type: integer
          minimum: 0
        createdAt:
          type: string
          format: date-time
    SyllableRequest:
      type: object
      additionalProperties: false
      required: [language, text]
      properties:
        language:
          $ref: '#/components/schemas/AssistLanguage'
        text:
          type: string
          minLength: 1
          maxLength: 65536
          description: Raw editor text; normalised like a 010 save (not stored).
        rhythmTarget:
          oneOf:
            - type: 'null'
            - $ref: '#/components/schemas/RhythmTarget'
    SyllableLine:
      type: object
      additionalProperties: false
      required: [line, syllables, isMarker, deviates]
      properties:
        line:
          type: integer
          minimum: 1
        syllables:
          type: integer
          minimum: 0
        isMarker:
          type: boolean
          description: Section marker or blank line (not counted).
        section:
          type: [string, 'null']
          maxLength: 40
        sectionMedian:
          type: [number, 'null']
        target:
          type: [integer, 'null']
        deviates:
          type: boolean
          description: More than 2 from the target, or from the section median when there is no target.
    SyllableReport:
      type: object
      additionalProperties: false
      required: [language, lines]
      properties:
        language:
          $ref: '#/components/schemas/AssistLanguage'
        lines:
          type: array
          maxItems: 4096
          items:
            $ref: '#/components/schemas/SyllableLine'
        targetDurationSeconds:
          type: [number, 'null']
          minimum: 0
        wordsPerSecond:
          type: [number, 'null']
          minimum: 0
          description: 010 density at the target duration; the UI warns above 4.0.
    Rhyme:
      type: object
      additionalProperties: false
      required: [word, kind, syllables]
      properties:
        word:
          type: string
          maxLength: 40
        kind:
          type: string
          enum: [perfect, near]
        syllables:
          type: integer
          minimum: 1
    RhymeResult:
      type: object
      additionalProperties: false
      required: [word, language, rhymes, source]
      properties:
        word:
          type: string
          maxLength: 40
        language:
          $ref: '#/components/schemas/AssistLanguage'
        rhymes:
          type: array
          maxItems: 60
          items:
            $ref: '#/components/schemas/Rhyme'
        source:
          type: string
          description: e.g. "CMU Pronouncing Dictionary" or "OpenTaal word list, spelling rhyme rules".
          maxLength: 100
    LyricWordInput:
      type: object
      additionalProperties: false
      required: [language, word]
      properties:
        language:
          $ref: '#/components/schemas/AssistLanguage'
        word:
          type: string
          minLength: 1
          maxLength: 40
          pattern: '^\S+$'
    LyricWord:
      type: object
      additionalProperties: false
      required: [wordId, language, word, createdAt]
      properties:
        wordId:
          type: string
          format: uuid
        language:
          $ref: '#/components/schemas/AssistLanguage'
        word:
          type: string
          maxLength: 40
        createdAt:
          type: string
          format: date-time
    LanguageGuessRequest:
      type: object
      additionalProperties: false
      required: [text]
      properties:
        text:
          type: string
          minLength: 1
          maxLength: 65536
    LanguageGuess:
      type: object
      additionalProperties: false
      required: [confidence]
      properties:
        language:
          oneOf:
            - type: 'null'
            - $ref: '#/components/schemas/AssistLanguage'
          description: null when neither language reaches 60 % dictionary hits.
        confidence:
          type: number
          minimum: 0
          maximum: 1
  responses:
    ValidationProblem:
      description: Invalid input; `errors` names the offending fields with a message the user can act on.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ValidationProblemDetails'
          example:
            type: https://tools.ietf.org/html/rfc9110#section-15.5.1
            title: One or more validation errors occurred.
            status: 400
            errors:
              url:
                - Only YouTube video links and Spotify track links are supported. Playlists and albums are not.
    PayloadTooLarge:
      description: Upload larger than 200 MiB (209,715,200 bytes).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          example:
            title: File too large
            status: 413
            detail: The file is larger than 200 MiB (209,715,200 bytes).
    UnsupportedMediaType:
      description: Upload is not an .mp3, .wav or .flac file.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          example:
            title: Unsupported file type
            status: 415
            detail: Only MP3, WAV and FLAC files are supported.
    NotFound:
      description: Unknown track, stem or mix.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          example:
            title: Not found
            status: 404
            detail: Track 0b7e4c1a-9d2f-4e8b-a1c3-5f6e7d8c9b0a does not exist.
    Conflict:
      description: The operation is not allowed in the current state (e.g. retry of a non-failed track).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          example:
            title: Track is not failed
            status: 409
            detail: Only failed tracks can be retried.
    MixNameTaken:
      description: Another mix of the same track already has this name.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          example:
            title: Mix name taken
            status: 409
            detail: A mix named "Guitar practice" already exists for this track.
    WorkerUnavailable:
      description: The processing service cannot be reached; no track or job was created.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          example:
            title: Processing service unavailable
            status: 503
            detail: The processing service is unavailable. Existing tracks and mixes remain usable.
    StemFile:
      description: Whole stem file.
      headers:
        Accept-Ranges:
          $ref: '#/components/headers/AcceptRanges'
        ETag:
          $ref: '#/components/headers/ETag'
        Last-Modified:
          $ref: '#/components/headers/LastModified'
      content:
        audio/flac:
          schema:
            type: string
            contentMediaType: audio/flac
    StemFilePartial:
      description: Requested byte range of the stem file.
      headers:
        Content-Range:
          schema:
            type: string
          example: bytes 0-1048575/23456789
        Accept-Ranges:
          $ref: '#/components/headers/AcceptRanges'
        ETag:
          $ref: '#/components/headers/ETag'
        Last-Modified:
          $ref: '#/components/headers/LastModified'
      content:
        audio/flac:
          schema:
            type: string
            contentMediaType: audio/flac
    StemNotModified:
      description: Not modified (`If-None-Match` or `If-Modified-Since` matched); no body.
      headers:
        ETag:
          $ref: '#/components/headers/ETag'
        Last-Modified:
          $ref: '#/components/headers/LastModified'
    RangeNotSatisfiable:
      description: Range not satisfiable; no body.
      headers:
        Content-Range:
          description: '`bytes */<file size>` (RFC 9110 section 14.4).'
          schema:
            type: string
          example: bytes */23456789
    UnprocessableRequest:
      description: The request is well-formed but a value is out of its limits; `errors` names the fields.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ValidationProblemDetails'
          example:
            type: https://tools.ietf.org/html/rfc9110#section-15.5.21
            title: One or more validation errors occurred.
            status: 422
            errors:
              title:
                - The title must be 1 to 500 characters long.
    ExportConflict:
      description: |
        `track-not-ready` (the track is not completed), `insufficient-disk-space` (less than
        `StemStudio:MinFreeDiskBytes` free on the data drive) or `source-unavailable` (a stem
        file of the source is missing; the worker rejected the input).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          examples:
            trackNotReady:
              value:
                type: track-not-ready
                title: Track not ready
                status: 409
                detail: The track is still being processed; export it when it is completed.
            insufficientDiskSpace:
              value:
                type: insufficient-disk-space
                title: Not enough disk space
                status: 409
                detail: Less than 1 GiB is free on the data drive; delete items or free space first.
            sourceUnavailable:
              value:
                type: source-unavailable
                title: Source unavailable
                status: 409
                detail: A stem file of this track is missing; separate the track again and retry.
    ExportUnprocessable:
      description: |
        A value is outside its limits (`errors` names the field, e.g. `channels[2]`, `range`,
        `format`), or `nothing-to-export` (no channel would be audible).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          examples:
            validation:
              value:
                type: https://tools.ietf.org/html/rfc9110#section-15.5.21
                title: One or more validation errors occurred.
                status: 422
                errors:
                  channels[2]:
                    - The track has no detail stem drums.kick.
            nothingToExport:
              value:
                type: nothing-to-export
                title: Nothing to export
                status: 422
                detail: 'Nothing to export: no channel is audible'
    LyricsDocument:
      description: The track's lyrics (never cached).
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Lyrics'
          examples:
            found:
              $ref: '#/components/examples/FoundLyrics'
            alignPending:
              $ref: '#/components/examples/AlignPendingLyrics'
            aligning:
              $ref: '#/components/examples/AligningLyrics'
            notFound:
              $ref: '#/components/examples/NotFoundLyrics'
            removed:
              $ref: '#/components/examples/RemovedLyrics'
    LyricsConflict:
      description: |
        The lyrics are in a state that does not allow the operation: `lyrics-busy` (a search or
        an alignment is running), `lyrics-no-text` (there is no text to align), `lyrics-timed`
        (align on lyrics that already have word timing), `lyrics-not-aligning` (cancel without a
        running alignment), `lyrics-align-rejected` (the worker refused the alignment at
        creation, e.g. the vocal stem is no longer available; `detail` is the worker's text),
        `track-not-ready` (align before the standard separation is completed) or `lyrics-none`
        (there are no lyrics to offset).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          examples:
            aligning:
              value:
                type: lyrics-busy
                title: Lyrics are being processed
                status: 409
                detail: The lyrics are being searched or aligned; try again when it has finished.
            noText:
              value:
                type: lyrics-no-text
                title: No lyrics text
                status: 409
                detail: There is no lyrics text to align; enter the lyrics first.
            noLyrics:
              value:
                type: lyrics-none
                title: No lyrics
                status: 409
                detail: This track has no lyrics.
            alreadyTimed:
              value:
                type: lyrics-timed
                title: Lyrics already timed
                status: 409
                detail: These lyrics already have word timing.
            notAligning:
              value:
                type: lyrics-not-aligning
                title: No alignment running
                status: 409
                detail: No alignment of these lyrics is running.
            alignRejected:
              value:
                type: lyrics-align-rejected
                title: Alignment rejected
                status: 409
                detail: The vocal stem of this track is no longer available.
            trackNotReady:
              value:
                type: track-not-ready
                title: Track not ready
                status: 409
                detail: The track is still being processed; align the lyrics when it is completed.
    ScoreConflict:
      description: |
        `track-not-ready` (the track is not completed), `drums-not-split` (the `drums` profile
        needs the drum detail stems; split the drums first), `insufficient-disk-space` or
        `source-unavailable` (the worker rejected the input; `detail` is the worker's text).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          examples:
            trackNotReady:
              value:
                type: track-not-ready
                title: Track not ready
                status: 409
                detail: The track is still being processed; create sheet music when it is completed.
            drumsNotSplit:
              value:
                type: drums-not-split
                title: Drums not split
                status: 409
                detail: Drum notation needs the drum detail stems; split the drums first.
            insufficientDiskSpace:
              value:
                type: insufficient-disk-space
                title: Not enough disk space
                status: 409
                detail: Less than 1 GiB is free on the data drive; delete items or free space first.
            sourceUnavailable:
              value:
                type: source-unavailable
                title: Source unavailable
                status: 409
                detail: A stem file of this track is missing; separate the track again and retry.
    ScoreUnprocessable:
      description: |
        A value is outside its limits (`errors` names the field, e.g. `profile`, `range`,
        `keyOverride`), or `tempo-required` (the track has no reliable beat grid and no `tempo`
        was given).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          examples:
            validation:
              value:
                type: https://tools.ietf.org/html/rfc9110#section-15.5.21
                title: One or more validation errors occurred.
                status: 422
                errors:
                  profile:
                    - The profile drums needs the drums channel.
            tempoRequired:
              value:
                type: tempo-required
                title: Tempo required
                status: 422
                detail: The beat grid of this track is not reliable; enter the tempo, the beats per bar and the first downbeat.
    StyleValidationProblem:
      description: Invalid style (field limits) or an artist-imitation hit (problem type `imitation`).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ValidationProblemDetails'
          examples:
            imitation:
              value:
                type: imitation
                title: Styles cannot imitate an artist.
                status: 400
                errors:
                  description:
                    - Describe the music (genre, instruments, mood) instead of naming an artist or saying "sounds like".
            limits:
              value:
                type: https://tools.ietf.org/html/rfc9110#section-15.5.1
                title: One or more validation errors occurred.
                status: 400
                errors:
                  name:
                    - The name must be 1 to 60 characters.
    StyleNameTaken:
      description: Another style already has this name (case-insensitive).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          example:
            type: style-name-taken
            title: Style name taken
            status: 409
            detail: A style named "Jazz trio" already exists.
    PresetReadOnly:
      description: Presets cannot be changed or deleted (duplicate them instead).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          example:
            type: preset-read-only
            title: Preset is read-only
            status: 403
            detail: Presets cannot be changed. Duplicate the preset to make your own version.
    GenerationConflict:
      description: |
        `track-not-ready` (the track is not completed), `not-installed` (no generator),
        `gpu-required` (the generator has no usable GPU; `detail` is the reason),
        `generation-not-completed` (import of a take before completion) or
        `generation-not-retryable` (retry of a generation that is not failed or cancelled).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          examples:
            trackNotReady:
              value:
                type: track-not-ready
                title: Track not ready
                status: 409
                detail: The track is still being processed; restyle it when it is completed.
            notInstalled:
              value:
                type: not-installed
                title: Generation not installed
                status: 409
                detail: The generator service is not installed. See the help page "Generation needs a GPU".
            gpuRequired:
              value:
                type: gpu-required
                title: GPU required
                status: 409
                detail: No NVIDIA GPU is available to the generator (CUDA is not available).
            notCompleted:
              value:
                type: generation-not-completed
                title: Generation not completed
                status: 409
                detail: Only takes of a completed generation can be imported.
            notRetryable:
              value:
                type: generation-not-retryable
                title: Generation cannot be retried
                status: 409
                detail: Only failed or cancelled generations can be retried.
    GeneratorUnavailable:
      description: The generator was reachable for the status check but refused or dropped the upload; no generation was created.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          example:
            type: generator-unavailable
            title: Generator unavailable
            status: 503
            detail: The generator service could not be reached. Try again in a moment.
    AudioFile:
      description: The whole audio file.
      headers:
        Accept-Ranges:
          $ref: '#/components/headers/AcceptRanges'
        ETag:
          $ref: '#/components/headers/ETag'
        Last-Modified:
          $ref: '#/components/headers/LastModified'
      content:
        audio/flac:
          schema:
            type: string
            contentMediaType: audio/flac
    AudioFilePart:
      description: The requested byte range of the audio file.
      headers:
        Content-Range:
          schema:
            type: string
          example: bytes 0-1048575/9012345
        Accept-Ranges:
          $ref: '#/components/headers/AcceptRanges'
        ETag:
          $ref: '#/components/headers/ETag'
        Last-Modified:
          $ref: '#/components/headers/LastModified'
      content:
        audio/flac:
          schema:
            type: string
            contentMediaType: audio/flac
    AudioNotModified:
      description: Not modified; no body.
      headers:
        ETag:
          $ref: '#/components/headers/ETag'
        Last-Modified:
          $ref: '#/components/headers/LastModified'
    LyricsTooLarge:
      description: The lyrics file is larger than 64 KiB (65,536 bytes).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          example:
            title: File too large
            status: 413
            detail: Lyrics files can be at most 64 KiB (65,536 bytes).
    LyricsUnsupportedMediaType:
      description: The file is not .txt, .lrc or .md.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          example:
            title: Unsupported file type
            status: 415
            detail: Only .txt, .lrc and .md lyrics files are supported.
    ConsentProblem:
      description: Consent missing (`consent-required`), an outdated statement (`consent-outdated`) or other invalid fields (`errors`). Nothing was stored.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ValidationProblemDetails'
          examples:
            consentRequired:
              value:
                type: consent-required
                title: Consent required
                status: 400
                errors:
                  consentConfirmed:
                    - Confirm that this is your own voice and that you agree to the statement.
            consentOutdated:
              value:
                type: consent-outdated
                title: Consent statement changed
                status: 400
                errors:
                  consentStatementVersion:
                    - The consent statement was updated; read and confirm the current version.
    VoiceConflict:
      description: |
        `voice-name-taken`, `voice-not-installed` (no singer service), `voice-unavailable`
        (the singer has no usable GPU; `detail` is the reason; sample checks still work),
        `no-vocals` (the take is not a completed song take with an AI voice).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          examples:
            nameTaken:
              value:
                type: voice-name-taken
                title: Voice name taken
                status: 409
                detail: A voice profile named "My voice" already exists.
            notInstalled:
              value:
                type: voice-not-installed
                title: Voice features not installed
                status: 409
                detail: The singer service is not installed.
            noVocals:
              value:
                type: no-vocals
                title: No AI vocal to convert
                status: 409
                detail: Only completed song takes with an AI voice can be converted.
    SampleTooLarge:
      description: The sample is larger than 20 MiB (20,971,520 bytes).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          example:
            title: File too large
            status: 413
            detail: The recording can be at most 20 MiB (20,971,520 bytes).
    SampleRejected:
      description: The sample cannot be used (`too-short`, `too-long`, `unvoiced` from the singer's check; `library-audio` byte-identical to audio stored by StemStudio). Nothing was stored.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          examples:
            tooShort:
              value:
                type: too-short
                title: Recording too short
                status: 422
                detail: The recording is 6.2 s long; record 10 to 60 seconds of your own singing.
            unvoiced:
              value:
                type: unvoiced
                title: Not enough singing
                status: 422
                detail: The recording contains too little singing (12 % voiced, at least 50 % is needed).
            libraryAudio:
              value:
                type: library-audio
                title: Not an own recording
                status: 422
                detail: This file is audio from your StemStudio library. Record or upload your own voice instead.
    AgentConflict:
      description: |
        Conflict with the current state; `type` ends in one of `claude-not-configured`,
        `run-active`, `approval-not-pending`, `arguments-changed`, `ui-result-not-expected`,
        `nothing-to-undo`, `run-ended`.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          example:
            type: https://stemstudio.local/problems/run-active
            title: A command is already running
            status: 409
            detail: Wait for the current command to finish or cancel it.
    AgentUnprocessable:
      description: |
        Well-formed but not acceptable; `type` ends in `notice-not-acknowledged`,
        `model-unavailable` or `validation` (with `errors`).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          example:
            type: https://stemstudio.local/problems/model-unavailable
            title: Model not available
            status: 422
            detail: qwen3.5:9b is not installed in Ollama. Run "ollama pull qwen3.5:9b" (6.6 GB).
    InvalidBody:
      description: The body is not a JSON object with `apiKey` (`invalid-body`); fixed text, never quotes the body.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          example:
            type: https://stemstudio.local/problems/invalid-body
            title: Invalid request body
            status: 400
            detail: Send a JSON object with the field apiKey.
    LocalOnly:
      description: Refused because the request does not come from the computer StemStudio runs on (`local-only`).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          example:
            type: https://stemstudio.local/problems/local-only
            title: Only on this computer
            status: 403
            detail: The Claude key can only be entered on the computer StemStudio runs on.
    ClaudeKeyTooLarge:
      description: The body is larger than 1 KiB (named apart from the upload `PayloadTooLarge` of 1.0.0).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          example:
            title: Request body too large
            status: 413
    ClaudeKeyInvalid:
      description: |
        The value is not a well-formed Claude API key (`claude-key-invalid`); the extension member
        `reason` says which rule failed. The value is never repeated.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ClaudeKeyInvalidProblem'
          example:
            type: https://stemstudio.local/problems/claude-key-invalid
            title: Not a Claude API key
            status: 422
            detail: The key must start with sk-ant- and be 40-256 characters (letters, digits, - and _).
            reason: prefix
    KeyStoreUnavailable:
      description: The key ring directory is missing, not writable or inside the library, backups, app or a repository (`key-store-unavailable`). The environment variable still works.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          example:
            type: https://stemstudio.local/problems/key-store-unavailable
            title: Key store not available
            status: 503
            detail: "The key store is not available: the key ring directory is missing or not writable. The ANTHROPIC_API_KEY environment variable still works."
    LibraryJobRunning:
      description: '`library-job-running`: another library job is active.'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          example:
            type: https://stemstudio.local/problems/library-job-running
            title: A library job is running
            status: 409
            detail: A backup is running; try again when it has finished.
    Maintenance:
      description: '`library-maintenance`: a restore is switching the library.'
      headers:
        Retry-After:
          schema:
            type: integer
          example: 5
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          example:
            type: https://stemstudio.local/problems/library-maintenance
            title: Library is being restored
            status: 503
            detail: StemStudio is switching to the restored library; this takes a few seconds.
    BackupRunning:
      description: '`backup-running`: a backup is running; operations that delete or replace library files wait until it has finished (1.12.0 write gate).'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          example:
            type: https://stemstudio.local/problems/backup-running
            title: A backup is running
            status: 409
            detail: A backup is running; try again when it has finished.
    FolderNotFound:
      description: The folder id is well-formed but no item is filed in it (any more).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          example:
            type: https://stemstudio.local/problems/folder-not-found
            title: This folder is empty now
            status: 404
            detail: Its items were moved or deleted.
    LibraryQueryInvalid:
      description: Invalid folder id, sort, filter, paging or search text (`errors` names the parameter).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ValidationProblemDetails'
          example:
            type: https://stemstudio.local/problems/library-query-invalid
            title: One or more validation errors occurred.
            status: 422
            errors:
              q:
                - Type at least one letter or digit.
    LibraryInfoInvalid:
      description: A name is empty after trimming, longer than 200 characters or contains control characters.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ValidationProblemDetails'
          example:
            title: One or more validation errors occurred.
            status: 400
            errors:
              album:
                - Use 1 to 200 characters, or leave it automatic.
    NotFileable:
      description: The item is a recorded play-along take (015); it lives with its track and is not filed.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          example:
            type: https://stemstudio.local/problems/not-fileable
            title: Recorded takes are not filed
            status: 409
            detail: Recorded takes stay with their track.
    ValidationOrImitation:
      description: Invalid input (`errors` present), or `imitation` - the instruction names an artist or asks to write like someone (ADR-018 D8, ADR-037 D7).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          example:
            type: https://stemstudio.local/problems/imitation
            title: Writing like a real artist is not supported. Describe a mood, theme or style instead.
            status: 400
    AssistConflict:
      description: |
        `revision-conflict` (the sheet changed; reload), `language-unsupported` (not `nl`/`en`),
        `not-own-lyrics` (matches library track lyrics; `matchedTrackTitle`), `assist-active`
        (`activeAssistId`), `model-unavailable` (`reason`, `fix`), `claude-notice-required`.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/AssistProblem'
          example:
            type: https://stemstudio.local/problems/not-own-lyrics
            title: This text matches the lyrics of "Hero of the Day". The assistant works on your own lyrics only.
            status: 409
            code: not-own-lyrics
            matchedTrackTitle: Hero of the Day
            matchedTrackId: 7d1e2f3a-4b5c-4d6e-8f70-91a2b3c4d5e6
            overridable: true
    AssistEnded:
      description: '`assist-ended` - the assist is already completed, failed or cancelled.'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    SheetConflict:
      description: '`revision-conflict` (the sheet changed since `expectedRevision`), `overlapping-suggestions` (`suggestionIds`), `suggestion-not-open` (`suggestionIds`).'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/AssistProblem'
    UndoConflict:
      description: '`revision-conflict`, `nothing-to-undo` (the newest revision is not an accept), `undo-blocked-by-edit` (`changedLines`: user edits were saved after the accept).'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/AssistProblem'
    OverrideConflict:
      description: '`override-not-applicable` - the sheet does not currently match `matchedTrackId` (or matches nothing); `revision-conflict` is not used here. `statement-outdated` - `statementVersion` is not the current one.'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/AssistProblem'
    TooLong:
      description: '`too-long` - the result would exceed 4,096 characters after normalisation.'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    LanguageUnsupported:
      description: '`language-unsupported` - the sheet language is not `nl` or `en`.'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/AssistProblem'
    MarkLimit:
      description: '`mark-limit` - the sheet already has 200 intentional marks.'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    WordLimit:
      description: '`word-limit` - the personal word list of this language has 5,000 words.'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
