# Lint configuration for the StemStudio OpenAPI 3.1 contracts of feature 023 (lyric writing assistant).
# Run from the repo root (Phase 0: full document 11 warnings, delta 2 warnings, 0 errors):
#   npx @redocly/cli@2.78.0 lint --config specs/023-lyric-writing-assistant/contracts/redocly.yaml \
#     specs/023-lyric-writing-assistant/contracts/backend-api.openapi.yaml \
#     specs/023-lyric-writing-assistant/contracts/backend-api.delta.openapi.yaml
# Model output schema: python -I specs/023-lyric-writing-assistant/contracts/check_output_schema.py
extends:
  - recommended
rules:
  # GET /api/lyric-assist/status has no client-error cases, nor do the 9 operations inherited from 1.11.0
  # (health, device, tracks, generation status, ...); every other operation lists its 4XX responses.
  operation-4xx-response: warn
  no-server-example.com: off
  # LyricAssistEvent documents the SSE payloads and is referenced by no operation (text/event-stream is a string).
  no-unused-components: warn
