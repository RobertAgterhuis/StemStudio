openapi: 3.1.0
info:
  title: StemStudio Worker API
  version: 1.6.0
  summary: Internal job API of the Python processing worker (ingest, Demucs separation, beat analysis, detail separation, artwork and metadata lookups, export rendering, lyrics lookup and alignment, sheet music transcription).
  description: |
    Called only by the StemStudio backend (never by the browser). Jobs run one at a time in a FIFO
    queue. The backend polls `GET /v1/jobs/{jobId}` about once per second and, when the job is
    `completed`, downloads the result and every stem.

    * JSON uses camelCase. Pydantic models: `worker/src/stemstudio_worker/schemas.py`.
    * Errors are RFC 9457 problem details (`application/problem+json`).
    * Job states and progress ranges: see `specs/001-stemstudio-mvp/data-model.md`.
    * Changelog: 1.0.1 (non-breaking) - explicit field limits, model -> stem set, URL vectors,
      200 MiB in bytes. 1.1.0 (additive, feature 002) - detail jobs (`/v1/detail-jobs/...`):
      second-stage separation of the standard stems of a completed job, with cancel, per-parent
      outcomes and detail stem files. Standard jobs always run before detail work (priority
      queue); a running detail job yields to a waiting standard job after its current parent step.
      1.2.0 (additive, feature 003) - GPU acceleration: `Health.deviceInfo` (active device found
      by the start-up probe, with the reason when the GPU is not used) and a `device` record on
      `Job` and `DetailJob` (GPU or CPU, CPU fallback and its reason). See ADR-012.
      1.3.0 (additive, feature 005) - song artwork and band info: `Job.artwork` (source picture
      captured in the new stage "Saving cover" between "Downloading audio" and "Converting
      audio", progress weight 0) with `GET /v1/jobs/{jobId}/artwork/{variant}`;
      `SourceMetadata.album/isrc/durationSeconds/lookupTitle/lookupArtist`; metadata jobs
      (`/v1/metadata-jobs/...`, a network-only lane that never waits behind a separation:
      MusicBrainz, Cover Art Archive, Wikidata, Wikipedia); `POST /v1/artwork` normalises a user
      picture; `Health.onlineLookups`. See ADR-014.
      1.4.0 (additive, feature 007) - export rendering: render jobs (`/v1/render-jobs/...`) mix
      library files (stems, detail stems, assets; read-only mount `STEMSTUDIO_LIBRARY_DIR`) with
      gain, Web Audio pan law and master gain into FLAC, WAV or MP3 with clip protection, in a
      `render` lane that never waits behind a separation; `Health.library` and `Health.lanes`.
      See ADR-016.
      1.5.0 (additive, feature 006) - synced lyrics: lyrics jobs (`/v1/lyrics-jobs/...`):
      `mode: lookup` searches LRCLIB on the network lane of the metadata jobs and returns one
      normalised `TimedLyrics` document (word timing from the record, or interpolated from line
      timing); `mode: align` aligns plain text to the vocal stem with stable-ts + Whisper
      large-v3-turbo as a model step of the separation scheduler (priority standard > align >
      detail parent step, GPU policy of ADR-012); results are `no-store` and deleted after the
      backend copied them; `Health.lyricsAlignment`. See ADR-015.
      1.6.0 (additive, feature 008) - sheet music: transcription jobs
      (`/v1/transcription-jobs/...`) turn one library audio file (or the five drum detail stems)
      into PDF, MusicXML and MIDI per instrument profile (basic-pitch ONNX, the piano CRNN through
      the GPU policy, drum onsets; music21 notation on the beat grid; Verovio + CairoSVG
      engraving) in a `transcribe` lane that never waits behind a separation or a render;
      `Health.transcription` and `Health.lanes.transcribe`. See ADR-017.
    * Jobs are persisted as JSON files; after a restart, jobs that were not terminal are reported
      as `failed` with error "interrupted by restart".
  license:
    name: MIT
    identifier: MIT
servers:
  - url: http://worker:8000
    description: docker compose (internal network)
  - url: http://localhost:8000
    description: local development
security: []  # internal service on a private network; no authentication (spec Assumptions)
tags:
  - name: jobs
    description: Processing jobs, their results and stem files.
  - name: detail
    description: Detail (second-stage) separation of the standard stems of a completed job.
  - name: artwork
    description: Normalised pictures (600 px cover, 160 px thumbnail JPEGs) of jobs and user uploads (1.3.0).
  - name: metadata
    description: Metadata jobs - recording, album, cover and artist facts from open data services (1.3.0).
  - name: render
    description: Render jobs - mix library files into one audio file (1.4.0).
  - name: lyrics
    description: Lyrics jobs - LRCLIB lookup and alignment of lyrics text to the vocal stem (1.5.0).
  - name: transcription
    description: Transcription jobs - sheet music (PDF, MusicXML, MIDI) of library audio (1.6.0).
  - name: health
    description: Liveness.
paths:
  /health:
    get:
      tags: [health]
      operationId: getHealth
      summary: Liveness probe.
      responses:
        '200':
          description: Worker is up.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
              examples:
                cpu:
                  summary: Default CPU worker
                  value:
                    status: ok
                    separator: demucs
                    device: cpu
                    deviceInfo:
                      kind: cpu
                      name: null
                      computeCapability: null
                      totalMemoryMiB: null
                      freeMemoryMiB: null
                      reason: null
                    onlineLookups: true
                    library:
                      readable: true
                      reason: null
                    lanes:
                      render:
                        queued: 0
                        running: false
                      transcribe:
                        queued: 0
                        running: false
                    lyricsAlignment:
                      available: true
                      model: large-v3-turbo
                      modelCached: false
                      auto: gpu
                      reason: null
                    transcription:
                      models:
                        basic-pitch-icassp2022: ready
                        piano-crnn-note-pedal: not-downloaded
                      font:
                        leipzig: true
                    contractVersion: 1.6.0
                gpu:
                  summary: GPU worker (docker-compose.gpu.yml)
                  value:
                    status: ok
                    separator: demucs
                    device: auto
                    deviceInfo:
                      kind: gpu
                      name: NVIDIA GeForce RTX 5070 Ti
                      computeCapability: '12.0'
                      totalMemoryMiB: 16303
                      freeMemoryMiB: 15469
                      reason: null
                    onlineLookups: true
                    library:
                      readable: true
                      reason: null
                    lanes:
                      render:
                        queued: 0
                        running: false
                      transcribe:
                        queued: 0
                        running: false
                    lyricsAlignment:
                      available: true
                      model: large-v3-turbo
                      modelCached: true
                      auto: gpu
                      reason: null
                    transcription:
                      models:
                        basic-pitch-icassp2022: ready
                        piano-crnn-note-pedal: not-downloaded
                      font:
                        leipzig: true
                    contractVersion: 1.6.0
                gpuUnavailable:
                  summary: GPU requested but not usable
                  value:
                    status: ok
                    separator: demucs
                    device: auto
                    deviceInfo:
                      kind: cpu
                      name: null
                      computeCapability: null
                      totalMemoryMiB: null
                      freeMemoryMiB: null
                      reason: 'No usable NVIDIA GPU: CUDA is not available in this container (is the GPU option enabled and the driver current?).'
                    onlineLookups: false
                    library:
                      readable: false
                      reason: The library is not available to the worker
                    lanes:
                      render:
                        queued: 0
                        running: false
                      transcribe:
                        queued: 0
                        running: false
                    lyricsAlignment:
                      available: true
                      model: large-v3-turbo
                      modelCached: false
                      auto: gpu
                      reason: null
                    transcription:
                      models:
                        basic-pitch-icassp2022: ready
                        piano-crnn-note-pedal: not-downloaded
                      font:
                        leipzig: true
                    contractVersion: 1.6.0
  /v1/jobs:
    post:
      tags: [jobs]
      operationId: createJob
      summary: Create a processing job for a URL or an uploaded file.
      description: |
        URL sources are sent as JSON, uploads as `multipart/form-data` with one part `file`
        (`.mp3`, `.wav` or `.flac`, at most 200 MiB = 209,715,200 bytes).

        Idempotency by source key: if a non-failed job for the same source key exists (queued,
        running or completed), that job is returned with `200`. If the audio was separated
        before (same source key or same audio SHA-256 in the cache), the new job completes
        without running Demucs again. Otherwise a new job is queued and `202` is returned.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateJobRequest'
            examples:
              youtube:
                value:
                  sourceType: youtube
                  url: https://www.youtube.com/watch?v=dQw4w9WgXcQ
              spotify:
                value:
                  sourceType: spotify
                  url: https://open.spotify.com/track/4cOdK2wGLETKBW3PvgPWqT
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/UploadJobRequest'
            encoding:
              file:
                contentType: audio/mpeg, audio/wav, audio/x-wav, audio/flac, application/octet-stream
      responses:
        '200':
          description: An existing job for the same source key is returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
              examples:
                completed:
                  $ref: '#/components/examples/CompletedJob'
        '202':
          description: Job accepted and queued.
          headers:
            Location:
              description: URL of the job status resource.
              schema:
                type: string
              example: /v1/jobs/3f2b8c1d9e4a4f6b8a7c5d3e2f1a0b9c
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
              examples:
                queued:
                  $ref: '#/components/examples/QueuedJob'
        '400':
          description: |
            Invalid or unsupported source. Spotify tracks are resolved synchronously, so a Spotify
            track without a matching public YouTube recording is also rejected here
            (title "Source unavailable") instead of becoming a failed job.
          $ref: '#/components/responses/BadRequest'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
  /v1/jobs/{jobId}:
    parameters:
      - $ref: '#/components/parameters/JobId'
    get:
      tags: [jobs]
      operationId: getJob
      summary: Get status, stage and progress of a job.
      responses:
        '200':
          description: Current job state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
              examples:
                separating:
                  $ref: '#/components/examples/SeparatingJob'
                failed:
                  $ref: '#/components/examples/FailedJob'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/jobs/{jobId}/result:
    parameters:
      - $ref: '#/components/parameters/JobId'
    get:
      tags: [jobs]
      operationId: getJobResult
      summary: Get the result of a completed job (also stored as result.json).
      responses:
        '200':
          description: Result of the completed job.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobResult'
              example:
                jobId: 3f2b8c1d9e4a4f6b8a7c5d3e2f1a0b9c
                sourceKey: youtube:dQw4w9WgXcQ
                metadata:
                  title: Never Gonna Give You Up
                  artist: Rick Astley
                  sourceUrl: https://www.youtube.com/watch?v=dQw4w9WgXcQ
                  album: null
                  isrc: null
                  durationSeconds: 213.04
                  lookupTitle: Never Gonna Give You Up
                  lookupArtist: Rick Astley
                durationSeconds: 213.04
                sampleRate: 44100
                channels: 2
                audioSha256: 9f86d081884c7d659a2feaa0c55ad015a3bf4f1b2b0b822cd15d6c15b0f00a08
                model: htdemucs_6s
                stems:
                  - name: vocals
                    path: /v1/jobs/3f2b8c1d9e4a4f6b8a7c5d3e2f1a0b9c/stems/vocals
                    sizeBytes: 21456789
                  - name: drums
                    path: /v1/jobs/3f2b8c1d9e4a4f6b8a7c5d3e2f1a0b9c/stems/drums
                    sizeBytes: 23456789
                  - name: bass
                    path: /v1/jobs/3f2b8c1d9e4a4f6b8a7c5d3e2f1a0b9c/stems/bass
                    sizeBytes: 22345678
                  - name: guitar
                    path: /v1/jobs/3f2b8c1d9e4a4f6b8a7c5d3e2f1a0b9c/stems/guitar
                    sizeBytes: 22456789
                  - name: piano
                    path: /v1/jobs/3f2b8c1d9e4a4f6b8a7c5d3e2f1a0b9c/stems/piano
                    sizeBytes: 21987654
                  - name: other
                    path: /v1/jobs/3f2b8c1d9e4a4f6b8a7c5d3e2f1a0b9c/stems/other
                    sizeBytes: 23123456
                beatGrid:
                  bpm: 113.5
                  beats: [0.52, 1.05, 1.58, 2.11]
                  downbeats: [0.52]
                  beatsPerBar: 4
                  confidence: 0.87
                  reliable: true
                completedAt: '2026-11-14T12:06:30Z'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/NotCompleted'
  /v1/jobs/{jobId}/stems/{stem}:
    parameters:
      - $ref: '#/components/parameters/JobId'
      - name: stem
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/StemName'
    get:
      tags: [jobs]
      operationId: getJobStem
      summary: Download one stem as FLAC (44.1 kHz, stereo, 16-bit).
      responses:
        '200':
          description: The stem file.
          headers:
            Content-Length:
              schema:
                type: integer
          content:
            audio/flac:
              schema:
                type: string
                contentMediaType: audio/flac
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/NotCompleted'
  /v1/jobs/{jobId}/artwork/{variant}:
    parameters:
      - $ref: '#/components/parameters/JobId'
      - $ref: '#/components/parameters/ArtworkVariant'
    get:
      tags: [artwork]
      operationId: getJobArtwork
      summary: Download the source picture of a job (1.3.0).
      description: |
        Available once `Job.artwork` is set (after the stage "Saving cover"); the `ETag` is the
        SHA-256 of the cover JPEG (`Job.artwork.sha256`), for both variants.
      responses:
        '200':
          $ref: '#/components/responses/ArtworkFile'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/detail-jobs:
    post:
      tags: [detail]
      operationId: createDetailJob
      summary: Create (or reuse) a detail job for the standard stems of a completed job.
      description: |
        Idempotent per audio: if a `queued`, `running` or `completed` detail job exists for the
        same `audioSha256` as the referenced standard job, it is returned with `200`. A
        `completed` result in the per-audio cache makes a new job complete immediately (SC-007).
        Otherwise a new job is queued with lower priority than every standard job and `202` is
        returned. Detail models are downloaded on first use into the model cache.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateDetailJobRequest'
            example:
              standardJobId: 3f2b8c1d9e4a4f6b8a7c5d3e2f1a0b9c
      responses:
        '200':
          description: An existing detail job for the same audio is returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailJob'
              examples:
                completed:
                  $ref: '#/components/examples/CompletedDetailJob'
        '202':
          description: Detail job accepted and queued.
          headers:
            Location:
              description: URL of the detail job status resource.
              schema:
                type: string
              example: /v1/detail-jobs/7c1e9a2b4d6f48e0a3b5c7d9e1f20a4b
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailJob'
              examples:
                queued:
                  $ref: '#/components/examples/QueuedDetailJob'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/DetailConflict'
  /v1/detail-jobs/{detailJobId}:
    parameters:
      - $ref: '#/components/parameters/DetailJobId'
    get:
      tags: [detail]
      operationId: getDetailJob
      summary: Get status, current parent stem and progress of a detail job.
      responses:
        '200':
          description: Current detail job state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailJob'
              examples:
                running:
                  $ref: '#/components/examples/RunningDetailJob'
                failed:
                  $ref: '#/components/examples/FailedDetailJob'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/detail-jobs/{detailJobId}/cancel:
    parameters:
      - $ref: '#/components/parameters/DetailJobId'
    post:
      tags: [detail]
      operationId: cancelDetailJob
      summary: Cancel a queued or running detail job.
      description: |
        A queued job becomes `cancelled` at once. A running job is stopped cooperatively before
        its next inference chunk (within a few seconds) and then reported as `cancelled`; the
        response already shows `cancelled`. Checkpoints of finished parent steps are kept, so a
        later detail job for the same audio resumes from them. Cancelling a `cancelled` job is a
        no-op (`200`); a `completed` or `failed` job returns `409`.
      responses:
        '200':
          description: The cancelled job.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailJob'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/DetailConflict'
  /v1/detail-jobs/{detailJobId}/result:
    parameters:
      - $ref: '#/components/parameters/DetailJobId'
    get:
      tags: [detail]
      operationId: getDetailResult
      summary: Get the per-parent outcomes and detail stems of a completed detail job.
      responses:
        '200':
          description: Result of the completed detail job.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailResult'
              examples:
                completed:
                  $ref: '#/components/examples/DetailResultExample'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/DetailConflict'
  /v1/detail-jobs/{detailJobId}/stems/{parent}/{name}:
    parameters:
      - $ref: '#/components/parameters/DetailJobId'
      - $ref: '#/components/parameters/ParentStem'
      - $ref: '#/components/parameters/DetailStem'
    get:
      tags: [detail]
      operationId: getDetailStem
      summary: Download one detail stem as FLAC (44.1 kHz, stereo, 16-bit).
      responses:
        '200':
          description: The detail stem file.
          headers:
            Content-Length:
              schema:
                type: integer
          content:
            audio/flac:
              schema:
                type: string
                contentMediaType: audio/flac
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/DetailConflict'
  /v1/metadata-jobs:
    post:
      tags: [metadata]
      operationId: createMetadataJob
      summary: Look up recording, album, cover and artist facts for a song (1.3.0).
      description: |
        Runs in a network-only lane (one job at a time) that is independent of the separation
        queue, so a lookup never waits behind a separation (ADR-014 D3). Every service is
        throttled to 1 request per second and called with a User-Agent that contains no personal
        data. With `STEMSTUDIO_ONLINE_LOOKUPS=off` the job completes at once with outcome
        `disabled` and no request is made. Jobs are kept for 24 hours; after a restart, `queued`
        and `running` jobs are run again from the start.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateMetadataJobRequest'
            examples:
              spotify:
                summary: Spotify source with an ISRC
                value:
                  title: Hero of the Day
                  artist: Metallica
                  album: Load
                  durationSeconds: 262.3
                  isrc: USEE19600011
                  standardJobId: 3f2b8c1d9e4a4f6b8a7c5d3e2f1a0b9c
              youtube:
                summary: YouTube source with cleaned lookup names
                value:
                  title: Never Gonna Give You Up
                  artist: Rick Astley
                  album: null
                  durationSeconds: 213.04
                  isrc: null
                  standardJobId: null
      responses:
        '202':
          description: Metadata job accepted and queued.
          headers:
            Location:
              description: URL of the metadata job status resource.
              schema:
                type: string
              example: /v1/metadata-jobs/5d2c7e9f1a3b4c6d8e0f2a4b6c8d0e1f
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MetadataJob'
              examples:
                queued:
                  $ref: '#/components/examples/QueuedMetadataJob'
        '422':
          $ref: '#/components/responses/ValidationFailed'
  /v1/metadata-jobs/{metadataJobId}:
    parameters:
      - $ref: '#/components/parameters/MetadataJobId'
    get:
      tags: [metadata]
      operationId: getMetadataJob
      summary: Get status and stage of a metadata job.
      responses:
        '200':
          description: Current metadata job state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MetadataJob'
              examples:
                running:
                  $ref: '#/components/examples/RunningMetadataJob'
                completed:
                  $ref: '#/components/examples/CompletedMetadataJob'
                failed:
                  $ref: '#/components/examples/FailedMetadataJob'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/metadata-jobs/{metadataJobId}/result:
    parameters:
      - $ref: '#/components/parameters/MetadataJobId'
    get:
      tags: [metadata]
      operationId: getMetadataResult
      summary: Get the result of a completed metadata job.
      responses:
        '200':
          description: Result of the completed metadata job.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MetadataResult'
              examples:
                found:
                  $ref: '#/components/examples/FoundMetadataResult'
                notFound:
                  $ref: '#/components/examples/NotFoundMetadataResult'
                disabled:
                  $ref: '#/components/examples/DisabledMetadataResult'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/NotCompleted'
  /v1/metadata-jobs/{metadataJobId}/artwork/{variant}:
    parameters:
      - $ref: '#/components/parameters/MetadataJobId'
      - $ref: '#/components/parameters/ArtworkVariant'
    get:
      tags: [metadata]
      operationId: getMetadataArtwork
      summary: Download the Cover Art Archive picture of a completed metadata job.
      responses:
        '200':
          $ref: '#/components/responses/ArtworkFile'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/artwork:
    post:
      tags: [artwork]
      operationId: normalizeArtwork
      summary: Normalise a user picture (re-encode only; nothing is attached to a job).
      description: |
        One multipart part `file` (JPEG, PNG or WebP, at most 10 MiB = 10,485,760 bytes). The
        picture is decoded with a 40-megapixel cap, EXIF orientation applied and every metadata
        block stripped, alpha flattened, the first frame of an animation used, centre-cropped to
        a square and encoded as a 600 px cover (<= 200 KB) and a 160 px thumbnail (<= 20 KB).
        The files are kept for one hour (`GET /v1/artwork/{artworkId}/{variant}`).
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ArtworkUploadRequest'
            encoding:
              file:
                contentType: image/jpeg, image/png, image/webp, application/octet-stream
      responses:
        '201':
          description: Picture normalised.
          headers:
            Location:
              description: URL of the cover variant.
              schema:
                type: string
              example: /v1/artwork/8e4f2a6c0b1d4e3f9a7c5b3d1e0f2a4c/cover
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArtworkUpload'
              example:
                artworkId: 8e4f2a6c0b1d4e3f9a7c5b3d1e0f2a4c
                info:
                  source: user
                  sha256: 4b227777d4dd1fc61c6f884f48641d02b4d121d3fd328cb08b5531fcacdabf8a
                  coverBytes: 61234
                  thumbBytes: 7012
                  originUrl: null
        '400':
          description: The file is not a decodable image (corrupt, truncated or not a picture).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                title: Not an image
                status: 400
                detail: The file could not be read as a picture.
        '413':
          description: Larger than 10 MiB (10,485,760 bytes).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                title: Picture too large
                status: 413
                detail: The picture is larger than 10 MiB.
        '415':
          description: Not a JPEG, PNG or WebP file.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                title: Unsupported picture type
                status: 415
                detail: Only JPEG, PNG and WebP pictures are supported.
        '422':
          description: More than 40 megapixels.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                title: Picture too large
                status: 422
                detail: The picture has more than 40 megapixels.
        '503':
          description: |
            This worker has no image normaliser (a partial build without the `metadata`
            package); nothing was stored. The backend answers its own 503.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                title: Pictures unavailable
                status: 503
                detail: This worker cannot process pictures.
  /v1/artwork/{artworkId}/{variant}:
    parameters:
      - name: artworkId
        in: path
        required: true
        description: Identifier returned by `POST /v1/artwork` (32 lower-case hex characters).
        schema:
          type: string
          pattern: '^[0-9a-f]{32}$'
        example: 8e4f2a6c0b1d4e3f9a7c5b3d1e0f2a4c
      - $ref: '#/components/parameters/ArtworkVariant'
    get:
      tags: [artwork]
      operationId: getNormalizedArtwork
      summary: Download a normalised user picture (kept for one hour).
      responses:
        '200':
          $ref: '#/components/responses/ArtworkFile'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/render-jobs:
    post:
      tags: [render]
      operationId: createRenderJob
      summary: Render library files into one audio file (1.4.0).
      description: |
        Inputs are files of the API library, read through a **read-only** mount
        (`STEMSTUDIO_LIBRARY_DIR`); the worker never writes there. Every `inputs[].path` must
        fully match one allow-list pattern (lower-case `D` UUIDs):

        * `tracks/<uuid>/stems/(vocals|drums|bass|guitar|piano|other).flac`
        * `tracks/<uuid>/detail/(vocals|drums|guitar|piano|other)/[a-z][a-z-]{0,31}.flac`
        * `assets/<uuid>/[a-z][a-z0-9-]{0,31}.(flac|wav|mp3)`

        and its real path must stay inside the library root; otherwise `400 invalid-input-path`
        and nothing is read. Paths are checked when the job is created (`404 input-not-found`
        names a missing file). Jobs run in a `render` lane of their own (one at a time, FIFO),
        so a render never waits behind a separation. Mixing law, clip protection, dither and
        encoding: `specs/007-export-library/data-model.md` 2-3 and `render-vectors.json`.
        Jobs are kept for 24 hours after they end; after a restart `queued`/`running` jobs are
        `failed` with "interrupted by restart".
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RenderJobRequest'
            examples:
              rawStem:
                $ref: '#/components/examples/RawStemRenderRequest'
              mixToMp3:
                $ref: '#/components/examples/MixRenderRequest'
      responses:
        '202':
          description: Render job accepted and queued.
          headers:
            Location:
              description: URL of the render job status resource.
              schema:
                type: string
              example: /v1/render-jobs/a1b2c3d4e5f60718293a4b5c6d7e8f90
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RenderJob'
              examples:
                queued:
                  $ref: '#/components/examples/QueuedRenderJob'
        '400':
          $ref: '#/components/responses/InvalidInputPath'
        '404':
          $ref: '#/components/responses/InputNotFound'
        '422':
          $ref: '#/components/responses/ValidationFailed'
  /v1/render-jobs/{renderJobId}:
    parameters:
      - $ref: '#/components/parameters/RenderJobId'
    get:
      tags: [render]
      operationId: getRenderJob
      summary: Get status, progress and result of a render job.
      responses:
        '200':
          description: Current render job state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RenderJob'
              examples:
                running:
                  $ref: '#/components/examples/RunningRenderJob'
                completed:
                  $ref: '#/components/examples/CompletedRenderJob'
                failed:
                  $ref: '#/components/examples/FailedRenderJob'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [render]
      operationId: deleteRenderJob
      summary: Cancel (when queued or running) and remove a render job and its file.
      description: |
        Idempotent: an unknown or already removed job also answers `204`. A running job stops
        after its current block.
      responses:
        '204':
          description: Removed (or did not exist).
  /v1/render-jobs/{renderJobId}/file:
    parameters:
      - $ref: '#/components/parameters/RenderJobId'
    get:
      tags: [render]
      operationId: getRenderJobFile
      summary: Download the rendered file of a completed job.
      responses:
        '200':
          description: The file (`RenderResult.contentType`); `Content-Length` = `RenderResult.sizeBytes`.
          headers:
            Content-Length:
              schema:
                type: integer
          content:
            audio/flac:
              schema:
                type: string
                contentMediaType: audio/flac
            audio/wav:
              schema:
                type: string
                contentMediaType: audio/wav
            audio/mpeg:
              schema:
                type: string
                contentMediaType: audio/mpeg
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/RenderNotCompleted'
  /v1/lyrics-jobs:
    post:
      tags: [lyrics]
      operationId: createLyricsJob
      summary: Look lyrics up (LRCLIB) or align lyrics text to the vocal stem (1.5.0).
      description: |
        `mode: lookup` runs on the network lane of the metadata jobs (never waits behind a
        separation): LRCLIB `/api/get` with album, without album, then `/api/search` and the
        selection of `specs/006-synced-lyrics-karaoke/data-model.md` 2.3; at most 3 requests,
        >= 500 ms apart. With online lookups off (`Health.onlineLookups = false`) the job completes
        at once with outcome `disabled` and makes no request.

        `mode: align` runs as a model step of the separation scheduler (priority: standard
        separation > alignment > detail parent step; a running step is never pre-empted) through
        the GPU policy of ADR-012 (Whisper large-v3-turbo via stable-ts; CPU retry on GPU out of
        memory). The vocal stem is the `vocals.lead` detail stem of the standard job when the
        worker cache has it, else `vocals`. `404` when `standardJobId` is unknown, `409` when that
        job is not completed or its vocal stem is gone. With `refine` (a line-synced document) the
        line times are kept and only the words are aligned inside them.

        Lyrics are copyrighted: results are served with `Cache-Control: no-store`, never logged,
        and removed with `DELETE /v1/lyrics-jobs/{lyricsJobId}` once the backend has copied them
        (a 24 h sweep removes leftovers). After a restart `queued`/`running` jobs run again from
        the start.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateLyricsJobRequest'
            examples:
              lookup:
                $ref: '#/components/examples/LookupLyricsRequest'
              align:
                $ref: '#/components/examples/AlignLyricsRequest'
      responses:
        '202':
          description: Lyrics job accepted and queued.
          headers:
            Location:
              description: URL of the lyrics job status resource.
              schema:
                type: string
              example: /v1/lyrics-jobs/5e8d2c4a6b1f40e9a7c3d5b1e9f20c48
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LyricsJob'
              examples:
                queuedLookup:
                  $ref: '#/components/examples/QueuedLyricsLookupJob'
                queuedAlign:
                  $ref: '#/components/examples/QueuedLyricsAlignJob'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/LyricsConflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
  /v1/lyrics-jobs/{lyricsJobId}:
    parameters:
      - $ref: '#/components/parameters/LyricsJobId'
    get:
      tags: [lyrics]
      operationId: getLyricsJob
      summary: Get status, stage and progress of a lyrics job.
      responses:
        '200':
          description: Current lyrics job state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LyricsJob'
              examples:
                aligning:
                  $ref: '#/components/examples/RunningLyricsAlignJob'
                completed:
                  $ref: '#/components/examples/CompletedLyricsLookupJob'
                failed:
                  $ref: '#/components/examples/FailedLyricsAlignJob'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [lyrics]
      operationId: deleteLyricsJob
      summary: Remove a lyrics job and its result (cancels it first when it is queued or running).
      responses:
        '204':
          description: Removed.
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/lyrics-jobs/{lyricsJobId}/result:
    parameters:
      - $ref: '#/components/parameters/LyricsJobId'
    get:
      tags: [lyrics]
      operationId: getLyricsResult
      summary: Get the outcome and the timed lyrics of a completed lyrics job.
      responses:
        '200':
          description: |
            The result. `lyrics` is set for outcome `found` (word, line or plain timing) and
            `instrumental` (an empty document that names the source record); it is null for
            `not-found` and `disabled`.
          headers:
            Cache-Control:
              description: Always `no-store` (lyrics are copyrighted; ADR-015 D6).
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LyricsResult'
              examples:
                wordSynced:
                  $ref: '#/components/examples/WordSyncedLyricsResult'
                lineSynced:
                  $ref: '#/components/examples/LineSyncedLyricsResult'
                plain:
                  $ref: '#/components/examples/PlainLyricsResult'
                aligned:
                  $ref: '#/components/examples/AlignedLyricsResult'
                instrumental:
                  $ref: '#/components/examples/InstrumentalLyricsResult'
                notFound:
                  $ref: '#/components/examples/NotFoundLyricsResult'
                disabled:
                  $ref: '#/components/examples/DisabledLyricsResult'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/LyricsNotCompleted'
  /v1/lyrics-jobs/{lyricsJobId}/cancel:
    parameters:
      - $ref: '#/components/parameters/LyricsJobId'
    post:
      tags: [lyrics]
      operationId: cancelLyricsJob
      summary: Cancel a queued or running alignment job.
      description: |
        A running alignment stops at its next progress report. Lookups finish within seconds and
        cannot be cancelled (`409`), nor can terminal jobs.
      responses:
        '200':
          description: The job, now `cancelled`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LyricsJob'
              examples:
                cancelled:
                  $ref: '#/components/examples/CancelledLyricsAlignJob'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/LyricsConflict'
  /v1/transcription-jobs:
    post:
      tags: [transcription]
      operationId: createTranscriptionJob
      summary: Transcribe one library audio file (or the five drum detail stems) to sheet music (1.6.0).
      description: |
        Inputs are read through the read-only library mount with the path rules of
        `createRenderJob` (`400 invalid-input-path`, `404 input-not-found`, checked when the job
        is created). Pitched profiles (`vocals`, `bass`, `guitar`, `keys`, `piano`) need `input`
        and no `drumInputs`; `drums` needs `drumInputs` (at least one piece; each a
        `tracks/<uuid>/detail/drums/<piece>.flac` path) and no `input`; otherwise `422`.

        Jobs run in a `transcribe` lane of their own (one at a time, FIFO, intra-op threads capped
        by `STEMSTUDIO_TRANSCRIBE_THREADS`), so they never wait behind a separation or a render.
        Pipeline (ADR-017): transcribe (basic-pitch ONNX on the CPU; the piano CRNN for `piano` +
        `accurate` through the GPU policy of ADR-012; onset detection for `drums`) -> clean ->
        quantise on `grid` -> key and spelling -> music21 score -> MusicXML + MIDI -> Verovio SVG
        -> PDF. Stages and progress: `loading-model` 0-0.05, `transcribing` 0.05-0.80,
        `notating` 0.80-0.90, `engraving` 0.90-1.0. No notes at all fails the job with "No notes
        were detected in this audio.". Jobs are kept for 24 hours after they end; after a restart
        `queued`/`running` jobs are `failed` with "interrupted by restart".
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TranscriptionJobRequest'
            examples:
              bass:
                $ref: '#/components/examples/BassTranscriptionRequest'
              drums:
                $ref: '#/components/examples/DrumsTranscriptionRequest'
              piano:
                $ref: '#/components/examples/PianoTranscriptionRequest'
      responses:
        '202':
          description: Transcription job accepted and queued.
          headers:
            Location:
              description: URL of the transcription job status resource.
              schema:
                type: string
              example: /v1/transcription-jobs/c4e6a8b0d2f4416385a7c9e1b3d5f7a9
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TranscriptionJob'
              examples:
                queued:
                  $ref: '#/components/examples/QueuedTranscriptionJob'
        '400':
          $ref: '#/components/responses/InvalidInputPath'
        '404':
          $ref: '#/components/responses/InputNotFound'
        '422':
          $ref: '#/components/responses/ValidationFailed'
  /v1/transcription-jobs/{transcriptionJobId}:
    parameters:
      - $ref: '#/components/parameters/TranscriptionJobId'
    get:
      tags: [transcription]
      operationId: getTranscriptionJob
      summary: Get status, stage, progress and result of a transcription job.
      responses:
        '200':
          description: Current transcription job state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TranscriptionJob'
              examples:
                transcribing:
                  $ref: '#/components/examples/RunningTranscriptionJob'
                completed:
                  $ref: '#/components/examples/CompletedTranscriptionJob'
                noNotes:
                  $ref: '#/components/examples/FailedTranscriptionJob'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [transcription]
      operationId: deleteTranscriptionJob
      summary: Cancel (when queued or running) and remove a transcription job and its files.
      description: |
        Idempotent: an unknown or already removed job also answers `204`. A running job stops at
        its next progress report.
      responses:
        '204':
          description: Removed (or did not exist).
  /v1/transcription-jobs/{transcriptionJobId}/files/{role}:
    parameters:
      - $ref: '#/components/parameters/TranscriptionJobId'
      - name: role
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/ScoreFileRole'
    get:
      tags: [transcription]
      operationId: getTranscriptionFile
      summary: Download one file of a completed transcription job.
      responses:
        '200':
          description: The file (`TranscriptionFile.contentType`); `Content-Length` = `TranscriptionFile.sizeBytes`.
          headers:
            Content-Length:
              schema:
                type: integer
          content:
            application/pdf:
              schema:
                type: string
                contentMediaType: application/pdf
            application/vnd.recordare.musicxml+xml:
              schema:
                type: string
                contentMediaType: application/vnd.recordare.musicxml+xml
            audio/midi:
              schema:
                type: string
                contentMediaType: audio/midi
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/TranscriptionNotCompleted'
components:
  parameters:
    JobId:
      name: jobId
      in: path
      required: true
      description: Job identifier (32 lower-case hex characters, a UUID without dashes).
      schema:
        type: string
        pattern: '^[0-9a-f]{32}$'
      example: 3f2b8c1d9e4a4f6b8a7c5d3e2f1a0b9c
    DetailJobId:
      name: detailJobId
      in: path
      required: true
      description: Detail job identifier (32 lower-case hex characters).
      schema:
        type: string
        pattern: '^[0-9a-f]{32}$'
      example: 7c1e9a2b4d6f48e0a3b5c7d9e1f20a4b
    ParentStem:
      name: parent
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/ParentStemName'
    DetailStem:
      name: name
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/DetailStemName'
    MetadataJobId:
      name: metadataJobId
      in: path
      required: true
      description: Metadata job identifier (32 lower-case hex characters).
      schema:
        type: string
        pattern: '^[0-9a-f]{32}$'
      example: 5d2c7e9f1a3b4c6d8e0f2a4b6c8d0e1f
    ArtworkVariant:
      name: variant
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/ArtworkVariant'
    RenderJobId:
      name: renderJobId
      in: path
      required: true
      description: Render job identifier (32 lower-case hex characters).
      schema:
        type: string
        pattern: '^[0-9a-f]{32}$'
      example: a1b2c3d4e5f60718293a4b5c6d7e8f90
    LyricsJobId:
      name: lyricsJobId
      in: path
      required: true
      description: Lyrics job identifier (32 lower-case hex characters).
      schema:
        type: string
        pattern: '^[0-9a-f]{32}$'
      example: 5e8d2c4a6b1f40e9a7c3d5b1e9f20c48
    TranscriptionJobId:
      name: transcriptionJobId
      in: path
      required: true
      description: Transcription job identifier (32 lower-case hex characters).
      schema:
        type: string
        pattern: '^[0-9a-f]{32}$'
      example: c4e6a8b0d2f4416385a7c9e1b3d5f7a9
  schemas:
    SourceType:
      type: string
      enum: [youtube, spotify, upload]
    JobState:
      type: string
      description: '`completed` and `failed` are terminal.'
      enum: [queued, downloading, separating, analysing, completed, failed]
    StemName:
      type: string
      enum: [vocals, drums, bass, guitar, piano, other]
    ModelName:
      type: string
      description: |
        `fake` only when STEMSTUDIO_SEPARATOR=fake (tests, CI). Stem set by model:
        `htdemucs_6s` and `fake` = vocals, drums, bass, guitar, piano, other (6);
        `htdemucs` = vocals, drums, bass, other (4).
      enum: [htdemucs_6s, htdemucs, fake]
    CreateJobRequest:
      type: object
      additionalProperties: false
      required: [sourceType, url]
      properties:
        sourceType:
          type: string
          enum: [youtube, spotify]
        url:
          type: string
          minLength: 1
          maxLength: 2048
          description: |
            YouTube video URL (hosts youtube.com, www.youtube.com, m.youtube.com,
            music.youtube.com, youtu.be) or Spotify track URL (open.spotify.com/track/...).
            Playlists, albums and other hosts are rejected with 400. The backend sends the
            canonical form (`https://www.youtube.com/watch?v=<id>`,
            `https://open.spotify.com/track/<id>`), but the worker accepts every form listed as
            accepted in `source-url-vectors.json` and rejects every rejected one.
    UploadJobRequest:
      type: object
      required: [file]
      properties:
        file:
          type: string
          contentMediaType: application/octet-stream
          description: Audio file; the file name extension must be .mp3, .wav or .flac.
    SourceMetadata:
      type: object
      additionalProperties: false
      required: [title]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 500
        artist:
          type: [string, 'null']
          maxLength: 500
        sourceUrl:
          type: [string, 'null']
          description: YouTube URL the audio was fetched from; null for uploads.
        album:
          type: [string, 'null']
          maxLength: 500
          description: Spotify album name, upload tag album or yt-dlp album (1.3.0).
        isrc:
          type: [string, 'null']
          pattern: '^[A-Z]{2}[A-Z0-9]{3}[0-9]{7}$'
          description: Spotify sources only (1.3.0).
        durationSeconds:
          type: [number, 'null']
          exclusiveMinimum: 0
          maximum: 900
          description: Set after normalisation; null before (1.3.0).
        lookupTitle:
          type: [string, 'null']
          maxLength: 500
          description: Cleaned title for the metadata lookup (1.3.0).
        lookupArtist:
          type: [string, 'null']
          maxLength: 500
          description: Cleaned artist for the metadata lookup (1.3.0).
    Job:
      type: object
      additionalProperties: false
      required: [jobId, sourceKey, sourceType, status, stage, progress, createdAt, updatedAt]
      properties:
        jobId:
          type: string
          pattern: '^[0-9a-f]{32}$'
        sourceKey:
          type: string
          pattern: '^(youtube|spotify|upload):[A-Za-z0-9_-]{1,64}$'
          description: '`youtube:<videoId>`, `spotify:<trackId>` or `upload:<sha256 of the uploaded bytes>`.'
        sourceType:
          $ref: '#/components/schemas/SourceType'
        status:
          $ref: '#/components/schemas/JobState'
        stage:
          type: string
          maxLength: 200
          description: Human-readable stage, e.g. "Downloading audio", "Saving cover" (1.3.0), "Converting audio", "Separating stems".
        progress:
          type: integer
          minimum: 0
          maximum: 100
        error:
          type: [string, 'null']
          maxLength: 1000
          description: Readable failure reason when status is failed.
        metadata:
          oneOf:
            - $ref: '#/components/schemas/SourceMetadata'
            - type: 'null'
          description: Known once the source is resolved (title/artist for display while processing).
        device:
          oneOf:
            - $ref: '#/components/schemas/JobDevice'
            - type: 'null'
          description: |
            Where the separation ran (1.2.0). Set when the separation starts (the device it starts
            on) and updated when it falls back to the CPU; null before the separation and when the
            result came from the cache.
        artwork:
          oneOf:
            - $ref: '#/components/schemas/ArtworkInfo'
            - type: 'null'
          description: |
            Source picture (1.3.0), set in the stage "Saving cover" after the download; null
            before, when the source has no picture and when capturing it failed (the job goes on).
            Cached results keep the picture of the job that produced them.
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    BeatGrid:
      type: object
      additionalProperties: false
      required: [bpm, beats, downbeats, beatsPerBar, confidence, reliable]
      properties:
        bpm:
          type: number
          minimum: 0
          maximum: 400
          description: Global tempo estimate; 0 when detection failed.
        beats:
          type: array
          items:
            type: number
            minimum: 0
          description: Beat times in seconds, ascending.
        downbeats:
          type: array
          items:
            type: number
            minimum: 0
          description: Beat-1 times in seconds; a subset of beats.
        beatsPerBar:
          type: integer
          minimum: 1
          maximum: 12
          default: 4
        confidence:
          type: number
          minimum: 0
          maximum: 1
        reliable:
          type: boolean
          description: False when there is no clear pulse; the metronome then starts disabled.
    StemInfo:
      type: object
      additionalProperties: false
      required: [name, path, sizeBytes]
      properties:
        name:
          $ref: '#/components/schemas/StemName'
        path:
          type: string
          description: Relative URL of the stem, /v1/jobs/{jobId}/stems/{name}.
        sizeBytes:
          type: integer
          minimum: 0
    JobResult:
      type: object
      additionalProperties: false
      required: [jobId, sourceKey, metadata, durationSeconds, sampleRate, channels, audioSha256, model, stems, beatGrid, completedAt]
      properties:
        jobId:
          type: string
          pattern: '^[0-9a-f]{32}$'
        sourceKey:
          type: string
        metadata:
          $ref: '#/components/schemas/SourceMetadata'
        durationSeconds:
          type: number
          exclusiveMinimum: 0
          maximum: 900
        sampleRate:
          type: integer
          const: 44100
        channels:
          type: integer
          const: 2
        audioSha256:
          type: string
          pattern: '^[0-9a-f]{64}$'
          description: SHA-256 of the normalised WAV (second cache key).
        model:
          $ref: '#/components/schemas/ModelName'
        stems:
          type: array
          minItems: 1
          maxItems: 6
          items:
            $ref: '#/components/schemas/StemInfo'
        beatGrid:
          $ref: '#/components/schemas/BeatGrid'
        completedAt:
          type: string
          format: date-time
    Health:
      type: object
      additionalProperties: false
      required: [status, separator, device, deviceInfo, onlineLookups, library, lanes, lyricsAlignment, transcription, contractVersion]
      properties:
        status:
          type: string
          const: ok
        separator:
          type: string
          enum: [demucs, fake]
        device:
          type: string
          enum: [cpu, cuda, auto]
          description: |
            Configured device preference (STEMSTUDIO_DEVICE). `cuda` and `auto` both use the GPU
            when the start-up probe finds a usable one and otherwise the CPU (1.2.0); `cpu` never
            touches CUDA. The device actually used is `deviceInfo`.
        deviceInfo:
          $ref: '#/components/schemas/DeviceInfo'
        onlineLookups:
          type: boolean
          description: False when STEMSTUDIO_ONLINE_LOOKUPS=off (1.3.0).
        library:
          $ref: '#/components/schemas/LibraryHealth'
        lanes:
          $ref: '#/components/schemas/LanesHealth'
        lyricsAlignment:
          $ref: '#/components/schemas/LyricsAlignmentHealth'
        transcription:
          $ref: '#/components/schemas/TranscriptionHealth'
        contractVersion:
          type: string
          example: 1.6.0
    ProcessingDeviceKind:
      type: string
      enum: [cpu, gpu]
      description: The CPU, or the NVIDIA GPU (CUDA).
    DeviceInfo:
      type: object
      additionalProperties: false
      required: [kind]
      description: |
        Active processing device, probed once at start-up (1.2.0). `kind` is `gpu` only when a GPU
        was requested and the probe passed (CUDA available, the GPU architecture is in the build,
        a test kernel ran); otherwise `cpu` and `reason` says why the GPU is not used (null when
        the CPU was chosen on purpose). GPU fields are null on the CPU.
      properties:
        kind:
          $ref: '#/components/schemas/ProcessingDeviceKind'
        name:
          type: [string, 'null']
          maxLength: 200
          example: NVIDIA GeForce RTX 5070 Ti
        computeCapability:
          type: [string, 'null']
          pattern: '^[0-9]{1,2}\.[0-9]{1,2}$'
          example: '12.0'
        totalMemoryMiB:
          type: [integer, 'null']
          minimum: 0
        freeMemoryMiB:
          type: [integer, 'null']
          minimum: 0
          description: Free GPU memory at start-up (NVML).
        reason:
          type: [string, 'null']
          maxLength: 500
    JobDevice:
      type: object
      additionalProperties: false
      required: [kind, cpuFallback]
      description: |
        Device record of a standard or detail job (1.2.0, data-model.md 2.2). `kind` is `gpu`
        when at least one model step of the job ran on the GPU, else `cpu`. `cpuFallback` is true
        when at least one model step ran on the CPU on a GPU worker (too little free GPU memory
        before the step, or GPU out of memory and the step was retried once on the CPU).
      properties:
        kind:
          $ref: '#/components/schemas/ProcessingDeviceKind'
        name:
          type: [string, 'null']
          maxLength: 200
          description: GPU name when kind is gpu, else null.
        cpuFallback:
          type: boolean
        fallbackReason:
          type: [string, 'null']
          maxLength: 500
          description: Readable reason of the latest CPU fallback; null without a fallback.
          example: 'Not enough free GPU memory for Mega 53-stem (needs 7000 MiB, 3100 MiB free); ran on the CPU.'
    ParentStemName:
      type: string
      description: A standard stem that can be split further (`bass` is never split).
      enum: [vocals, drums, guitar, piano, other]
    DetailStemName:
      type: string
      description: |
        Detail stem names (closed set). `drums`: kick, snare, toms, hihat, cymbals.
        `vocals`: lead, backing. `other`, `guitar`, `piano`: strings, brass, woodwinds, keys,
        synth, acoustic-guitar, electric-guitar, percussion. Every split parent also has
        `rest` (= parent minus the kept sub-stems), listed last.
      enum: [kick, snare, toms, hihat, cymbals, lead, backing, strings, brass, woodwinds, keys, synth, acoustic-guitar, electric-guitar, percussion, rest]
    DetailJobState:
      type: string
      description: '`completed`, `failed` and `cancelled` are terminal.'
      enum: [queued, running, completed, failed, cancelled]
    ParentOutcomeKind:
      type: string
      description: |
        `split`: at least two meaningful sub-stems plus `rest`. `skipped-silent`: the parent is
        (almost) silent. `nothing-further`: fewer than two sub-stems are audible.
        `not-reliable`: the model residual or the reconstruction check failed.
        `not-supported`: no detail model for this parent (bass).
      enum: [split, skipped-silent, nothing-further, not-reliable, not-supported]
    CreateDetailJobRequest:
      type: object
      additionalProperties: false
      required: [standardJobId]
      properties:
        standardJobId:
          type: string
          pattern: '^[0-9a-f]{32}$'
          description: A completed standard job; its stems in the per-audio cache are split.
    DetailJob:
      type: object
      additionalProperties: false
      required: [detailJobId, standardJobId, audioSha256, status, stage, progress, createdAt, updatedAt]
      properties:
        detailJobId:
          type: string
          pattern: '^[0-9a-f]{32}$'
        standardJobId:
          type: string
          pattern: '^[0-9a-f]{32}$'
        audioSha256:
          type: string
          pattern: '^[0-9a-f]{64}$'
        status:
          $ref: '#/components/schemas/DetailJobState'
        stage:
          type: string
          maxLength: 200
          description: e.g. "Queued", "Waiting for standard separations", "Downloading detail model", "Splitting drums (1 of 3)".
        currentParent:
          oneOf:
            - $ref: '#/components/schemas/ParentStemName'
            - type: 'null'
          description: The parent stem being split while running; null otherwise.
        progress:
          type: integer
          minimum: 0
          maximum: 100
          description: Overall progress of the detail job; never decreases.
        error:
          type: [string, 'null']
          maxLength: 1000
          description: Readable failure reason when status is failed.
        device:
          oneOf:
            - $ref: '#/components/schemas/JobDevice'
            - type: 'null'
          description: |
            Where the parent steps ran (1.2.0), folded over the steps so far: `gpu` once any step
            ran on the GPU, `cpuFallback` once any step ran on the CPU on a GPU worker. Null
            before the first parent step and when the result came from the cache.
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    DetailStemInfo:
      type: object
      additionalProperties: false
      required: [name, path, sizeBytes]
      properties:
        name:
          $ref: '#/components/schemas/DetailStemName'
        path:
          type: string
          description: Relative URL /v1/detail-jobs/{detailJobId}/stems/{parent}/{name}.
        sizeBytes:
          type: integer
          minimum: 0
    OutcomeMetrics:
      type: object
      additionalProperties: false
      required: [parentLevelDbfs, activeShare]
      description: Gate and check measurements (diagnostics; thresholds in research.md D-04).
      properties:
        parentLevelDbfs:
          type: number
          maximum: 0
        activeShare:
          type: number
          minimum: 0
          maximum: 1
        modelResidualDb:
          type: [number, 'null']
          description: Energy of parent minus the sum of all model outputs, relative to the parent (dB).
        reconstructionErrorDb:
          type: [number, 'null']
          description: Energy of parent minus (kept sub-stems + rest) as written, relative to the parent (dB); <= -30 for split parents.
    ParentOutcome:
      type: object
      additionalProperties: false
      required: [parent, outcome, model, stems, metrics]
      properties:
        parent:
          $ref: '#/components/schemas/StemName'
        outcome:
          $ref: '#/components/schemas/ParentOutcomeKind'
        model:
          type: [string, 'null']
          enum: [mdx23c-drumsep-6s, uvr-mdxnet-kara-2, mvsep-mega-53, fake-detail, null]
          description: Detail model that ran for this parent; null when none ran.
        stems:
          type: array
          maxItems: 10
          description: Kept sub-stems in display order, `rest` last; empty unless outcome is split.
          items:
            $ref: '#/components/schemas/DetailStemInfo'
        metrics:
          $ref: '#/components/schemas/OutcomeMetrics'
    DetailResult:
      type: object
      additionalProperties: false
      required: [detailJobId, audioSha256, separatorVersion, parents, completedAt]
      properties:
        detailJobId:
          type: string
          pattern: '^[0-9a-f]{32}$'
        audioSha256:
          type: string
          pattern: '^[0-9a-f]{64}$'
        separatorVersion:
          type: string
          description: Version of the detail pipeline (models + thresholds); a change invalidates cached results.
          example: '1'
        parents:
          type: array
          minItems: 1
          maxItems: 6
          description: One outcome per standard stem of the job, in standard display order.
          items:
            $ref: '#/components/schemas/ParentOutcome'
        completedAt:
          type: string
          format: date-time
    ArtworkSource:
      type: string
      description: |
        Where a picture came from (1.3.0). `spotify` album image, `embedded` cover of an
        uploaded file, `youtube` video thumbnail, `coverartarchive` front of the release group,
        `user` picture chosen by the user.
      enum: [spotify, embedded, youtube, coverartarchive, user]
    ArtworkVariant:
      type: string
      description: '`cover` = 600 x 600 JPEG (<= 200 KB), `thumb` = 160 x 160 JPEG (<= 20 KB).'
      enum: [cover, thumb]
    ArtworkInfo:
      type: object
      additionalProperties: false
      required: [source, sha256, coverBytes, thumbBytes]
      description: A normalised picture (1.3.0); files are served by the artwork routes.
      properties:
        source:
          $ref: '#/components/schemas/ArtworkSource'
        sha256:
          type: string
          pattern: '^[0-9a-f]{64}$'
          description: SHA-256 of the cover JPEG bytes; the artwork version and the `ETag`.
        coverBytes:
          type: integer
          minimum: 1
          maximum: 204800
        thumbBytes:
          type: integer
          minimum: 1
          maximum: 20480
        originUrl:
          type: [string, 'null']
          maxLength: 2048
          description: Remote image URL; null for embedded and user pictures. Not shown to the user.
    ArtworkUploadRequest:
      type: object
      required: [file]
      properties:
        file:
          type: string
          contentMediaType: application/octet-stream
          description: JPEG, PNG or WebP picture, at most 10,485,760 bytes.
    ArtworkUpload:
      type: object
      additionalProperties: false
      required: [artworkId, info]
      properties:
        artworkId:
          type: string
          pattern: '^[0-9a-f]{32}$'
        info:
          $ref: '#/components/schemas/ArtworkInfo'
    MetadataJobState:
      type: string
      description: '`completed` and `failed` are terminal (no cancel).'
      enum: [queued, running, completed, failed]
    CreateMetadataJobRequest:
      type: object
      additionalProperties: false
      required: [title]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 500
        artist:
          type: [string, 'null']
          minLength: 1
          maxLength: 500
        album:
          type: [string, 'null']
          minLength: 1
          maxLength: 500
        durationSeconds:
          type: [number, 'null']
          exclusiveMinimum: 0
          maximum: 900
          description: Duration of the normalised audio; the search accepts recordings within +-5 s.
        isrc:
          type: [string, 'null']
          pattern: '^[A-Z]{2}[A-Z0-9]{3}[0-9]{7}$'
          description: Tried before the title search (Spotify sources).
        standardJobId:
          type: [string, 'null']
          pattern: '^[0-9a-f]{32}$'
          description: Only for logging and correlation.
    MetadataJob:
      type: object
      additionalProperties: false
      required: [metadataJobId, status, stage, createdAt, updatedAt]
      properties:
        metadataJobId:
          type: string
          pattern: '^[0-9a-f]{32}$'
        status:
          $ref: '#/components/schemas/MetadataJobState'
        stage:
          type: string
          maxLength: 200
          description: e.g. "Queued", "Searching MusicBrainz", "Fetching album cover", "Reading Wikidata", "Reading Wikipedia", "Completed".
        error:
          type: [string, 'null']
          maxLength: 1000
          description: Readable failure reason when status is failed.
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    MetadataOutcome:
      type: string
      description: '`disabled` when online lookups are switched off (no request was made).'
      enum: [found, not-found, disabled]
    RecordingMatch:
      type: object
      additionalProperties: false
      required: [mbid, title, score, matchedBy]
      properties:
        mbid:
          type: string
          format: uuid
        title:
          type: string
          minLength: 1
          maxLength: 500
        lengthSeconds:
          type: [number, 'null']
          exclusiveMinimum: 0
        score:
          type: integer
          minimum: 0
          maximum: 100
        matchedBy:
          type: string
          enum: [isrc, search]
    ReleaseGroupInfo:
      type: object
      additionalProperties: false
      required: [mbid, title]
      properties:
        mbid:
          type: string
          format: uuid
        title:
          type: string
          minLength: 1
          maxLength: 500
        primaryType:
          type: [string, 'null']
          maxLength: 50
          example: Album
        firstReleaseYear:
          type: [integer, 'null']
          minimum: 1000
          maximum: 2999
    ArtistType:
      type: string
      enum: [group, person, orchestra, choir, character, other]
    ArtistMember:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 500
        fromYear:
          type: [integer, 'null']
          minimum: 1000
          maximum: 2999
        toYear:
          type: [integer, 'null']
          minimum: 1000
          maximum: 2999
    WikipediaSummary:
      type: object
      additionalProperties: false
      required: [language, title, extract, pageUrl, historyUrl, revisionId, licence, licenceUrl]
      description: |
        Wikipedia excerpt (CC BY-SA 4.0) with what its attribution needs: article title and link,
        the authors ("Wikipedia contributors", history link), the licence and link, unmodified.
      properties:
        language:
          type: string
          pattern: '^[a-z]{2,3}$'
        title:
          type: string
          minLength: 1
          maxLength: 500
        extract:
          type: string
          minLength: 1
          maxLength: 2000
          description: The API `extract`, unmodified.
        pageUrl:
          type: string
          pattern: '^https://'
          maxLength: 2048
        historyUrl:
          type: string
          pattern: '^https://'
          maxLength: 2048
        revisionId:
          type: string
          minLength: 1
          maxLength: 50
        licence:
          type: string
          const: CC BY-SA 4.0
        licenceUrl:
          type: string
          const: https://creativecommons.org/licenses/by-sa/4.0/
    ArtistInfo:
      type: object
      additionalProperties: false
      required: [mbid, name, genres, members, fetchedAt]
      properties:
        mbid:
          type: string
          format: uuid
        name:
          type: string
          minLength: 1
          maxLength: 500
        type:
          oneOf:
            - $ref: '#/components/schemas/ArtistType'
            - type: 'null'
        country:
          type: [string, 'null']
          pattern: '^[A-Z]{2}$'
          description: ISO 3166-1 alpha-2.
        beginYear:
          type: [integer, 'null']
          minimum: 1000
          maximum: 2999
        endYear:
          type: [integer, 'null']
          minimum: 1000
          maximum: 2999
          description: Null while the artist is active.
        genres:
          type: array
          maxItems: 8
          description: Wikidata P136 labels (CC0).
          items:
            type: string
            maxLength: 100
        members:
          type: array
          maxItems: 12
          description: Wikidata P527 with P580/P582 (groups only).
          items:
            $ref: '#/components/schemas/ArtistMember'
        website:
          type: [string, 'null']
          pattern: '^https://'
          maxLength: 2048
        wikidataId:
          type: [string, 'null']
          pattern: '^Q[0-9]+$'
        summary:
          oneOf:
            - $ref: '#/components/schemas/WikipediaSummary'
            - type: 'null'
        fetchedAt:
          type: string
          format: date-time
    MetadataResult:
      type: object
      additionalProperties: false
      required: [outcome, warnings]
      description: |
        A failure after the recording was found (e.g. Wikipedia down) still completes with the
        parts obtained plus a warning; only a failure of the recording search fails the job.
      properties:
        outcome:
          $ref: '#/components/schemas/MetadataOutcome'
        recording:
          oneOf:
            - $ref: '#/components/schemas/RecordingMatch'
            - type: 'null'
        releaseGroup:
          oneOf:
            - $ref: '#/components/schemas/ReleaseGroupInfo'
            - type: 'null'
        artwork:
          oneOf:
            - $ref: '#/components/schemas/ArtworkInfo'
            - type: 'null'
          description: Cover Art Archive front of the release group (`source` = `coverartarchive`).
        artist:
          oneOf:
            - $ref: '#/components/schemas/ArtistInfo'
            - type: 'null'
        warnings:
          type: array
          maxItems: 5
          items:
            type: string
            maxLength: 500
    RenderInput:
      type: object
      additionalProperties: false
      required: [path, gain, pan]
      properties:
        path:
          type: string
          minLength: 1
          maxLength: 300
          description: Library-relative path; must match an allow-list pattern (see `createRenderJob`), else 400.
          example: tracks/0b7e4c1a-9d2f-4e8b-a1c3-5f6e7d8c9b0a/stems/drums.flac
        gain:
          type: number
          minimum: 0
          maximum: 1
        pan:
          type: number
          minimum: -1
          maximum: 1
          description: Web Audio StereoPannerNode law (data-model.md 3).
    RenderRange:
      type: object
      additionalProperties: false
      required: [startSeconds, endSeconds]
      description: Requires `endSeconds - startSeconds >= 0.5`; an end beyond the longest input is clamped to it.
      properties:
        startSeconds:
          type: number
          minimum: 0
        endSeconds:
          type: number
          exclusiveMinimum: 0
    RenderFormat:
      type: string
      enum: [flac, wav, mp3]
    RenderOutput:
      type: object
      additionalProperties: false
      required: [format]
      properties:
        format:
          $ref: '#/components/schemas/RenderFormat'
        bitDepth:
          type: integer
          enum: [16, 24]
          default: 24
          description: Ignored for mp3.
        mp3BitrateKbps:
          type: integer
          enum: [192, 256, 320]
          default: 320
          description: Constant bit rate; only for mp3.
        dither:
          type: boolean
          default: true
          description: TPDF dither before quantising; the API sends false for raw single-input renders (bit-identical path).
    RenderMetadata:
      type: object
      additionalProperties: false
      description: Written as WAV/FLAC tags (MP3 gets no tags); control characters are stripped.
      properties:
        title:
          type: [string, 'null']
          maxLength: 200
        artist:
          type: [string, 'null']
          maxLength: 200
        comment:
          type: [string, 'null']
          maxLength: 200
    RenderJobRequest:
      type: object
      additionalProperties: false
      required: [inputs, masterGain, output]
      properties:
        inputs:
          type: array
          minItems: 1
          maxItems: 64
          items:
            $ref: '#/components/schemas/RenderInput'
        masterGain:
          type: number
          minimum: 0
          maximum: 1
        range:
          oneOf:
            - $ref: '#/components/schemas/RenderRange'
            - type: 'null'
          description: Null renders the whole length (the longest input).
        output:
          $ref: '#/components/schemas/RenderOutput'
        metadata:
          $ref: '#/components/schemas/RenderMetadata'
    RenderJobStatus:
      type: string
      description: '`completed`, `failed` and `cancelled` are terminal.'
      enum: [queued, running, completed, failed, cancelled]
    RenderResult:
      type: object
      additionalProperties: false
      required: [fileName, contentType, sizeBytes, sha256, durationSeconds, sampleRate, channels, peakDbfs, appliedGainDb]
      properties:
        fileName:
          type: string
          pattern: '^output\.(flac|wav|mp3)$'
        contentType:
          type: string
          enum: [audio/flac, audio/wav, audio/mpeg]
        sizeBytes:
          type: integer
          minimum: 1
        sha256:
          type: string
          pattern: '^[0-9a-f]{64}$'
        durationSeconds:
          type: number
          exclusiveMinimum: 0
          maximum: 900
        sampleRate:
          type: integer
          const: 44100
        channels:
          type: integer
          const: 2
        peakDbfs:
          type: number
          maximum: 0
          description: Peak of the written samples (before encoding for MP3).
        appliedGainDb:
          type: number
          maximum: 0
          description: 0, or the negative gain that kept the peak at -0.1 dBFS (clip protection).
    RenderJob:
      type: object
      additionalProperties: false
      required: [renderJobId, status, progress, createdAt, updatedAt]
      properties:
        renderJobId:
          type: string
          pattern: '^[0-9a-f]{32}$'
        status:
          $ref: '#/components/schemas/RenderJobStatus'
        progress:
          type: number
          minimum: 0
          maximum: 1
          description: Pass 1 (peak) 0..0.5, pass 2 (write) 0.5..1.
        error:
          type: [string, 'null']
          maxLength: 500
        result:
          oneOf:
            - $ref: '#/components/schemas/RenderResult'
            - type: 'null'
          description: Set when completed.
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    LibraryHealth:
      type: object
      additionalProperties: false
      required: [readable]
      description: Read access to the API library (1.4.0); `readable` when STEMSTUDIO_LIBRARY_DIR exists and is listable.
      properties:
        readable:
          type: boolean
        reason:
          type: [string, 'null']
          maxLength: 500
    LaneHealth:
      type: object
      additionalProperties: false
      required: [queued, running]
      properties:
        queued:
          type: integer
          minimum: 0
        running:
          type: boolean
    LanesHealth:
      type: object
      additionalProperties: false
      required: [render, transcribe]
      description: Lanes beside the separation queue (render 1.4.0, transcribe 1.6.0).
      properties:
        render:
          $ref: '#/components/schemas/LaneHealth'
        transcribe:
          $ref: '#/components/schemas/LaneHealth'
    LyricsAlignmentHealth:
      type: object
      additionalProperties: false
      required: [available, model, modelCached, auto]
      description: |
        Lyrics alignment readiness (1.5.0). `auto` is `STEMSTUDIO_ALIGN_AUTO`: the backend starts
        an alignment without a click when it is `always`, or `gpu` and `deviceInfo.kind` is `gpu`.
      properties:
        available:
          type: boolean
          description: False when the alignment stack cannot be loaded (`reason` says why).
        model:
          type: string
          enum: [large-v3-turbo, small]
          description: Whisper model used for alignment (`STEMSTUDIO_ALIGN_MODEL` turbo|small).
        modelCached:
          type: boolean
          description: True when the model weights are in the model cache (no 1.6 GB download before the first alignment).
        auto:
          type: string
          enum: [gpu, always, never]
        reason:
          type: [string, 'null']
          maxLength: 500
    LyricsJobMode:
      type: string
      description: '`lookup` (LRCLIB, network lane) or `align` (stable-ts + Whisper on the vocal stem).'
      enum: [lookup, align]
    LyricsJobState:
      type: string
      description: '`completed`, `failed` and `cancelled` are terminal.'
      enum: [queued, running, completed, failed, cancelled]
    LyricsLanguage:
      type: [string, 'null']
      pattern: '^[a-z]{2,3}$'
      description: ISO 639 language code (BCP-47 primary tag); null when unknown.
      example: en
    LookupLyricsRequest:
      type: object
      additionalProperties: false
      required: [mode, title, durationSeconds]
      description: Names are the cleaned lookup fields of feature 005 (`SourceMetadata.lookupTitle/lookupArtist`).
      properties:
        mode:
          type: string
          const: lookup
        title:
          type: string
          minLength: 1
          maxLength: 500
        artist:
          type: [string, 'null']
          minLength: 1
          maxLength: 500
        album:
          type: [string, 'null']
          minLength: 1
          maxLength: 500
        durationSeconds:
          type: number
          exclusiveMinimum: 0
          maximum: 900
          description: Duration of the normalised audio; LRCLIB records within +-2 s match.
        standardJobId:
          type: [string, 'null']
          pattern: '^[0-9a-f]{32}$'
          description: Only for logging and correlation.
    AlignLyricsRequest:
      type: object
      additionalProperties: false
      required: [mode, standardJobId, text]
      properties:
        mode:
          type: string
          const: align
        standardJobId:
          type: string
          pattern: '^[0-9a-f]{32}$'
          description: Completed standard job whose vocal stem (`vocals.lead` when split, else `vocals`) is aligned.
        text:
          type: string
          minLength: 1
          maxLength: 20000
          description: Plain lyrics, one line per line break (normalised to `\n`); no control characters except line breaks and tabs.
        language:
          $ref: '#/components/schemas/LyricsLanguage'
        refine:
          oneOf:
            - $ref: '#/components/schemas/TimedLyrics'
            - type: 'null'
          description: "A line-synced document (`syncLevel` line) whose line times are kept; only the words are aligned inside them. Null aligns the whole text."
    CreateLyricsJobRequest:
      description: Body of `POST /v1/lyrics-jobs`, selected by `mode`.
      oneOf:
        - $ref: '#/components/schemas/LookupLyricsRequest'
        - $ref: '#/components/schemas/AlignLyricsRequest'
      discriminator:
        propertyName: mode
        mapping:
          lookup: '#/components/schemas/LookupLyricsRequest'
          align: '#/components/schemas/AlignLyricsRequest'
    LyricsJob:
      type: object
      additionalProperties: false
      required: [lyricsJobId, mode, status, stage, progress, createdAt, updatedAt]
      properties:
        lyricsJobId:
          type: string
          pattern: '^[0-9a-f]{32}$'
        mode:
          $ref: '#/components/schemas/LyricsJobMode'
        status:
          $ref: '#/components/schemas/LyricsJobState'
        stage:
          type: string
          maxLength: 200
          description: '"Queued", "Searching lyrics", "Downloading speech model (1.6 GB)", "Aligning lyrics", "Completed", "Failed", "Cancelled".'
        progress:
          type: number
          minimum: 0
          maximum: 1
        device:
          oneOf:
            - $ref: '#/components/schemas/JobDevice'
            - type: 'null'
          description: Where the alignment ran (align only; null for lookups and before the step starts).
        estimatedSeconds:
          type: [number, 'null']
          minimum: 0
          description: Expected wall time of the alignment on the worker's device (align only; research.md R-04).
        error:
          type: [string, 'null']
          maxLength: 1000
          description: One of the fixed texts of data-model.md 2.4 when status is failed.
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    LyricsOutcome:
      type: string
      description: '`disabled` when online lookups are off (no request was made). Align jobs always complete with `found`.'
      enum: [found, instrumental, not-found, disabled]
    SyncLevel:
      type: string
      description: Best timing in the document. `word` and `line` documents time every word (line-synced words are interpolated); `plain` has no times.
      enum: [word, line, plain]
    WordOrigin:
      type: string
      enum: [source, interpolated, aligned]
    LyricsOrigin:
      type: string
      description: Dominant word origin of a document; `none` for plain documents.
      enum: [source, interpolated, aligned, none]
    LyricsSource:
      type: string
      enum: [lrclib, user]
    LyricsWord:
      type: object
      additionalProperties: false
      required: [text, startMs, endMs, origin, lowConfidence]
      description: Times are integer milliseconds from the start of the track audio; all null in a plain document.
      properties:
        text:
          type: string
          minLength: 1
          maxLength: 100
        startMs:
          type: [integer, 'null']
          minimum: 0
        endMs:
          type: [integer, 'null']
          minimum: 1
          description: '> startMs and at most startMs + 3000.'
        origin:
          oneOf:
            - $ref: '#/components/schemas/WordOrigin'
            - type: 'null'
          description: Null in a plain document.
        lowConfidence:
          type: boolean
          description: Aligned words with probability < 0.2 or zero duration (shown in the expert view).
    LyricsLine:
      type: object
      additionalProperties: false
      required: [startMs, endMs, text, words]
      properties:
        startMs:
          type: [integer, 'null']
          minimum: 0
        endMs:
          type: [integer, 'null']
          minimum: 1
        text:
          type: string
          minLength: 1
          maxLength: 500
        words:
          type: array
          minItems: 1
          maxItems: 40
          items:
            $ref: '#/components/schemas/LyricsWord'
    TimedLyrics:
      type: object
      additionalProperties: false
      required: [syncLevel, origin, language, source, sourceId, sourceDurationSeconds, instrumental, lines, plainText]
      description: |
        One normalised lyrics document (ADR-015 D4, data-model.md 2.1). Invariants (checked by
        the worker and again by the backend): word and line times are all set (`word`, `line`)
        or all null (`plain`); `endMs > startMs`; words lie inside their line; starts never
        decrease across the document; a word lasts at most 3000 ms; an instrumental document
        has no lines.
      properties:
        syncLevel:
          $ref: '#/components/schemas/SyncLevel'
        origin:
          $ref: '#/components/schemas/LyricsOrigin'
        language:
          $ref: '#/components/schemas/LyricsLanguage'
        source:
          $ref: '#/components/schemas/LyricsSource'
        sourceId:
          type: [string, 'null']
          maxLength: 64
          description: LRCLIB record id; null for user text.
        sourceDurationSeconds:
          type: [number, 'null']
          exclusiveMinimum: 0
          description: Duration of the LRCLIB record.
        instrumental:
          type: boolean
        lines:
          type: array
          maxItems: 400
          items:
            $ref: '#/components/schemas/LyricsLine'
        plainText:
          type: string
          maxLength: 20000
          description: The text as received (newlines normalised); used for (re-)alignment. Empty for instrumental documents.
    LyricsResult:
      type: object
      additionalProperties: false
      required: [outcome, lyrics]
      properties:
        outcome:
          $ref: '#/components/schemas/LyricsOutcome'
        lyrics:
          oneOf:
            - $ref: '#/components/schemas/TimedLyrics'
            - type: 'null'
    ScoreProfile:
      type: string
      description: Instrument profile (data-model.md 2.1); `drums` reads the five drum detail stems.
      enum: [vocals, bass, guitar, keys, piano, drums]
    ScoreQuality:
      type: string
      description: Only `piano` uses it - `accurate` = piano CRNN (GPU when available), `fast` = basic-pitch.
      enum: [accurate, fast]
    ScoreResolution:
      type: string
      description: Smallest note value of the quantisation grid (`eighth` = "simplified").
      enum: [sixteenth, eighth]
    KeyName:
      type: string
      description: One of the 30 key signatures in music21 spelling (`-` = flat).
      enum: ['C major', 'G major', 'D major', 'A major', 'E major', 'B major', 'F# major', 'C# major',
             'F major', 'B- major', 'E- major', 'A- major', 'D- major', 'G- major', 'C- major',
             'A minor', 'E minor', 'B minor', 'F# minor', 'C# minor', 'G# minor', 'D# minor', 'A# minor',
             'D minor', 'G minor', 'C minor', 'F minor', 'B- minor', 'E- minor', 'A- minor']
    TranscriptionInput:
      type: object
      additionalProperties: false
      required: [path]
      properties:
        path:
          type: string
          minLength: 1
          maxLength: 300
          description: Library-relative path with the allow-list of `createRenderJob`.
          example: tracks/0b7e4c1a-9d2f-4e8b-a1c3-5f6e7d8c9b0a/stems/bass.flac
    DrumInputs:
      type: object
      additionalProperties: false
      minProperties: 1
      description: The drum detail stems; a missing piece is transcribed as silence and named in a `missing-drum-piece` warning.
      properties:
        kick:
          type: [string, 'null']
          maxLength: 300
          example: tracks/0b7e4c1a-9d2f-4e8b-a1c3-5f6e7d8c9b0a/detail/drums/kick.flac
        snare:
          type: [string, 'null']
          maxLength: 300
        toms:
          type: [string, 'null']
          maxLength: 300
        hihat:
          type: [string, 'null']
          maxLength: 300
        cymbals:
          type: [string, 'null']
          maxLength: 300
    BeatGridTempo:
      type: object
      additionalProperties: false
      required: [kind, bpm, beatsPerBar, beats, downbeats]
      description: |
        The track's beat grid, shifted by the API so that 0 is the start of the input (beats
        before the input start stay, with negative times, for interpolation; data-model.md 2.4).
      properties:
        kind:
          type: string
          const: beat-grid
        bpm:
          type: number
          minimum: 30
          maximum: 300
        beatsPerBar:
          type: integer
          minimum: 1
          maximum: 12
        beats:
          type: array
          minItems: 2
          maxItems: 10000
          description: Ascending beat times in seconds.
          items:
            type: number
            minimum: -900
            maximum: 900
        downbeats:
          type: array
          minItems: 1
          maxItems: 10000
          description: |
            Ascending downbeat times (a subset of `beats`); bar 1 starts at the first one (with more
            than one bar of lead-in, at the first whole bar before it; data-model.md 2.4).
          items:
            type: number
            minimum: -900
            maximum: 900
    ManualTempo:
      type: object
      additionalProperties: false
      required: [kind, bpm, beatsPerBar, firstDownbeatSeconds]
      description: A constant tempo entered by the user; beats are generated over the input length.
      properties:
        kind:
          type: string
          const: manual
        bpm:
          type: number
          minimum: 30
          maximum: 300
        beatsPerBar:
          type: integer
          minimum: 1
          maximum: 12
        firstDownbeatSeconds:
          type: number
          minimum: 0
          maximum: 900
          description: Time of the first downbeat, relative to the input start.
    TempoGrid:
      description: The time base of the score, selected by `kind`.
      oneOf:
        - $ref: '#/components/schemas/BeatGridTempo'
        - $ref: '#/components/schemas/ManualTempo'
      discriminator:
        propertyName: kind
        mapping:
          beat-grid: '#/components/schemas/BeatGridTempo'
          manual: '#/components/schemas/ManualTempo'
    ScoreTitles:
      type: object
      additionalProperties: false
      required: [title]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
          description: The asset name.
        subtitle:
          type: [string, 'null']
          maxLength: 200
          description: '"<track title> - <artist>".'
        instrumentName:
          type: [string, 'null']
          maxLength: 200
          description: Part name, e.g. "Bass".
    TranscriptionJobRequest:
      type: object
      additionalProperties: false
      required: [profile, grid, titles]
      properties:
        profile:
          $ref: '#/components/schemas/ScoreProfile'
        quality:
          $ref: '#/components/schemas/ScoreQuality'
          default: accurate
        input:
          oneOf:
            - $ref: '#/components/schemas/TranscriptionInput'
            - type: 'null'
          description: Required for pitched profiles, null for drums.
        drumInputs:
          oneOf:
            - $ref: '#/components/schemas/DrumInputs'
            - type: 'null'
          description: Required for drums, null for pitched profiles.
        range:
          oneOf:
            - $ref: '#/components/schemas/RenderRange'
            - type: 'null'
          description: Part of the input to transcribe; null = all of it. Times in the result are relative to its start.
        grid:
          $ref: '#/components/schemas/TempoGrid'
        resolution:
          oneOf:
            - $ref: '#/components/schemas/ScoreResolution'
            - type: 'null'
          description: Null = the profile's default (vocals eighth, the others sixteenth).
        keyOverride:
          oneOf:
            - $ref: '#/components/schemas/KeyName'
            - type: 'null'
          description: Null = estimated from the notes (not used for drums).
        titles:
          $ref: '#/components/schemas/ScoreTitles'
    TranscriptionStage:
      type: string
      enum: [loading-model, transcribing, notating, engraving]
    ScoreFileRole:
      type: string
      enum: [pdf, musicxml, midi]
    TranscriptionFile:
      type: object
      additionalProperties: false
      required: [role, fileName, contentType, sizeBytes, sha256]
      properties:
        role:
          $ref: '#/components/schemas/ScoreFileRole'
        fileName:
          type: string
          enum: [score.pdf, score.musicxml, score.mid]
        contentType:
          type: string
          enum: [application/pdf, application/vnd.recordare.musicxml+xml, audio/midi]
        sizeBytes:
          type: integer
          minimum: 1
        sha256:
          type: string
          pattern: '^[0-9a-f]{64}$'
    KeyInfo:
      type: object
      additionalProperties: false
      required: [tonic, mode, confidence, source]
      properties:
        tonic:
          type: string
          pattern: '^[A-G](#|-)?$'
          description: music21 spelling (`-` = flat).
          example: A-
        mode:
          type: string
          enum: [major, minor]
        confidence:
          type: number
          minimum: 0
          maximum: 1
          description: Correlation of the Krumhansl-Schmuckler estimate clamped to 0..1; 1 for overrides.
        source:
          type: string
          enum: [estimated, override]
    ScoreWarningCode:
      type: string
      enum: [manual-tempo, low-key-confidence, notes-cleaned, dense-capped, detail-bleed, cpu-piano, few-notes, missing-drum-piece]
    ScoreWarning:
      type: object
      additionalProperties: false
      required: [code, text]
      properties:
        code:
          $ref: '#/components/schemas/ScoreWarningCode'
        text:
          type: string
          minLength: 1
          maxLength: 300
          description: English text of data-model.md 2.7.
    ScoreEngine:
      type: string
      enum: [basic-pitch, piano-crnn, drum-onsets, fake]
    ScoreSummary:
      type: object
      additionalProperties: false
      required: [profile, engine, quality, key, bpm, timeSignature, bars, notes, pages, resolution, warnings, attribution]
      properties:
        profile:
          $ref: '#/components/schemas/ScoreProfile'
        engine:
          $ref: '#/components/schemas/ScoreEngine'
        quality:
          oneOf:
            - $ref: '#/components/schemas/ScoreQuality'
            - type: 'null'
          description: Set for piano only.
        key:
          oneOf:
            - $ref: '#/components/schemas/KeyInfo'
            - type: 'null'
          description: Null for drums.
        bpm:
          type: integer
          minimum: 30
          maximum: 300
          description: Rounded tempo of the tempo mark (quarter = bpm).
        timeSignature:
          type: string
          pattern: '^([1-9]|1[0-2])/4$'
        bars:
          type: integer
          minimum: 1
        notes:
          type: integer
          minimum: 1
          description: Notes (or drum hits) in the score.
        pages:
          type: integer
          minimum: 1
        resolution:
          $ref: '#/components/schemas/ScoreResolution'
        warnings:
          type: array
          maxItems: 8
          items:
            $ref: '#/components/schemas/ScoreWarning'
        attribution:
          type: [string, 'null']
          maxLength: 300
          description: Model credit (piano CRNN, CC BY 4.0); null for the other engines.
    TranscriptionResult:
      type: object
      additionalProperties: false
      required: [files, summary]
      properties:
        files:
          type: array
          minItems: 3
          maxItems: 3
          description: One file per role, in the order pdf, musicxml, midi.
          items:
            $ref: '#/components/schemas/TranscriptionFile'
        summary:
          $ref: '#/components/schemas/ScoreSummary'
    TranscriptionJob:
      type: object
      additionalProperties: false
      required: [transcriptionJobId, status, stage, progress, createdAt, updatedAt]
      properties:
        transcriptionJobId:
          type: string
          pattern: '^[0-9a-f]{32}$'
        status:
          $ref: '#/components/schemas/RenderJobStatus'
        stage:
          oneOf:
            - $ref: '#/components/schemas/TranscriptionStage'
            - type: 'null'
          description: Null while queued and after the job ended.
        progress:
          type: number
          minimum: 0
          maximum: 1
        device:
          oneOf:
            - $ref: '#/components/schemas/JobDevice'
            - type: 'null'
          description: Where the model step ran (always `cpu` for basic-pitch and drums); null before it.
        error:
          type: [string, 'null']
          maxLength: 500
        result:
          oneOf:
            - $ref: '#/components/schemas/TranscriptionResult'
            - type: 'null'
          description: Set when completed.
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    ModelReadiness:
      type: string
      enum: [ready, not-downloaded]
    TranscriptionHealth:
      type: object
      additionalProperties: false
      required: [models, font]
      description: Readiness of the transcription models and the music font (1.6.0).
      properties:
        models:
          type: object
          additionalProperties: false
          required: [basic-pitch-icassp2022, piano-crnn-note-pedal]
          properties:
            basic-pitch-icassp2022:
              $ref: '#/components/schemas/ModelReadiness'
            piano-crnn-note-pedal:
              $ref: '#/components/schemas/ModelReadiness'
        font:
          type: object
          additionalProperties: false
          required: [leipzig]
          properties:
            leipzig:
              type: boolean
              description: True when fontconfig lists the Leipzig font (PDF tempo marks need it).
    ProblemDetails:
      type: object
      description: RFC 9457 problem details. Extension members are allowed.
      required: [title, status]
      properties:
        type:
          type: string
          default: about:blank
        title:
          type: string
        status:
          type: integer
          minimum: 400
          maximum: 599
        detail:
          type: [string, 'null']
        instance:
          type: [string, 'null']
      additionalProperties: true
  responses:
    BadRequest:
      description: Invalid URL, unsupported host, playlist/album, or malformed request.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          example:
            type: about:blank
            title: Invalid source
            status: 400
            detail: Only YouTube video and Spotify track URLs are supported; playlists and albums are not.
    PayloadTooLarge:
      description: Upload larger than 200 MiB (209,715,200 bytes).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          example:
            title: File too large
            status: 413
            detail: The file is larger than 200 MiB (209,715,200 bytes).
    UnsupportedMediaType:
      description: Upload is not .mp3, .wav or .flac, or the request body type is neither JSON nor multipart.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          example:
            title: Unsupported file type
            status: 415
            detail: Only MP3, WAV and FLAC files are supported.
    NotFound:
      description: Unknown job or stem.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          example:
            title: Not found
            status: 404
            detail: Job 3f2b8c1d9e4a4f6b8a7c5d3e2f1a0b9c does not exist.
    NotCompleted:
      description: The job is not completed (yet), so no result or stems exist.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          example:
            title: Job not completed
            status: 409
            detail: Job is in state separating.
    DetailConflict:
      description: |
        The request conflicts with the current state: the standard job is not completed or its
        stems are no longer in the worker cache (create), the detail job is not completed
        (result, stems), or it is already completed or failed (cancel).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          example:
            title: Conflict
            status: 409
            detail: Detail job is in state running.
    ArtworkFile:
      description: The picture as JPEG; `ETag` is the quoted SHA-256 of the cover JPEG.
      headers:
        ETag:
          schema:
            type: string
          example: '"2c26b46b68ffc68ff99b453c1d30413413422d706483bfa0f98a5e886266e7ae"'
        Content-Length:
          schema:
            type: integer
      content:
        image/jpeg:
          schema:
            type: string
            contentMediaType: image/jpeg
    ValidationFailed:
      description: |
        The JSON body does not match the request schema (1.3.0). Problem details with an
        `errors` extension (field -> messages).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          example:
            title: Validation failed
            status: 422
            detail: The request body is not valid.
            errors:
              title:
                - String should have at least 1 character
    InvalidInputPath:
      description: An input path is not on the allow-list or its real path escapes the library root (1.4.0).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          example:
            type: invalid-input-path
            title: Invalid input path
            status: 400
            detail: 'Input path is not allowed: tracks/../stemstudio.db'
    InputNotFound:
      description: An allowed input path does not exist; `detail` names it (1.4.0).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          example:
            type: input-not-found
            title: Input not found
            status: 404
            detail: 'Input not found: tracks/0b7e4c1a-9d2f-4e8b-a1c3-5f6e7d8c9b0a/detail/drums/kick.flac'
    RenderNotCompleted:
      description: The render job is not completed (yet), so there is no file.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          example:
            type: render-not-completed
            title: Render not completed
            status: 409
            detail: Render job is in state running.
    LyricsConflict:
      description: |
        `createLyricsJob` (align): the standard job is not completed, or its vocal stem is no
        longer in the worker cache. `cancelLyricsJob`: the job is a lookup or already terminal.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          examples:
            standardNotCompleted:
              value:
                type: standard-job-not-completed
                title: Standard job not completed
                status: 409
                detail: Job 3f2b8c1d9e4a4f6b8a7c5d3e2f1a0b9c is in state separating.
            notCancellable:
              value:
                type: lyrics-job-not-cancellable
                title: Lyrics job cannot be cancelled
                status: 409
                detail: Lyrics job is in state completed.
    LyricsNotCompleted:
      description: The lyrics job is not completed (yet), so there is no result.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          example:
            type: lyrics-not-completed
            title: Lyrics job not completed
            status: 409
            detail: Lyrics job is in state running.
    TranscriptionNotCompleted:
      description: The transcription job is not completed (yet), so there are no files.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          example:
            type: transcription-not-completed
            title: Transcription not completed
            status: 409
            detail: Transcription job is in state running.
  examples:
    QueuedJob:
      value:
        jobId: 3f2b8c1d9e4a4f6b8a7c5d3e2f1a0b9c
        sourceKey: youtube:dQw4w9WgXcQ
        sourceType: youtube
        status: queued
        stage: Queued
        progress: 0
        error: null
        metadata: null
        device: null
        artwork: null
        createdAt: '2026-11-14T12:00:00Z'
        updatedAt: '2026-11-14T12:00:00Z'
    SeparatingJob:
      value:
        jobId: 3f2b8c1d9e4a4f6b8a7c5d3e2f1a0b9c
        sourceKey: youtube:dQw4w9WgXcQ
        sourceType: youtube
        status: separating
        stage: Separating stems
        progress: 47
        error: null
        metadata:
          title: Never Gonna Give You Up
          artist: Rick Astley
          sourceUrl: https://www.youtube.com/watch?v=dQw4w9WgXcQ
          album: null
          isrc: null
          durationSeconds: null
          lookupTitle: Never Gonna Give You Up
          lookupArtist: Rick Astley
        device:
          kind: gpu
          name: NVIDIA GeForce RTX 5070 Ti
          cpuFallback: false
          fallbackReason: null
        artwork: null
        createdAt: '2026-11-14T12:00:00Z'
        updatedAt: '2026-11-14T12:03:10Z'
    CompletedJob:
