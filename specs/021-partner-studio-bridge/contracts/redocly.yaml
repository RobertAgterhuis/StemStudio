# Lint configuration for the StemStudio OpenAPI 3.1 contract deltas of feature 021.
# Run from the repo root:
#   npx @redocly/cli@2.78.0 lint --config specs/021-partner-studio-bridge/contracts/redocly.yaml \
#     specs/021-partner-studio-bridge/contracts/backend-api.delta.openapi.yaml \
#     specs/021-partner-studio-bridge/contracts/worker-api.delta.openapi.yaml \
#     specs/021-partner-studio-bridge/contracts/generator-api.delta.openapi.yaml
# (Phase 0 merges the deltas into full documents backend 1.20.0, worker 1.12.0, generator 1.2.0.)
extends:
  - recommended
rules:
  # GET /api/amp/catalogue, /api/amp/irs and /api/amp/rigs have no client-error cases; every other operation lists its 4XX responses.
  operation-4xx-response: warn
  no-server-example.com: off
  # Delta documents define merge-only schemas (PartnerDetails, DawExportProvenance, ...) that no delta operation references.
  no-unused-components: warn
