openapi: 3.1.0
info:
  title: StemStudio Generator API
  version: 1.0.0
  summary: Internal job API of the optional, GPU-only generator service (style transfer with ACE-Step 1.5).
  description: |
    Called only by the StemStudio backend (never by the browser). The service is optional and
    opt-in (`docker-compose.generative.yml`, ADR-018 D1); it has no host port. Generation jobs run
    one at a time in a FIFO queue; every GPU step holds the shared cross-container GPU lease
    (`flock` on `/gpu-lease/gpu.lock`, ADR-018 D3) and passes the NVML free-memory check
    (ADR-018 D4). The backend polls `GET /v1/generations/{generationId}` every 2 s and, when the
    job is `completed`, downloads every take and deletes the job.

    * JSON uses camelCase. Pydantic models: `generator/src/stemstudio_generator/schemas.py`.
    * Errors are RFC 9457 problem details (`application/problem+json`) with an extension member
      `code` (`GeneratorProblemCode`).
    * Without a usable GPU the service still starts: `/health` reports `ready: false` and the
      probe reason, and every create request is refused with `409` `code: gpuRequired`. There is
      no CPU path for generation (constitution 1.3.0, GPU-only generative services exception).
    * `STEMSTUDIO_GENERATOR=fake` replaces ACE-Step by a deterministic fake engine (CI and E2E,
      no torch); `STEMSTUDIO_FAKE_GENERATOR_MODE` selects `ready`, `no-gpu`, `oom`, `oom-twice`,
      `busy` or `slow` (009 data-model.md 1).
    * Progress is an integer percentage 0-100 like the worker's job progress (Phase 0 outcome).
    * Takes are numbered from 1.
    * Changelog: 1.0.0 (new, feature 009) - health, restyle generations (`kind: restyle`,
      ACE-Step `cover` for a range, `repaint` for an in-place section), cancel, take audio,
      delete. See ADR-018.
  license:
    name: MIT
    identifier: MIT
servers:
  - url: http://generator:8010
    description: Docker compose internal network (no host port).
security: []  # internal service on a private network; no authentication
tags:
  - name: health
    description: Liveness, readiness and models.
  - name: generations
    description: Generation jobs and their takes.
paths:
  /health:
    get:
      tags: [health]
      operationId: getHealth
      summary: Liveness, readiness (usable GPU), models and queue.
      description: |
        Always `200` while the process runs. `ready` is true only when the start-up probe found a
        usable NVIDIA GPU (same probe and reason texts as the worker's `DeviceInfo`, ADR-012 D2).
        The backend treats a missing or slow (> 2 s) answer as "not installed".
      responses:
        '200':
          description: Service status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeneratorHealth'
              examples:
                ready:
                  $ref: '#/components/examples/ReadyHealth'
                noGpu:
                  $ref: '#/components/examples/NoGpuHealth'
  /v1/generations:
    post:
      tags: [generations]
      operationId: createGeneration
      summary: Queue a generation job.
      description: |
        `multipart/form-data` with one part `params` (JSON `CreateGenerationRequest`) and 1-6
        parts `stem` (FLAC or WAV, each <= 300 MiB, same sample rate and length within one frame).
        The stems are summed at unity; for `mode: range` the range is cut from the sum, for
        `mode: inPlace` the whole sum is the source and the range is repainted. Validation:
        `rangeEndSeconds - rangeStartSeconds` is 10-480 s, the range lies inside the source
        (else `422` `code: sourceTooShort`), the number of seeds is the number of takes.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CreateGenerationUpload'
            encoding:
              params:
                contentType: application/json
              stem:
                contentType: audio/flac, audio/wav, audio/x-wav, application/octet-stream
            examples:
              rangeRestyle:
                $ref: '#/components/examples/RangeRestyleUpload'
              inPlaceRestyle:
                $ref: '#/components/examples/InPlaceRestyleUpload'
      responses:
        '202':
          description: Job accepted and queued.
          headers:
            Location:
              description: URL of the generation status resource.
              schema:
                type: string
              example: /v1/generations/5b0f7e2c9a1d4c3e8f6a2b1d0c9e8f7a
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Generation'
              examples:
                queued:
                  $ref: '#/components/examples/QueuedRestyle'
        '400':
          $ref: '#/components/responses/InvalidInput'
        '409':
          $ref: '#/components/responses/GpuRequired'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/SourceTooShort'
  /v1/generations/{generationId}:
    parameters:
      - $ref: '#/components/parameters/GenerationId'
    get:
      tags: [generations]
      operationId: getGeneration
      summary: Status, stage, progress and (when completed) the takes of a generation.
      responses:
        '200':
          description: Current state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Generation'
              examples:
                queued:
                  $ref: '#/components/examples/QueuedRestyle'
                waitingForGpu:
                  $ref: '#/components/examples/WaitingForGpuRestyle'
                running:
                  $ref: '#/components/examples/RunningRestyle'
                completed:
                  $ref: '#/components/examples/CompletedRestyle'
                failed:
                  $ref: '#/components/examples/FailedOutOfMemory'
                cancelled:
                  $ref: '#/components/examples/CancelledRestyle'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [generations]
      operationId: deleteGeneration
      summary: Delete a generation and its files (a running job is cancelled first).
      responses:
        '204':
          description: Deleted.
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/generations/{generationId}/cancel:
    parameters:
      - $ref: '#/components/parameters/GenerationId'
    post:
      tags: [generations]
      operationId: cancelGeneration
      summary: Cancel a generation (no-op when it is already terminal).
      description: |
        `queued` and `waitingForGpu` jobs are cancelled immediately; a `running` job stops at the
        next progress callback (between diffusion steps) or between takes and releases the lease.
        A terminal job is returned unchanged.
      responses:
        '200':
          description: The job after the cancel request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Generation'
              examples:
                cancelled:
                  $ref: '#/components/examples/CancelledRestyle'
                completed:
                  $ref: '#/components/examples/CompletedRestyle'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/generations/{generationId}/takes/{index}:
    parameters:
      - $ref: '#/components/parameters/GenerationId'
      - $ref: '#/components/parameters/TakeIndex'
    get:
      tags: [generations]
      operationId: getTakeAudio
      summary: Download one take (FLAC 24-bit stereo 48 kHz with AI-generated Vorbis comments).
      description: |
        Vorbis comments: `AI_GENERATED=true`, `GENERATOR=ACE-Step 1.5 (<revision>)`,
        `STEMSTUDIO_GENERATION=<generationId>`, `STEMSTUDIO_TAKE=<index>`,
        `COMMENT=AI-generated with StemStudio`. The `ETag` is the take's `sha256`.
        Single byte ranges are supported.
      parameters:
        - $ref: '#/components/parameters/Range'
      responses:
        '200':
          $ref: '#/components/responses/TakeFile'
        '206':
          $ref: '#/components/responses/TakeFilePart'
        '404':
          $ref: '#/components/responses/NotFound'
        '416':
          $ref: '#/components/responses/RangeNotSatisfiable'
components:
  parameters:
    GenerationId:
      name: generationId
      in: path
      required: true
      description: Generation identifier (32 lower-case hex characters, a UUID without dashes).
      schema:
        type: string
        pattern: '^[0-9a-f]{32}$'
      example: 5b0f7e2c9a1d4c3e8f6a2b1d0c9e8f7a
    TakeIndex:
      name: index
      in: path
      required: true
      description: Take number, starting at 1.
      schema:
        type: integer
        minimum: 1
        maximum: 2
    Range:
      name: Range
      in: header
      required: false
      description: A single byte range (`bytes=<start>-<end>`).
      schema:
        type: string
        pattern: '^bytes=[0-9]*-[0-9]*$'
      example: bytes=0-65535
  responses:
    InvalidInput:
      description: Invalid parameters or files (missing `params`, schema violation, 0 or more than 6 stems, unreadable audio, mismatched sample rates or lengths, range length outside 10-480 s, number of seeds outside 1-2).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/GeneratorProblem'
          example:
            title: Invalid input
            status: 400
            detail: The range must be between 10 and 480 seconds long.
            code: invalidInput
    GpuRequired:
      description: The service has no usable GPU (`/health.ready` is false); generation needs an NVIDIA GPU.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/GeneratorProblem'
          example:
            title: GPU required
            status: 409
            detail: No NVIDIA GPU is available to this service (CUDA is not available).
            code: gpuRequired
    PayloadTooLarge:
      description: A stem part is larger than 300 MiB (314,572,800 bytes).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/GeneratorProblem'
          example:
            title: File too large
            status: 413
            detail: Stem 3 is larger than 300 MiB (314,572,800 bytes).
            code: invalidInput
    UnsupportedMediaType:
      description: The body is not multipart, or a stem part is neither FLAC nor WAV.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/GeneratorProblem'
          example:
            title: Unsupported file type
            status: 415
            detail: Only FLAC and WAV stems are supported.
            code: invalidInput
    SourceTooShort:
      description: The summed source is shorter than the requested range end.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/GeneratorProblem'
          example:
            title: Source too short
            status: 422
            detail: The range ends at 105.0 s but the source is 98.4 s long.
            code: sourceTooShort
    NotFound:
      description: Unknown generation, or the take does not exist (job not completed or index too high).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/GeneratorProblem'
          example:
            title: Not found
            status: 404
            detail: Generation 5b0f7e2c9a1d4c3e8f6a2b1d0c9e8f7a does not exist.
    RangeNotSatisfiable:
      description: The requested byte range lies outside the file.
      headers:
        Content-Range:
          schema:
            type: string
          example: bytes */1048576
    TakeFile:
      description: The whole take.
      headers:
        ETag:
          schema:
            type: string
          description: Quoted SHA-256 of the file.
        Accept-Ranges:
          schema:
            type: string
            const: bytes
        Content-Length:
          schema:
            type: integer
      content:
        audio/flac:
          schema:
            type: string
            contentMediaType: audio/flac
    TakeFilePart:
      description: The requested byte range of the take.
      headers:
        Content-Range:
          schema:
            type: string
          example: bytes 0-65535/1048576
        Content-Length:
          schema:
            type: integer
      content:
        audio/flac:
          schema:
            type: string
            contentMediaType: audio/flac
  schemas:
    GeneratorProblem:
      type: object
      description: RFC 9457 problem details with the extension member `code`. Extension members are allowed.
      required: [title, status]
      properties:
        type:
          type: string
          default: about:blank
        title:
          type: string
        status:
          type: integer
          minimum: 400
          maximum: 599
        detail:
          type: [string, 'null']
        instance:
          type: [string, 'null']
        code:
          $ref: '#/components/schemas/GeneratorProblemCode'
      additionalProperties: true
    GeneratorProblemCode:
      type: string
      description: Machine-readable reason of a refused request.
      enum: [invalidInput, gpuRequired, sourceTooShort]
    GeneratorEngine:
      type: string
      description: The engine behind the service (`STEMSTUDIO_GENERATOR`); `fake` in CI and E2E.
      enum: [acestep, fake]
    GeneratorHealth:
      type: object
      additionalProperties: false
      required: [status, contractVersion, engine, ready, reason, device, models, queue]
      properties:
        status:
          type: string
          const: ok
        contractVersion:
          type: string
          example: 1.0.0
        engine:
          $ref: '#/components/schemas/GeneratorEngine'
        ready:
          type: boolean
          description: True iff `device.kind` is `gpu` (generation is possible).
        reason:
          type: [string, 'null']
          maxLength: 500
          description: Why the service is not ready (the probe reason); null when ready.
        device:
          $ref: '#/components/schemas/DeviceInfo'
        models:
          type: array
          maxItems: 16
          items:
            $ref: '#/components/schemas/ModelStatus'
        queue:
          $ref: '#/components/schemas/QueueStatus'
    QueueStatus:
      type: object
      additionalProperties: false
      required: [queued, running]
      properties:
        queued:
          type: integer
          minimum: 0
          description: Jobs waiting in the queue (excluding the running one).
        running:
          type: [string, 'null']
          pattern: '^[0-9a-f]{32}$'
          description: Id of the job being processed (also while it waits for the GPU or downloads a model); null when idle.
    ModelId:
      type: string
      description: |
        Model files of the service. `acestep-v15-turbo` (DiT 2B), `acestep-vae`,
        `qwen3-embedding-0.6b` (text encoder) and `acestep-5hz-lm-1.7b` (language model, only
        loaded for songs from 1.1.0) form the `ACE-Step/Ace-Step1.5` bundle (MIT).
      enum: [acestep-v15-turbo, acestep-vae, qwen3-embedding-0.6b, acestep-5hz-lm-1.7b]
    ModelStatus:
      type: object
      additionalProperties: false
      required: [id, present, bytes, revision]
      properties:
        id:
          $ref: '#/components/schemas/ModelId'
        present:
          type: boolean
          description: True when the files are in the model cache (no download needed).
        bytes:
          type: integer
          minimum: 0
          description: Download size (present or not).
        revision:
          type: string
          maxLength: 64
          description: Pinned Hugging Face revision.
    ProcessingDeviceKind:
      type: string
      enum: [cpu, gpu]
      description: The CPU, or the NVIDIA GPU (CUDA). Copied from worker 1.2.0.
    DeviceInfo:
      type: object
      additionalProperties: false
      required: [kind]
      description: |
        Device found by the start-up probe; same shape and reason texts as the worker's
        `DeviceInfo` (worker 1.2.0, ADR-012 D2). On a service without a usable GPU `kind` is
        `cpu` and `reason` says why (the service is then not ready).
      properties:
        kind:
          $ref: '#/components/schemas/ProcessingDeviceKind'
        name:
          type: [string, 'null']
          maxLength: 200
          example: NVIDIA GeForce RTX 5070 Ti
        computeCapability:
          type: [string, 'null']
          pattern: '^[0-9]{1,2}\.[0-9]{1,2}$'
          example: '12.0'
        totalMemoryMiB:
          type: [integer, 'null']
          minimum: 0
        freeMemoryMiB:
          type: [integer, 'null']
          minimum: 0
          description: Free GPU memory at start-up (NVML).
        reason:
          type: [string, 'null']
          maxLength: 500
    JobDevice:
      type: object
      additionalProperties: false
      required: [kind, cpuFallback]
      description: |
        Device record of a generation (worker 1.2.0 shape). `kind` is `gpu` once a step ran;
        `cpuFallback` is always false (generation never falls back to the CPU); `fallbackReason`
        is null.
      properties:
        kind:
          $ref: '#/components/schemas/ProcessingDeviceKind'
        name:
          type: [string, 'null']
          maxLength: 200
        cpuFallback:
          type: boolean
        fallbackReason:
          type: [string, 'null']
          maxLength: 500
    GenerationKind:
      type: string
      description: Job kind. 1.0.0 has `restyle` only.
      enum: [restyle]
    GenerationStatus:
      type: string
      description: |
        `queued` -> `waitingForGpu` (lease or free memory) -> `downloadingModel` (first use only)
        -> `running` -> `completed`; any non-terminal state -> `failed` or `cancelled`.
        `completed`, `failed` and `cancelled` are terminal (009 data-model.md 2.4).
      enum: [queued, waitingForGpu, downloadingModel, running, completed, failed, cancelled]
    GenerationErrorCode:
      type: string
      description: |
        `gpuRequired` the GPU became unusable; `gpuBusy` not enough free GPU memory within the
        wait limit (another program holds it); `outOfMemory` out of GPU memory twice (standard and
        low-memory profile); `modelDownloadFailed`; `interrupted` the service restarted while the
        job was active; `invalidInput` the audio could not be processed; `engineError` any other
        model failure.
      enum: [gpuRequired, gpuBusy, outOfMemory, modelDownloadFailed, interrupted, invalidInput, engineError]
    GenerationError:
      type: object
      additionalProperties: false
      required: [code, message]
      properties:
        code:
          $ref: '#/components/schemas/GenerationErrorCode'
        message:
          type: string
          maxLength: 500
    RestyleMode:
      type: string
      description: '`range`: the range becomes the take (ACE-Step `cover`). `inPlace`: the whole source is kept and only the range is restyled (ACE-Step `repaint`); the take has the source length.'
      enum: [range, inPlace]
    Seed:
      type: integer
      minimum: 0
      maximum: 2147483647
    RestyleParams:
      type: object
      additionalProperties: false
      required: [caption, audioCoverStrength, seeds, mode, rangeStartSeconds, rangeEndSeconds]
      properties:
        caption:
          type: string
          minLength: 1
          maxLength: 512
          description: Style caption built by the backend's prompt builder (ADR-018 D7).
        audioCoverStrength:
          type: number
          minimum: 0
          maximum: 1
          description: Adherence to the source (Subtle 0.85, Light 0.70, Balanced 0.55, Strong 0.40, Free 0.25).
        inferenceSteps:
          type: integer
          minimum: 1
          maximum: 20
          default: 8
        shift:
          type: number
          minimum: 1
          maximum: 5
          default: 3.0
        seeds:
          type: array
          minItems: 1
          maxItems: 2
          description: One seed per take.
          items:
            $ref: '#/components/schemas/Seed'
        mode:
          $ref: '#/components/schemas/RestyleMode'
        rangeStartSeconds:
          type: number
          minimum: 0
        rangeEndSeconds:
          type: number
          exclusiveMinimum: 0
          description: '`rangeEndSeconds - rangeStartSeconds` must be 10-480 s.'
    RestyleGenerationRequest:
      type: object
      additionalProperties: false
      required: [kind, restyle]
      properties:
        kind:
          type: string
          const: restyle
        restyle:
          $ref: '#/components/schemas/RestyleParams'
    CreateGenerationRequest:
      description: The JSON `params` part; one member named by `kind`.
      oneOf:
        - $ref: '#/components/schemas/RestyleGenerationRequest'
      discriminator:
        propertyName: kind
        mapping:
          restyle: '#/components/schemas/RestyleGenerationRequest'
    CreateGenerationUpload:
      type: object
      required: [params, stem]
      properties:
        params:
          $ref: '#/components/schemas/CreateGenerationRequest'
        stem:
          type: array
          minItems: 1
          maxItems: 6
          items:
            type: string
            contentMediaType: application/octet-stream
    TakeModel:
      type: object
      additionalProperties: false
      required: [id, revision]
      properties:
        id:
          type: string
          maxLength: 64
          example: acestep-v15-turbo
        revision:
          type: string
          maxLength: 64
    GeneratedTake:
      type: object
      additionalProperties: false
      required: [index, seed, durationSeconds, sampleRate, sha256, bytes, peakDbfs, model]
      properties:
        index:
          type: integer
          minimum: 1
          maximum: 2
        seed:
          $ref: '#/components/schemas/Seed'
        durationSeconds:
          type: number
          exclusiveMinimum: 0
        sampleRate:
          type: integer
          const: 48000
        sha256:
          type: string
          pattern: '^[0-9a-f]{64}$'
          description: SHA-256 of the FLAC file.
        bytes:
          type: integer
          minimum: 1
        peakDbfs:
          type: number
          maximum: 0
          description: Sample peak of the take in dBFS (for the library's audio facts).
        model:
          $ref: '#/components/schemas/TakeModel'
    Generation:
      type: object
      additionalProperties: false
      required: [generationId, kind, status, progress, stage, takes, warnings, createdAt, updatedAt]
      description: A generation job. Exactly the parameter member named by `kind` is present (`restyle`).
      properties:
        generationId:
          type: string
          pattern: '^[0-9a-f]{32}$'
        kind:
          $ref: '#/components/schemas/GenerationKind'
        status:
          $ref: '#/components/schemas/GenerationStatus'
        progress:
          type: integer
          minimum: 0
          maximum: 100
          description: Percentage within the job; monotonic within a status.
        stage:
          type: string
          maxLength: 200
          description: e.g. "Queued", "Waiting for the GPU", "Downloading model (2.1 of 10.1 GB)", "Loading model", "Generating take 1 of 2", "Retrying with low memory", "Writing takes".
        restyle:
          $ref: '#/components/schemas/RestyleParams'
        takes:
          type: array
          maxItems: 2
          description: Empty until completed.
          items:
            $ref: '#/components/schemas/GeneratedTake'
        warnings:
          type: array
          maxItems: 5
          description: Readable warnings that do not fail the job (e.g. "The summed stems clipped; peaks were limited.").
          items:
            type: string
            maxLength: 300
        device:
          oneOf:
            - $ref: '#/components/schemas/JobDevice'
            - type: 'null'
        error:
          oneOf:
            - $ref: '#/components/schemas/GenerationError'
            - type: 'null'
          description: Set iff `status` is `failed`.
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
  examples:
    ReadyHealth:
      summary: GPU found, no model downloaded yet, idle.
      value:
        status: ok
        contractVersion: 1.0.0
        engine: acestep
        ready: true
        reason: null
        device:
          kind: gpu
          name: NVIDIA GeForce RTX 5070 Ti
          computeCapability: '12.0'
          totalMemoryMiB: 16303
          freeMemoryMiB: 14960
          reason: null
        models:
          - id: acestep-v15-turbo
            present: false
            bytes: 4790000000
            revision: 19671f406d603126926c1b7e2adc169acbcade22
          - id: acestep-vae
            present: false
            bytes: 340000000
            revision: 19671f406d603126926c1b7e2adc169acbcade22
          - id: qwen3-embedding-0.6b
            present: false
            bytes: 1190000000
            revision: 19671f406d603126926c1b7e2adc169acbcade22
        queue:
          queued: 0
          running: null
    NoGpuHealth:
      summary: Started without a usable GPU; generation is refused.
      value:
        status: ok
        contractVersion: 1.0.0
        engine: acestep
        ready: false
        reason: CUDA is not available (no NVIDIA GPU or driver visible in the container).
        device:
          kind: cpu
          name: null
          computeCapability: null
          totalMemoryMiB: null
          freeMemoryMiB: null
          reason: CUDA is not available (no NVIDIA GPU or driver visible in the container).
        models:
          - id: acestep-v15-turbo
            present: false
            bytes: 4790000000
            revision: 19671f406d603126926c1b7e2adc169acbcade22
          - id: acestep-vae
            present: false
            bytes: 340000000
            revision: 19671f406d603126926c1b7e2adc169acbcade22
          - id: qwen3-embedding-0.6b
            present: false
            bytes: 1190000000
            revision: 19671f406d603126926c1b7e2adc169acbcade22
        queue:
          queued: 0
          running: null
    RangeRestyleUpload:
      summary: A 45 s range restyle with two takes (`params` part as JSON; six stem files).
      value:
        stem: ['(FLAC vocals)', '(FLAC drums)', '(FLAC bass)', '(FLAC guitar)', '(FLAC piano)', '(FLAC other)']
        params:
          kind: restyle
          restyle:
            caption: Jazz swing, swing feel, piano, upright bass, brushed drums, relaxed, warm
            audioCoverStrength: 0.55
            inferenceSteps: 8
            shift: 3.0
            seeds: [1234567, 7654321]
            mode: range
            rangeStartSeconds: 60.0
            rangeEndSeconds: 105.0
    InPlaceRestyleUpload:
