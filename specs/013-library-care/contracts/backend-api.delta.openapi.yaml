openapi: 3.1.0
info:
  title: StemStudio Backend API - library care delta (feature 013)
  version: 1.12.0-delta.1
  summary: Additive delta of the backend API for backup, restore, storage overview and clean-up.
  description: |
    * **Standalone, additive delta.** This document contains only the `library-care` and
      `storage` tags of the backend API plus one additive field on an existing schema. It is
      merged unchanged into the full `backend-api.openapi.yaml` **1.12.0** after feature 012 has
      fixed 1.11.0 (CTO merge, tasks.md T005). No existing operation or behaviour of 1.11.0 changes,
      except the documented write gate (section "Write gate") which adds `409 backup-running` and
      `503 library-maintenance` responses to existing operations. C# DTOs:
      `src/StemStudio.Contracts/LibraryCare`, routes `ApiRoutes.LibraryCare*`, `ApiRoutes.Storage*`.
    * Conventions of the backend API apply: JSON camelCase, enums lower-case camelCase strings, UTC
      ISO 8601 times, sizes in bytes (integer), RFC 9457 problem details with
      `type` = `https://stemstudio.local/problems/<code>`.
    * **Backups folder**: archives live in `StemStudio:BackupDir` (compose: host folder bind-mounted
      at `/backups`). Archives are addressed by their file name (`fileName` path parameter,
      `^[A-Za-z0-9][A-Za-z0-9._-]{0,119}\.zip$`); no endpoint accepts a path. Archive format:
      `contracts/backup-archive.md` 1.0.0.
    * **One library job at a time** (backup, verify, restore, undo restore); `409
      library-job-running` otherwise. Jobs run in the API and continue when the browser closes;
      poll `GET /api/library-jobs/{jobId}` about once per second.
    * **Write gate** (data-model 5.2). While a backup runs, these existing operations answer
      `409 backup-running`: `DELETE /api/tracks/{trackId}`, `POST /api/tracks/{trackId}/retry`,
      `PUT`/`DELETE /api/tracks/{trackId}/artwork`, `DELETE /api/assets/{assetId}`,
      `DELETE /api/generations/{generationId}`, `DELETE /api/voice-profiles/{profileId}`,
      `DELETE /api/styles/{styleId}`, `DELETE /api/lyrics/{lyricsId}`,
      `DELETE /api/agent/conversations/{conversationId}`, and the destructive operations of this
      delta. While a restore switches the library (seconds), every `/api/*` operation except
      `GET /api/library-care/status` and `GET /api/library-jobs/{jobId}` answers `503
      library-maintenance` with `Retry-After: 5`; `GET /health` stays up.
    * **Rehydration** (FR-019): when the worker answers a detail-job, lyrics-alignment or other
      request with a cache miss for a track, the API calls worker `POST /v1/jobs/rehydrate` and
      retries once; clients see only a stage text "Preparing stems".
    * **Cross-site guard** (CTO integration, security review T069; editorial before release):
      every non-GET/HEAD/OPTIONS `/api/*` request whose `Origin` is not the web origin, or that
      carries `Sec-Fetch-Site: cross-site`, answers `403` (problem title "Cross-site request refused").
      Requests without `Origin` (server-side calls, scripts) and CORS preflights are not affected.
    * **Storage worker entries** (CTO integration): `StorageOverview.workerEntries` lists the
      worker cache entries (shown at Expert as `storage-worker-entries`).
    * Changelog: 1.12.0-delta.1 (additive, feature 013) - library-care status, backups (list,
      estimate, create, details, download, verify, delete, restore with replace or merge),
      library jobs (status, list, cancel), previous library (details, undo restore, discard),
      storage overview, clean-up preview and execution, `DetailPhase.filesRemovedAt`. See ADR-022.
  license:
    name: MIT
    identifier: MIT
servers:
  - url: http://localhost:8081
    description: docker compose (host port)
security: []
tags:
  - name: library-care
    description: Backups, restore and library jobs (1.12.0).
  - name: storage
    description: Storage overview and clean-up of regenerable data (1.12.0).
paths:
  /api/library-care/status:
    get:
      tags: [library-care]
      operationId: getLibraryCareStatus
      summary: Gate mode, the active library job, the backups folder state and blockers for a restore.
      description: Always answers, also during maintenance (the UI polls it to leave the maintenance screen).
      responses:
        '200':
          description: Current state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LibraryCareStatus'
              examples:
                idle:
                  $ref: '#/components/examples/StatusIdle'
                backupRunning:
                  $ref: '#/components/examples/StatusBackupRunning'
  /api/backups:
    get:
      tags: [library-care]
      operationId: listBackups
      summary: Archives in the backups folder, newest first, with their manifest summary.
      description: |
        Lists every `*.zip` file (not `*.partial`) in the backups folder. A file without a readable
        manifest is listed with `recognised: false` and the reason. Manifests are read from the
        central directory (no full read); results are cached per file name, size and modification
        time.
      responses:
        '200':
          description: The folder state and the archives.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BackupList'
              examples:
                twoArchives:
                  $ref: '#/components/examples/BackupListTwo'
    post:
      tags: [library-care]
      operationId: createBackup
      summary: Start a backup of the library into the backups folder.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BackupOptions'
            example:
              detailStems: false
              exports: true
              scores: true
              generations: true
              voiceProfiles: true
      responses:
        '202':
          description: Backup job accepted.
          headers:
            Location:
              description: URL of the library job.
              schema:
                type: string
              example: /api/library-jobs/8e0c1f2a-3b4d-4e5f-8a6b-7c8d9e0f1a2b
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LibraryJob'
              examples:
                queued:
                  $ref: '#/components/examples/BackupJobQueued'
        '400':
          $ref: '#/components/responses/ValidationProblem'
        '409':
          description: |
            `library-job-running` (another library job is active), `backups-folder-unavailable`
            (missing or not writable; `detail` has the reason), `insufficient-disk-space`
            (extension members `requiredBytes`, `freeBytes`).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: https://stemstudio.local/problems/insufficient-disk-space
                title: Not enough free space in the backups folder
                status: 409
                detail: The backup needs about 21.4 GB; 12.0 GB is free.
                requiredBytes: 21474836480
                freeBytes: 12884901888
        '503':
          $ref: '#/components/responses/Maintenance'
  /api/backups/estimate:
    get:
      tags: [library-care]
      operationId: estimateBackup
      summary: Size per category and free space for the given options.
      parameters:
        - $ref: '#/components/parameters/IncludeDetailStems'
        - $ref: '#/components/parameters/IncludeExports'
        - $ref: '#/components/parameters/IncludeScores'
        - $ref: '#/components/parameters/IncludeGenerations'
        - $ref: '#/components/parameters/IncludeRecordings'
        - $ref: '#/components/parameters/IncludeVoiceProfiles'
      responses:
        '200':
          description: The estimate (from a storage walk, at most 30 s old).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BackupEstimate'
              examples:
                defaults:
                  $ref: '#/components/examples/EstimateDefaults'
        '400':
          $ref: '#/components/responses/ValidationProblem'
  /api/backups/{fileName}:
    parameters:
      - $ref: '#/components/parameters/FileName'
    get:
      tags: [library-care]
      operationId: getBackup
      summary: Details of one archive (manifest summary, consent proofs, compatibility).
      responses:
        '200':
          description: The archive details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BackupDetails'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          description: '`archive-invalid`: not a ZIP or no valid manifest.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
    delete:
      tags: [library-care]
      operationId: deleteBackup
      summary: Delete an archive from the backups folder.
      responses:
        '204':
          description: Deleted.
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: '`archive-in-use`: a library job reads or writes this archive.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '503':
          $ref: '#/components/responses/Maintenance'
  /api/backups/{fileName}/file:
    parameters:
      - $ref: '#/components/parameters/FileName'
    get:
      tags: [library-care]
      operationId: downloadBackup
      summary: Download the archive (resumable).
      description: Served from disk with `Content-Disposition attachment`, `Accept-Ranges bytes`, `ETag`, `Last-Modified` (same semantics as stems, 1.0.1).
      parameters:
        - name: Range
          in: header
          required: false
          schema:
            type: string
          example: bytes=0-1048575
      responses:
        '200':
          description: The whole archive.
          headers:
            Content-Disposition:
              schema:
                type: string
              example: attachment; filename="stemstudio-backup-20261116-142233.zip"
            ETag:
              schema:
                type: string
          content:
            application/zip:
              schema:
                type: string
                contentMediaType: application/zip
        '206':
          description: A byte range.
          content:
            application/zip:
              schema:
                type: string
                contentMediaType: application/zip
        '404':
          $ref: '#/components/responses/NotFound'
        '416':
          description: Range not satisfiable.
  /api/backups/{fileName}/verify:
    parameters:
      - $ref: '#/components/parameters/FileName'
    post:
      tags: [library-care]
      operationId: verifyBackup
      summary: Check every entry of an archive (structure, layout, hashes, database integrity) without restoring it.
      responses:
        '202':
          description: Verify job accepted; the report is in `LibraryJob.report` (`VerifyReport`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LibraryJob'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/LibraryJobRunning'
        '503':
          $ref: '#/components/responses/Maintenance'
  /api/backups/{fileName}/restore:
    parameters:
      - $ref: '#/components/parameters/FileName'
    post:
      tags: [library-care]
      operationId: restoreBackup
      summary: Restore an archive (empty library, replace or merge).
      description: |
        Validates the whole archive before any change (data-model 3.4), migrates an older schema
        in staging, then switches the library in one journalled step. `mode: replace` on a
        non-empty library needs `confirmation: "REPLACE"` and keeps the current library as the
        previous library (at most one may exist). `mode: merge` adds what is missing (P3).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RestoreOptions'
            examples:
              replace:
                value:
                  mode: replace
                  voiceProfiles: true
                  confirmation: REPLACE
              merge:
                value:
                  mode: merge
                  voiceProfiles: false
      responses:
        '202':
          description: Restore job accepted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LibraryJob'
              examples:
                running:
                  $ref: '#/components/examples/RestoreJobExtracting'
        '400':
          $ref: '#/components/responses/ValidationProblem'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: |
            `library-job-running`; `backup-running`; `jobs-active` (extension member `activeWork`:
            `ActiveWork[]`); `previous-library-exists` (discard or undo it first);
            `insufficient-disk-space` (`requiredBytes`, `freeBytes`).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: https://stemstudio.local/problems/jobs-active
                title: Jobs are running
                status: 409
                detail: Wait for 2 jobs to finish or cancel them, then restore.
                activeWork:
                  - kind: export
                    id: 2f6d8a0c-1b3e-4f5a-9c7d-8e9f0a1b2c3d
                    title: Song title - vocals
                  - kind: generation
                    id: 9a8b7c6d-5e4f-4a3b-8c2d-1e0f9a8b7c6d
                    title: Restyle of Song title
        '422':
          description: |
            `confirmation-required` (replace without `confirmation: "REPLACE"`),
            `archive-incompatible` (format major or newer migrations; extension members
            `archiveBackendApi`, `unknownMigrations`), `archive-invalid`.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '503':
          $ref: '#/components/responses/Maintenance'
  /api/library-jobs:
    get:
      tags: [library-care]
      operationId: listLibraryJobs
      summary: Recent library jobs, newest first (at most 50 are kept).
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 10
      responses:
        '200':
          description: The jobs.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/LibraryJob'
        '400':
          $ref: '#/components/responses/ValidationProblem'
  /api/library-jobs/{jobId}:
    parameters:
      - $ref: '#/components/parameters/JobId'
    get:
      tags: [library-care]
      operationId: getLibraryJob
      summary: Status of a library job (also during maintenance).
      responses:
        '200':
          description: The job.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LibraryJob'
              examples:
                backupRunning:
                  $ref: '#/components/examples/BackupJobRunning'
                backupCompleted:
                  $ref: '#/components/examples/BackupJobCompleted'
                restoreCompleted:
                  $ref: '#/components/examples/RestoreJobCompleted'
                restoreFailed:
                  $ref: '#/components/examples/RestoreJobFailedUnsafe'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/library-jobs/{jobId}/cancel:
    parameters:
      - $ref: '#/components/parameters/JobId'
    post:
      tags: [library-care]
      operationId: cancelLibraryJob
      summary: Cancel a queued or running library job.
      description: 'A backup removes its partial file, a restore its staging folder; within 5 seconds the job is `cancelled`. A restore cannot be cancelled once it switches the library (`cancellable` false).'
      responses:
        '202':
          description: Cancellation requested; the job is returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LibraryJob'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: '`not-cancellable`: terminal, or a restore in the switch or reconcile stage.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /api/library-care/previous:
    get:
      tags: [library-care]
      operationId: getPreviousLibrary
      summary: The library kept aside by the last replace restore.
      responses:
        '200':
          description: The previous library.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PreviousLibrary'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/library-care/previous/revert:
    post:
      tags: [library-care]
      operationId: revertRestore
      summary: Undo the last replace restore (switch back to the previous library).
      description: Runs an `undoRestore` library job with the same journal; the restored library becomes the previous library. Refused while jobs are active.
      responses:
        '202':
          description: Undo job accepted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LibraryJob'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: '`library-job-running`, `backup-running`, `jobs-active` (with `activeWork`).'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '503':
          $ref: '#/components/responses/Maintenance'
  /api/library-care/previous/discard:
    post:
      tags: [library-care]
      operationId: discardPreviousLibrary
      summary: Permanently delete the previous library.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Confirmation'
            example:
              confirmation: DISCARD
      responses:
        '204':
          description: Deleted.
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: '`library-job-running`, `backup-running`.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '422':
          description: '`confirmation-required`: the confirmation is not `DISCARD`.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '503':
          $ref: '#/components/responses/Maintenance'
  /api/storage:
    get:
      tags: [storage]
      operationId: getStorageOverview
      summary: Disk use per category, per track, per model cache, and free space.
      parameters:
        - name: refresh
          in: query
          required: false
          description: Bypass the 30-second cache.
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: The overview. Parts that cannot be measured carry `reason` instead of numbers.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StorageOverview'
              examples:
                small:
                  $ref: '#/components/examples/StorageSmall'
        '400':
          $ref: '#/components/responses/ValidationProblem'
        '503':
          $ref: '#/components/responses/Maintenance'
  /api/storage/cleanup/preview:
    post:
      tags: [storage]
      operationId: previewCleanup
      summary: Plan a clean-up of regenerable data; nothing is removed.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CleanupRequest'
            example:
              actions:
                - kind: detailStems
                  trackIds: null
                - kind: leftovers
      responses:
        '200':
          description: The plan, valid for 10 minutes.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CleanupPlan'
              examples:
                detail:
                  $ref: '#/components/examples/CleanupPlanDetail'
        '400':
          $ref: '#/components/responses/ValidationProblem'
        '409':
          description: '`backup-running`, `library-job-running`.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '503':
          $ref: '#/components/responses/Maintenance'
  /api/storage/cleanup:
    post:
      tags: [storage]
      operationId: executeCleanup
      summary: Execute a previewed clean-up plan.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExecuteCleanupRequest'
            example:
              planId: 3c5e7a9b-1d2f-4a6b-8c0d-2e4f6a8b0c1d
      responses:
        '200':
          description: What was removed and what failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CleanupResult'
        '400':
          $ref: '#/components/responses/ValidationProblem'
        '409':
          description: '`plan-expired` (unknown or older than 10 minutes), `plan-stale` (library changed since the preview), `backup-running`, `library-job-running`.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '503':
          $ref: '#/components/responses/Maintenance'
components:
  parameters:
    FileName:
      name: fileName
      in: path
      required: true
      description: Archive file name in the backups folder.
      schema:
        type: string
        pattern: '^[A-Za-z0-9][A-Za-z0-9._-]{0,119}\.zip$'
      example: stemstudio-backup-20261116-142233.zip
    JobId:
      name: jobId
      in: path
      required: true
      schema:
        type: string
        format: uuid
      example: 8e0c1f2a-3b4d-4e5f-8a6b-7c8d9e0f1a2b
    IncludeDetailStems:
      name: detailStems
      in: query
      required: false
      schema:
        type: boolean
        default: true
    IncludeExports:
      name: exports
      in: query
      required: false
      schema:
        type: boolean
        default: true
    IncludeScores:
      name: scores
      in: query
      required: false
      schema:
        type: boolean
        default: true
    IncludeGenerations:
      name: generations
      in: query
      required: false
      schema:
        type: boolean
        default: true
    IncludeRecordings:
      name: recordings
      in: query
      required: false
      schema:
        type: boolean
        default: true
    IncludeVoiceProfiles:
      name: voiceProfiles
      in: query
      required: false
      schema:
        type: boolean
        default: true
  responses:
    NotFound:
      description: Not found.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          example:
            type: https://stemstudio.local/problems/not-found
            title: Not found
            status: 404
    ValidationProblem:
      description: Invalid request (field errors).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/HttpValidationProblemDetails'
    LibraryJobRunning:
      description: '`library-job-running`: another library job is active.'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          example:
            type: https://stemstudio.local/problems/library-job-running
            title: A library job is running
            status: 409
            detail: A backup is running; try again when it has finished.
    Maintenance:
      description: '`library-maintenance`: a restore is switching the library.'
      headers:
        Retry-After:
          schema:
            type: integer
          example: 5
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          example:
            type: https://stemstudio.local/problems/library-maintenance
            title: Library is being restored
            status: 503
            detail: StemStudio is switching to the restored library; this takes a few seconds.
  schemas:
    Category:
      type: string
      description: Archive and storage categories (backup-archive 1.0.0).
      enum: [database, stems, artwork, pendingUploads, detailStems, exports, scores, generations, recordings, voiceProfiles]
    StorageCategory:
      type: string
      enum: [database, stems, artwork, pendingUploads, detailStems, exports, scores, generations, recordings, voiceProfiles, leftovers, restoreStaging, previousLibrary, workerSeparationCache, workerDetailCache, workerJobFiles, workerScratch]
    Regenerability:
      type: string
      description: '`original` = StemStudio cannot recreate it; `regenerable` = one action (or automatic use) recreates it.'
      enum: [original, regenerable]
    LibraryJobKind:
      type: string
      enum: [backup, verify, restore, undoRestore]
    LibraryJobStatus:
      type: string
      description: '`completed`, `failed` and `cancelled` are terminal.'
      enum: [queued, running, completed, failed, cancelled]
    GateMode:
      type: string
      enum: [open, backupRunning, maintenance]
    FolderState:
      type: object
      additionalProperties: false
      required: [available, writable, hostPathHint, freeBytes, totalBytes, reason]
      properties:
        available:
          type: boolean
        writable:
          type: boolean
        hostPathHint:
          type: [string, 'null']
          maxLength: 260
          description: Display only (`StemStudio:BackupHostDirHint`), e.g. `./backups`.
        freeBytes:
          type: [integer, 'null']
        totalBytes:
          type: [integer, 'null']
        reason:
          type: [string, 'null']
          maxLength: 300
          description: Why the folder is not available or not writable, with the fix.
    ActiveWork:
      type: object
      additionalProperties: false
      required: [kind, id, title]
      properties:
        kind:
          type: string
          enum: [import, detail, export, score, lyricsAlignment, generation, agentRun]
        id:
          type: string
          maxLength: 64
        title:
          type: string
          maxLength: 300
    LibraryCareStatus:
      type: object
      additionalProperties: false
      required: [gate, activeJob, backupFolder, previousLibrary, activeWork, libraryEmpty]
      properties:
        gate:
          $ref: '#/components/schemas/GateMode'
        activeJob:
          oneOf:
            - $ref: '#/components/schemas/LibraryJob'
            - type: 'null'
        backupFolder:
          $ref: '#/components/schemas/FolderState'
        previousLibrary:
          oneOf:
            - $ref: '#/components/schemas/PreviousLibrary'
            - type: 'null'
        activeWork:
          type: array
          description: Queued or running jobs that block a restore.
          items:
            $ref: '#/components/schemas/ActiveWork'
        libraryEmpty:
          type: boolean
          description: True when a restore needs no replace (research R-07 definition).
    BackupOptions:
      type: object
      additionalProperties: false
      description: Optional categories; `database`, `stems`, `artwork` and `pendingUploads` are always included.
      properties:
        detailStems:
          type: boolean
          default: true
        exports:
          type: boolean
          default: true
        scores:
          type: boolean
          default: true
        generations:
          type: boolean
          default: true
        recordings:
          type: boolean
          default: true
          description: Play-along takes of feature 015 (user-created originals; empty before 015).
        voiceProfiles:
          type: boolean
          default: true
    CategorySize:
      type: object
      additionalProperties: false
      required: [category, included, optional, bytes, files, regenerability]
      properties:
        category:
          $ref: '#/components/schemas/Category'
        included:
          type: boolean
        optional:
          type: boolean
        bytes:
          type: integer
          minimum: 0
        files:
          type: integer
          minimum: 0
        regenerability:
          $ref: '#/components/schemas/Regenerability'
    BackupEstimate:
      type: object
      additionalProperties: false
      required: [totalBytes, categories, folder, enough]
      properties:
        totalBytes:
          type: integer
          minimum: 0
          description: Uncompressed size of the archive (audio is stored; the archive is about this size).
        categories:
          type: array
          items:
            $ref: '#/components/schemas/CategorySize'
        folder:
          $ref: '#/components/schemas/FolderState'
        enough:
          type: boolean
          description: Free space >= totalBytes + 64 MiB.
    Compatibility:
      type: object
      additionalProperties: false
      required: [restorable, reason, migrationNeeded]
      properties:
        restorable:
          type: boolean
        reason:
          type: [string, 'null']
          maxLength: 300
        migrationNeeded:
          type: boolean
          description: The archive's schema is older; it is migrated in staging.
    BackupSummary:
      type: object
      additionalProperties: false
      required: [fileName, sizeBytes, modifiedAt, recognised, reason, backupId, createdAt, appVersion, backendApi, formatVersion, included, counts, compatibility]
      properties:
        fileName:
          type: string
          pattern: '^[A-Za-z0-9][A-Za-z0-9._-]{0,119}\.zip$'
        sizeBytes:
          type: integer
        modifiedAt:
          type: string
          format: date-time
        recognised:
          type: boolean
        reason:
          type: [string, 'null']
          description: Why the file is not recognised (no manifest, not a ZIP).
        backupId:
          type: [string, 'null']
          format: uuid
        createdAt:
          type: [string, 'null']
          format: date-time
        appVersion:
          type: [string, 'null']
        backendApi:
          type: [string, 'null']
        formatVersion:
          type: [string, 'null']
        included:
          type: array
          items:
            $ref: '#/components/schemas/Category'
        counts:
          oneOf:
            - $ref: '#/components/schemas/ArchiveCounts'
            - type: 'null'
        compatibility:
          $ref: '#/components/schemas/Compatibility'
    ArchiveCounts:
      type: object
      additionalProperties: false
      required: [tracks, mixes, assets, generations, styles, lyricsSheets, voiceProfiles]
      properties:
        tracks:
          type: integer
        mixes:
          type: integer
        assets:
          type: integer
        generations:
          type: integer
        styles:
          type: integer
        lyricsSheets:
          type: integer
        voiceProfiles:
          type: integer
    BackupList:
      type: object
      additionalProperties: false
      required: [folder, archives]
      properties:
        folder:
          $ref: '#/components/schemas/FolderState'
        archives:
          type: array
          items:
            $ref: '#/components/schemas/BackupSummary'
    VoiceProfileProof:
      type: object
      additionalProperties: false
      description: Consent proof from the manifest (010); shown before a restore.
      required: [id, displayName, statementVersion, personName, consentedAt, valid, reason]
      properties:
        id:
          type: string
          format: uuid
        displayName:
          type: string
          maxLength: 60
        statementVersion:
          type: string
        personName:
          type: string
          maxLength: 80
        consentedAt:
          type: string
          format: date-time
        valid:
          type: boolean
          description: Statement version known and statement SHA-256 matching (the full check runs during restore).
        reason:
          type: [string, 'null']
    ArchiveWarning:
      type: object
      additionalProperties: false
      required: [code, message]
      properties:
        code:
          type: string
          enum: [missing-file, changed-after-snapshot, voice-profile-without-consent, interrupted-entity]
        message:
          type: string
          maxLength: 500
    BackupDetails:
      type: object
      additionalProperties: false
      description: Every member of `BackupSummary` plus the manifest details (one closed object; `BackupSummary` is closed, so it cannot be extended with `allOf`).
      required: [fileName, sizeBytes, modifiedAt, recognised, reason, backupId, createdAt, appVersion, backendApi, formatVersion, included, counts, compatibility, excluded, entries, totalBytes, schemaLastMigration, voiceProfiles, warnings]
      properties:
        fileName:
          type: string
          pattern: '^[A-Za-z0-9][A-Za-z0-9._-]{0,119}\.zip$'
        sizeBytes:
          type: integer
        modifiedAt:
          type: string
          format: date-time
        recognised:
          type: boolean
        reason:
          type: [string, 'null']
          description: Why the file is not recognised (no manifest, not a ZIP).
        backupId:
          type: [string, 'null']
          format: uuid
        createdAt:
          type: [string, 'null']
          format: date-time
        appVersion:
          type: [string, 'null']
        backendApi:
          type: [string, 'null']
        formatVersion:
          type: [string, 'null']
        included:
          type: array
          items:
            $ref: '#/components/schemas/Category'
        counts:
          oneOf:
            - $ref: '#/components/schemas/ArchiveCounts'
            - type: 'null'
        compatibility:
          $ref: '#/components/schemas/Compatibility'
        excluded:
          type: array
          items:
            $ref: '#/components/schemas/Category'
        entries:
          type: integer
        totalBytes:
          type: integer
        schemaLastMigration:
          type: string
        voiceProfiles:
          type: array
          items:
            $ref: '#/components/schemas/VoiceProfileProof'
        warnings:
          type: array
          items:
            $ref: '#/components/schemas/ArchiveWarning'
    RestoreOptions:
      type: object
      additionalProperties: false
      required: [mode]
      properties:
        mode:
          type: string
          enum: [replace, merge]
          description: '`replace` also covers an empty library (nothing is moved aside). `merge` is P3.'
        voiceProfiles:
          type: boolean
          default: true
          description: false = no voice profile is restored (their converted takes are kept with the name snapshot).
        confirmation:
          type: [string, 'null']
          description: Must be `REPLACE` for `replace` on a non-empty library.
    Confirmation:
      type: object
      additionalProperties: false
      required: [confirmation]
      properties:
        confirmation:
          type: string
          maxLength: 16
    JobError:
      type: object
      additionalProperties: false
      required: [code, message]
      properties:
        code:
          type: string
          enum: [interrupted, insufficient-disk-space, backups-folder-unavailable, archive-invalid, archive-incompatible, archive-unsafe, archive-corrupt, migration-failed, io-error]
        message:
          type: string
          maxLength: 500
    CategoryCount:
      type: object
      additionalProperties: false
      required: [category, items, files, bytes]
      properties:
        category:
          $ref: '#/components/schemas/Category'
        items:
          type: integer
        files:
          type: integer
        bytes:
          type: integer
    SkippedItem:
      type: object
      additionalProperties: false
      required: [category, id, name, reason]
      properties:
        category:
          type: string
        id:
          type: string
        name:
          type: [string, 'null']
        reason:
          type: string
          enum: [same-id, same-source, dependency-skipped, consent-invalid, option, missing-file]
        renamedTo:
          type: [string, 'null']
    BackupReport:
      type: object
      additionalProperties: false
      required: [type, fileName, included, entries, bytes, warnings]
      properties:
        type:
          const: backup
        fileName:
          type: string
        included:
          type: array
          items:
            $ref: '#/components/schemas/CategoryCount'
        entries:
          type: integer
        bytes:
          type: integer
          description: Archive file size.
        warnings:
          type: array
          items:
            $ref: '#/components/schemas/ArchiveWarning'
    VerifyReport:
      type: object
      additionalProperties: false
      required: [type, ok, entriesChecked, bytesChecked, problem]
      properties:
        type:
          const: verify
        ok:
          type: boolean
        entriesChecked:
          type: integer
        bytesChecked:
          type: integer
        problem:
          oneOf:
            - $ref: '#/components/schemas/JobError'
            - type: 'null'
    RestoreReport:
      type: object
      additionalProperties: false
      required: [type, mode, restored, skipped, migratedFrom, warnings, previousLibraryKept]
      properties:
        type:
          const: restore
        mode:
          type: string
          enum: [empty, replace, merge, undo]
        restored:
          type: array
          items:
            $ref: '#/components/schemas/CategoryCount'
        skipped:
          type: array
          items:
            $ref: '#/components/schemas/SkippedItem'
        migratedFrom:
          type: [string, 'null']
          description: Last migration of the archive when it was migrated.
        warnings:
          type: array
          items:
            type: string
            maxLength: 500
        previousLibraryKept:
          type: boolean
    LibraryJob:
      type: object
      additionalProperties: false
      required: [jobId, kind, status, stage, stageText, progress, bytesDone, bytesTotal, currentItem, etaSeconds, archiveFileName, cancellable, report, error, createdAt, startedAt, finishedAt]
      properties:
        jobId:
          type: string
          format: uuid
        kind:
          $ref: '#/components/schemas/LibraryJobKind'
        status:
          $ref: '#/components/schemas/LibraryJobStatus'
        stage:
          type: [string, 'null']
          enum: [snapshot, scrub, files, manifest, check, validate, extract, database, switch, reconcile, null]
        stageText:
          type: [string, 'null']
          maxLength: 200
        progress:
          type: integer
          minimum: 0
          maximum: 100
        bytesDone:
          type: integer
          minimum: 0
        bytesTotal:
          type: integer
          minimum: 0
        currentItem:
          type: [string, 'null']
          maxLength: 300
          description: e.g. "Song title - stems"; never a file path or personal content.
        etaSeconds:
          type: [integer, 'null']
        archiveFileName:
          type: [string, 'null']
        cancellable:
          type: boolean
        report:
          oneOf:
            - $ref: '#/components/schemas/BackupReport'
            - $ref: '#/components/schemas/VerifyReport'
            - $ref: '#/components/schemas/RestoreReport'
            - type: 'null'
        error:
          oneOf:
            - $ref: '#/components/schemas/JobError'
            - type: 'null'
        createdAt:
          type: string
          format: date-time
        startedAt:
          type: [string, 'null']
          format: date-time
        finishedAt:
          type: [string, 'null']
          format: date-time
    PreviousLibrary:
      type: object
      additionalProperties: false
      required: [restoreId, movedAsideAt, sizeBytes, counts, restoredArchive]
      properties:
        restoreId:
          type: string
          format: uuid
        movedAsideAt:
          type: string
          format: date-time
        sizeBytes:
          type: integer
        counts:
          $ref: '#/components/schemas/ArchiveCounts'
        restoredArchive:
          type: [string, 'null']
    Volume:
      type: object
      additionalProperties: false
      required: [id, label, freeBytes, totalBytes, sharedWith, reason]
      properties:
        id:
          type: string
          enum: [library, backups, workerData, modelCache]
        label:
          type: string
        freeBytes:
          type: [integer, 'null']
        totalBytes:
          type: [integer, 'null']
        sharedWith:
          type: array
          description: Other volume ids on the same disk (same total and free bytes).
          items:
            type: string
        reason:
          type: [string, 'null']
    StorageCategoryUsage:
      type: object
      additionalProperties: false
      required: [category, bytes, files, regenerability, howToRegenerate, costHint]
      properties:
        category:
          $ref: '#/components/schemas/StorageCategory'
        bytes:
          type: [integer, 'null']
        files:
          type: [integer, 'null']
        regenerability:
          $ref: '#/components/schemas/Regenerability'
        howToRegenerate:
          type: [string, 'null']
          maxLength: 200
        costHint:
          type: [string, 'null']
          maxLength: 120
    WorkerCacheEntryStorage:
      type: object
      additionalProperties: false
      required: [audioSha256Prefix, bytes, inUse, fromLibrary, trackId]
      properties:
        audioSha256Prefix:
          type: string
          pattern: '^[0-9a-f]{12}$'
          description: First 12 hex characters of the worker's cache key (the audio SHA-256).
        bytes:
          type: integer
          minimum: 0
          description: Standard result, detail result, unfinished detail checkpoints and artwork of the entry.
        inUse:
          type: boolean
          description: A queued or running worker job uses the entry (it is never cleaned while in use).
        fromLibrary:
          type: boolean
          description: Created by a rehydration from the library stems (FR-019).
        trackId:
          type: [string, 'null']
          format: uuid
          description: The library track whose standard job uses the entry, or null.
    TrackStorage:
      type: object
      additionalProperties: false
      required: [trackId, title, artist, totalBytes, sourceBytes, stemsBytes, detailStemsBytes, detailFilesRemoved, artworkBytes, exportsBytes, scoresBytes, generationsBytes, recordingsBytes, workerCacheBytes]
      properties:
        trackId:
          type: string
          format: uuid
        title:
          type: string
        artist:
          type: [string, 'null']
        totalBytes:
          type: integer
        sourceBytes:
          type: [integer, 'null']
          description: Pending upload plus the worker separation cache of the track (null when the worker is unavailable and nothing is pending).
        stemsBytes:
          type: integer
        detailStemsBytes:
          type: integer
        detailFilesRemoved:
          type: boolean
        artworkBytes:
          type: integer
        exportsBytes:
          type: integer
        scoresBytes:
          type: integer
        generationsBytes:
          type: integer
        recordingsBytes:
          type: integer
          description: Play-along takes of the track (feature 015; original, never in a clean-up).
        workerCacheBytes:
          type: [integer, 'null']
    ModelCacheUsage:
      type: object
      additionalProperties: false
      required: [id, bytes, models]
      properties:
        id:
          type: string
          description: Folder under the model cache, e.g. torch, hf, whisper, acestep, soulx.
        bytes:
          type: integer
        models:
          type: array
          items:
            type: string
    StorageOverview:
      type: object
      additionalProperties: false
      required: [measuredAt, volumes, categories, tracks, unattached, modelCaches, workerEntries, backups, worker]
      properties:
        measuredAt:
          type: string
          format: date-time
        volumes:
          type: array
          items:
            $ref: '#/components/schemas/Volume'
        categories:
          type: array
          items:
            $ref: '#/components/schemas/StorageCategoryUsage'
        tracks:
          type: array
          description: Sorted by totalBytes descending.
          items:
            $ref: '#/components/schemas/TrackStorage'
        unattached:
          type: object
          additionalProperties: false
          required: [exportsBytes, scoresBytes, generationsBytes, voiceProfilesBytes, lyricsSheets]
          properties:
            exportsBytes:
              type: integer
            scoresBytes:
              type: integer
            generationsBytes:
              type: integer
            voiceProfilesBytes:
              type: integer
            lyricsSheets:
              type: integer
        modelCaches:
          type: array
          items:
            $ref: '#/components/schemas/ModelCacheUsage'
        workerEntries:
          type: array
          description: |
            Worker cache entries (one per audio file), largest first; empty when the worker is not
            reachable. Shown at Expert (`storage-worker-entries`). Added editorially before the
            1.12.0 release (CTO integration 013).
          items:
            $ref: '#/components/schemas/WorkerCacheEntryStorage'
        backups:
          type: object
          additionalProperties: false
          required: [count, bytes, folderAvailable, reason]
          properties:
            count:
              type: integer
            bytes:
              type: integer
            folderAvailable:
              type: boolean
            reason:
              type: [string, 'null']
        worker:
          type: object
          additionalProperties: false
          required: [available, reason]
          properties:
            available:
              type: boolean
            reason:
              type: [string, 'null']
    CleanupKind:
      type: string
      enum: [detailStems, workerCache, leftovers]
    CleanupAction:
      type: object
      additionalProperties: false
      required: [kind]
      properties:
        kind:
          $ref: '#/components/schemas/CleanupKind'
        trackIds:
          type: [array, 'null']
          description: null or absent = all tracks (ignored for leftovers).
          maxItems: 10000
          items:
            type: string
            format: uuid
    CleanupRequest:
      type: object
      additionalProperties: false
      required: [actions]
      properties:
        actions:
          type: array
          minItems: 1
          maxItems: 3
          items:
            $ref: '#/components/schemas/CleanupAction'
    CleanupItem:
      type: object
      additionalProperties: false
      required: [kind, trackId, title, files, bytes, howToRegenerate]
      properties:
        kind:
          $ref: '#/components/schemas/CleanupKind'
        trackId:
          type: [string, 'null']
          format: uuid
        title:
          type: [string, 'null']
        files:
          type: integer
        bytes:
          type: integer
        howToRegenerate:
          type: string
          maxLength: 200
    CleanupSkip:
      type: object
      additionalProperties: false
      required: [kind, trackId, title, reason]
      properties:
        kind:
          $ref: '#/components/schemas/CleanupKind'
        trackId:
          type: [string, 'null']
          format: uuid
        title:
          type: [string, 'null']
        reason:
          type: string
          enum: [detail-active, job-active, export-active, worker-unavailable, nothing-to-remove]
    CleanupPlan:
      type: object
      additionalProperties: false
      required: [planId, createdAt, expiresAt, items, skipped, totalBytes]
      properties:
        planId:
          type: string
          format: uuid
        createdAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
        items:
          type: array
          items:
            $ref: '#/components/schemas/CleanupItem'
        skipped:
          type: array
          items:
            $ref: '#/components/schemas/CleanupSkip'
        totalBytes:
          type: integer
    ExecuteCleanupRequest:
      type: object
      additionalProperties: false
      required: [planId]
      properties:
        planId:
          type: string
          format: uuid
    CleanupResult:
      type: object
      additionalProperties: false
      required: [planId, freedBytes, removed, failed]
      properties:
        planId:
          type: string
          format: uuid
        freedBytes:
          type: integer
        removed:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [kind, trackId, files, bytes]
            properties:
              kind:
                $ref: '#/components/schemas/CleanupKind'
              trackId:
                type: [string, 'null']
                format: uuid
              files:
                type: integer
              bytes:
                type: integer
        failed:
          type: array
          items:
            $ref: '#/components/schemas/CleanupSkip'
    DetailPhaseAddition:
      type: object
      description: |
        Additive member of the existing `DetailPhase` schema (`Track.detail`) in 1.12.0. Merge note:
        add `filesRemovedAt` to `DetailPhase.properties` (not to `required`). When set, the detail
        stems were removed by a clean-up or left out of a restored backup; `stems` still lists their
        names, their URLs answer 404, and `POST /api/tracks/{trackId}/detail` ("Split further") is
        accepted for this completed phase.
      properties:
        filesRemovedAt:
          type: [string, 'null']
          format: date-time
    ProblemDetails:
      type: object
      description: RFC 9457 problem details; extension members allowed.
      required: [title, status]
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        detail:
          type: [string, 'null']
        instance:
          type: [string, 'null']
      additionalProperties: true
    HttpValidationProblemDetails:
      allOf:
        - $ref: '#/components/schemas/ProblemDetails'
        - type: object
          required: [errors]
          properties:
            errors:
              type: object
              additionalProperties:
                type: array
                items:
                  type: string
