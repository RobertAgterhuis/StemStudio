# Lint configuration for the StemStudio OpenAPI 3.1 contracts (feature 010).
# Run from the repo root: npx @redocly/cli@2.78.0 lint --config specs/010-lyrics-to-song/contracts/redocly.yaml #   specs/010-lyrics-to-song/contracts/generator-api.openapi.yaml specs/010-lyrics-to-song/contracts/backend-api.openapi.yaml
extends:
  - recommended
rules:
  # GET /health, GET /api/device, GET /api/tracks and GET /api/generation/status have no client-error cases; every other operation lists its 4XX responses.
  operation-4xx-response: warn
  no-server-example.com: off
  no-unused-components: warn
