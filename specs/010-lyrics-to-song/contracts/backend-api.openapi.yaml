      - $ref: '#/components/parameters/ProfileId'
    get:
      tags: [voices]
      operationId: getVoiceSample
      summary: Play the normalised sample of a profile (48 kHz mono FLAC) (1.9.0).
      parameters:
        - $ref: '#/components/parameters/RangeHeader'
