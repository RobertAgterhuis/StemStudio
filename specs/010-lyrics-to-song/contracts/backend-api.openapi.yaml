  /api/songs:
    post:
      tags: [songs]
      operationId: createSong
      summary: Generate a song from own lyrics with an AI voice or as an instrumental (1.9.0).
      description: |
        Exactly one of `lyricsId` and `lyricsText` (normalised like `createLyricsSheet`); unless
        `instrumental`, the lyrics must not be empty. Exactly one of `styleId` and `freeCaption`
        may be given (neither: a neutral pop caption); `freeCaption`, `delivery` and the style
        texts pass the artist-imitation guard (`400`, problem type `imitation`). The caption is
        the 009 style caption plus the lead voice and delivery (at most 512 characters). A lyrics
        density above 4 words per second is **not** an error: the generation is created and
        `warnings` says so. `409` (`not-installed`, `gpu-required`) when the generator cannot run.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SongRequest'
            examples:
              withStyle:
                $ref: '#/components/examples/SongRequestExample'
              instrumental:
                $ref: '#/components/examples/InstrumentalSongRequestExample'
      responses:
        '202':
          description: Generation created and queued.
          headers:
            Location:
              $ref: '#/components/headers/GenerationLocation'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Generation'
              examples:
                queued:
                  $ref: '#/components/examples/QueuedSongGeneration'
        '400':
          $ref: '#/components/responses/StyleValidationProblem'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/GenerationConflict'
        '503':
          $ref: '#/components/responses/GeneratorUnavailable'
  /api/voice-profiles:
    get:
      tags: [voices]
      operationId: listVoiceProfiles
      summary: Own-voice profiles (1.9.0).
      responses:
        '200':
          description: All profiles, by display name.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/VoiceProfile'
              examples:
                profiles:
                  $ref: '#/components/examples/VoiceProfileList'
    post:
      tags: [voices]
      operationId: createVoiceProfile
      summary: Create a voice profile from an own recording or upload with consent (1.9.0).
      description: |
        Order of checks (ADR-019 D3): consent first, before any file is written
        (`consentConfirmed` must be true -> else `400 consent-required`; the statement version
        must be the current one -> else `400 consent-outdated`; `personName` 1-80); display
        name unique (`409 voice-name-taken`); singer ready (`409 voice-not-installed` /
        `voice-unavailable`); the file-byte SHA-256 of the sample must not equal any stored
        stem, detail stem, take, take vocal, export or upload (`422 library-audio`; an
        exact-copy guard, not a similarity check); the singer checks duration and voiced ratio
        (`422 too-short`, `too-long`, `unvoiced`). Only then the normalised sample and the
        consent record are stored.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CreateVoiceProfileRequest'
            encoding:
              sample:
                contentType: audio/webm, audio/wav, audio/x-wav, audio/flac, audio/mpeg, application/octet-stream
      responses:
        '201':
          description: Profile created.
          headers:
            Location:
              $ref: '#/components/headers/VoiceProfileLocation'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VoiceProfile'
              examples:
                profile:
                  $ref: '#/components/examples/VoiceProfileExample'
        '400':
          $ref: '#/components/responses/ConsentProblem'
        '409':
          $ref: '#/components/responses/VoiceConflict'
        '413':
          $ref: '#/components/responses/SampleTooLarge'
        '422':
          $ref: '#/components/responses/SampleRejected'
        '503':
          $ref: '#/components/responses/GeneratorUnavailable'
  /api/voice-profiles/{profileId}:
    parameters:
      - $ref: '#/components/parameters/ProfileId'
    get:
      tags: [voices]
      operationId: getVoiceProfile
      summary: One voice profile with its consent record (1.9.0).
      responses:
        '200':
          description: The profile.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VoiceProfile'
              examples:
                profile:
                  $ref: '#/components/examples/VoiceProfileExample'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [voices]
      operationId: deleteVoiceProfile
      summary: Delete a voice profile and every file derived from its sample (1.9.0).
      description: |
        Cancels queued and running conversions with the profile, removes the sample and every
        temporary file, and keeps converted takes labelled "converted to <name> (profile
        deleted)" unless `deleteTakes=true` (then their files and library items are removed too).
      parameters:
        - name: deleteTakes
          in: query
          required: false
          schema:
            type: boolean
            default: false
      responses:
        '204':
          description: Deleted.
        '404':
          $ref: '#/components/responses/NotFound'
