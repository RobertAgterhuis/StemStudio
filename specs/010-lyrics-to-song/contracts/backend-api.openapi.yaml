      parameters:
        - $ref: '#/components/parameters/RangeHeader'
        - $ref: '#/components/parameters/IfNoneMatchHeader'
        - $ref: '#/components/parameters/IfModifiedSinceHeader'
        - $ref: '#/components/parameters/IfRangeHeader'
      responses:
        '200':
          $ref: '#/components/responses/AudioFile'
        '206':
          $ref: '#/components/responses/AudioFilePart'
        '304':
          $ref: '#/components/responses/AudioNotModified'
        '404':
          $ref: '#/components/responses/NotFound'
        '416':
          $ref: '#/components/responses/RangeNotSatisfiable'
components:
  parameters:
    LyricsId:
      name: lyricsId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ProfileId:
      name: profileId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    StyleId:
      name: styleId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    GenerationId:
      name: generationId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    TakeIndex:
      name: index
      in: path
      required: true
      description: Take number, starting at 1.
      schema:
        type: integer
        minimum: 1
        maximum: 2
    RangeHeader:
      name: Range
      in: header
      required: false
      schema:
        type: string
      example: bytes=0-1048575
    IfNoneMatchHeader:
      name: If-None-Match
      in: header
      required: false
      schema:
        type: string
    IfModifiedSinceHeader:
      name: If-Modified-Since
      in: header
      required: false
      schema:
        type: string
    IfRangeHeader:
      name: If-Range
      in: header
      required: false
      schema:
        type: string
    TrackId:
      name: trackId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    MixId:
      name: mixId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    AssetId:
      name: assetId
      in: path
      required: true
      schema:
        type: string
        format: uuid
  headers:
    LyricsLocation:
      description: URL of the lyrics sheet.
      schema:
        type: string
      example: /api/lyrics/2c4e6a8b-0d1f-4a3b-8c5d-7e9f1a3b5c7d
    VoiceProfileLocation:
      description: URL of the voice profile.
      schema:
        type: string
      example: /api/voice-profiles/4b6d8f0a-1c3e-4a5b-9d7f-2e4c6a8b0d1f
    StyleLocation:
      description: URL of the style resource.
      schema:
        type: string
      example: /api/styles/7d1f3a5c-2b4e-4c6a-9e8f-0a1b2c3d4e5f
    GenerationLocation:
      description: URL of the generation resource to poll.
      schema:
        type: string
      example: /api/generations/1a2b3c4d-5e6f-4a7b-8c9d-0e1f2a3b4c5d
    AcceptRanges:
      schema:
        type: string
        const: bytes
    ETag:
      description: Entity tag of the stem file.
      schema:
        type: string
      example: '"1db3f0a2c4e5"'
    LastModified:
      description: HTTP-date of the stem file's last write.
      schema:
        type: string
      example: Sat, 14 Nov 2026 12:06:30 GMT
    TrackLocation:
      description: URL of the track resource to poll.
      schema:
        type: string
      example: /api/tracks/0b7e4c1a-9d2f-4e8b-a1c3-5f6e7d8c9b0a
    ArtworkETag:
      description: Entity tag of the picture (quoted artwork version).
      schema:
        type: string
      example: '"2c26b46b68ff"'
    AssetLocation:
      description: URL of the library item to poll.
      schema:
        type: string
      example: /api/assets/3c9a1e7b-5d2f-4a6c-8e0b-1f2a3b4c5d6e
    ContentDisposition:
      description: '`attachment` (or `inline` with `inline=true`) with the sanitised item name (RFC 6266/5987).'
      schema:
        type: string
      example: attachment; filename="Never Gonna Give You Up - drums.flac"; filename*=UTF-8''Never%20Gonna%20Give%20You%20Up%20-%20drums.flac
    NoStore:
      description: Lyrics are never cached (ADR-015 D6).
      schema:
        type: string
        const: no-store
  schemas:
    HealthResponse:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
          const: ok
    ImportUrlRequest:
      type: object
      additionalProperties: false
      required: [url]
      properties:
        url:
          type: string
          minLength: 1
          maxLength: 2048
          description: |
            YouTube video URL (youtube.com, www.youtube.com, m.youtube.com, music.youtube.com,
            youtu.be; `watch?v=`, `youtu.be/<id>`, `shorts/<id>`) or Spotify track URL
            (`https://open.spotify.com/track/<id>`, optional `intl-xx/` segment). Playlists,
            albums, podcasts and other hosts are rejected.
    UploadRequest:
      type: object
      required: [file]
      properties:
        file:
          type: string
          contentMediaType: application/octet-stream
          description: .mp3, .wav or .flac file, at most 209715200 bytes.
    SourceType:
      type: string
      enum: [youtube, spotify, upload]
    TrackStatus:
      type: string
      description: '`completed` and `failed` are terminal; see data-model.md for transitions.'
      enum: [queued, downloading, separating, analysing, completed, failed]
    StemName:
      type: string
      enum: [vocals, drums, bass, guitar, piano, other]
    Stem:
      type: object
      additionalProperties: false
      required: [name, url]
      properties:
        name:
          $ref: '#/components/schemas/StemName'
        url:
          type: string
          description: Relative URL /api/tracks/{trackId}/stems/{name}; resolve against the public API base URL.
    BeatGrid:
      type: object
      additionalProperties: false
      required: [bpm, beats, downbeats, beatsPerBar, confidence, reliable]
      properties:
        bpm:
          type: number
          minimum: 0
          maximum: 400
        beats:
          type: array
          items:
            type: number
            minimum: 0
        downbeats:
          type: array
          items:
            type: number
            minimum: 0
        beatsPerBar:
          type: integer
          minimum: 1
          maximum: 12
        confidence:
          type: number
          minimum: 0
          maximum: 1
        reliable:
          type: boolean
    Track:
      type: object
      additionalProperties: false
      required: [id, title, sourceType, sourceKey, status, progress, stems, detail, metadata, lyricsStatus, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
          minLength: 1
          maxLength: 500
        artist:
          type: [string, 'null']
          maxLength: 500
        sourceType:
          $ref: '#/components/schemas/SourceType'
        sourceKey:
          type: string
          pattern: '^(youtube|spotify|upload):[A-Za-z0-9_-]{1,64}$'
        sourceUrl:
          type: [string, 'null']
        status:
          $ref: '#/components/schemas/TrackStatus'
        stage:
          type: [string, 'null']
          maxLength: 200
        progress:
          type: integer
          minimum: 0
          maximum: 100
        error:
          type: [string, 'null']
          maxLength: 1000
        durationSeconds:
          type: [number, 'null']
          exclusiveMinimum: 0
          maximum: 900
        model:
          type: [string, 'null']
          enum: [htdemucs_6s, htdemucs, fake, null]
        stems:
          type: array
          description: |
            Empty until completed. Stem set by model: `htdemucs_6s` and `fake` = vocals, drums, bass,
            guitar, piano, other (6); `htdemucs` = vocals, drums, bass, other (4).
          items:
            $ref: '#/components/schemas/Stem'
        beatGrid:
          oneOf:
            - $ref: '#/components/schemas/BeatGrid'
            - type: 'null'
        detail:
          $ref: '#/components/schemas/DetailPhase'
        device:
          oneOf:
            - $ref: '#/components/schemas/JobDevice'
            - type: 'null'
          description: |
            Where the standard separation ran (1.3.0); set from the worker job while separating and
            kept when completed. Null before the separation, for results that came from the cache,
            and for tracks processed before 1.3.0.
        artwork:
          oneOf:
            - $ref: '#/components/schemas/Artwork'
            - type: 'null'
          description: The picture shown (1.4.0); null when there is none (the UI shows a placeholder).
        metadata:
          $ref: '#/components/schemas/TrackMetadata'
        lyricsStatus:
          $ref: '#/components/schemas/LyricsStatus'
          description: Lyrics state (1.6.0); the lyrics themselves are only served by `GET /api/tracks/{trackId}/lyrics`.
        origin:
          $ref: '#/components/schemas/TrackOrigin'
          description: Where the track came from (1.8.0); absent (never null) on imported tracks.
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    ProcessingDeviceKind:
      type: string
      enum: [cpu, gpu]
      description: The CPU, or the NVIDIA GPU (CUDA).
    JobDevice:
      type: object
      additionalProperties: false
      required: [kind, cpuFallback]
      description: |
        Where a job ran (1.3.0; copied from the worker's `JobDevice`). `kind` is `gpu` when at
        least one model step ran on the GPU. `cpuFallback` is true when at least one model step
        ran on the CPU on a GPU worker (too little free GPU memory, or out of GPU memory and
        retried once on the CPU); the UI then shows `fallbackReason`.
      properties:
        kind:
          $ref: '#/components/schemas/ProcessingDeviceKind'
        name:
          type: [string, 'null']
          maxLength: 200
          description: GPU name when kind is gpu, else null.
        cpuFallback:
          type: boolean
        fallbackReason:
          type: [string, 'null']
          maxLength: 500
    ProcessingDevice:
      type: object
      additionalProperties: false
      required: [reachable]
      description: The worker's active processing device (1.3.0, `GET /api/device`).
      properties:
        reachable:
          type: boolean
          description: False when the worker could not be asked; every other field is then null.
        kind:
          oneOf:
            - $ref: '#/components/schemas/ProcessingDeviceKind'
            - type: 'null'
        name:
          type: [string, 'null']
          maxLength: 200
        totalMemoryMiB:
          type: [integer, 'null']
          minimum: 0
        reason:
          type: [string, 'null']
          maxLength: 500
          description: Why the GPU is not used although it was requested; null otherwise.
    ParentStemName:
      type: string
      description: A standard stem that can be split further (`bass` is never split).
      enum: [vocals, drums, guitar, piano, other]
    DetailStemName:
      type: string
      description: Same closed set as worker contract 1.1.0; `rest` is always the last stem of a group.
      enum: [kick, snare, toms, hihat, cymbals, lead, backing, strings, brass, woodwinds, keys, synth, acoustic-guitar, electric-guitar, percussion, rest]
    DetailPhaseStatus:
      type: string
      description: |
        `none` = never requested (tracks imported before feature 002, or standard separation not
        completed yet). `completed`, `failed`, `cancelled` are terminal (data-model.md 4.1).
      enum: [none, queued, running, completed, failed, cancelled]
    ParentOutcomeKind:
      type: string
      description: |
        UI texts: `split` "Split into <names>", `skipped-silent` "Skipped: (almost) silent",
        `nothing-further` "Nothing further to separate", `not-reliable` "Split was not reliable",
        `not-supported` "Not split".
      enum: [split, skipped-silent, nothing-further, not-reliable, not-supported]
    DetailStem:
      type: object
      additionalProperties: false
      required: [name, url]
      properties:
        name:
          $ref: '#/components/schemas/DetailStemName'
        url:
          type: string
          description: Relative URL /api/tracks/{trackId}/detail-stems/{parent}/{name}; resolve against the public API base URL.
    ParentOutcome:
      type: object
      additionalProperties: false
      required: [parent, outcome, stems]
      properties:
        parent:
          $ref: '#/components/schemas/StemName'
        outcome:
          $ref: '#/components/schemas/ParentOutcomeKind'
        stems:
          type: array
          maxItems: 10
          description: Detail stems in display order, `rest` last; empty unless outcome is split.
          items:
            $ref: '#/components/schemas/DetailStem'
    DetailPhase:
      type: object
      additionalProperties: false
      required: [status, progress, parents]
      properties:
        status:
          $ref: '#/components/schemas/DetailPhaseStatus'
        stage:
          type: [string, 'null']
          maxLength: 200
          description: e.g. "Queued", "Waiting for standard separations", "Splitting drums (1 of 3)".
        currentParent:
          oneOf:
            - $ref: '#/components/schemas/ParentStemName'
            - type: 'null'
        progress:
          type: integer
          minimum: 0
          maximum: 100
        error:
          type: [string, 'null']
          maxLength: 1000
          description: Set iff status is failed (e.g. "interrupted by restart").
        parents:
          type: array
          maxItems: 6
          description: One outcome per standard stem once completed (standard display order); empty otherwise.
          items:
            $ref: '#/components/schemas/ParentOutcome'
        device:
          oneOf:
            - $ref: '#/components/schemas/JobDevice'
            - type: 'null'
          description: |
            Where the detail steps ran (1.3.0), updated while running; null before the first parent
            step, for cached results and for phases completed before 1.3.0.
        updatedAt:
          type: [string, 'null']
          format: date-time
    DetailChannelSettings:
      type: object
      additionalProperties: false
      required: [parent, stem, volume, pan, mute, solo]
      properties:
        parent:
          $ref: '#/components/schemas/ParentStemName'
        stem:
          $ref: '#/components/schemas/DetailStemName'
        volume:
          type: number
          minimum: 0
          maximum: 1
          default: 0.8
        pan:
          type: number
          minimum: -1
          maximum: 1
          default: 0
        mute:
          type: boolean
          default: false
        solo:
          type: boolean
          default: false
    ChannelSettings:
      type: object
      additionalProperties: false
      required: [stem, volume, pan, mute, solo]
      properties:
        stem:
          $ref: '#/components/schemas/StemName'
        volume:
          type: number
          minimum: 0
          maximum: 1
          default: 0.8
        pan:
          type: number
          minimum: -1
          maximum: 1
          default: 0
        mute:
          type: boolean
          default: false
        solo:
          type: boolean
          default: false
    MetronomeSettings:
      type: object
      additionalProperties: false
      required: [enabled, volume, bpmOverride, offsetMs, beatsPerBar]
      properties:
        enabled:
          type: boolean
        volume:
          type: number
          minimum: 0
          maximum: 1
          default: 0.7
        bpmOverride:
          type: [number, 'null']
          minimum: 30
          maximum: 300
          description: Null follows the detected beat grid.
        offsetMs:
          type: integer
          minimum: -2000
          maximum: 2000
          default: 0
        beatsPerBar:
          type: integer
          minimum: 1
          maximum: 12
          default: 4
    LoopRegion:
      type: object
      additionalProperties: false
      required: [start, end, enabled]
      description: Requires 0 <= start < end <= track duration.
      properties:
        start:
          type: number
          minimum: 0
        end:
          type: number
          exclusiveMinimum: 0
        enabled:
          type: boolean
    MixSettings:
      type: object
      additionalProperties: false
      required: [name, masterVolume, channels, metronome, loop]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
          description: Trimmed; unique per track, compared case-insensitively.
        masterVolume:
          type: number
          minimum: 0
          maximum: 1
          default: 1
        channels:
          type: array
          maxItems: 6
          description: At most one entry per stem of the track; stems without an entry use defaults.
          items:
            $ref: '#/components/schemas/ChannelSettings'
        metronome:
          $ref: '#/components/schemas/MetronomeSettings'
        loop:
          oneOf:
            - $ref: '#/components/schemas/LoopRegion'
            - type: 'null'
        expanded:
          type: array
          uniqueItems: true
          maxItems: 5
          default: []
          description: |
            Parents shown expanded (their detail stems replace the parent audio); each must have
            outcome `split` on the track. Absent or empty = all collapsed (mixes saved before 1.2.0).
          items:
            $ref: '#/components/schemas/ParentStemName'
        detailChannels:
          type: array
          maxItems: 50
          default: []
          description: |
            At most one entry per (parent, stem); each detail stem must exist on the track; detail
            stems without an entry use defaults. Kept while the parent is collapsed.
          items:
            $ref: '#/components/schemas/DetailChannelSettings'
    CreateMixRequest:
      type: object
      additionalProperties: false
      required: [trackId, settings]
      properties:
        trackId:
          type: string
          format: uuid
        settings:
          $ref: '#/components/schemas/MixSettings'
    Mix:
      type: object
      additionalProperties: false
      required: [id, trackId, settings, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        trackId:
          type: string
          format: uuid
        settings:
          $ref: '#/components/schemas/MixSettings'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    MixSummary:
      type: object
      additionalProperties: false
      required: [id, trackId, trackTitle, name, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        trackId:
          type: string
          format: uuid
        trackTitle:
          type: string
        name:
          type: string
        updatedAt:
          type: string
          format: date-time
    ArtworkSource:
      type: string
      description: |
        Where the shown picture came from (1.4.0). Precedence of automatic pictures: `spotify` >
        `embedded` > `coverartarchive` > `youtube`; an own picture (`user`) always wins.
      enum: [user, spotify, embedded, coverartarchive, youtube]
    ArtworkVariant:
      type: string
      description: '`cover` = 600 x 600 JPEG, `thumb` = 160 x 160 JPEG.'
      enum: [cover, thumb]
    Artwork:
      type: object
      additionalProperties: false
      required: [source, version, coverUrl, thumbUrl]
      description: The picture shown for a track (1.4.0).
      properties:
        source:
          $ref: '#/components/schemas/ArtworkSource'
        version:
          type: string
          pattern: '^[0-9a-f]{12}$'
          description: First 12 hex characters of the cover's SHA-256; changes with the picture.
        coverUrl:
          type: string
          description: /api/tracks/{trackId}/artwork/cover?v={version}
        thumbUrl:
          type: string
          description: /api/tracks/{trackId}/artwork/thumb?v={version}
    MetadataStatus:
      type: string
      description: |
        Lookup state (1.4.0): `none` (never looked up, e.g. tracks from before 1.4.0), `pending`
        (scheduled), `searching`, `found`, `notFound` (no reliable match; nothing is guessed),
        `failed` (services unreachable; `reason` says why), `disabled` (online lookups off).
      enum: [none, pending, searching, found, notFound, failed, disabled]
    TrackMetadata:
      type: object
      additionalProperties: false
      required: [status, correctedByUser]
      properties:
        status:
          $ref: '#/components/schemas/MetadataStatus'
        reason:
          type: [string, 'null']
          maxLength: 1000
          description: Failure reason or warnings of the last lookup.
        album:
          type: [string, 'null']
          maxLength: 500
        year:
          type: [integer, 'null']
          minimum: 1000
          maximum: 2999
          description: First release year of the album.
        artistName:
          type: [string, 'null']
          maxLength: 500
        correctedByUser:
          type: boolean
          description: True when the user corrected title or artist for the lookup.
    MetadataLookupRequest:
      type: object
      additionalProperties: false
      description: Both optional; an empty object retries with the current names.
      properties:
        title:
          type: [string, 'null']
          minLength: 1
          maxLength: 500
        artist:
          type: [string, 'null']
          minLength: 1
          maxLength: 500
    ArtworkUploadRequest:
      type: object
      required: [file]
      properties:
        file:
          type: string
          contentMediaType: application/octet-stream
          description: JPEG, PNG or WebP picture, at most 10,485,760 bytes.
    RecordingInfo:
      type: object
      additionalProperties: false
      required: [title]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 500
        album:
          type: [string, 'null']
          maxLength: 500
        year:
          type: [integer, 'null']
          minimum: 1000
          maximum: 2999
    ArtistType:
      type: string
      enum: [group, person, orchestra, choir, character, other]
    ArtistMember:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 500
        fromYear:
          type: [integer, 'null']
          minimum: 1000
          maximum: 2999
        toYear:
          type: [integer, 'null']
          minimum: 1000
          maximum: 2999
    WikipediaSummary:
      type: object
      additionalProperties: false
      required: [language, title, extract, pageUrl, historyUrl, licence, licenceUrl]
      description: |
        Shown with: the article title linked to `pageUrl`, "Wikipedia contributors" linked to
        `historyUrl`, the licence linked to `licenceUrl`, and the note "Excerpt, unmodified".
      properties:
        language:
          type: string
          pattern: '^[a-z]{2,3}$'
        title:
          type: string
          minLength: 1
          maxLength: 500
        extract:
          type: string
          minLength: 1
          maxLength: 2000
        pageUrl:
          type: string
          pattern: '^https://'
        historyUrl:
          type: string
          pattern: '^https://'
        licence:
          type: string
          const: CC BY-SA 4.0
        licenceUrl:
          type: string
          const: https://creativecommons.org/licenses/by-sa/4.0/
    ArtistInfo:
      type: object
      additionalProperties: false
      required: [mbid, name, genres, members]
      properties:
        mbid:
          type: string
          format: uuid
          description: MusicBrainz artist id.
        name:
          type: string
          minLength: 1
          maxLength: 500
        type:
          oneOf:
            - $ref: '#/components/schemas/ArtistType'
            - type: 'null'
        country:
          type: [string, 'null']
          pattern: '^[A-Z]{2}$'
        beginYear:
          type: [integer, 'null']
          minimum: 1000
          maximum: 2999
        endYear:
          type: [integer, 'null']
          minimum: 1000
          maximum: 2999
          description: Null while active.
        genres:
          type: array
          maxItems: 8
          items:
            type: string
            maxLength: 100
        members:
          type: array
          maxItems: 12
          description: Only for groups.
          items:
            $ref: '#/components/schemas/ArtistMember'
        website:
          type: [string, 'null']
          pattern: '^https://'
        summary:
          oneOf:
            - $ref: '#/components/schemas/WikipediaSummary'
            - type: 'null'
    DataSource:
      type: object
      additionalProperties: false
      required: [name, url]
      properties:
        name:
          type: string
          enum: [MusicBrainz, Wikidata, Wikipedia, Cover Art Archive]
        url:
          type: string
          pattern: '^https://'
          description: The record or article the facts came from.
        licence:
          type: [string, 'null']
          description: '`CC0` (MusicBrainz core data, Wikidata), `CC BY-SA 4.0` (Wikipedia); null for Cover Art Archive (no licence stated; shown in the app only).'
    BandInfo:
      type: object
      additionalProperties: false
      required: [status, sources]
      properties:
        status:
          $ref: '#/components/schemas/MetadataStatus'
        reason:
          type: [string, 'null']
          maxLength: 1000
        recording:
          oneOf:
            - $ref: '#/components/schemas/RecordingInfo'
            - type: 'null'
        artist:
          oneOf:
            - $ref: '#/components/schemas/ArtistInfo'
            - type: 'null'
        sources:
          type: array
          maxItems: 4
          items:
            $ref: '#/components/schemas/DataSource'
    AssetKind:
      type: string
      description: '`audio` (1.5.0) and `score` (sheet music, 1.7.0).'
      enum: [audio, score]
    AssetStatus:
      type: string
      description: '`ready` and `failed` are terminal.'
      enum: [queued, rendering, ready, failed]
    AssetFileRole:
      type: string
      description: '`audio` (1.5.0); `pdf`, `musicxml` and `midi` of score items (1.7.0).'
      enum: [audio, pdf, musicxml, midi]
    ChannelId:
      type: string
      pattern: '^(vocals|drums|bass|guitar|piano|other)(\.[a-z][a-z-]{0,31})?$'
      description: A standard stem (`drums`) or a detail stem `<parent>.<detail>` (`drums.kick`); the engine's ChannelId.
      example: drums.kick
    ExportMode:
      type: string
      description: '`raw`: gain 1, pan 0, master 1, mute/solo ignored. `mix`: fader, pan and master of the mix.'
      enum: [raw, mix]
    AudioFileFormat:
      type: string
      enum: [flac, wav, mp3]
    ExportFormat:
      type: object
      additionalProperties: false
      required: [format]
      properties:
        format:
          $ref: '#/components/schemas/AudioFileFormat'
        bitDepth:
          type: [integer, 'null']
          enum: [16, 24, null]
          description: FLAC/WAV only; null = 16 for one raw channel, else 24.
        mp3BitrateKbps:
          type: [integer, 'null']
          enum: [192, 256, 320, null]
          description: MP3 only (constant bit rate); null = 320.
    ExportRange:
      type: object
      additionalProperties: false
      required: [startSeconds, endSeconds]
      description: Requires 0 <= startSeconds < endSeconds <= track duration and a length of at least 0.5 s.
      properties:
        startSeconds:
          type: number
          minimum: 0
        endSeconds:
          type: number
          exclusiveMinimum: 0
          maximum: 900
    ExportMix:
      type: object
      additionalProperties: false
      required: [masterVolume, channels]
      description: The mixer state used for an export (`MixSettings` without name, metronome and loop, which never affect an export).
      properties:
        masterVolume:
          type: number
          minimum: 0
          maximum: 1
        channels:
          type: array
          maxItems: 6
          items:
            $ref: '#/components/schemas/ChannelSettings'
        expanded:
          type: array
          uniqueItems: true
          maxItems: 5
          default: []
          items:
            $ref: '#/components/schemas/ParentStemName'
        detailChannels:
          type: array
          maxItems: 50
          default: []
          items:
            $ref: '#/components/schemas/DetailChannelSettings'
    CreateAudioExportRequest:
      type: object
      additionalProperties: false
      required: [trackId, mode, format]
      properties:
        trackId:
          type: string
          format: uuid
          description: A completed track.
        mode:
          $ref: '#/components/schemas/ExportMode'
        channels:
          type: [array, 'null']
          minItems: 1
          maxItems: 56
          uniqueItems: true
          description: |
            Explicit selection (each a standard stem of the track or a kept detail stem of a split
            parent), or null = every audible channel (mode `mix` only). Required in mode `raw`.
          items:
            $ref: '#/components/schemas/ChannelId'
        mix:
          oneOf:
            - $ref: '#/components/schemas/ExportMix'
            - type: 'null'
          description: Current mixer state (mode `mix`; exactly one of `mix` and `mixId`).
        mixId:
          type: [string, 'null']
          format: uuid
          description: A saved mix of the track (mode `mix`; exactly one of `mix` and `mixId`).
        range:
          oneOf:
            - $ref: '#/components/schemas/ExportRange'
            - type: 'null'
        format:
          $ref: '#/components/schemas/ExportFormat'
        name:
          type: [string, 'null']
          minLength: 1
          maxLength: 120
          description: Null = "<track title> - <contents>", made unique with " (2)", " (3)", ...
    CreateStemPackRequest:
      type: object
      additionalProperties: false
      required: [trackId, format]
      properties:
        trackId:
          type: string
          format: uuid
        includeDetail:
          type: boolean
          default: false
        format:
          $ref: '#/components/schemas/ExportFormat'
    StemPack:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          minItems: 1
          maxItems: 56
          items:
            $ref: '#/components/schemas/Asset'
    RenameAssetRequest:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
          description: Trimmed; no control characters.
    AssetFile:
      type: object
      additionalProperties: false
      required: [role, contentType, sizeBytes, sha256, url]
      properties:
        role:
          $ref: '#/components/schemas/AssetFileRole'
        contentType:
          type: string
          enum: [audio/flac, audio/wav, audio/mpeg, application/pdf, application/vnd.recordare.musicxml+xml, audio/midi]
        sizeBytes:
          type: integer
          minimum: 1
        sha256:
          type: string
          pattern: '^[0-9a-f]{64}$'
        url:
          type: string
          description: /api/assets/{assetId}/files/{role}
    AudioFacts:
      type: object
      additionalProperties: false
      required: [format, bitDepth, mp3BitrateKbps, sampleRate, channels, durationSeconds, peakDbfs, appliedGainDb]
      properties:
        format:
          $ref: '#/components/schemas/AudioFileFormat'
        bitDepth:
          type: [integer, 'null']
          enum: [16, 24, null]
        mp3BitrateKbps:
          type: [integer, 'null']
          enum: [192, 256, 320, null]
        sampleRate:
          type: integer
          enum: [44100, 48000]
          description: 44100 for exports; 48000 for generated takes (1.8.0).
        channels:
          type: integer
          const: 2
        durationSeconds:
          type: number
          exclusiveMinimum: 0
          maximum: 900
        peakDbfs:
          type: number
          maximum: 0
        appliedGainDb:
          type: number
          maximum: 0
          description: Negative when the export was lowered to avoid clipping ("Lowered by X dB").
    ExportRecipe:
      type: object
      additionalProperties: false
      required: [trackId, mode, channels, mix, range, format]
      description: The normalised export request (stored; used by retry and by the agent).
      properties:
        trackId:
          type: string
          format: uuid
        mode:
          $ref: '#/components/schemas/ExportMode'
        channels:
          type: [array, 'null']
          items:
            $ref: '#/components/schemas/ChannelId'
        mix:
          oneOf:
            - $ref: '#/components/schemas/ExportMix'
            - type: 'null'
          description: Snapshot of the mix used (mode `mix`; a `mixId` is resolved and copied at creation).
        range:
          oneOf:
            - $ref: '#/components/schemas/ExportRange'
            - type: 'null'
        format:
          $ref: '#/components/schemas/ExportFormat'
    AssetOrigin:
      type: string
      description: '`export` (1.5.0), `transcription` (1.7.0), `generation` (a take of a generation, 1.8.0).'
      enum: [export, transcription, generation]
    Provenance:
      type: object
      additionalProperties: false
      required: [origin, trackId, trackTitle, trackArtist, trackAvailable, sourceAssetIds, contents, recipe, scoreRecipe]
      properties:
        origin:
          $ref: '#/components/schemas/AssetOrigin'
        trackId:
          type: [string, 'null']
          format: uuid
        trackTitle:
          type: string
          maxLength: 300
          description: Snapshot taken at creation; kept when the track is deleted.
        trackArtist:
          type: [string, 'null']
          maxLength: 500
        trackAvailable:
          type: boolean
          description: Whether the track still exists (computed on read).
        sourceAssetIds:
          type: array
          description: Library items this item was made from (empty for exports).
          items:
            type: string
            format: uuid
        contents:
          type: string
          maxLength: 200
          description: e.g. "drums, raw", "vocals + bass + drums.kick, mixed, 0:30-1:15", "6 channels, mixed".
        recipe:
          oneOf:
            - $ref: '#/components/schemas/ExportRecipe'
            - type: 'null'
          description: How an export was made (origin `export`); null for score items (1.7.0).
        scoreRecipe:
          oneOf:
            - $ref: '#/components/schemas/ScoreRecipe'
            - type: 'null'
          description: How a score item was made (origin `transcription`, 1.7.0); null for exports.
        generation:
          oneOf:
            - $ref: '#/components/schemas/GenerationProvenance'
            - type: 'null'
          description: The generation of a take item (origin `generation`, 1.8.0); absent or null otherwise.
    Asset:
      type: object
      additionalProperties: false
      required: [id, kind, name, status, progress, error, files, audio, score, provenance, sizeBytes, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        kind:
          $ref: '#/components/schemas/AssetKind'
        name:
          type: string
          minLength: 1
          maxLength: 120
        status:
          $ref: '#/components/schemas/AssetStatus'
        progress:
          type: integer
          minimum: 0
          maximum: 100
        error:
          type: [string, 'null']
          maxLength: 500
          description: Readable reason; set exactly when status is failed.
        files:
          type: array
          maxItems: 4
          description: Empty until ready.
          items:
            $ref: '#/components/schemas/AssetFile'
        audio:
          oneOf:
            - $ref: '#/components/schemas/AudioFacts'
            - type: 'null'
          description: Set when a kind `audio` item is ready.
        score:
          oneOf:
            - $ref: '#/components/schemas/ScoreFacts'
            - type: 'null'
          description: Set when a kind `score` item is ready (1.7.0).
        provenance:
          $ref: '#/components/schemas/Provenance'
        sizeBytes:
          type: integer
          minimum: 0
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    AssetList:
      type: object
      additionalProperties: false
      required: [items, total, totalSizeBytes]
      properties:
        items:
          type: array
          maxItems: 200
          items:
            $ref: '#/components/schemas/Asset'
        total:
          type: integer
          minimum: 0
        totalSizeBytes:
          type: integer
          minimum: 0
    AudioSource:
      description: |
        An audio input of later features (008 transcription, 009 style transfer, 011 agent): a
        channel of a track or a library item. Not used by a 1.5.0 operation.
      oneOf:
        - type: object
          additionalProperties: false
          required: [trackId, channel]
          properties:
            trackId:
              type: string
              format: uuid
            channel:
              $ref: '#/components/schemas/ChannelId'
        - type: object
          additionalProperties: false
          required: [assetId]
          properties:
            assetId:
              type: string
              format: uuid
    LyricsStatus:
      type: string
      description: |
        Lyrics state of a track (1.6.0, data-model.md 3.2). `none`: never looked up (older tracks
        or before the duration is known); `found`: timed lyrics available (banner); `alignPending`:
        text without timing, alignment not started (CPU worker); `removed`: removed by the user (no
        automatic lookup any more).
      enum: [none, searching, found, instrumental, notFound, alignPending, aligning, failed, disabled, removed]
    SyncLevel:
      type: string
      enum: [word, line, plain]
    WordOrigin:
      type: string
      enum: [source, interpolated, aligned]
    LyricsOrigin:
      type: string
      enum: [source, interpolated, aligned, none]
    LyricsSource:
      type: string
      enum: [lrclib, user]
    LyricsWord:
      type: object
      additionalProperties: false
      required: [text, startMs, endMs, origin, lowConfidence]
      description: Integer milliseconds from the start of the track audio; null in a plain document.
      properties:
        text:
          type: string
          minLength: 1
          maxLength: 100
        startMs:
          type: [integer, 'null']
          minimum: 0
        endMs:
          type: [integer, 'null']
          minimum: 1
        origin:
          oneOf:
            - $ref: '#/components/schemas/WordOrigin'
            - type: 'null'
        lowConfidence:
          type: boolean
    LyricsLine:
      type: object
      additionalProperties: false
      required: [startMs, endMs, text, words]
      properties:
        startMs:
          type: [integer, 'null']
          minimum: 0
        endMs:
          type: [integer, 'null']
          minimum: 1
        text:
          type: string
          minLength: 1
          maxLength: 500
        words:
          type: array
          minItems: 1
          maxItems: 40
          items:
            $ref: '#/components/schemas/LyricsWord'
    LyricsAlignment:
      type: object
      additionalProperties: false
      required: [estimateSeconds, device, progress]
      description: The alignment of the track's text (status `alignPending` or `aligning`).
      properties:
        estimateSeconds:
          type: [integer, 'null']
          minimum: 0
          description: Expected duration on the worker's device (shown before a CPU alignment is started).
        device:
          oneOf:
            - $ref: '#/components/schemas/JobDevice'
            - type: 'null'
        progress:
          type: [integer, 'null']
          minimum: 0
          maximum: 100
          description: Set while aligning.
    Lyrics:
      type: object
      additionalProperties: false
      required: [status, reason, syncLevel, origin, language, source, credit, offsetMs, instrumental, lines, alignment]
      description: |
        The lyrics of a track (1.6.0). `lines` carry the text also for plain documents (times
        null), so the track page can show it while alignment is pending. `credit` is built by the
        backend: "Lyrics: LRCLIB" or "Lyrics: entered by you", plus "; word timing estimated"
        (interpolated) or "; timing: automatic alignment" (aligned).
      properties:
        status:
          $ref: '#/components/schemas/LyricsStatus'
        reason:
          type: [string, 'null']
          maxLength: 1000
          description: Readable reason for failed, notFound, disabled and the alignPending estimate.
        syncLevel:
          oneOf:
            - $ref: '#/components/schemas/SyncLevel'
            - type: 'null'
        origin:
          oneOf:
            - $ref: '#/components/schemas/LyricsOrigin'
            - type: 'null'
        language:
          type: [string, 'null']
          pattern: '^[a-z]{2,3}$'
        source:
          oneOf:
            - $ref: '#/components/schemas/LyricsSource'
            - type: 'null'
        credit:
          type: [string, 'null']
          maxLength: 200
        offsetMs:
          type: integer
          minimum: -5000
          maximum: 5000
          multipleOf: 10
        instrumental:
          type: boolean
        lines:
          type: array
          maxItems: 400
          items:
            $ref: '#/components/schemas/LyricsLine'
        alignment:
          oneOf:
            - $ref: '#/components/schemas/LyricsAlignment'
            - type: 'null'
    SetLyricsRequest:
      type: object
      additionalProperties: false
      required: [text]
      properties:
        text:
          type: string
          minLength: 1
          maxLength: 20000
        language:
          type: [string, 'null']
          pattern: '^[a-z]{2,3}$'
          description: Language hint for the alignment; null = detect.
    LyricsOffsetRequest:
      type: object
      additionalProperties: false
      required: [offsetMs]
      properties:
        offsetMs:
          type: integer
          minimum: -5000
          maximum: 5000
          multipleOf: 10
          description: Positive = the lyrics come later.
    ScoreProfile:
      type: string
      description: Instrument profile (data-model.md 2.1).
      enum: [vocals, bass, guitar, keys, piano, drums]
    ScoreQuality:
      type: string
      description: Piano only - `accurate` (piano model, GPU when available) or `fast` (basic-pitch).
      enum: [accurate, fast]
    ScoreResolution:
      type: string
      description: '`eighth` is shown as "simplified".'
      enum: [sixteenth, eighth]
    KeyName:
      type: string
      description: One of the 30 key signatures in music21 spelling (`-` = flat).
      enum: ['C major', 'G major', 'D major', 'A major', 'E major', 'B major', 'F# major', 'C# major',
             'F major', 'B- major', 'E- major', 'A- major', 'D- major', 'G- major', 'C- major',
             'A minor', 'E minor', 'B minor', 'F# minor', 'C# minor', 'G# minor', 'D# minor', 'A# minor',
             'D minor', 'G minor', 'C minor', 'F minor', 'B- minor', 'E- minor', 'A- minor']
    ScoreTempo:
      type: object
      additionalProperties: false
      required: [bpm, beatsPerBar, firstDownbeatSeconds]
      description: A manual tempo; overrides the beat grid when given.
      properties:
        bpm:
          type: number
          minimum: 30
          maximum: 300
        beatsPerBar:
          type: integer
          minimum: 1
          maximum: 12
        firstDownbeatSeconds:
          type: number
          minimum: 0
          maximum: 900
    ScoreRange:
      type: object
      additionalProperties: false
      required: [startSeconds, endSeconds]
      description: Part of the source; at least 2 s long (`ContractLimits.MinScoreRangeSeconds`).
      properties:
        startSeconds:
          type: number
          minimum: 0
        endSeconds:
          type: number
          exclusiveMinimum: 0
    CreateScoreRequest:
      type: object
      additionalProperties: false
      required: [source]
      properties:
        source:
          $ref: '#/components/schemas/AudioSource'
        profile:
          oneOf:
            - $ref: '#/components/schemas/ScoreProfile'
            - type: 'null'
          description: Null = the suggested profile of the channel.
        quality:
          oneOf:
            - $ref: '#/components/schemas/ScoreQuality'
            - type: 'null'
          description: Null = `accurate` on a GPU worker, else `fast` (piano only).
        resolution:
          oneOf:
            - $ref: '#/components/schemas/ScoreResolution'
            - type: 'null'
          description: Null = the profile's default.
        keyOverride:
          oneOf:
            - $ref: '#/components/schemas/KeyName'
            - type: 'null'
        tempo:
          oneOf:
            - $ref: '#/components/schemas/ScoreTempo'
            - type: 'null'
          description: Required when the grid is unreliable or absent (`422 tempo-required`).
        range:
          oneOf:
            - $ref: '#/components/schemas/ScoreRange'
            - type: 'null'
        name:
          type: [string, 'null']
          minLength: 1
          maxLength: 120
          description: Null = "<track title> - <channel> (sheet music)".
    ScoreRecipe:
      type: object
      additionalProperties: false
      required: [kind, source, profile, quality, resolution, keyOverride, tempo, range]
      description: The normalised request of a score item (defaults resolved).
      properties:
        kind:
          type: string
          const: score
        source:
          $ref: '#/components/schemas/AudioSource'
        profile:
          $ref: '#/components/schemas/ScoreProfile'
        quality:
          oneOf:
            - $ref: '#/components/schemas/ScoreQuality'
            - type: 'null'
          description: Set for piano only.
        resolution:
          $ref: '#/components/schemas/ScoreResolution'
        keyOverride:
          oneOf:
            - $ref: '#/components/schemas/KeyName'
            - type: 'null'
        tempo:
          oneOf:
            - $ref: '#/components/schemas/ScoreTempo'
            - type: 'null'
        range:
          oneOf:
            - $ref: '#/components/schemas/ScoreRange'
            - type: 'null'
    KeyInfo:
      type: object
      additionalProperties: false
      required: [tonic, mode, confidence, source]
      properties:
        tonic:
          type: string
          pattern: '^[A-G](#|-)?$'
        mode:
          type: string
          enum: [major, minor]
        confidence:
          type: number
          minimum: 0
          maximum: 1
        source:
          type: string
          enum: [estimated, override]
    ScoreWarningCode:
      type: string
      enum: [manual-tempo, low-key-confidence, notes-cleaned, dense-capped, detail-bleed, cpu-piano, few-notes, missing-drum-piece]
    ScoreWarning:
      type: object
      additionalProperties: false
      required: [code, text]
      properties:
        code:
          $ref: '#/components/schemas/ScoreWarningCode'
        text:
          type: string
          minLength: 1
          maxLength: 300
    ScoreEngine:
      type: string
      enum: [basic-pitch, piano-crnn, drum-onsets, fake]
    ScoreFacts:
      type: object
      additionalProperties: false
      required: [profile, engine, quality, key, bpm, timeSignature, bars, notes, pages, resolution, warnings, attribution, device]
      description: The worker's score summary plus where the model ran (1.7.0).
      properties:
        profile:
          $ref: '#/components/schemas/ScoreProfile'
        engine:
          $ref: '#/components/schemas/ScoreEngine'
        quality:
          oneOf:
            - $ref: '#/components/schemas/ScoreQuality'
            - type: 'null'
        key:
          oneOf:
            - $ref: '#/components/schemas/KeyInfo'
            - type: 'null'
          description: Null for drums.
        bpm:
          type: integer
          minimum: 30
          maximum: 300
        timeSignature:
          type: string
          pattern: '^([1-9]|1[0-2])/4$'
        bars:
          type: integer
          minimum: 1
        notes:
          type: integer
          minimum: 1
        pages:
          type: integer
          minimum: 1
        resolution:
          $ref: '#/components/schemas/ScoreResolution'
        warnings:
          type: array
          maxItems: 8
          items:
            $ref: '#/components/schemas/ScoreWarning'
        attribution:
          type: [string, 'null']
          maxLength: 300
        device:
          oneOf:
            - $ref: '#/components/schemas/JobDevice'
            - type: 'null'
    GridStatus:
      type: string
      description: '`reliable`: the track beat grid is used; `unreliable`/`none`: a manual tempo is required.'
      enum: [reliable, unreliable, none]
    ScoreEstimate:
      type: object
      additionalProperties: false
      required: [profile, quality, seconds]
      properties:
        profile:
          $ref: '#/components/schemas/ScoreProfile'
        quality:
          oneOf:
            - $ref: '#/components/schemas/ScoreQuality'
            - type: 'null'
          description: Set for the two piano estimates.
        seconds:
          type: integer
          minimum: 0
    ProfileLimit:
      type: object
      additionalProperties: false
      required: [profile, text]
      properties:
        profile:
          $ref: '#/components/schemas/ScoreProfile'
        text:
          type: string
          minLength: 1
          maxLength: 500
    ScoreOptions:
      type: object
      additionalProperties: false
      required: [source, durationSeconds, suggestedProfile, allowedProfiles, drumsRequireSplit, gridStatus, defaultQuality, estimates, limits, attribution]
      properties:
        source:
          $ref: '#/components/schemas/AudioSource'
        durationSeconds:
          type: number
          exclusiveMinimum: 0
          maximum: 900
        suggestedProfile:
          oneOf:
            - $ref: '#/components/schemas/ScoreProfile'
            - type: 'null'
          description: Null for channels without a suggestion (single drum pieces).
        allowedProfiles:
          type: array
          maxItems: 6
          items:
            $ref: '#/components/schemas/ScoreProfile'
        drumsRequireSplit:
          type: boolean
          description: True for the `drums` channel while the drums are not split into detail stems.
        gridStatus:
          $ref: '#/components/schemas/GridStatus'
        defaultQuality:
          $ref: '#/components/schemas/ScoreQuality'
        estimates:
          type: array
          maxItems: 8
          items:
            $ref: '#/components/schemas/ScoreEstimate'
        limits:
          type: array
          maxItems: 6
          items:
            $ref: '#/components/schemas/ProfileLimit'
        attribution:
          type: string
          maxLength: 300
          description: Credit of the piano model (CC BY 4.0), shown with the piano quality choice.
    ProblemDetails:
      type: object
      description: RFC 9457 problem details. Extension members are allowed.
      required: [title, status]
      properties:
        type:
          type: string
          default: about:blank
        title:
          type: string
        status:
          type: integer
          minimum: 400
          maximum: 599
        detail:
          type: [string, 'null']
        instance:
          type: [string, 'null']
      additionalProperties: true
    ValidationProblemDetails:
      allOf:
        - $ref: '#/components/schemas/ProblemDetails'
        - type: object
          required: [errors]
          properties:
            errors:
              type: object
              additionalProperties:
                type: array
                items:
                  type: string
    GenerationAvailability:
      type: string
      description: '`notInstalled` no generator configured or reachable; `unavailable` running without a usable GPU (reason set); `ready` generation possible (1.8.0).'
      enum: [notInstalled, unavailable, ready]
    GenerationModel:
      type: object
      additionalProperties: false
      required: [id, present, bytes]
      properties:
        id:
          type: string
          maxLength: 64
          example: acestep-v15-turbo
        present:
          type: boolean
        bytes:
          type: integer
          minimum: 0
    GenerationStatus:
      type: object
      additionalProperties: false
      required: [state, reason, device, models, downloadBytesNeeded, voice]
      description: Availability of the generative features (1.8.0, `GET /api/generation/status`).
      properties:
        state:
          $ref: '#/components/schemas/GenerationAvailability'
        reason:
          type: [string, 'null']
          maxLength: 500
          description: Readable reason when not ready (the generator's probe reason, or "The generator service is not installed.").
        device:
          oneOf:
            - $ref: '#/components/schemas/ProcessingDevice'
            - type: 'null'
          description: The generator's device (`reachable` true); null when not installed.
        models:
          type: array
          maxItems: 16
          items:
            $ref: '#/components/schemas/GenerationModel'
        downloadBytesNeeded:
          type: integer
          minimum: 0
          description: Sum of `bytes` of the models that are not present (generator and singer).
        voice:
          $ref: '#/components/schemas/VoiceServiceStatus'
    VoiceServiceStatus:
      type: object
      additionalProperties: false
      required: [state, reason]
      description: Availability of the voice features (the singer service, `StemStudio:SingerBaseUrl`) (1.9.0).
      properties:
        state:
          $ref: '#/components/schemas/GenerationAvailability'
        reason:
          type: [string, 'null']
          maxLength: 500
    StyleKind:
      type: string
      description: '`preset` curated and read-only; `user` created by the user.'
      enum: [preset, user]
    GenreFamily:
      type: string
      enum: [rock, pop, jazz, blues, electronic, hipHop, latin, folk, classical, world, country, metal, soul, ambient]
    TempoFeel:
      type: string
      description: '`keep` follows the source; the others steer the caption.'
      enum: [keep, laidback, driving, halfTime, swing]
    VocalHandling:
      type: string
      description: '`keep` the vocals stay in the source mix; `instrumental` the vocal stem is excluded and the caption says "instrumental".'
      enum: [keep, instrumental]
    Strength:
      type: string
      description: How far the take may move from the source; cover strength 0.85 / 0.70 / 0.55 / 0.40 / 0.25 (ADR-018 D7). UI slider position 0-4.
      enum: [subtle, light, balanced, strong, free]
    StyleTag:
      type: string
      minLength: 1
      maxLength: 30
    StyleInput:
      type: object
      additionalProperties: false
      required: [name, genreFamily, tempoFeel, instrumentation, moods, vocalHandling, defaultStrength]
      description: A user style as written by the editor; every text passes the imitation guard.
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 60
          description: Unique across the library (case-insensitive).
        genreFamily:
          $ref: '#/components/schemas/GenreFamily'
        subGenre:
          type: [string, 'null']
          maxLength: 40
        tempoFeel:
          $ref: '#/components/schemas/TempoFeel'
        instrumentation:
          type: array
          maxItems: 8
          items:
            $ref: '#/components/schemas/StyleTag'
        moods:
          type: array
          maxItems: 8
          items:
            $ref: '#/components/schemas/StyleTag'
        vocalHandling:
          $ref: '#/components/schemas/VocalHandling'
        defaultStrength:
          $ref: '#/components/schemas/Strength'
        description:
          type: [string, 'null']
          maxLength: 300
          description: Shown in the library; part of the caption for user styles only.
    Style:
      type: object
      additionalProperties: false
      required: [id, kind, presetKey, name, genreFamily, subGenre, tempoFeel, instrumentation, moods, vocalHandling, defaultStrength, description, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        kind:
          $ref: '#/components/schemas/StyleKind'
        presetKey:
          type: [string, 'null']
          pattern: '^[a-z0-9]+(-[a-z0-9]+)*$'
          maxLength: 40
          description: Stable key of a preset (e.g. `jazz-trio`); null for user styles.
        name:
          type: string
          minLength: 1
          maxLength: 60
        genreFamily:
          $ref: '#/components/schemas/GenreFamily'
        subGenre:
          type: [string, 'null']
          maxLength: 40
        tempoFeel:
          $ref: '#/components/schemas/TempoFeel'
        instrumentation:
          type: array
          maxItems: 8
          items:
            $ref: '#/components/schemas/StyleTag'
        moods:
          type: array
          maxItems: 8
          items:
            $ref: '#/components/schemas/StyleTag'
        vocalHandling:
          $ref: '#/components/schemas/VocalHandling'
        defaultStrength:
          $ref: '#/components/schemas/Strength'
        description:
          type: [string, 'null']
          maxLength: 300
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    StyleSnapshot:
      type: object
      additionalProperties: false
      required: [styleId, kind, presetKey, name, genreFamily, subGenre, tempoFeel, instrumentation, moods, vocalHandling, defaultStrength, description]
      description: The style as it was when the generation was created (kept when the style changes or is deleted).
      properties:
        styleId:
          type: string
          format: uuid
        kind:
          $ref: '#/components/schemas/StyleKind'
        presetKey:
          type: [string, 'null']
          maxLength: 40
        name:
          type: string
          minLength: 1
          maxLength: 60
        genreFamily:
          $ref: '#/components/schemas/GenreFamily'
        subGenre:
          type: [string, 'null']
          maxLength: 40
        tempoFeel:
          $ref: '#/components/schemas/TempoFeel'
        instrumentation:
          type: array
          maxItems: 8
          items:
            $ref: '#/components/schemas/StyleTag'
        moods:
          type: array
          maxItems: 8
          items:
            $ref: '#/components/schemas/StyleTag'
        vocalHandling:
          $ref: '#/components/schemas/VocalHandling'
        defaultStrength:
          $ref: '#/components/schemas/Strength'
        description:
          type: [string, 'null']
          maxLength: 300
    RestyleMode:
      type: string
      description: '`range` the range becomes the take; `inPlace` the whole track is kept and only the range is restyled (take length = track length).'
      enum: [range, inPlace]
    RestyleRequest:
      type: object
      additionalProperties: false
      required: [styleId, mode]
      description: |
        Range defaults: start 0, end min(track duration, start + 480). `rangeEndSeconds -
        rangeStartSeconds` must be 10-480 s and inside the track. `includedStems` defaults to all
        stems of the track (minus `vocals` for an `instrumental` style); `strength` to the style's
        default; `takes` 1-2.
      properties:
        styleId:
          type: string
          format: uuid
        mode:
          $ref: '#/components/schemas/RestyleMode'
        rangeStartSeconds:
          type: [number, 'null']
          minimum: 0
        rangeEndSeconds:
          type: [number, 'null']
          exclusiveMinimum: 0
        includedStems:
          type: [array, 'null']
          minItems: 1
          maxItems: 6
          uniqueItems: true
          items:
            $ref: '#/components/schemas/StemName'
        strength:
          oneOf:
            - $ref: '#/components/schemas/Strength'
            - type: 'null'
        takes:
          type: integer
          minimum: 1
          maximum: 2
          default: 1
    GenerationKind:
      type: string
      description: '`restyle` (1.8.0); `song`, `voiceConversion` (1.9.0).'
      enum: [restyle, song, voiceConversion]
    GenerationState:
      type: string
      description: |
        Mirrors the generator job (`queued`, `waitingForGpu`, `downloadingModel`, `running`) and
        the terminal states `completed`, `failed`, `cancelled`. `waitingForStems` (1.9.0, voice
        conversions only, API side): the source take is being imported and separated.
      enum: [queued, waitingForStems, waitingForGpu, downloadingModel, running, completed, failed, cancelled]
    GenerationErrorCode:
      type: string
      description: Same codes as the generator contract 1.1.0 (`unvoicedTarget`, `promptInvalid` from 1.9.0).
      enum: [gpuRequired, gpuBusy, outOfMemory, modelDownloadFailed, interrupted, invalidInput, engineError, unvoicedTarget, promptInvalid]
    GenerationError:
      type: object
      additionalProperties: false
      required: [code, message]
      properties:
        code:
          $ref: '#/components/schemas/GenerationErrorCode'
        message:
          type: string
          maxLength: 500
    SourceRange:
      type: object
      additionalProperties: false
      required: [startSeconds, endSeconds, mode]
      properties:
        startSeconds:
          type: number
          minimum: 0
        endSeconds:
          type: number
          exclusiveMinimum: 0
        mode:
          $ref: '#/components/schemas/RestyleMode'
    RestyleDetails:
      type: object
      additionalProperties: false
      required: [sourceTrackId, sourceTrackTitle, range, includedStems, style, strength, caption]
      description: What a restyle was made from (snapshots, kept when the track or style is deleted).
      properties:
        sourceTrackId:
          type: [string, 'null']
          format: uuid
          description: Null after the source track was deleted.
        sourceTrackTitle:
          type: string
          minLength: 1
          maxLength: 500
        range:
          $ref: '#/components/schemas/SourceRange'
        includedStems:
          type: array
          minItems: 1
          maxItems: 6
          items:
            $ref: '#/components/schemas/StemName'
        style:
          $ref: '#/components/schemas/StyleSnapshot'
        strength:
          $ref: '#/components/schemas/Strength'
        caption:
          type: string
          minLength: 1
          maxLength: 512
          description: The caption sent to the model (stored for reproducibility).
    GenerationTakeModel:
      type: object
      additionalProperties: false
      required: [id, revision]
      properties:
        id:
          type: string
          maxLength: 64
          example: acestep-v15-turbo
        revision:
          type: string
          maxLength: 64
    GenerationTake:
      type: object
      additionalProperties: false
      required: [index, seed, durationSeconds, audioUrl, libraryAssetId, importedTrackId, model, aiGenerated, vocal, voiceProfileName, vocalAudioUrl]
      properties:
        index:
          type: integer
          minimum: 1
          maximum: 2
        seed:
          type: integer
          minimum: 0
          maximum: 2147483647
        durationSeconds:
          type: number
          exclusiveMinimum: 0
        audioUrl:
          type: string
          example: /api/generations/1a2b3c4d-5e6f-4a7b-8c9d-0e1f2a3b4c5d/takes/1/audio
        libraryAssetId:
          type: [string, 'null']
          format: uuid
          description: The take's item in the asset library (origin `generation`).
        importedTrackId:
          type: [string, 'null']
          format: uuid
          description: Set once the take was imported as a track.
        model:
          $ref: '#/components/schemas/GenerationTakeModel'
        aiGenerated:
          type: boolean
          const: true
          description: Always true; the UI shows the AI badge.
        vocal:
          oneOf:
            - $ref: '#/components/schemas/VocalLabel'
            - type: 'null'
          description: AI voice label (1.9.0); null for restyle takes.
        voiceProfileName:
          type: [string, 'null']
          maxLength: 100
          description: Voice profile of a converted take (1.9.0).
        vocalAudioUrl:
          type: [string, 'null']
          description: The converted vocal of a voice-conversion take (1.9.0).
    Generation:
      type: object
      additionalProperties: false
      required: [id, kind, status, progress, stage, takes, warnings, device, error, createdAt, updatedAt, completedAt]
      description: A generation (1.8.0). The details member named by `kind` is set (`restyle`; `song`, `voiceConversion` from 1.9.0); the others are absent or null.
      properties:
        id:
          type: string
          format: uuid
        kind:
          $ref: '#/components/schemas/GenerationKind'
        status:
          $ref: '#/components/schemas/GenerationState'
        progress:
          type: integer
          minimum: 0
          maximum: 100
        stage:
          type: [string, 'null']
          maxLength: 200
        restyle:
          oneOf:
            - $ref: '#/components/schemas/RestyleDetails'
            - type: 'null'
        song:
          oneOf:
            - $ref: '#/components/schemas/SongDetails'
            - type: 'null'
        voiceConversion:
          oneOf:
            - $ref: '#/components/schemas/VoiceConversionDetails'
            - type: 'null'
        takes:
          type: array
          maxItems: 2
          description: Empty until completed.
          items:
            $ref: '#/components/schemas/GenerationTake'
        warnings:
          type: array
          maxItems: 5
          items:
            type: string
            maxLength: 300
        device:
          oneOf:
            - $ref: '#/components/schemas/JobDevice'
            - type: 'null'
        error:
          oneOf:
            - $ref: '#/components/schemas/GenerationError'
            - type: 'null'
          description: Set iff `status` is `failed`.
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        completedAt:
          type: [string, 'null']
          format: date-time
    TrackOriginKind:
      type: string
      enum: [imported, generated]
    TrackOrigin:
      type: object
      additionalProperties: false
      required: [kind, generationId, takeIndex, sourceTrackId, aiGenerated, vocal, voiceProfileName, lyricsSheetId]
      description: Where a track came from (1.8.0). Absent on imported tracks.
      properties:
        kind:
          $ref: '#/components/schemas/TrackOriginKind'
        generationId:
          type: [string, 'null']
          format: uuid
        takeIndex:
          type: [integer, 'null']
          minimum: 1
          maximum: 2
        sourceTrackId:
          type: [string, 'null']
          format: uuid
          description: The track the generation was made from (restyles), for the source link; null when deleted or not applicable.
        aiGenerated:
          type: boolean
        vocal:
          oneOf:
            - $ref: '#/components/schemas/VocalLabel'
            - type: 'null'
          description: AI voice label of the take (1.9.0); null for restyles.
        voiceProfileName:
          type: [string, 'null']
          maxLength: 100
        lyricsSheetId:
          type: [string, 'null']
          format: uuid
          description: The lyrics sheet of a song (1.9.0), for the lyrics link.
    GenerationProvenance:
      type: object
      additionalProperties: false
      required: [generationId, takeIndex, kind]
      description: The generation a library item came from (origin `generation`, 1.8.0).
      properties:
        generationId:
          type: string
          format: uuid
        takeIndex:
          type: integer
          minimum: 1
          maximum: 2
        kind:
          $ref: '#/components/schemas/GenerationKind'
    LyricsLanguage:
      type: string
      description: Lyrics language (ISO 639-1 plus `yue`, the 50 languages of ACE-Step 1.5), or `unknown` (1.9.0).
      enum: [ar, az, bg, bn, ca, cs, da, de, el, en, es, fa, fi, fr, he, hi, hr, ht, hu, id, is, it, ja, ko, la, lt, ms, ne, nl, 'no', pa, pl, pt, ro, ru, sa, sk, sr, sv, sw, ta, te, th, tl, tr, uk, ur, vi, yue, zh, unknown]
    LyricsInput:
      type: object
      additionalProperties: false
      required: [title, language, text]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 80
        language:
          $ref: '#/components/schemas/LyricsLanguage'
        text:
          type: string
          minLength: 1
          maxLength: 65536
          description: Raw text; 1-4,096 characters after normalisation.
    LyricsSheet:
      type: object
      additionalProperties: false
      required: [id, title, language, text, createdAt, updatedAt]
      description: Own lyrics, normalised (1.9.0).
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
          minLength: 1
          maxLength: 80
        language:
          $ref: '#/components/schemas/LyricsLanguage'
        text:
          type: string
          minLength: 1
          maxLength: 4096
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    LyricsUploadRequest:
      type: object
      required: [file]
      properties:
        file:
          type: string
          contentMediaType: application/octet-stream
          description: .txt, .lrc or .md, UTF-8, at most 64 KiB (65,536 bytes).
        title:
          type: [string, 'null']
          maxLength: 80
          description: Defaults to the file name without extension.
        language:
          oneOf:
            - $ref: '#/components/schemas/LyricsLanguage'
            - type: 'null'
          description: Defaults to `unknown`.
    SectionsRequest:
      type: object
      additionalProperties: false
      required: [text]
      properties:
        text:
          type: string
          minLength: 1
          maxLength: 65536
    SectionMarker:
      type: string
      description: Recognised section markers (case-insensitive in the text, optionally numbered, `[verse 2]`).
      enum: [intro, verse, pre-chorus, chorus, bridge, outro, instrumental]
    LyricsSection:
      type: object
      additionalProperties: false
      required: [marker, number, lineCount]
      properties:
        marker:
          $ref: '#/components/schemas/SectionMarker'
        number:
          type: [integer, 'null']
          minimum: 1
          maximum: 99
        lineCount:
          type: integer
          minimum: 0
    SectionProposal:
      type: object
      additionalProperties: false
      required: [text, sections, wordsPerSecondAt120s]
      properties:
        text:
          type: string
          maxLength: 4096
          description: The normalised text with proposed markers (existing markers are kept).
        sections:
          type: array
          items:
            $ref: '#/components/schemas/LyricsSection'
        wordsPerSecondAt120s:
          type: number
          minimum: 0
          description: Lyrics density for a 120 s song; above 4.0 the UI warns.
    LeadVoice:
      type: string
      enum: [female, male, any]
    SongRequest:
      type: object
      additionalProperties: false
      required: [language, leadVoice]
      description: |
        One of `lyricsId` / `lyricsText`; at most one of `styleId` / `freeCaption`. Defaults:
        `instrumental` false, `durationSeconds` 120, `takes` 1, BPM/key/time signature chosen by
        the model (or 120 BPM 4/4 when the language-model planner does not run).
      properties:
        lyricsId:
          type: [string, 'null']
          format: uuid
        lyricsText:
          type: [string, 'null']
          maxLength: 65536
        title:
          type: [string, 'null']
          maxLength: 80
          description: Song title; defaults to the lyrics sheet title or "Untitled song".
        language:
          $ref: '#/components/schemas/LyricsLanguage'
        styleId:
          type: [string, 'null']
          format: uuid
        freeCaption:
          type: [string, 'null']
          maxLength: 300
        leadVoice:
          $ref: '#/components/schemas/LeadVoice'
        delivery:
          type: [string, 'null']
          maxLength: 40
          example: breathy, soft
        instrumental:
          type: boolean
          default: false
        bpm:
          type: [integer, 'null']
          minimum: 40
          maximum: 220
        keyScale:
          type: [string, 'null']
          pattern: '^[A-G](#|b)? (major|minor)$'
        timeSignature:
          type: [string, 'null']
          enum: ['2', '3', '4', '6', null]
        durationSeconds:
          type: number
          minimum: 10
          maximum: 480
          default: 120
        takes:
          type: integer
          minimum: 1
          maximum: 2
          default: 1
    LyricsSnapshot:
      type: object
      additionalProperties: false
      required: [lyricsId, title, language, text]
      properties:
        lyricsId:
          type: [string, 'null']
          format: uuid
          description: The saved sheet; null for inline text or after the sheet was deleted.
        title:
          type: string
          minLength: 1
          maxLength: 80
        language:
          $ref: '#/components/schemas/LyricsLanguage'
        text:
          type: string
          maxLength: 4096
    SongVoice:
      type: object
      additionalProperties: false
      required: [leadVoice, delivery]
      properties:
        leadVoice:
          $ref: '#/components/schemas/LeadVoice'
        delivery:
          type: [string, 'null']
          maxLength: 40
    SongDetails:
      type: object
      additionalProperties: false
      required: [lyrics, style, freeCaption, voice, instrumental, bpm, keyScale, timeSignature, durationSeconds, caption]
      description: What a song was made from (snapshots) (1.9.0).
      properties:
        lyrics:
          $ref: '#/components/schemas/LyricsSnapshot'
        style:
          oneOf:
            - $ref: '#/components/schemas/StyleSnapshot'
            - type: 'null'
        freeCaption:
          type: [string, 'null']
          maxLength: 300
        voice:
          $ref: '#/components/schemas/SongVoice'
        instrumental:
          type: boolean
        bpm:
          type: [integer, 'null']
          minimum: 40
          maximum: 220
        keyScale:
          type: [string, 'null']
        timeSignature:
          type: [string, 'null']
          enum: ['2', '3', '4', '6', null]
        durationSeconds:
          type: number
          minimum: 10
          maximum: 480
        caption:
          type: string
          minLength: 1
          maxLength: 512
    VoiceConversionRequest:
      type: object
      additionalProperties: false
      required: [profileId]
      properties:
        profileId:
          type: string
          format: uuid
        pitchShift:
          type: integer
          minimum: -12
          maximum: 12
          default: 0
        autoShift:
          type: boolean
          default: true
    VoiceConversionDetails:
      type: object
      additionalProperties: false
      required: [sourceGenerationId, sourceTakeIndex, voiceProfileId, voiceProfileName, importedTrackId, pitchShift, autoShift]
      description: What a voice conversion was made from (1.9.0).
      properties:
        sourceGenerationId:
          type: string
          format: uuid
        sourceTakeIndex:
          type: integer
          minimum: 1
          maximum: 2
        voiceProfileId:
          type: [string, 'null']
          format: uuid
          description: Null after the profile was deleted (the name snapshot ends with "(profile deleted)").
        voiceProfileName:
          type: string
          minLength: 1
          maxLength: 80
        importedTrackId:
          type: [string, 'null']
          format: uuid
          description: The track of the source take whose stems are converted.
        pitchShift:
          type: integer
          minimum: -12
          maximum: 12
        autoShift:
          type: boolean
    VocalLabel:
      type: string
      description: AI voice label (1.9.0). `none` no vocals; `synthetic` an AI voice from the song model; `converted` converted to a voice profile.
      enum: [none, synthetic, converted]
    VoiceSampleSource:
      type: string
      enum: [recorded, uploaded]
    VoiceConsent:
      type: object
      additionalProperties: false
      required: [statementVersion, personName, consentedAt]
      properties:
        statementVersion:
          type: string
          const: consent.v1
        personName:
          type: string
          minLength: 1
          maxLength: 80
        consentedAt:
          type: string
          format: date-time
    VoiceProfile:
      type: object
      additionalProperties: false
      required: [id, displayName, consent, source, durationSeconds, voicedRatio, sampleUrl, createdAt, convertedTakeCount]
      description: An own-voice profile with its consent record (1.9.0). Voice data never leaves this computer.
      properties:
        id:
          type: string
          format: uuid
        displayName:
          type: string
          minLength: 1
          maxLength: 60
        consent:
          $ref: '#/components/schemas/VoiceConsent'
        source:
          $ref: '#/components/schemas/VoiceSampleSource'
        durationSeconds:
          type: number
          minimum: 10
          maximum: 60
        voicedRatio:
          type: number
          minimum: 0.5
          maximum: 1
        sampleUrl:
          type: string
          example: /api/voice-profiles/4b6d8f0a-1c3e-4a5b-9d7f-2e4c6a8b0d1f/sample
        createdAt:
          type: string
          format: date-time
        convertedTakeCount:
          type: integer
          minimum: 0
    CreateVoiceProfileRequest:
      type: object
      required: [sample, displayName, personName, consentConfirmed, consentStatementVersion, source]
      properties:
        sample:
          type: string
          contentMediaType: application/octet-stream
          description: WAV, FLAC, MP3 or WebM/Opus (browser recorder), at most 20 MiB, 10-60 s of own singing.
        displayName:
          type: string
          minLength: 1
          maxLength: 60
        personName:
          type: string
          minLength: 1
          maxLength: 80
        consentConfirmed:
          type: boolean
          description: Must be true.
        consentStatementVersion:
          type: string
          description: Must be the current version (`consent.v1`).
        source:
          $ref: '#/components/schemas/VoiceSampleSource'
    ConsentStatement:
      type: object
      additionalProperties: false
      required: [version, text, textNl]
      properties:
        version:
          type: string
          const: consent.v1
        text:
          type: string
          maxLength: 1000
        textNl:
          type: string
          maxLength: 1000
  responses:
    ValidationProblem:
      description: Invalid input; `errors` names the offending fields with a message the user can act on.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ValidationProblemDetails'
          example:
            type: https://tools.ietf.org/html/rfc9110#section-15.5.1
            title: One or more validation errors occurred.
            status: 400
            errors:
              url:
                - Only YouTube video links and Spotify track links are supported. Playlists and albums are not.
    PayloadTooLarge:
      description: Upload larger than 200 MiB (209,715,200 bytes).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          example:
            title: File too large
            status: 413
            detail: The file is larger than 200 MiB (209,715,200 bytes).
    UnsupportedMediaType:
      description: Upload is not an .mp3, .wav or .flac file.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          example:
            title: Unsupported file type
            status: 415
            detail: Only MP3, WAV and FLAC files are supported.
    NotFound:
      description: Unknown track, stem or mix.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          example:
            title: Not found
            status: 404
            detail: Track 0b7e4c1a-9d2f-4e8b-a1c3-5f6e7d8c9b0a does not exist.
    Conflict:
      description: The operation is not allowed in the current state (e.g. retry of a non-failed track).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          example:
            title: Track is not failed
            status: 409
            detail: Only failed tracks can be retried.
    MixNameTaken:
      description: Another mix of the same track already has this name.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          example:
            title: Mix name taken
            status: 409
            detail: A mix named "Guitar practice" already exists for this track.
    WorkerUnavailable:
      description: The processing service cannot be reached; no track or job was created.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          example:
            title: Processing service unavailable
            status: 503
            detail: The processing service is unavailable. Existing tracks and mixes remain usable.
    StemFile:
      description: Whole stem file.
      headers:
        Accept-Ranges:
          $ref: '#/components/headers/AcceptRanges'
        ETag:
          $ref: '#/components/headers/ETag'
        Last-Modified:
          $ref: '#/components/headers/LastModified'
      content:
        audio/flac:
          schema:
            type: string
            contentMediaType: audio/flac
    StemFilePartial:
      description: Requested byte range of the stem file.
      headers:
        Content-Range:
          schema:
            type: string
          example: bytes 0-1048575/23456789
        Accept-Ranges:
          $ref: '#/components/headers/AcceptRanges'
        ETag:
          $ref: '#/components/headers/ETag'
        Last-Modified:
          $ref: '#/components/headers/LastModified'
      content:
        audio/flac:
          schema:
            type: string
            contentMediaType: audio/flac
    StemNotModified:
      description: Not modified (`If-None-Match` or `If-Modified-Since` matched); no body.
      headers:
        ETag:
          $ref: '#/components/headers/ETag'
        Last-Modified:
          $ref: '#/components/headers/LastModified'
    RangeNotSatisfiable:
      description: Range not satisfiable; no body.
      headers:
        Content-Range:
          description: '`bytes */<file size>` (RFC 9110 section 14.4).'
          schema:
            type: string
          example: bytes */23456789
    UnprocessableRequest:
      description: The request is well-formed but a value is out of its limits; `errors` names the fields.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ValidationProblemDetails'
          example:
            type: https://tools.ietf.org/html/rfc9110#section-15.5.21
            title: One or more validation errors occurred.
            status: 422
            errors:
              title:
                - The title must be 1 to 500 characters long.
    ExportConflict:
      description: |
        `track-not-ready` (the track is not completed), `insufficient-disk-space` (less than
        `StemStudio:MinFreeDiskBytes` free on the data drive) or `source-unavailable` (a stem
        file of the source is missing; the worker rejected the input).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          examples:
            trackNotReady:
              value:
                type: track-not-ready
                title: Track not ready
                status: 409
                detail: The track is still being processed; export it when it is completed.
            insufficientDiskSpace:
              value:
                type: insufficient-disk-space
                title: Not enough disk space
                status: 409
                detail: Less than 1 GiB is free on the data drive; delete items or free space first.
            sourceUnavailable:
              value:
                type: source-unavailable
                title: Source unavailable
                status: 409
                detail: A stem file of this track is missing; separate the track again and retry.
    ExportUnprocessable:
      description: |
        A value is outside its limits (`errors` names the field, e.g. `channels[2]`, `range`,
        `format`), or `nothing-to-export` (no channel would be audible).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          examples:
            validation:
              value:
                type: https://tools.ietf.org/html/rfc9110#section-15.5.21
                title: One or more validation errors occurred.
                status: 422
                errors:
                  channels[2]:
                    - The track has no detail stem drums.kick.
            nothingToExport:
              value:
                type: nothing-to-export
                title: Nothing to export
                status: 422
                detail: 'Nothing to export: no channel is audible'
    LyricsDocument:
      description: The track's lyrics (never cached).
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Lyrics'
          examples:
            found:
              $ref: '#/components/examples/FoundLyrics'
            alignPending:
              $ref: '#/components/examples/AlignPendingLyrics'
            aligning:
              $ref: '#/components/examples/AligningLyrics'
            notFound:
              $ref: '#/components/examples/NotFoundLyrics'
            removed:
              $ref: '#/components/examples/RemovedLyrics'
    LyricsConflict:
      description: |
        The lyrics are in a state that does not allow the operation (a search or an alignment
        is running, there is no text to align, the standard separation is not completed, or there
        are no lyrics to offset).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          examples:
            aligning:
              value:
                type: lyrics-busy
                title: Lyrics are being processed
                status: 409
                detail: The lyrics are being aligned; try again when it has finished.
            noText:
              value:
                type: lyrics-no-text
                title: No lyrics text
                status: 409
                detail: There is no lyrics text to align; enter the lyrics first.
            noLyrics:
              value:
                type: lyrics-none
                title: No lyrics
                status: 409
                detail: This track has no lyrics.
    ScoreConflict:
      description: |
        `track-not-ready` (the track is not completed), `drums-not-split` (the `drums` profile
        needs the drum detail stems; split the drums first) or `insufficient-disk-space`.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          examples:
            trackNotReady:
              value:
                type: track-not-ready
                title: Track not ready
                status: 409
                detail: The track is still being processed; create sheet music when it is completed.
            drumsNotSplit:
              value:
                type: drums-not-split
                title: Drums not split
                status: 409
                detail: Drum notation needs the drum detail stems; split the drums first.
            insufficientDiskSpace:
              value:
                type: insufficient-disk-space
                title: Not enough disk space
                status: 409
                detail: Less than 1 GiB is free on the data drive; delete items or free space first.
    ScoreUnprocessable:
      description: |
        A value is outside its limits (`errors` names the field, e.g. `profile`, `range`,
        `keyOverride`), or `tempo-required` (the track has no reliable beat grid and no `tempo`
        was given).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          examples:
            validation:
              value:
                type: https://tools.ietf.org/html/rfc9110#section-15.5.21
                title: One or more validation errors occurred.
                status: 422
                errors:
                  profile:
                    - The profile drums needs the drums channel.
            tempoRequired:
              value:
                type: tempo-required
                title: Tempo required
                status: 422
                detail: The beat grid of this track is not reliable; enter the tempo, the beats per bar and the first downbeat.
    StyleValidationProblem:
      description: Invalid style (field limits) or an artist-imitation hit (problem type `imitation`).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ValidationProblemDetails'
          examples:
            imitation:
              value:
                type: imitation
                title: Styles cannot imitate an artist.
                status: 400
                errors:
                  description:
                    - Describe the music (genre, instruments, mood) instead of naming an artist or saying "sounds like".
            limits:
              value:
                type: https://tools.ietf.org/html/rfc9110#section-15.5.1
                title: One or more validation errors occurred.
                status: 400
                errors:
                  name:
                    - The name must be 1 to 60 characters.
    StyleNameTaken:
      description: Another style already has this name (case-insensitive).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          example:
            type: style-name-taken
            title: Style name taken
            status: 409
            detail: A style named "Jazz trio" already exists.
    PresetReadOnly:
      description: Presets cannot be changed or deleted (duplicate them instead).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          example:
            type: preset-read-only
            title: Preset is read-only
            status: 403
            detail: Presets cannot be changed. Duplicate the preset to make your own version.
    GenerationConflict:
      description: |
        `track-not-ready` (the track is not completed), `not-installed` (no generator),
        `gpu-required` (the generator has no usable GPU; `detail` is the reason),
        `generation-not-completed` (import of a take before completion) or
        `generation-not-retryable` (retry of a generation that is not failed or cancelled).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          examples:
            trackNotReady:
              value:
                type: track-not-ready
                title: Track not ready
                status: 409
                detail: The track is still being processed; restyle it when it is completed.
            notInstalled:
              value:
                type: not-installed
                title: Generation not installed
                status: 409
                detail: The generator service is not installed. See the help page "Generation needs a GPU".
            gpuRequired:
              value:
                type: gpu-required
                title: GPU required
                status: 409
                detail: No NVIDIA GPU is available to the generator (CUDA is not available).
            notCompleted:
              value:
                type: generation-not-completed
                title: Generation not completed
                status: 409
                detail: Only takes of a completed generation can be imported.
            notRetryable:
              value:
                type: generation-not-retryable
                title: Generation cannot be retried
                status: 409
                detail: Only failed or cancelled generations can be retried.
    GeneratorUnavailable:
      description: The generator was reachable for the status check but refused or dropped the upload; no generation was created.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          example:
            type: generator-unavailable
            title: Generator unavailable
            status: 503
            detail: The generator service could not be reached. Try again in a moment.
    AudioFile:
      description: The whole audio file.
      headers:
        Accept-Ranges:
          $ref: '#/components/headers/AcceptRanges'
        ETag:
          $ref: '#/components/headers/ETag'
        Last-Modified:
          $ref: '#/components/headers/LastModified'
      content:
        audio/flac:
          schema:
            type: string
            contentMediaType: audio/flac
    AudioFilePart:
      description: The requested byte range of the audio file.
      headers:
        Content-Range:
          schema:
            type: string
          example: bytes 0-1048575/9012345
        Accept-Ranges:
          $ref: '#/components/headers/AcceptRanges'
        ETag:
          $ref: '#/components/headers/ETag'
        Last-Modified:
          $ref: '#/components/headers/LastModified'
      content:
        audio/flac:
          schema:
            type: string
            contentMediaType: audio/flac
    AudioNotModified:
      description: Not modified; no body.
      headers:
        ETag:
          $ref: '#/components/headers/ETag'
        Last-Modified:
          $ref: '#/components/headers/LastModified'
    LyricsTooLarge:
      description: The lyrics file is larger than 64 KiB (65,536 bytes).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          example:
            title: File too large
            status: 413
            detail: Lyrics files can be at most 64 KiB (65,536 bytes).
    LyricsUnsupportedMediaType:
      description: The file is not .txt, .lrc or .md.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          example:
            title: Unsupported file type
            status: 415
            detail: Only .txt, .lrc and .md lyrics files are supported.
    ConsentProblem:
      description: Consent missing (`consent-required`), an outdated statement (`consent-outdated`) or other invalid fields (`errors`). Nothing was stored.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ValidationProblemDetails'
          examples:
            consentRequired:
              value:
                type: consent-required
                title: Consent required
                status: 400
                errors:
                  consentConfirmed:
                    - Confirm that this is your own voice and that you agree to the statement.
            consentOutdated:
              value:
                type: consent-outdated
                title: Consent statement changed
                status: 400
                errors:
                  consentStatementVersion:
                    - The consent statement was updated; read and confirm the current version.
    VoiceConflict:
      description: |
        `voice-name-taken`, `voice-not-installed` (no singer service), `voice-unavailable`
        (the singer has no usable GPU; `detail` is the reason; sample checks still work),
        `no-vocals` (the take is not a completed song take with an AI voice).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          examples:
            nameTaken:
              value:
                type: voice-name-taken
                title: Voice name taken
                status: 409
                detail: A voice profile named "My voice" already exists.
            notInstalled:
              value:
                type: voice-not-installed
                title: Voice features not installed
                status: 409
                detail: The singer service is not installed.
            noVocals:
              value:
                type: no-vocals
                title: No AI vocal to convert
                status: 409
                detail: Only completed song takes with an AI voice can be converted.
    SampleTooLarge:
      description: The sample is larger than 20 MiB (20,971,520 bytes).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          example:
            title: File too large
            status: 413
            detail: The recording can be at most 20 MiB (20,971,520 bytes).
    SampleRejected:
      description: The sample cannot be used (`too-short`, `too-long`, `unvoiced` from the singer's check; `library-audio` byte-identical to audio stored by StemStudio). Nothing was stored.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          examples:
            tooShort:
              value:
                type: too-short
                title: Recording too short
                status: 422
                detail: The recording is 6.2 s long; record 10 to 60 seconds of your own singing.
            unvoiced:
              value:
                type: unvoiced
                title: Not enough singing
                status: 422
                detail: The recording contains too little singing (12 % voiced, at least 50 % is needed).
            libraryAudio:
              value:
                type: library-audio
                title: Not an own recording
                status: 422
                detail: This file is audio from your StemStudio library. Record or upload your own voice instead.
