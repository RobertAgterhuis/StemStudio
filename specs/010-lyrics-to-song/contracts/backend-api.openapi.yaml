    get:
      tags: [voices]
      operationId: getVoiceConsentStatement
      summary: The current consent statement for voice profiles (English and Dutch) (1.9.0).
      responses:
        '200':
          description: The statement shown next to the consent checkbox.
          content:
            application/json:
