                  $ref: '#/components/examples/ConsentStatementV1'
  /api/generations/{generationId}/takes/{index}/voice-conversions:
    parameters:
      - $ref: '#/components/parameters/GenerationId'
      - $ref: '#/components/parameters/TakeIndex'
    post:
      tags: [voices]
      operationId: createVoiceConversion
      summary: '"Use my voice": convert the vocal of a song take to a voice profile (1.9.0).'
      description: |
        Only for a completed `song` take with `vocal: synthetic` (`409 no-vocals` otherwise).
        When the take is not imported yet it is imported first (as `importTake`) and the
        generation waits in `waitingForStems` until the track's separation is completed; then the
        `vocals` stem (target), the other five stems (accompaniment) and the profile sample
        (prompt) are sent to the singer service. `409` (`voice-not-installed`,
        `voice-unavailable`) when the singer cannot run.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VoiceConversionRequest'
            example:
              profileId: 4b6d8f0a-1c3e-4a5b-9d7f-2e4c6a8b0d1f
              pitchShift: 0
              autoShift: true
      responses:
        '202':
          description: Conversion created (`queued` or `waitingForStems`).
          headers:
            Location:
              $ref: '#/components/headers/GenerationLocation'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Generation'
              examples:
                waitingForStems:
                  $ref: '#/components/examples/WaitingForStemsConversion'
        '400':
          $ref: '#/components/responses/ValidationProblem'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/VoiceConflict'
        '503':
          $ref: '#/components/responses/GeneratorUnavailable'
