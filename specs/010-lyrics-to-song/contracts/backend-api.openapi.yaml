openapi: 3.1.0
info:
  title: StemStudio Backend API
  version: 1.9.0
  summary: HTTP API used by the StemStudio Blazor app and by the browser audio engine.
  description: |
    * JSON uses camelCase; enums are lower-case strings. C# DTOs: `src/StemStudio.Contracts`.
    * Errors are RFC 9457 problem details (`application/problem+json`); validation errors use
      `HttpValidationProblemDetails` with an `errors` map (field -> messages).
    * No authentication: single local user (spec Assumptions).
    * CORS: the configured web origin (`StemStudio:WebOrigin`) may `GET` stems and tracks, so the
      browser audio engine can fetch FLAC files directly.
    * Times are UTC ISO 8601. Durations and positions are seconds (number).
    * Collections (`GET /api/tracks`, `GET /api/mixes`) are ordered by `updatedAt` descending;
      `GET /api/assets` by `createdAt` descending.
    * Changelog: 1.0.1 (non-breaking) - stem caching/range headers (304, Last-Modified, 416
      Content-Range), explicit field limits, canonical URL forwarding, 200 MiB in bytes.
      1.1.0 (additive) - `DELETE /api/tracks/{trackId}` removes a failed or completed track with
      its stem files and mixes; 409 while the track is queued or processing.
      1.2.0 (additive, feature 002) - detail separation: `Track.detail` (phase status, progress,
      per-parent outcomes, detail stems), `POST /api/tracks/{trackId}/detail` (start, "Split
      further", retry), `POST /api/tracks/{trackId}/detail/cancel`,
      `GET /api/tracks/{trackId}/detail-stems/{parent}/{name}` (same Range/ETag semantics as
      stems); `MixSettings.expanded` and `MixSettings.detailChannels` (optional, default empty,
      so mixes saved with 1.1.0 load unchanged); delete returns 409 while a detail phase is
      queued or running.
      1.3.0 (additive, feature 003) - GPU acceleration: `Track.device` (where the standard
      separation ran) and `DetailPhase.device` (where the detail steps ran), both with the CPU
      fallback flag and reason; `GET /api/device` reports the worker's active processing device
      (GPU name or CPU, with the reason when the GPU is not used). See ADR-012.
      1.4.0 (additive, feature 005) - song artwork and band info: `Track.artwork` (the picture
      shown, with versioned cover/thumbnail URLs) and `Track.metadata` (lookup state, always
      present; `none` for older tracks); `GET /api/tracks/{trackId}/artwork/{variant}`,
      `PUT`/`DELETE /api/tracks/{trackId}/artwork` (own picture, reset to automatic),
      `GET /api/tracks/{trackId}/band-info` (facts with sources and Wikipedia attribution),
      `POST /api/tracks/{trackId}/metadata/lookup` (retry or correct the names). See ADR-014.
      1.5.0 (additive, feature 007) - asset library: `/api/assets` (list with filters, total
      size), `POST /api/assets/audio-exports` (a stem, a detail stem, what I hear or selected
      channels, optional range, FLAC/WAV/MP3), `POST /api/assets/stem-packs`, get, rename,
      delete, retry, and `GET /api/assets/{assetId}/files/{role}` (Range, ETag,
      Content-Disposition). Items are rendered by the worker from a server-side plan (gate rule
      v2, `render-vectors.json`) and survive deletion of their track. The shared `AudioSource`
      schema is defined for later features. See ADR-016.
      1.6.0 (additive, feature 006) - synced lyrics: `Track.lyricsStatus` (always present; `none`
      for older tracks) and `/api/tracks/{trackId}/lyrics` (get, enter text, remove), `/search`,
      `/align`, `/align/cancel` and `/offset`. Lyrics are served only there, with
      `Cache-Control: no-store`; they are never part of the track list or track resources, never
      logged and never exported. See ADR-015.
      1.7.0 (additive, feature 008) - sheet music: `GET /api/scores/options` and
      `POST /api/assets/scores` create library items of kind `score` with the files `pdf`,
      `musicxml` and `midi` (served by `getAssetFile`; the preview uses `inline=true`),
      `Asset.score` (key, tempo, bars, warnings, attribution, device), `Provenance.scoreRecipe`
      (and `Provenance.recipe` null for score items) and origin `transcription`. See ADR-017.
      1.8.0 (additive, feature 009) - style transfer with a style library:
      `GET /api/generation/status` (`notInstalled` | `unavailable` + reason | `ready`, models
      and download size); `/api/styles` (24+ read-only presets and user styles: list with
      filters, get, create, update, delete, duplicate; artist-imitation guard `type: imitation`);
      `POST /api/tracks/{trackId}/restyles` (range or in-place, 1-2 takes) and
      `/api/generations` (list, get, cancel, retry, delete, take audio with Range, import a take
      as a track); `Track.origin` (absent on imported tracks); library items of generated takes
      (origin `generation`, `Provenance.generation`, 48 kHz audio facts). Generation is
      GPU-only and optional (constitution 1.3.0). See ADR-018.
      1.9.0 (additive, feature 010) - own lyrics to song: `/api/lyrics` (saved lyrics sheets:
      list, get, create, upload .txt/.lrc/.md, update, delete; `POST /api/lyrics/sections`
      proposes section markers); `POST /api/songs` (song generation with an AI voice or
      instrumental); voice profiles with a stored, versioned consent record
      (`/api/voice-profiles`, sample, `GET /api/consent/voice`); "Use my voice"
      (`POST .../takes/{index}/voice-conversions`, status `waitingForStems`) and the converted
      vocal (`GET .../takes/{index}/vocal`); `Generation.song` / `voiceConversion`,
      `GenerationTake.vocal`, `Track.origin.vocal` / `voiceProfileName` / `lyricsSheetId`;
      `GenerationStatus.voice` (the singer service). See ADR-019.
  license:
    name: MIT
    identifier: MIT
servers:
  - url: http://localhost:8081
    description: local development and docker compose (published port)
security: []  # single local user; no authentication (spec Assumptions)
tags:
  - name: imports
    description: Start processing a YouTube/Spotify URL or an uploaded file.
  - name: tracks
    description: Imported tracks, their processing status, stems and beat grid.
  - name: mixes
    description: Saved mixer configurations.
  - name: artwork
    description: Song pictures (cover and thumbnail) of tracks (1.4.0).
  - name: band-info
    description: Recording, album and artist facts from open data services (1.4.0).
  - name: assets
    description: The personal library of saved audio (and later scores and generated songs) (1.5.0).
  - name: lyrics
    description: Time-synced lyrics of a track for the karaoke banner (1.6.0).
  - name: scores
    description: Sheet music of a channel or a library audio item (1.7.0).
  - name: styles
    description: The style library of presets and user styles (1.8.0).
  - name: generation
    description: Generative features - restyles, their takes and the availability of the generator (1.8.0).
  - name: songs
    description: Own lyrics sheets and songs generated from them (1.9.0).
  - name: voices
    description: Own-voice profiles with consent and voice conversion of song takes (1.9.0).
  - name: health
    description: Liveness and the processing device.
paths:
  /health:
    get:
      tags: [health]
      operationId: getHealth
      summary: Liveness probe.
      responses:
        '200':
          description: API is up.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
              example:
                status: ok
  /api/device:
    get:
      tags: [health]
      operationId: getProcessingDevice
      summary: The worker's active processing device (GPU or CPU).
      description: |
        The API reads the worker's `GET /health` (`deviceInfo`, worker contract 1.2.0) with a
        short timeout and may cache the answer for up to 10 seconds. The device is probed once at
        worker start-up, so it changes only when the worker restarts. When the worker cannot be
        reached the answer is still `200` with `reachable: false` and the device fields null, so
        the UI can show "unknown" without an error. `/health` stays a pure liveness probe.
      responses:
        '200':
          description: The processing device, or `reachable` false.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProcessingDevice'
              examples:
                gpu:
                  summary: GPU worker
                  value:
                    reachable: true
                    kind: gpu
                    name: NVIDIA GeForce RTX 5070 Ti
                    totalMemoryMiB: 16303
                    reason: null
                cpuWithReason:
                  summary: GPU requested but not usable
                  value:
                    reachable: true
                    kind: cpu
                    name: null
                    totalMemoryMiB: null
                    reason: 'No usable NVIDIA GPU: CUDA is not available in this container (is the GPU option enabled and the driver current?).'
                unreachable:
                  summary: Worker not reachable
                  value:
                    reachable: false
                    kind: null
                    name: null
                    totalMemoryMiB: null
                    reason: null
  /api/imports:
    post:
      tags: [imports]
      operationId: importFromUrl
      summary: Import a YouTube video URL or a Spotify track URL.
      description: |
        The API validates the URL (allow-listed hosts, single video/track only) and derives the
        source key (`youtube:<videoId>` or `spotify:<trackId>`). Accepted and rejected forms and
        their keys are listed in `source-url-vectors.json` (binding test vectors for the API and
        the worker). The API forwards the **canonical** URL to the worker
        (`https://www.youtube.com/watch?v=<id>` or `https://open.spotify.com/track/<id>`); a worker
        `400` is returned as a `400` validation problem on field `url`, and nothing is persisted.

        * A track with that key exists: it is returned with `200` (cached; no new job). A failed
          track is returned as-is; the client may call `POST /api/tracks/{id}/retry`.
        * Otherwise a track is created with status `queued`, a worker job is started and the
          track is returned with `202`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ImportUrlRequest'
            example:
              url: https://youtu.be/dQw4w9WgXcQ
      responses:
        '200':
          description: The source was imported before; the existing track is returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Track'
              examples:
                completed:
                  $ref: '#/components/examples/CompletedTrack'
        '202':
          description: Track created and processing job started.
          headers:
            Location:
              $ref: '#/components/headers/TrackLocation'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Track'
              examples:
                queued:
                  $ref: '#/components/examples/QueuedTrack'
        '400':
          $ref: '#/components/responses/ValidationProblem'
        '503':
          $ref: '#/components/responses/WorkerUnavailable'
  /api/imports/upload:
    post:
      tags: [imports]
      operationId: importFromUpload
      summary: Import an uploaded MP3, WAV or FLAC file (max 200 MiB = 209,715,200 bytes).
      description: |
        The source key is `upload:<sha256 of the file bytes>`. Caching and responses behave as
        for `POST /api/imports`. The title is the file name without extension.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/UploadRequest'
            encoding:
              file:
                contentType: audio/mpeg, audio/wav, audio/x-wav, audio/flac, application/octet-stream
      responses:
        '200':
          description: The same file was imported before; the existing track is returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Track'
        '202':
          description: Track created and processing job started.
          headers:
            Location:
              $ref: '#/components/headers/TrackLocation'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Track'
        '400':
          $ref: '#/components/responses/ValidationProblem'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '503':
          $ref: '#/components/responses/WorkerUnavailable'
  /api/tracks:
    get:
      tags: [tracks]
      operationId: listTracks
      summary: List all imported tracks, ordered by updatedAt descending.
      responses:
        '200':
          description: All tracks.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Track'
  /api/tracks/{trackId}:
    parameters:
      - $ref: '#/components/parameters/TrackId'
    get:
      tags: [tracks]
      operationId: getTrack
      summary: Get a track with status, progress, stems and beat grid (polled about once per second).
      responses:
        '200':
          description: The track.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Track'
              examples:
                separating:
                  $ref: '#/components/examples/SeparatingTrack'
                completed:
                  $ref: '#/components/examples/CompletedTrack'
                failed:
                  $ref: '#/components/examples/FailedTrack'
                detailCompleted:
                  $ref: '#/components/examples/DetailCompletedTrack'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [tracks]
      operationId: deleteTrack
      summary: Delete a failed or completed track together with its stem files, detail stems and mixes.
      description: |
        Allowed only in a terminal status (`failed`, `completed`) and while no detail phase is
        `queued` or `running` (cancel it first); otherwise 409. The stored upload (if any), the track's stem files and all of its mixes are
        removed. The worker's per-source cache is not touched, so importing the same source again
        may complete instantly.
      responses:
        '204':
          description: Deleted.
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/tracks/{trackId}/retry:
    parameters:
      - $ref: '#/components/parameters/TrackId'
    post:
      tags: [tracks]
      operationId: retryTrack
      summary: Retry a failed track (new worker job, status back to queued).
      description: Upload sources can be retried only while the API still holds the uploaded file; otherwise 409.
      responses:
        '202':
          description: A new job was started.
          headers:
            Location:
              $ref: '#/components/headers/TrackLocation'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Track'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          $ref: '#/components/responses/WorkerUnavailable'
  /api/tracks/{trackId}/stems/{stemName}:
    parameters:
      - $ref: '#/components/parameters/TrackId'
      - name: stemName
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/StemName'
    get:
      tags: [tracks]
      operationId: getStem
      summary: Download one stem as FLAC; supports HTTP Range requests and conditional GET.
      description: |
        Static-file semantics (ASP.NET Core `Results.File` with range processing): `ETag` and
        `Last-Modified` on every 200/206/304; `If-None-Match` / `If-Modified-Since` -> 304;
        `If-Range` honoured; an unsatisfiable range -> 416 with `Content-Range: bytes */<size>`.
        CORS allows the configured web origin and exposes `Content-Range`, `Accept-Ranges`, `ETag`.
      parameters:
        - name: Range
          in: header
          required: false
          schema:
            type: string
          example: bytes=0-1048575
        - name: If-None-Match
          in: header
          required: false
          schema:
            type: string
        - name: If-Modified-Since
          in: header
          required: false
          schema:
            type: string
        - name: If-Range
          in: header
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Whole stem file.
          headers:
            Accept-Ranges:
              $ref: '#/components/headers/AcceptRanges'
            ETag:
              $ref: '#/components/headers/ETag'
            Last-Modified:
              $ref: '#/components/headers/LastModified'
          content:
            audio/flac:
              schema:
                type: string
                contentMediaType: audio/flac
        '206':
          description: Requested byte range of the stem file.
          headers:
            Content-Range:
              schema:
                type: string
              example: bytes 0-1048575/23456789
            Accept-Ranges:
              $ref: '#/components/headers/AcceptRanges'
            ETag:
              $ref: '#/components/headers/ETag'
            Last-Modified:
              $ref: '#/components/headers/LastModified'
          content:
            audio/flac:
              schema:
                type: string
                contentMediaType: audio/flac
        '304':
          description: Not modified (`If-None-Match` or `If-Modified-Since` matched); no body.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
            Last-Modified:
              $ref: '#/components/headers/LastModified'
        '404':
          $ref: '#/components/responses/NotFound'
        '416':
          description: Range not satisfiable; no body.
          headers:
            Content-Range:
              description: '`bytes */<file size>` (RFC 9110 section 14.4).'
              schema:
                type: string
              example: bytes */23456789
  /api/tracks/{trackId}/detail:
    parameters:
      - $ref: '#/components/parameters/TrackId'
    post:
      tags: [tracks]
      operationId: startDetail
      summary: Queue the detail phase of a completed track ("Split further", or retry after failed/cancelled).
      description: |
        Allowed when the track is `completed` and `detail.status` is `none`, `failed` or
        `cancelled`; the phase restarts at `queued` with progress 0 (worker checkpoints of
        finished parent steps are reused). Otherwise 409. New imports get their detail phase
        queued automatically when the standard separation completes. If the worker is
        unreachable the phase stays `queued` and the background sync submits it later (no 503).
      responses:
        '202':
          description: The detail phase was queued.
          headers:
            Location:
              $ref: '#/components/headers/TrackLocation'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Track'
              examples:
                queued:
                  $ref: '#/components/examples/DetailQueuedTrack'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/tracks/{trackId}/detail/cancel:
    parameters:
      - $ref: '#/components/parameters/TrackId'
    post:
      tags: [tracks]
      operationId: cancelDetail
      summary: Cancel a queued or running detail phase.
      description: |
        The phase becomes `cancelled` at once; detail stems are never partially offered. 409 when
        the phase is not `queued` or `running`; 503 when a worker job exists and the worker
        cannot be reached (nothing changes).
      responses:
        '200':
          description: The track with the cancelled detail phase.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Track'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          $ref: '#/components/responses/WorkerUnavailable'
  /api/tracks/{trackId}/detail-stems/{parent}/{name}:
    parameters:
      - $ref: '#/components/parameters/TrackId'
      - name: parent
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/ParentStemName'
      - name: name
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/DetailStemName'
    get:
      tags: [tracks]
      operationId: getDetailStem
      summary: Download one detail stem as FLAC; same Range, conditional-GET and CORS semantics as getStem.
      parameters:
        - name: Range
          in: header
          required: false
          schema:
            type: string
          example: bytes=0-1048575
        - name: If-None-Match
          in: header
          required: false
          schema:
            type: string
        - name: If-Modified-Since
          in: header
          required: false
          schema:
            type: string
        - name: If-Range
          in: header
          required: false
          schema:
            type: string
      responses:
        '200':
          $ref: '#/components/responses/StemFile'
        '206':
          $ref: '#/components/responses/StemFilePartial'
        '304':
          $ref: '#/components/responses/StemNotModified'
        '404':
          $ref: '#/components/responses/NotFound'
        '416':
          $ref: '#/components/responses/RangeNotSatisfiable'
  /api/mixes:
    get:
      tags: [mixes]
      operationId: listMixes
      summary: List saved mixes, ordered by updatedAt descending.
      parameters:
        - name: trackId
          in: query
          required: false
          description: Only mixes of this track.
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Mix library entries.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MixSummary'
              example:
                - id: 6a1f0c9e-2b3d-4e5f-8a9b-0c1d2e3f4a5b
                  trackId: 0b7e4c1a-9d2f-4e8b-a1c3-5f6e7d8c9b0a
                  trackTitle: Never Gonna Give You Up
                  name: Guitar practice
                  updatedAt: '2026-11-14T13:00:00Z'
        '400':
          $ref: '#/components/responses/ValidationProblem'
    post:
      tags: [mixes]
      operationId: createMix
      summary: Save a new mix (also "save as").
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateMixRequest'
            example:
              trackId: 0b7e4c1a-9d2f-4e8b-a1c3-5f6e7d8c9b0a
              settings:
                name: Guitar practice
                masterVolume: 1
                channels:
                  - stem: guitar
                    volume: 0
                    pan: 0
                    mute: true
                    solo: false
                metronome:
                  enabled: true
                  volume: 0.7
                  bpmOverride: null
                  offsetMs: 0
                  beatsPerBar: 4
                loop: null
      responses:
        '201':
          description: Mix created.
          headers:
            Location:
              description: URL of the new mix.
              schema:
                type: string
              example: /api/mixes/6a1f0c9e-2b3d-4e5f-8a9b-0c1d2e3f4a5b
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Mix'
        '400':
          $ref: '#/components/responses/ValidationProblem'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/MixNameTaken'
  /api/mixes/{mixId}:
    parameters:
      - $ref: '#/components/parameters/MixId'
    get:
      tags: [mixes]
      operationId: getMix
      summary: Get a mix.
      responses:
        '200':
          description: The mix.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Mix'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [mixes]
      operationId: updateMix
      summary: Replace name and settings of a mix (save / edit).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MixSettings'
            examples:
              guitarPractice:
                $ref: '#/components/examples/MixSettings'
              noSnare:
                $ref: '#/components/examples/MixSettingsWithDetail'
      responses:
        '200':
          description: Updated mix.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Mix'
        '400':
          $ref: '#/components/responses/ValidationProblem'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/MixNameTaken'
    delete:
      tags: [mixes]
      operationId: deleteMix
      summary: Delete a mix (the track and its stems remain).
      responses:
        '204':
          description: Deleted.
        '404':
          $ref: '#/components/responses/NotFound'
  /api/mixes/{mixId}/duplicate:
    parameters:
      - $ref: '#/components/parameters/MixId'
    post:
      tags: [mixes]
      operationId: duplicateMix
      summary: Copy a mix as "<name> (copy)".
      description: |
        If "<name> (copy)" is taken for the track, "<name> (copy 2)", "<name> (copy 3)", ... is
        used. The base name is shortened so that the result is at most 100 characters.
      responses:
        '201':
          description: Copy created.
          headers:
            Location:
              description: URL of the new mix.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Mix'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/tracks/{trackId}/artwork/{variant}:
    parameters:
      - $ref: '#/components/parameters/TrackId'
      - name: variant
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/ArtworkVariant'
      - name: v
        in: query
        required: false
        description: |
          Artwork version (`Track.artwork.version`). When it matches the current picture the
          response is cacheable for a year (`immutable`); otherwise (missing or stale) it is
          served with `no-cache`.
        schema:
          type: string
          pattern: '^[0-9a-f]{12}$'
    get:
      tags: [artwork]
      operationId: getTrackArtwork
      summary: The picture shown for a track as JPEG (1.4.0).
      parameters:
        - name: If-None-Match
          in: header
          required: false
          schema:
            type: string
      responses:
        '200':
          description: |
            The JPEG (`cover` 600 x 600, `thumb` 160 x 160). `Cache-Control` is
            `private, max-age=31536000, immutable` when `v` matches, else `no-cache`.
          headers:
            ETag:
              $ref: '#/components/headers/ArtworkETag'
            Cache-Control:
              schema:
                type: string
              example: private, max-age=31536000, immutable
          content:
            image/jpeg:
              schema:
                type: string
                contentMediaType: image/jpeg
        '304':
          description: Not modified (`If-None-Match` matched); no body.
          headers:
            ETag:
              $ref: '#/components/headers/ArtworkETag'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/tracks/{trackId}/artwork:
    parameters:
      - $ref: '#/components/parameters/TrackId'
    put:
      tags: [artwork]
      operationId: setTrackArtwork
      summary: Use an own picture for a track (1.4.0).
      description: |
        One multipart part `file` (JPEG, PNG or WebP, at most 10 MiB = 10,485,760 bytes; the
        limit is enforced while streaming). The API forwards the bytes to the worker, which
        re-encodes them (EXIF/GPS and every other metadata block removed); the result becomes
        `Track.artwork` with `source` `user`. The automatic picture is kept for
        `DELETE /api/tracks/{trackId}/artwork`.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ArtworkUploadRequest'
            encoding:
              file:
                contentType: image/jpeg, image/png, image/webp, application/octet-stream
      responses:
        '200':
          description: The track with its new picture.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Track'
        '400':
          description: The file is not a decodable picture.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                title: Not an image
                status: 400
                detail: The file could not be read as a picture.
        '404':
          $ref: '#/components/responses/NotFound'
        '413':
          description: Larger than 10 MiB (10,485,760 bytes).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                title: Picture too large
                status: 413
                detail: The picture is larger than 10 MiB.
        '415':
          description: Not a JPEG, PNG or WebP file.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                title: Unsupported picture type
                status: 415
                detail: Only JPEG, PNG and WebP pictures are supported.
        '422':
          description: More than 40 megapixels.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                title: Picture too large
                status: 422
                detail: The picture has more than 40 megapixels.
        '503':
          $ref: '#/components/responses/WorkerUnavailable'
    delete:
      tags: [artwork]
      operationId: resetTrackArtwork
      summary: Remove the own picture and go back to the automatic one (1.4.0).
      description: Idempotent; without an own picture the track is returned unchanged.
      responses:
        '200':
          description: The track with the automatic picture (or none).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Track'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/tracks/{trackId}/band-info:
    parameters:
      - $ref: '#/components/parameters/TrackId'
    get:
      tags: [band-info]
      operationId: getBandInfo
      summary: Recording, album and artist facts of a track with their sources (1.4.0).
      description: |
        `status` is `Track.metadata.status`. Facts are present only when `found`. Every fact
        lists its source in `sources`; the Wikipedia excerpt carries its CC BY-SA 4.0
        attribution data and must be shown with it, unmodified.
      responses:
        '200':
          description: Band information (possibly empty while searching or not found).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BandInfo'
              examples:
                found:
                  $ref: '#/components/examples/FoundBandInfo'
                searching:
                  $ref: '#/components/examples/SearchingBandInfo'
                failed:
                  $ref: '#/components/examples/FailedBandInfo'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/tracks/{trackId}/metadata/lookup:
    parameters:
      - $ref: '#/components/parameters/TrackId'
    post:
      tags: [band-info]
      operationId: lookupTrackMetadata
      summary: Retry the lookup, optionally with corrected title and artist (1.4.0).
      description: |
        With a body, the given names are stored (`metadata.correctedByUser` true) and used for
        the lookup; an empty body (or no body) retries with the current names. The metadata
        status becomes `pending` and the lookup runs in the background (poll the track).
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MetadataLookupRequest'
            examples:
              corrected:
                value:
                  title: Hero of the Day
                  artist: Metallica
              retry:
                value: {}
      responses:
        '202':
          description: Lookup scheduled; the track with metadata status `pending`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Track'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: A lookup is already running for this track (status `searching`).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                title: Lookup in progress
                status: 409
                detail: Band information is being looked up; try again when it has finished.
        '422':
          $ref: '#/components/responses/UnprocessableRequest'
  /api/assets:
    get:
      tags: [assets]
      operationId: listAssets
      summary: List library items, newest first (1.5.0).
      parameters:
        - name: kind
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/AssetKind'
        - name: trackId
          in: query
          required: false
          description: Only items made from this track (also after the track was deleted).
          schema:
            type: string
            format: uuid
        - name: status
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/AssetStatus'
        - name: q
          in: query
          required: false
          description: Case-insensitive "name contains".
          schema:
            type: string
            minLength: 1
            maxLength: 100
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 100
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        '200':
          description: One page of items; `total` and `totalSizeBytes` count every item matching the filters.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssetList'
              example:
                items: []
                total: 0
                totalSizeBytes: 0
        '422':
          $ref: '#/components/responses/UnprocessableRequest'
  /api/assets/audio-exports:
    post:
      tags: [assets]
      operationId: createAudioExport
      summary: Save a stem, a detail stem or a selection of channels as an audio file (1.5.0).
      description: |
        `mode` `raw`: every listed channel at gain 1, pan 0, master 1 (mute/solo ignored); a single
        raw channel to 16-bit FLAC is bit-identical to the stem. `mode` `mix`: the current mixer
        state (`mix`, possibly unsaved) or a saved mix (`mixId`), exactly one of the two;
        `channels` null = every audible channel by the engine's gate rule v2 (what I hear), a list
        = exactly those channels with their fader and pan (selected channels). The item is
        created `queued` and rendered in the background (poll `GET /api/assets/{assetId}`).
        Refused with `409 insufficient-disk-space` when the data drive has less than
        `StemStudio:MinFreeDiskBytes` (1 GiB) free.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAudioExportRequest'
            examples:
              rawStem:
                $ref: '#/components/examples/RawStemExportRequest'
              whatIHear:
                $ref: '#/components/examples/AudibleMixExportRequest'
              selectedChannels:
                $ref: '#/components/examples/SelectedChannelsExportRequest'
      responses:
        '202':
          description: Item created and render started.
          headers:
            Location:
              $ref: '#/components/headers/AssetLocation'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Asset'
              examples:
                queued:
                  $ref: '#/components/examples/QueuedAsset'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/ExportConflict'
        '422':
          $ref: '#/components/responses/ExportUnprocessable'
        '503':
          $ref: '#/components/responses/WorkerUnavailable'
  /api/assets/stem-packs:
    post:
      tags: [assets]
      operationId: createStemPack
      summary: Save every stem of a track (optionally every kept detail stem) as raw items (1.5.0).
      description: One raw item per standard stem and, with `includeDetail`, per kept detail stem of every split parent, in catalogue order; each is rendered as its own job.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateStemPackRequest'
            example:
              trackId: 0b7e4c1a-9d2f-4e8b-a1c3-5f6e7d8c9b0a
              includeDetail: true
              format:
                format: flac
                bitDepth: 16
                mp3BitrateKbps: null
      responses:
        '202':
          description: Items created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StemPack'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/ExportConflict'
        '422':
          $ref: '#/components/responses/ExportUnprocessable'
        '503':
          $ref: '#/components/responses/WorkerUnavailable'
  /api/assets/{assetId}:
    parameters:
      - $ref: '#/components/parameters/AssetId'
    get:
      tags: [assets]
      operationId: getAsset
      summary: Get a library item with status, progress, files and provenance (polled while rendering).
      responses:
        '200':
          description: The item.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Asset'
              examples:
                rendering:
                  $ref: '#/components/examples/RenderingAsset'
                ready:
                  $ref: '#/components/examples/ReadyAsset'
                failed:
                  $ref: '#/components/examples/FailedAsset'
                readyScore:
                  $ref: '#/components/examples/ReadyScoreAsset'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [assets]
      operationId: renameAsset
      summary: Rename a library item (names need not be unique).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RenameAssetRequest'
            example:
              name: Drums for practice
      responses:
        '200':
          description: The renamed item.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Asset'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableRequest'
    delete:
      tags: [assets]
      operationId: deleteAsset
      summary: Delete a library item and its files (an active render is cancelled).
      responses:
        '204':
          description: Deleted.
        '404':
          $ref: '#/components/responses/NotFound'
  /api/assets/{assetId}/retry:
    parameters:
      - $ref: '#/components/parameters/AssetId'
    post:
      tags: [assets]
      operationId: retryAsset
      summary: Render a failed item again from its stored recipe.
      responses:
        '202':
          description: A new render was started.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Asset'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: |
            `asset-not-failed` (only failed items can be retried) or `source-unavailable` (the
            track or one of its stems no longer exists).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              examples:
                notFailed:
                  value:
                    type: asset-not-failed
                    title: Item is not failed
                    status: 409
                    detail: Only failed items can be retried.
                sourceUnavailable:
                  value:
                    type: source-unavailable
                    title: Source unavailable
                    status: 409
                    detail: The track of this item was deleted, so it cannot be rendered again.
        '503':
          $ref: '#/components/responses/WorkerUnavailable'
  /api/assets/{assetId}/files/{role}:
    parameters:
      - $ref: '#/components/parameters/AssetId'
      - name: role
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/AssetFileRole'
    get:
      tags: [assets]
      operationId: getAssetFile
      summary: Download or play a file of a ready item; supports HTTP Range and conditional GET.
      description: |
        Same static-file semantics as stems (Range -> 206, `If-None-Match`/`If-Modified-Since`
        -> 304, unsatisfiable range -> 416). `HEAD` answers with the same headers and no body.
        `Content-Disposition` is `attachment` with the sanitised item name plus the file
        extension (RFC 6266 `filename` ASCII fallback and RFC 5987 `filename*`), or `inline`
        with `inline=true` (player). 404 for an unknown role or an item that is not ready.
      parameters:
        - name: inline
          in: query
          required: false
          schema:
            type: boolean
            default: false
        - name: Range
          in: header
          required: false
          schema:
            type: string
          example: bytes=0-1048575
        - name: If-None-Match
          in: header
          required: false
          schema:
            type: string
        - name: If-Modified-Since
          in: header
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Whole file.
          headers:
            Accept-Ranges:
              $ref: '#/components/headers/AcceptRanges'
            ETag:
              $ref: '#/components/headers/ETag'
            Last-Modified:
              $ref: '#/components/headers/LastModified'
            Content-Disposition:
              $ref: '#/components/headers/ContentDisposition'
          content:
            audio/flac:
              schema:
                type: string
                contentMediaType: audio/flac
            audio/wav:
              schema:
                type: string
                contentMediaType: audio/wav
            audio/mpeg:
              schema:
                type: string
                contentMediaType: audio/mpeg
            application/pdf:
              schema:
                type: string
                contentMediaType: application/pdf
            application/vnd.recordare.musicxml+xml:
              schema:
                type: string
                contentMediaType: application/vnd.recordare.musicxml+xml
            audio/midi:
              schema:
                type: string
                contentMediaType: audio/midi
        '206':
          description: Requested byte range of the file.
          headers:
            Content-Range:
              schema:
                type: string
              example: bytes 0-1048575/1824512
            Accept-Ranges:
              $ref: '#/components/headers/AcceptRanges'
            ETag:
              $ref: '#/components/headers/ETag'
            Last-Modified:
              $ref: '#/components/headers/LastModified'
          content:
            audio/flac:
              schema:
                type: string
                contentMediaType: audio/flac
            audio/wav:
              schema:
                type: string
                contentMediaType: audio/wav
            audio/mpeg:
              schema:
                type: string
                contentMediaType: audio/mpeg
            application/pdf:
              schema:
                type: string
                contentMediaType: application/pdf
            application/vnd.recordare.musicxml+xml:
              schema:
                type: string
                contentMediaType: application/vnd.recordare.musicxml+xml
            audio/midi:
              schema:
                type: string
                contentMediaType: audio/midi
        '304':
          $ref: '#/components/responses/StemNotModified'
        '404':
          $ref: '#/components/responses/NotFound'
        '416':
          $ref: '#/components/responses/RangeNotSatisfiable'
  /api/tracks/{trackId}/lyrics:
    parameters:
      - $ref: '#/components/parameters/TrackId'
    get:
      tags: [lyrics]
      operationId: getLyrics
      summary: The track's lyrics with word timing, status and credit (1.6.0).
      description: |
        Lyrics are copyrighted: served only here (never in `GET /api/tracks` or
        `GET /api/tracks/{trackId}`), with `Cache-Control: no-store`, never logged and never
        exported. Opening this resource for a completed track whose `lyricsStatus` is `none`
        (tracks imported before 1.6.0) starts the lookup (the response then has status
        `searching`).
      responses:
        '200':
          $ref: '#/components/responses/LyricsDocument'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [lyrics]
      operationId: setLyrics
      summary: Enter lyrics text yourself (replaces the current lyrics).
      description: |
        The text becomes a plain document (source `user`) and is aligned to the vocal stem: at
        once when the worker's automatic rule applies (`Health.lyricsAlignment.auto` `always`,
        or `gpu` on a GPU worker, and the standard separation is completed), otherwise the
        status is `alignPending` with the CPU estimate. Lines are split at line breaks; control
        characters other than line breaks and tabs are rejected (`422`).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetLyricsRequest'
            example:
              text: "Fake line one\nLa la la"
              language: en
      responses:
        '202':
          $ref: '#/components/responses/LyricsDocument'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/LyricsConflict'
        '422':
          $ref: '#/components/responses/UnprocessableRequest'
    delete:
      tags: [lyrics]
      operationId: removeLyrics
      summary: Remove the lyrics; no automatic lookup happens any more (status `removed`).
      responses:
        '200':
          $ref: '#/components/responses/LyricsDocument'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/tracks/{trackId}/lyrics/search:
    parameters:
      - $ref: '#/components/parameters/TrackId'
    post:
      tags: [lyrics]
      operationId: searchLyrics
      summary: Search LRCLIB again (from removed, notFound, failed, disabled or found).
      description: |
        Status becomes `searching` (or stays `disabled` when online lookups are off). `409` while
        a search or an alignment runs.
      responses:
        '202':
          $ref: '#/components/responses/LyricsDocument'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/LyricsConflict'
  /api/tracks/{trackId}/lyrics/align:
    parameters:
      - $ref: '#/components/parameters/TrackId'
    post:
      tags: [lyrics]
      operationId: alignLyrics
      summary: Align the lyrics text to the vocal stem (status `aligning`).
      description: |
        From `alignPending`, `failed` with text, or `found` with `syncLevel: line` (refines the
        words inside the line times). `409` without text, while aligning, or while the standard
        separation is not completed; `503` when the worker cannot be reached.
      responses:
        '202':
          $ref: '#/components/responses/LyricsDocument'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/LyricsConflict'
        '503':
          $ref: '#/components/responses/WorkerUnavailable'
  /api/tracks/{trackId}/lyrics/align/cancel:
    parameters:
      - $ref: '#/components/parameters/TrackId'
    post:
      tags: [lyrics]
      operationId: cancelLyricsAlignment
      summary: Cancel a running alignment (back to `alignPending`, or `found` when a line-synced document was being refined).
      responses:
        '200':
          $ref: '#/components/responses/LyricsDocument'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/LyricsConflict'
  /api/tracks/{trackId}/lyrics/offset:
    parameters:
      - $ref: '#/components/parameters/TrackId'
    put:
      tags: [lyrics]
      operationId: setLyricsOffset
      summary: Store the lyrics offset of the track (positive = lyrics later).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LyricsOffsetRequest'
            example:
              offsetMs: -120
      responses:
        '200':
          $ref: '#/components/responses/LyricsDocument'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/LyricsConflict'
        '422':
          $ref: '#/components/responses/UnprocessableRequest'
  /api/scores/options:
    get:
      tags: [scores]
      operationId: getScoreOptions
      summary: Profiles, defaults, estimates and limits for sheet music of one source (1.7.0).
      description: |
        Pass `trackId` and `channel` (a standard stem or a kept detail stem of a completed track)
        or `assetId` (a ready audio item), not both (`422`). Estimates are
        `duration * factor(engine, device) + overhead` (data-model.md 4.5) for the worker's device.
      parameters:
        - name: trackId
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: channel
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/ChannelId'
        - name: assetId
          in: query
          required: false
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: The options for the source.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScoreOptions'
              examples:
                bass:
                  $ref: '#/components/examples/BassScoreOptions'
                drumsNotSplit:
                  $ref: '#/components/examples/DrumsScoreOptions'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/ScoreConflict'
        '422':
          $ref: '#/components/responses/UnprocessableRequest'
  /api/assets/scores:
    post:
      tags: [scores]
      operationId: createScore
      summary: Transcribe a channel or a library audio item to sheet music (PDF, MusicXML, MIDI) (1.7.0).
      description: |
        Validates the source and the profile, resolves the input path(s) and the tempo grid
        (data-model.md 4.3-4.4), checks the free disk space, creates a library item of kind
        `score` (status `queued`) and submits a worker transcription job. Poll
        `GET /api/assets/{assetId}`; when `ready`, the files `pdf`, `musicxml` and `midi` and
        `score` are set. `409 drums-not-split` when `drums` is chosen before the drums were
        split into detail stems; `422 tempo-required` when the track has no reliable beat grid
        and no `tempo` is given.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateScoreRequest'
            examples:
              bass:
                $ref: '#/components/examples/BassScoreRequest'
              pianoFromAsset:
                $ref: '#/components/examples/PianoScoreRequest'
      responses:
        '202':
          description: Item created and queued.
          headers:
            Location:
              $ref: '#/components/headers/AssetLocation'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Asset'
              examples:
                queued:
                  $ref: '#/components/examples/QueuedScoreAsset'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/ScoreConflict'
        '422':
          $ref: '#/components/responses/ScoreUnprocessable'
  /api/generation/status:
    get:
      tags: [generation]
      operationId: getGenerationStatus
      summary: Whether generative features can run (1.8.0).
      description: |
        `notInstalled` when `StemStudio:GeneratorBaseUrl` is not configured or the generator's
        `/health` does not answer within 2 s; `unavailable` with the generator's reason when it
        runs without a usable GPU; `ready` otherwise. Cached for 10 s. `models` lists the model
        files the generator needs and `downloadBytesNeeded` the bytes still to download (shown
        before the first restyle). Never fails: the style library stays usable on CPU-only
        installs.
      responses:
        '200':
          description: The generation availability.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenerationStatus'
              examples:
                ready:
                  $ref: '#/components/examples/ReadyGenerationStatus'
                notInstalled:
                  $ref: '#/components/examples/NotInstalledGenerationStatus'
                unavailable:
                  $ref: '#/components/examples/UnavailableGenerationStatus'
  /api/styles:
    get:
      tags: [styles]
      operationId: listStyles
      summary: The style library, presets first, then by name (1.8.0).
      description: Filters combine with AND; `q` matches name, description and tags (case-insensitive substring).
      parameters:
        - name: kind
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/StyleKind'
        - name: genreFamily
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/GenreFamily'
        - name: mood
          in: query
          required: false
          schema:
            type: string
            maxLength: 30
        - name: instrument
          in: query
          required: false
          schema:
            type: string
            maxLength: 30
        - name: q
          in: query
          required: false
          schema:
            type: string
            maxLength: 100
      responses:
        '200':
          description: Matching styles.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Style'
              examples:
                library:
                  $ref: '#/components/examples/StyleList'
        '400':
          $ref: '#/components/responses/ValidationProblem'
    post:
      tags: [styles]
      operationId: createStyle
      summary: Create a user style (1.8.0).
      description: |
        Validated by the field limits and the artist-imitation guard (ADR-018 D8): a name,
        sub-genre, tag or description that contains an imitation phrase ("in the style of",
        "sounds like", "klinkt als", ...), an artist of the user's own tracks or a name on the
        deny-list is refused with `400`, `type: imitation` and the field in `errors`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StyleInput'
            examples:
              userStyle:
                $ref: '#/components/examples/StyleInputExample'
      responses:
        '201':
          description: Created.
          headers:
            Location:
              $ref: '#/components/headers/StyleLocation'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Style'
              examples:
                user:
                  $ref: '#/components/examples/UserStyle'
        '400':
          $ref: '#/components/responses/StyleValidationProblem'
        '409':
          $ref: '#/components/responses/StyleNameTaken'
  /api/styles/{styleId}:
    parameters:
