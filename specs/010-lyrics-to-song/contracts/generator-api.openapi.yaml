openapi: 3.1.0
info:
  title: StemStudio Generator API
  version: 1.1.0
  summary: Internal job API of the optional, GPU-only generator and singer services (style transfer and songs with ACE-Step 1.5, own-voice conversion with SoulX-Singer-SVC).
  description: |
    Called only by the StemStudio backend (never by the browser). The service is optional and
    opt-in (`docker-compose.generative.yml`, ADR-018 D1); it has no host port. Generation jobs run
    one at a time in a FIFO queue; every GPU step holds the shared cross-container GPU lease
    (`flock` on `/gpu-lease/gpu.lock`, ADR-018 D3) and passes the NVML free-memory check
    (ADR-018 D4). The backend polls `GET /v1/generations/{generationId}` every 2 s and, when the
    job is `completed`, downloads every take and deletes the job.

    * JSON uses camelCase. Pydantic models: `generator/src/stemstudio_generator/schemas.py`.
    * Errors are RFC 9457 problem details (`application/problem+json`) with an extension member
      `code` (`GeneratorProblemCode`).
    * Without a usable GPU the service still starts: `/health` reports `ready: false` and the
      probe reason, and every create request is refused with `409` `code: gpuRequired`. There is
      no CPU path for generation (constitution 1.3.0, GPU-only generative services exception).
    * `STEMSTUDIO_GENERATOR=fake` replaces ACE-Step by a deterministic fake engine (CI and E2E,
      no torch); `STEMSTUDIO_FAKE_GENERATOR_MODE` selects `ready`, `no-gpu`, `oom`, `oom-twice`,
      `busy` or `slow` (009 data-model.md 1).
    * Progress is an integer percentage 0-100 like the worker's job progress (Phase 0 outcome).
    * Takes are numbered from 1.
    * Two deployments serve this document (ADR-019 D2): `generator` (image variant `acestep`,
      kinds `restyle` and `song`) and `singer` (variant `soulx`, kind `voiceConversion` and the
      voice-sample endpoints; SoulX-Singer needs transformers 4.41). `/health.kinds` lists the
      kinds an instance serves (`STEMSTUDIO_GENERATOR_KINDS`); any other kind is refused with
      `409` `code: kindNotServed`, and the voice-sample endpoints answer `409` `kindNotServed`
      when `voiceSampleCheck` is false.
    * Changelog: 1.0.0 (new, feature 009) - health, restyle generations (`kind: restyle`,
      ACE-Step `cover` for a range, `repaint` for an in-place section), cancel, take audio,
      delete. See ADR-018.
      1.1.0 (additive, feature 010) - `kind: song` (ACE-Step `text2music` from lyrics, JSON body,
      no audio parts) and `kind: voiceConversion` (SoulX-Singer-SVC: parts `target`, `prompt`,
      `accompaniment`); takes report `vocal`, `hasVocalStem` and the song `profile`;
      `GET .../takes/{index}/vocal`; voice-sample checks (`POST /v1/voice-samples/check`,
      `GET /v1/voice-samples/{checkId}/audio`, CPU only); `GeneratorHealth.kinds` and
      `voiceSampleCheck`; error codes `unvoicedTarget`, `promptInvalid`; problem code
      `kindNotServed`; fake mode `unvoiced-sample`. See ADR-019.
  license:
    name: MIT
    identifier: MIT
servers:
  - url: http://generator:8010
    description: Docker compose internal network (no host port).
security: []  # internal service on a private network; no authentication
tags:
  - name: health
    description: Liveness, readiness and models.
  - name: generations
    description: Generation jobs and their takes.
  - name: voice-samples
    description: Checks of own-voice samples for voice profiles (1.1.0, singer service).
paths:
  /health:
    get:
      tags: [health]
      operationId: getHealth
      summary: Liveness, readiness (usable GPU), models and queue.
      description: |
        Always `200` while the process runs. `ready` is true only when the start-up probe found a
        usable NVIDIA GPU (same probe and reason texts as the worker's `DeviceInfo`, ADR-012 D2).
        The backend treats a missing or slow (> 2 s) answer as "not installed".
      responses:
        '200':
          description: Service status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeneratorHealth'
              examples:
                ready:
                  $ref: '#/components/examples/ReadyHealth'
                noGpu:
                  $ref: '#/components/examples/NoGpuHealth'
                singer:
                  $ref: '#/components/examples/SingerReadyHealth'
  /v1/generations:
    post:
      tags: [generations]
      operationId: createGeneration
      summary: Queue a generation job.
      description: |
        `kind: song` (1.1.0) is sent as `application/json` (`CreateGenerationRequest`, no audio).
        `kind: voiceConversion` (1.1.0) is `multipart/form-data` with `params`, one part `target`
        (the vocal stem, <= `STEMSTUDIO_SVC_MAX_TARGET_SECONDS`), one part `prompt` (the voice
        sample, 10-60 s) and 0-5 parts `accompaniment` (the other stems, summed and mixed with
        the converted vocal); the service deletes its copies of `prompt` and `target` when the
        job ends. `kind: restyle` is
        `multipart/form-data` with one part `params` (JSON `CreateGenerationRequest`) and 1-6
        parts `stem` (FLAC or WAV, each <= 300 MiB, same sample rate and length within one frame).
        The stems are summed at unity; for `mode: range` the range is cut from the sum, for
        `mode: inPlace` the whole sum is the source and the range is repainted. Validation:
        `rangeEndSeconds - rangeStartSeconds` is 10-480 s, the range lies inside the source
        (else `422` `code: sourceTooShort`), the number of seeds is the number of takes.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CreateGenerationUpload'
            encoding:
              params:
                contentType: application/json
              stem:
                contentType: audio/flac, audio/wav, audio/x-wav, application/octet-stream
              target:
                contentType: audio/flac, audio/wav, audio/x-wav, application/octet-stream
              prompt:
                contentType: audio/flac, audio/wav, audio/x-wav, application/octet-stream
              accompaniment:
                contentType: audio/flac, audio/wav, audio/x-wav, application/octet-stream
            examples:
              rangeRestyle:
                $ref: '#/components/examples/RangeRestyleUpload'
              inPlaceRestyle:
                $ref: '#/components/examples/InPlaceRestyleUpload'
              voiceConversion:
                $ref: '#/components/examples/VoiceConversionUpload'
          application/json:
            schema:
              $ref: '#/components/schemas/CreateGenerationRequest'
            examples:
              song:
                $ref: '#/components/examples/SongRequest'
              instrumental:
                $ref: '#/components/examples/InstrumentalSongRequest'
      responses:
        '202':
          description: Job accepted and queued.
          headers:
            Location:
              description: URL of the generation status resource.
              schema:
                type: string
              example: /v1/generations/5b0f7e2c9a1d4c3e8f6a2b1d0c9e8f7a
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Generation'
              examples:
                queued:
                  $ref: '#/components/examples/QueuedRestyle'
                queuedSong:
                  $ref: '#/components/examples/QueuedSong'
        '400':
          $ref: '#/components/responses/InvalidInput'
        '409':
          $ref: '#/components/responses/NotServable'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/SourceTooShort'
  /v1/generations/{generationId}:
    parameters:
      - $ref: '#/components/parameters/GenerationId'
    get:
      tags: [generations]
      operationId: getGeneration
      summary: Status, stage, progress and (when completed) the takes of a generation.
      responses:
        '200':
          description: Current state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Generation'
              examples:
                queued:
                  $ref: '#/components/examples/QueuedRestyle'
                waitingForGpu:
                  $ref: '#/components/examples/WaitingForGpuRestyle'
                running:
                  $ref: '#/components/examples/RunningRestyle'
                completed:
                  $ref: '#/components/examples/CompletedRestyle'
                failed:
                  $ref: '#/components/examples/FailedOutOfMemory'
                cancelled:
                  $ref: '#/components/examples/CancelledRestyle'
                runningSong:
                  $ref: '#/components/examples/RunningSong'
                completedSong:
                  $ref: '#/components/examples/CompletedSong'
                completedInstrumental:
                  $ref: '#/components/examples/CompletedInstrumental'
                completedVoiceConversion:
                  $ref: '#/components/examples/CompletedVoiceConversion'
                failedUnvoicedTarget:
                  $ref: '#/components/examples/FailedUnvoicedTarget'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [generations]
      operationId: deleteGeneration
      summary: Delete a generation and its files (a running job is cancelled first).
      responses:
        '204':
          description: Deleted.
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/generations/{generationId}/cancel:
    parameters:
      - $ref: '#/components/parameters/GenerationId'
    post:
      tags: [generations]
      operationId: cancelGeneration
      summary: Cancel a generation (no-op when it is already terminal).
      description: |
        `queued` and `waitingForGpu` jobs are cancelled immediately; a `running` job stops at the
        next progress callback (between diffusion steps) or between takes and releases the lease.
        A terminal job is returned unchanged.
      responses:
        '200':
          description: The job after the cancel request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Generation'
              examples:
                cancelled:
                  $ref: '#/components/examples/CancelledRestyle'
                completed:
                  $ref: '#/components/examples/CompletedRestyle'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/generations/{generationId}/takes/{index}:
    parameters:
      - $ref: '#/components/parameters/GenerationId'
      - $ref: '#/components/parameters/TakeIndex'
    get:
      tags: [generations]
      operationId: getTakeAudio
      summary: Download one take (FLAC 24-bit stereo 48 kHz with AI-generated Vorbis comments).
      description: |
        Vorbis comments: `AI_GENERATED=true`, `GENERATOR=ACE-Step 1.5 (<revision>)` (voice
        conversions: `SoulX-Singer-SVC (<revision>)`), `STEMSTUDIO_GENERATION=<generationId>`,
        `STEMSTUDIO_TAKE=<index>`, `COMMENT=AI-generated with StemStudio`; 1.1.0 adds
        `AI_VOICE=synthetic|converted` (takes with an AI voice) and `AI_VOICE_PROFILE=<name>`
        (voice conversions). Lyrics are not embedded. The `ETag` is the take's `sha256`.
        Single byte ranges are supported.
      parameters:
        - $ref: '#/components/parameters/Range'
      responses:
        '200':
          $ref: '#/components/responses/TakeFile'
        '206':
          $ref: '#/components/responses/TakeFilePart'
        '404':
          $ref: '#/components/responses/NotFound'
        '416':
          $ref: '#/components/responses/RangeNotSatisfiable'
  /v1/generations/{generationId}/takes/{index}/vocal:
    parameters:
      - $ref: '#/components/parameters/GenerationId'
      - $ref: '#/components/parameters/TakeIndex'
    get:
      tags: [generations]
      operationId: getTakeVocal
      summary: Download the converted vocal stem of a voice-conversion take (1.1.0).
      description: |
        Only for takes with `hasVocalStem: true` (voice conversions); FLAC 24-bit stereo 48 kHz
        (the SoulX output at 24 kHz mono, upsampled for import consistency) with the same Vorbis
        comments as the take. `404` for other kinds. Single byte ranges are supported.
      parameters:
        - $ref: '#/components/parameters/Range'
      responses:
        '200':
          $ref: '#/components/responses/TakeFile'
        '206':
          $ref: '#/components/responses/TakeFilePart'
        '404':
          $ref: '#/components/responses/NotFound'
        '416':
          $ref: '#/components/responses/RangeNotSatisfiable'
  /v1/voice-samples/check:
    post:
      tags: [voice-samples]
      operationId: checkVoiceSample
      summary: Check an own-voice sample for a voice profile (1.1.0, singer service).
      description: |
        Decodes the sample (WAV, FLAC, MP3 or WebM/Opus from the browser recorder; soundfile or
        torchaudio, never a shell), resamples it to 48 kHz mono, measures the duration and the
        voiced ratio (RMVPE F0 > 0 on the CPU, no GPU lease, so it works while a GPU job runs).
        `ok` iff 10 <= duration <= 60 s and `voicedRatio >= 0.5`. When `ok`, the normalised
        sample (FLAC) is kept for 10 minutes at `GET /v1/voice-samples/{checkId}/audio` and
        deleted after the first download or the timeout; otherwise nothing is kept. Works without
        a GPU. `409` `code: kindNotServed` when this instance has `voiceSampleCheck: false`.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/VoiceSampleUpload'
            encoding:
              sample:
                contentType: audio/wav, audio/x-wav, audio/flac, audio/mpeg, audio/webm, application/octet-stream
      responses:
        '200':
          description: The check result (also when the sample is not usable).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VoiceSampleCheck'
              examples:
                ok:
                  $ref: '#/components/examples/VoiceSampleOk'
                unvoiced:
                  $ref: '#/components/examples/VoiceSampleUnvoiced'
        '400':
          $ref: '#/components/responses/UnreadableSample'
        '409':
          $ref: '#/components/responses/KindNotServed'
        '413':
          $ref: '#/components/responses/SampleTooLarge'
  /v1/voice-samples/{checkId}/audio:
    parameters:
      - $ref: '#/components/parameters/CheckId'
    get:
      tags: [voice-samples]
      operationId: getCheckedVoiceSample
      summary: Download the normalised sample of an `ok` check once, within 10 minutes (1.1.0).
      description: 48 kHz mono FLAC; the file is deleted when the response completes. `404` afterwards, after the timeout, or for a check that was not `ok`.
      responses:
        '200':
          description: The normalised sample.
          headers:
            Content-Length:
              schema:
                type: integer
          content:
            audio/flac:
              schema:
                type: string
                contentMediaType: audio/flac
        '404':
          $ref: '#/components/responses/NotFound'
components:
  parameters:
    GenerationId:
      name: generationId
      in: path
      required: true
      description: Generation identifier (32 lower-case hex characters, a UUID without dashes).
      schema:
        type: string
        pattern: '^[0-9a-f]{32}$'
      example: 5b0f7e2c9a1d4c3e8f6a2b1d0c9e8f7a
    TakeIndex:
      name: index
      in: path
      required: true
      description: Take number, starting at 1.
      schema:
        type: integer
        minimum: 1
        maximum: 2
    CheckId:
      name: checkId
      in: path
      required: true
      description: Voice-sample check identifier (32 lower-case hex characters).
      schema:
        type: string
        pattern: '^[0-9a-f]{32}$'
      example: 2e4c6a8b0d1f43a5b7c9e1d3f5a7b9c1
    Range:
      name: Range
      in: header
      required: false
      description: A single byte range (`bytes=<start>-<end>`).
      schema:
        type: string
        pattern: '^bytes=[0-9]*-[0-9]*$'
      example: bytes=0-65535
  responses:
    InvalidInput:
      description: Invalid parameters or files (missing `params`, schema violation, 0 or more than 6 stems, unreadable audio, mismatched sample rates or lengths, range length outside 10-480 s, number of seeds outside 1-2).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/GeneratorProblem'
          example:
            title: Invalid input
            status: 400
            detail: The range must be between 10 and 480 seconds long.
            code: invalidInput
    NotServable:
      description: |
        The service has no usable GPU (`code: gpuRequired`), or this instance does not serve the
        requested kind (`code: kindNotServed`, 1.1.0: e.g. a song sent to the singer service).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/GeneratorProblem'
          examples:
            gpuRequired:
              value:
                title: GPU required
                status: 409
                detail: No NVIDIA GPU is available to this service (CUDA is not available).
                code: gpuRequired
            kindNotServed:
              value:
                title: Kind not served
                status: 409
                detail: This service does not generate songs; it serves voiceConversion.
                code: kindNotServed
    KindNotServed:
      description: This instance does not check voice samples (`voiceSampleCheck` is false; use the singer service).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/GeneratorProblem'
          example:
            title: Kind not served
            status: 409
            detail: This service does not check voice samples.
            code: kindNotServed
    UnreadableSample:
      description: The `sample` part is missing or cannot be decoded as audio.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/GeneratorProblem'
          example:
            title: Invalid input
            status: 400
            detail: The sample could not be read as audio.
            code: invalidInput
    SampleTooLarge:
      description: The sample is larger than 20 MiB (20,971,520 bytes).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/GeneratorProblem'
          example:
            title: File too large
            status: 413
            detail: The sample is larger than 20 MiB (20,971,520 bytes).
            code: invalidInput
    PayloadTooLarge:
      description: A stem part is larger than 300 MiB (314,572,800 bytes).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/GeneratorProblem'
          example:
            title: File too large
            status: 413
            detail: Stem 3 is larger than 300 MiB (314,572,800 bytes).
            code: invalidInput
    UnsupportedMediaType:
      description: The body is not multipart, or a stem part is neither FLAC nor WAV.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/GeneratorProblem'
          example:
            title: Unsupported file type
            status: 415
            detail: Only FLAC and WAV stems are supported.
            code: invalidInput
    SourceTooShort:
      description: The summed source is shorter than the requested range end.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/GeneratorProblem'
          example:
            title: Source too short
            status: 422
            detail: The range ends at 105.0 s but the source is 98.4 s long.
            code: sourceTooShort
    NotFound:
      description: Unknown generation, or the take does not exist (job not completed or index too high).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/GeneratorProblem'
          example:
            title: Not found
            status: 404
            detail: Generation 5b0f7e2c9a1d4c3e8f6a2b1d0c9e8f7a does not exist.
    RangeNotSatisfiable:
      description: The requested byte range lies outside the file.
      headers:
        Content-Range:
          schema:
            type: string
          example: bytes */1048576
    TakeFile:
      description: The whole take.
      headers:
        ETag:
          schema:
            type: string
          description: Quoted SHA-256 of the file.
        Accept-Ranges:
          schema:
            type: string
            const: bytes
        Content-Length:
          schema:
            type: integer
      content:
        audio/flac:
          schema:
            type: string
            contentMediaType: audio/flac
    TakeFilePart:
      description: The requested byte range of the take.
      headers:
        Content-Range:
          schema:
            type: string
          example: bytes 0-65535/1048576
        Content-Length:
          schema:
            type: integer
      content:
        audio/flac:
          schema:
            type: string
            contentMediaType: audio/flac
  schemas:
    GeneratorProblem:
      type: object
      description: RFC 9457 problem details with the extension member `code`. Extension members are allowed.
      required: [title, status]
      properties:
        type:
          type: string
          default: about:blank
        title:
          type: string
        status:
          type: integer
          minimum: 400
          maximum: 599
        detail:
          type: [string, 'null']
        instance:
          type: [string, 'null']
        code:
          $ref: '#/components/schemas/GeneratorProblemCode'
      additionalProperties: true
    GeneratorProblemCode:
      type: string
      description: Machine-readable reason of a refused request.
      enum: [invalidInput, gpuRequired, sourceTooShort, kindNotServed]
    GeneratorEngine:
      type: string
      description: The engine behind the service (`STEMSTUDIO_GENERATOR`); `fake` in CI and E2E; `soulx` on the singer service (1.1.0).
      enum: [acestep, soulx, fake]
    GeneratorHealth:
      type: object
      additionalProperties: false
      required: [status, contractVersion, engine, kinds, voiceSampleCheck, ready, reason, device, models, queue]
      properties:
        status:
          type: string
          const: ok
        contractVersion:
          type: string
          example: 1.0.0
        engine:
          $ref: '#/components/schemas/GeneratorEngine'
        kinds:
          type: array
          minItems: 1
          maxItems: 3
          uniqueItems: true
          description: Job kinds this instance serves (1.1.0, `STEMSTUDIO_GENERATOR_KINDS`).
          items:
            $ref: '#/components/schemas/GenerationKind'
        voiceSampleCheck:
          type: boolean
          description: True when this instance serves the voice-sample endpoints (1.1.0, singer service).
        ready:
          type: boolean
          description: True iff `device.kind` is `gpu` (generation is possible).
        reason:
          type: [string, 'null']
          maxLength: 500
          description: Why the service is not ready (the probe reason); null when ready.
        device:
          $ref: '#/components/schemas/DeviceInfo'
        models:
          type: array
          maxItems: 16
          items:
            $ref: '#/components/schemas/ModelStatus'
        queue:
          $ref: '#/components/schemas/QueueStatus'
    QueueStatus:
      type: object
      additionalProperties: false
      required: [queued, running]
      properties:
        queued:
          type: integer
          minimum: 0
          description: Jobs waiting in the queue (excluding the running one).
        running:
          type: [string, 'null']
          pattern: '^[0-9a-f]{32}$'
          description: Id of the job being processed (also while it waits for the GPU or downloads a model); null when idle.
    ModelId:
      type: string
      description: |
        Model files of the service. `acestep-v15-turbo` (DiT 2B), `acestep-vae`,
        `qwen3-embedding-0.6b` (text encoder) and `acestep-5hz-lm-1.7b` (language model, only
        loaded for songs from 1.1.0) form the `ACE-Step/Ace-Step1.5` bundle (MIT).
        `soulx-singer-svc` (`Soul-AILab/SoulX-Singer` `model-svc.pt`), `rmvpe`
        (`Soul-AILab/SoulX-Singer-Preprocess` `rmvpe/rmvpe.pt`) and `whisper-base`
        (`openai/whisper-base`, content encoder) are the singer's models (1.1.0, Apache-2.0).
      enum: [acestep-v15-turbo, acestep-vae, qwen3-embedding-0.6b, acestep-5hz-lm-1.7b, soulx-singer-svc, rmvpe, whisper-base]
    ModelStatus:
      type: object
      additionalProperties: false
      required: [id, present, bytes, revision]
      properties:
        id:
          $ref: '#/components/schemas/ModelId'
        present:
          type: boolean
          description: True when the files are in the model cache (no download needed).
        bytes:
          type: integer
          minimum: 0
          description: Download size (present or not).
        revision:
          type: string
          maxLength: 64
          description: Pinned Hugging Face revision.
    ProcessingDeviceKind:
      type: string
      enum: [cpu, gpu]
      description: The CPU, or the NVIDIA GPU (CUDA). Copied from worker 1.2.0.
    DeviceInfo:
      type: object
      additionalProperties: false
      required: [kind]
      description: |
        Device found by the start-up probe; same shape and reason texts as the worker's
        `DeviceInfo` (worker 1.2.0, ADR-012 D2). On a service without a usable GPU `kind` is
        `cpu` and `reason` says why (the service is then not ready).
      properties:
        kind:
          $ref: '#/components/schemas/ProcessingDeviceKind'
        name:
          type: [string, 'null']
          maxLength: 200
          example: NVIDIA GeForce RTX 5070 Ti
        computeCapability:
          type: [string, 'null']
          pattern: '^[0-9]{1,2}\.[0-9]{1,2}$'
          example: '12.0'
        totalMemoryMiB:
          type: [integer, 'null']
          minimum: 0
        freeMemoryMiB:
          type: [integer, 'null']
          minimum: 0
          description: Free GPU memory at start-up (NVML).
        reason:
          type: [string, 'null']
          maxLength: 500
    JobDevice:
      type: object
      additionalProperties: false
      required: [kind, cpuFallback]
      description: |
        Device record of a generation (worker 1.2.0 shape). `kind` is `gpu` once a step ran;
        `cpuFallback` is always false (generation never falls back to the CPU); `fallbackReason`
        is null.
      properties:
        kind:
          $ref: '#/components/schemas/ProcessingDeviceKind'
        name:
          type: [string, 'null']
          maxLength: 200
        cpuFallback:
          type: boolean
        fallbackReason:
          type: [string, 'null']
          maxLength: 500
    GenerationKind:
      type: string
      description: Job kind. 1.0.0 has `restyle`; 1.1.0 adds `song` and `voiceConversion`.
      enum: [restyle, song, voiceConversion]
    GenerationStatus:
      type: string
      description: |
        `queued` -> `waitingForGpu` (lease or free memory) -> `downloadingModel` (first use only)
        -> `running` -> `completed`; any non-terminal state -> `failed` or `cancelled`.
        `completed`, `failed` and `cancelled` are terminal (009 data-model.md 2.4).
      enum: [queued, waitingForGpu, downloadingModel, running, completed, failed, cancelled]
    GenerationErrorCode:
      type: string
      description: |
        `gpuRequired` the GPU became unusable; `gpuBusy` not enough free GPU memory within the
        wait limit (another program holds it); `outOfMemory` out of GPU memory twice (standard and
        low-memory profile); `modelDownloadFailed`; `interrupted` the service restarted while the
        job was active; `invalidInput` the audio could not be processed; `engineError` any other
        model failure. 1.1.0: `unvoicedTarget` the target vocal stem is less than 10 % voiced;
        `promptInvalid` the voice sample (prompt) could not be used.
      enum: [gpuRequired, gpuBusy, outOfMemory, modelDownloadFailed, interrupted, invalidInput, engineError, unvoicedTarget, promptInvalid]
    GenerationError:
      type: object
      additionalProperties: false
      required: [code, message]
      properties:
        code:
          $ref: '#/components/schemas/GenerationErrorCode'
        message:
          type: string
          maxLength: 500
    RestyleMode:
      type: string
      description: '`range`: the range becomes the take (ACE-Step `cover`). `inPlace`: the whole source is kept and only the range is restyled (ACE-Step `repaint`); the take has the source length.'
      enum: [range, inPlace]
    Seed:
      type: integer
      minimum: 0
      maximum: 2147483647
    RestyleParams:
      type: object
      additionalProperties: false
      required: [caption, audioCoverStrength, seeds, mode, rangeStartSeconds, rangeEndSeconds]
      properties:
        caption:
          type: string
          minLength: 1
          maxLength: 512
          description: Style caption built by the backend's prompt builder (ADR-018 D7).
        audioCoverStrength:
          type: number
          minimum: 0
          maximum: 1
          description: Adherence to the source (Subtle 0.85, Light 0.70, Balanced 0.55, Strong 0.40, Free 0.25).
        inferenceSteps:
          type: integer
          minimum: 1
          maximum: 20
          default: 8
        shift:
          type: number
          minimum: 1
          maximum: 5
          default: 3.0
        seeds:
          type: array
          minItems: 1
          maxItems: 2
          description: One seed per take.
          items:
            $ref: '#/components/schemas/Seed'
        mode:
          $ref: '#/components/schemas/RestyleMode'
        rangeStartSeconds:
          type: number
          minimum: 0
        rangeEndSeconds:
          type: number
          exclusiveMinimum: 0
          description: '`rangeEndSeconds - rangeStartSeconds` must be 10-480 s.'
    RestyleGenerationRequest:
      type: object
      additionalProperties: false
      required: [kind, restyle]
      properties:
        kind:
          type: string
          const: restyle
        restyle:
          $ref: '#/components/schemas/RestyleParams'
    CreateGenerationRequest:
      description: The JSON body (`song`) or the JSON `params` part (`restyle`, `voiceConversion`); one member named by `kind`.
      oneOf:
        - $ref: '#/components/schemas/RestyleGenerationRequest'
        - $ref: '#/components/schemas/SongGenerationRequest'
        - $ref: '#/components/schemas/VoiceConversionGenerationRequest'
      discriminator:
        propertyName: kind
        mapping:
          restyle: '#/components/schemas/RestyleGenerationRequest'
          song: '#/components/schemas/SongGenerationRequest'
          voiceConversion: '#/components/schemas/VoiceConversionGenerationRequest'
    VocalLanguage:
      type: string
      description: Lyrics language (ACE-Step `VALID_LANGUAGES`, ISO 639-1 plus `yue`), or `unknown`.
      enum: [ar, az, bg, bn, ca, cs, da, de, el, en, es, fa, fi, fr, he, hi, hr, ht, hu, id, is, it, ja, ko, la, lt, ms, ne, nl, 'no', pa, pl, pt, ro, ru, sa, sk, sr, sv, sw, ta, te, th, tl, tr, uk, ur, vi, yue, zh, unknown]
    TimeSignature:
      type: string
      description: Beats per bar (2/4, 3/4, 4/4, 6/8).
      enum: ['2', '3', '4', '6']
    SongParams:
      type: object
      additionalProperties: false
      required: [caption, lyrics, instrumental, vocalLanguage, durationSeconds, seeds]
      properties:
        caption:
          type: string
          minLength: 1
          maxLength: 512
          description: Caption built by the backend (style + lead voice + delivery, guarded).
        lyrics:
          type: string
          minLength: 1
          maxLength: 4096
          description: Normalised lyrics with section markers, LF line ends; `[Instrumental]` when instrumental.
        instrumental:
          type: boolean
        vocalLanguage:
          $ref: '#/components/schemas/VocalLanguage'
        bpm:
          type: [integer, 'null']
          minimum: 40
          maximum: 220
        keyScale:
          type: [string, 'null']
          pattern: '^[A-G](#|b)? (major|minor)$'
          example: E minor
        timeSignature:
          oneOf:
            - $ref: '#/components/schemas/TimeSignature'
            - type: 'null'
        durationSeconds:
          type: number
          minimum: 10
          maximum: 480
        inferenceSteps:
          type: integer
          minimum: 1
          maximum: 20
          default: 8
        shift:
          type: number
          minimum: 1
          maximum: 5
          default: 3.0
        seeds:
          type: array
          minItems: 1
          maxItems: 2
          items:
            $ref: '#/components/schemas/Seed'
        thinking:
          type: boolean
          default: true
          description: Use the language-model planner when GPU memory allows (profile `planned`); else the DiT runs alone (`direct`).
    SongGenerationRequest:
      type: object
      additionalProperties: false
      required: [kind, song]
      properties:
        kind:
          type: string
          const: song
        song:
          $ref: '#/components/schemas/SongParams'
    VoiceConversionParams:
      type: object
      additionalProperties: false
      required: [profileName]
      properties:
        pitchShift:
          type: integer
          minimum: -12
          maximum: 12
          default: 0
          description: Semitones; `0` with `autoShift` shifts the target to the prompt's register.
        autoShift:
          type: boolean
          default: true
        steps:
          type: integer
          minimum: 8
          maximum: 64
          default: 32
        cfg:
          type: number
          minimum: 1
          maximum: 6
          default: 3.0
        vocalGainDb:
          type: number
          minimum: -12
          maximum: 6
          default: 0
        profileName:
          type: string
          minLength: 1
          maxLength: 80
          description: Display name of the voice profile, written into `AI_VOICE_PROFILE`.
    VoiceConversionGenerationRequest:
      type: object
      additionalProperties: false
      required: [kind, voiceConversion]
      properties:
        kind:
          type: string
          const: voiceConversion
        voiceConversion:
          $ref: '#/components/schemas/VoiceConversionParams'
    VoiceSampleUpload:
      type: object
      required: [sample]
      properties:
        sample:
          type: string
          contentMediaType: application/octet-stream
          description: The recorded or uploaded sample, <= 20 MiB.
    VoiceSampleIssue:
      type: string
      description: Why a sample is not usable.
      enum: [tooShort, tooLong, unvoiced]
    VoiceSampleCheck:
      type: object
      additionalProperties: false
      required: [checkId, durationSeconds, voicedRatio, pcmSha256, ok, reason, message]
      properties:
        checkId:
          type: string
          pattern: '^[0-9a-f]{32}$'
        durationSeconds:
          type: number
          minimum: 0
        voicedRatio:
          type: number
          minimum: 0
          maximum: 1
        pcmSha256:
          type: string
          pattern: '^[0-9a-f]{64}$'
          description: SHA-256 of the decoded PCM (int16 LE, 48 kHz mono).
        ok:
          type: boolean
        reason:
          oneOf:
            - $ref: '#/components/schemas/VoiceSampleIssue'
            - type: 'null'
          description: Set iff `ok` is false.
        message:
          type: [string, 'null']
          maxLength: 300
          description: Readable reason; set iff `ok` is false.
    VocalLabel:
      type: string
      description: AI voice label of a take (1.1.0). `none` no vocals (instrumental); `synthetic` an AI voice from the song model; `converted` a vocal converted to a voice profile.
      enum: [none, synthetic, converted]
    SongProfile:
      type: string
      description: Song profile that ran (1.1.0). `planned` DiT + language-model planner; `direct` DiT only (also the low-memory variant).
      enum: [planned, direct]
    CreateGenerationUpload:
      type: object
      required: [params]
      description: '`restyle`: `params` + 1-6 `stem`. `voiceConversion` (1.1.0): `params` + `target` + `prompt` + 0-5 `accompaniment`.'
      properties:
        params:
          $ref: '#/components/schemas/CreateGenerationRequest'
        stem:
          type: array
          minItems: 1
          maxItems: 6
          items:
            type: string
            contentMediaType: application/octet-stream
        target:
          type: string
          contentMediaType: application/octet-stream
        prompt:
          type: string
          contentMediaType: application/octet-stream
        accompaniment:
          type: array
          maxItems: 5
          items:
            type: string
            contentMediaType: application/octet-stream
    TakeModel:
      type: object
      additionalProperties: false
      required: [id, revision]
      properties:
        id:
          type: string
          maxLength: 64
          example: acestep-v15-turbo
        revision:
          type: string
          maxLength: 64
    GeneratedTake:
      type: object
      additionalProperties: false
      required: [index, seed, durationSeconds, sampleRate, sha256, bytes, peakDbfs, model, vocal, hasVocalStem, profile]
      properties:
        index:
          type: integer
          minimum: 1
          maximum: 2
        seed:
          $ref: '#/components/schemas/Seed'
        durationSeconds:
          type: number
          exclusiveMinimum: 0
        sampleRate:
          type: integer
          const: 48000
        sha256:
          type: string
          pattern: '^[0-9a-f]{64}$'
          description: SHA-256 of the FLAC file.
        bytes:
          type: integer
          minimum: 1
        peakDbfs:
          type: number
          maximum: 0
          description: Sample peak of the take in dBFS (for the library's audio facts).
        model:
          $ref: '#/components/schemas/TakeModel'
        vocal:
          oneOf:
            - $ref: '#/components/schemas/VocalLabel'
            - type: 'null'
          description: AI voice label (1.1.0); null for restyle takes (the whole take is AI-generated).
        hasVocalStem:
          type: boolean
          description: True when `GET .../takes/{index}/vocal` serves the converted vocal (voice conversions, 1.1.0).
        profile:
          oneOf:
            - $ref: '#/components/schemas/SongProfile'
            - type: 'null'
          description: Song profile (song takes, 1.1.0); null otherwise.
    Generation:
      type: object
      additionalProperties: false
      required: [generationId, kind, status, progress, stage, takes, warnings, createdAt, updatedAt]
      description: A generation job. Exactly the parameter member named by `kind` is present (`restyle`, `song` or `voiceConversion`).
      properties:
        generationId:
          type: string
          pattern: '^[0-9a-f]{32}$'
        kind:
          $ref: '#/components/schemas/GenerationKind'
        status:
          $ref: '#/components/schemas/GenerationStatus'
        progress:
          type: integer
          minimum: 0
          maximum: 100
          description: Percentage within the job; monotonic within a status.
        stage:
          type: string
          maxLength: 200
          description: e.g. "Queued", "Waiting for the GPU", "Downloading model (2.1 of 10.1 GB)", "Loading model", "Generating take 1 of 2", "Retrying with low memory", "Writing takes".
        restyle:
          $ref: '#/components/schemas/RestyleParams'
        song:
          $ref: '#/components/schemas/SongParams'
        voiceConversion:
          $ref: '#/components/schemas/VoiceConversionParams'
        takes:
          type: array
          maxItems: 2
          description: Empty until completed.
          items:
            $ref: '#/components/schemas/GeneratedTake'
        warnings:
          type: array
          maxItems: 5
          description: Readable warnings that do not fail the job (e.g. "The summed stems clipped; peaks were limited.").
          items:
            type: string
            maxLength: 300
        device:
          oneOf:
            - $ref: '#/components/schemas/JobDevice'
            - type: 'null'
        error:
          oneOf:
            - $ref: '#/components/schemas/GenerationError'
            - type: 'null'
          description: Set iff `status` is `failed`.
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
