openapi: 3.1.0
info:
  title: StemStudio Worker API - insights and handouts delta (feature 020)
  version: 1.11.0-delta.3
  summary: Additive delta of the worker API for stem quality reports, lesson handouts and the gated high-quality vocal re-separation.
  description: |
    * **Standalone, additive delta.** Contains only what feature 020 adds. It is merged unchanged
      into the full `specs/020-insights-handouts/contracts/worker-api.openapi.yaml` **1.11.0** by
      `merge_full.py` (020 Phase 0, 2026-11-23) on top of the newest full document on `main`, 016's
      1.9.0 (017-019 are not built yet; 020 needs nothing from them, DELTA.md "Phase 0 outcome").
      No existing operation, schema or behaviour changes. Schemas repeated here from the base
      (`LibraryPath`, `StemName`, `ParentStemName`, `RenderJobStatus`, `JobDevice`, `LaneHealth`,
      `ProblemDetails` and the responses `NotFound`, `InvalidInputPath`, `InputNotFound`,
      `ValidationFailed`) are copies for standalone validity; at the merge the base definitions win
      and the copies are dropped. `ChannelId` and `JobHexId` are new to the worker document.
    * Library paths (data-model 2.2): quality jobs accept only the stem and detail stem patterns of
      `createRenderJob` (1.4.0); handout jobs accept only `assets/<uuid>/[a-z][a-z0-9-]{0,31}.pdf`
      (notation) and `tracks/<uuid>/artwork/(auto|user)/cover.jpg` (artwork). The general
      allow-list of render and transcription jobs is unchanged. Invalid -> `400
      invalid-input-path`; missing -> `404 input-not-found`, both checked when the job is created.
    * Quality and handout jobs run in the new **`insights`** lane (one at a time, FIFO, threads
      capped by `STEMSTUDIO_INSIGHTS_THREADS`); they never wait behind a separation, a render or
      a transcription. Jobs are kept for 24 hours after they end; after a restart `queued` and
      `running` jobs are `failed` with "interrupted by restart". `DELETE` cancels and removes
      (idempotent `204`).
    * The handout renderer never uses the network and reads only the files named in the request
      (ADR-029 D7).
    * **G2 pending** (Phase 0, 2026-11-23: MUSDB18-HQ not available, research.md "Phase 0
      measurements"). The paths tagged `reseparation`, `SeparationPipelinesHealth` and the
      `Reseparation*`/`SeparationPipeline` schemas are kept here as the design record but are
      **not merged** into 1.11.0; they need a later contract minor once G2 passes.
    * Health additions (merged into `Health`, required): `lanes.insights` (`LaneHealth`),
      `insights` (`InsightsHealth`); `separationPipelines` (G2, deferred).
    * Changelog: 1.11.0-delta.3 (integration: the job limits in `createHandoutJob`, warnings `notation-omitted` and `artwork-omitted`, the example outline in data-model 6.4 order); 1.11.0-delta.2 (Phase 0: base 016 1.9.0, G2 deferred, per-job allow-lists, setlist entries without `available`); 1.11.0-delta.1 (additive, feature 020 planning) - quality jobs, handout jobs,
      re-separation jobs (gated), health additions. See ADR-029 and DELTA.md.
  license:
    name: MIT
    identifier: MIT
servers:
  - url: http://worker:8000
    description: docker compose network (internal only)
security: []
tags:
  - name: insights
    description: Reference-free stem quality estimates (1.11.0, feature 020).
  - name: handouts
    description: Lesson handout PDFs laid out from a resolved document (1.11.0, feature 020).
  - name: reseparation
    description: High-quality vocal re-separation of a completed track (1.11.0, feature 020, gated by G2).
paths:
  /v1/quality-jobs:
    post:
      tags: [insights]
      operationId: createQualityJob
      summary: Estimate bleed and artefacts of every given stem (insights lane).
      description: |
        Reads the six standard stems (their sum is the mix) and any detail stems, computes the
        measures of data-model 4 and returns levels and a rating per stem. Stages and progress:
        `loading` 0-0.2, `analysing` 0.2-0.9, `rating` 0.9-1.0.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QualityJobRequest'
            examples:
              standardAndDetail:
                $ref: '#/components/examples/QualityRequest'
      responses:
        '202':
          description: Accepted and queued.
          headers:
            Location:
              description: URL of the job.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QualityJob'
        '400':
          $ref: '#/components/responses/InvalidInputPath'
        '404':
          $ref: '#/components/responses/InputNotFound'
        '422':
          $ref: '#/components/responses/ValidationFailed'
  /v1/quality-jobs/{qualityJobId}:
    parameters:
      - $ref: '#/components/parameters/QualityJobId'
    get:
      tags: [insights]
      operationId: getQualityJob
      summary: Status, progress and result of a quality job.
      responses:
        '200':
          description: Current state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QualityJob'
              examples:
                completed:
                  $ref: '#/components/examples/CompletedQualityJob'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [insights]
      operationId: deleteQualityJob
      summary: Cancel (when queued or running) and remove a quality job.
      responses:
        '204':
          description: Removed (or did not exist).
  /v1/handout-jobs:
    post:
      tags: [handouts]
      operationId: createHandoutJob
      summary: Render a lesson handout PDF from a resolved document (insights lane).
      description: |
        The document is complete: the worker performs no lookups. Notice texts must equal the
        fixed texts of data-model 6.6 (else `422`). Each `notation[].pdfPath` and `artworkPath`
        is checked against the handout allow-list. Stages and progress: `layout` 0-0.6, `notation`
        0.6-0.9, `writing` 0.9-1.0. An unreadable notation file does not fail the job: its pages
        are replaced by a note and a `notation-unreadable` warning is returned.
        The worker refuses a job over its limits with `422`: a body over 8 MiB (8 388 608 bytes), more
        than 500 000 characters of text in the document, more than 30 000 layout cells (sections,
        bars, chords in bars, legend chords, lyric lines and their chords, setlist entries) or more
        than 128 MiB of distinct notation PDFs together. While it renders, at most 600 notation
        frame pages and 128 MiB of notation are read; further notation items become a note with a
        `notation-omitted` warning. A render that passes 240 s fails ("The handout could not be
        written"). Artwork that is not a JPEG or is larger than 40 megapixels is left out with an
        `artwork-omitted` warning.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HandoutJobRequest'
            examples:
              bassSong:
                $ref: '#/components/examples/BassHandoutRequest'
      responses:
        '202':
          description: Accepted and queued.
          headers:
            Location:
              description: URL of the job.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HandoutJob'
        '400':
          $ref: '#/components/responses/InvalidInputPath'
        '404':
          $ref: '#/components/responses/InputNotFound'
        '422':
          $ref: '#/components/responses/ValidationFailed'
  /v1/handout-jobs/{handoutJobId}:
    parameters:
      - $ref: '#/components/parameters/HandoutJobId'
    get:
      tags: [handouts]
      operationId: getHandoutJob
      summary: Status, progress and result of a handout job.
      responses:
        '200':
          description: Current state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HandoutJob'
              examples:
                completed:
                  $ref: '#/components/examples/CompletedHandoutJob'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [handouts]
      operationId: deleteHandoutJob
      summary: Cancel (when queued or running) and remove a handout job and its file.
      responses:
        '204':
          description: Removed (or did not exist).
  /v1/handout-jobs/{handoutJobId}/file:
    parameters:
      - $ref: '#/components/parameters/HandoutJobId'
    get:
      tags: [handouts]
      operationId: getHandoutFile
      summary: Download the PDF of a completed handout job.
      responses:
        '200':
          description: The PDF; `Content-Length` = `HandoutResult.sizeBytes`.
          headers:
            Content-Length:
              schema:
                type: integer
          content:
            application/pdf:
              schema:
                type: string
                contentMediaType: application/pdf
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/HandoutNotCompleted'
  /v1/reseparation-jobs:
    post:
      tags: [reseparation]
      operationId: createReseparationJob
      summary: Re-separate a track's mix (sum of its six stems) with a high-quality pipeline (G2).
      description: |
        Runs in the separation queue under the GPU policy of ADR-012 (CPU fallback allowed).
        Pipeline `vocals-hq`: RoFormer vocal model on the summed input, then `htdemucs_6s` on the
        instrumental (data-model 2.7). Stages: `loading-model` 0-0.05, `vocals` 0.05-0.45,
        `instruments` 0.45-0.95, `writing` 0.95-1.0. Results are cached per summed-input hash.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReseparationJobRequest'
      responses:
        '202':
          description: Accepted and queued.
          headers:
            Location:
              description: URL of the job.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReseparationJob'
        '400':
          $ref: '#/components/responses/InvalidInputPath'
        '404':
          $ref: '#/components/responses/InputNotFound'
        '422':
          $ref: '#/components/responses/ValidationFailed'
  /v1/reseparation-jobs/{reseparationJobId}:
    parameters:
      - $ref: '#/components/parameters/ReseparationJobId'
    get:
      tags: [reseparation]
      operationId: getReseparationJob
      summary: Status, progress, device and result of a re-separation job.
      responses:
        '200':
          description: Current state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReseparationJob'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [reseparation]
      operationId: deleteReseparationJob
      summary: Cancel (when queued or running) and remove a re-separation job.
      responses:
        '204':
          description: Removed (or did not exist).
  /v1/reseparation-jobs/{reseparationJobId}/stems/{stem}:
    parameters:
      - $ref: '#/components/parameters/ReseparationJobId'
      - name: stem
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/StemName'
    get:
      tags: [reseparation]
      operationId: getReseparationStem
      summary: Download one FLAC stem of a completed re-separation job.
      responses:
        '200':
          description: The FLAC file.
          content:
            audio/flac:
              schema:
                type: string
                contentMediaType: audio/flac
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/ReseparationNotCompleted'
components:
  parameters:
    QualityJobId:
      name: qualityJobId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/JobHexId'
    HandoutJobId:
      name: handoutJobId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/JobHexId'
    ReseparationJobId:
      name: reseparationJobId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/JobHexId'
  schemas:
    JobHexId:
      type: string
      pattern: '^[0-9a-f]{32}$'
      example: 0d1e2f3a4b5c4d6e8f9a0b1c2d3e4f5a
    LibraryPath:
      type: string
      maxLength: 200
      description: Library-relative path (allow-list of 1.4.0 plus the 1.11.0 additions in data-model 2.2).
      example: tracks/7d9f2c1e-3b4a-4c5d-8e6f-1a2b3c4d5e6f/stems/vocals.flac
    ChannelId:
      type: string
      description: A standard stem or a detail stem `<parent>.<detail>` (`drums.kick`, `drums.rest`); same pattern as the backend `ChannelId`.
      pattern: '^(vocals|drums|bass|guitar|piano|other)(\.[a-z][a-z-]{0,31})?$'
    StemName:
      type: string
      description: Copy of the base schema.
      enum: [vocals, drums, bass, guitar, piano, other]
    ParentStemName:
      type: string
      description: Copy of the base schema.
      enum: [vocals, drums, guitar, piano, other]
    RenderJobStatus:
      type: string
      description: Copy of the base schema; `completed`, `failed` and `cancelled` are terminal.
      enum: [queued, running, completed, failed, cancelled]
    JobDevice:
      type: object
      description: Copy placeholder of the base `JobDevice` (1.2.0); the base definition wins at the merge.
      additionalProperties: true
    LaneHealth:
      type: object
      description: Copy of the base schema; merged as `Health.lanes.insights`.
      additionalProperties: false
      required: [queued, running]
      properties:
        queued:
          type: integer
          minimum: 0
        running:
          type: boolean
    InsightsHealth:
      type: object
      additionalProperties: false
      required: [analyzer, analyzerVersion, renderer, fonts]
      description: Merged as `Health.insights`.
      properties:
        analyzer:
          type: string
          enum: [real, fake]
        analyzerVersion:
          type: string
          maxLength: 20
          example: 1.0.0
        renderer:
          type: object
          additionalProperties: false
          required: [weasyprint, pango]
          properties:
            weasyprint:
              type: [string, 'null']
              description: Installed WeasyPrint version; null when it cannot be imported (handout jobs then fail readably).
              example: '70.0'
            pango:
              type: [string, 'null']
              example: 1.56.3
        fonts:
          type: object
          additionalProperties: false
          required: [archivo, fallback]
          properties:
            archivo:
              type: boolean
            fallback:
              type: boolean
              description: DejaVu Sans available for characters Archivo lacks.
    SeparationPipelinesHealth:
      type: object
      additionalProperties: false
      required: [vocals-hq]
      description: Merged as `Health.separationPipelines` (G2 only).
      properties:
        vocals-hq:
          type: string
          enum: [ready, not-downloaded]
    QualityInputKind:
      type: string
      enum: [standard, detail, rest]
    QualityInput:
      type: object
      additionalProperties: false
      required: [channel, path, kind]
      properties:
        channel:
          $ref: '#/components/schemas/ChannelId'
        path:
          $ref: '#/components/schemas/LibraryPath'
        kind:
          $ref: '#/components/schemas/QualityInputKind'
    DetailParentInput:
      type: object
      additionalProperties: false
      required: [parent, modelResidualDb, reconstructionErrorDb]
      properties:
        parent:
          $ref: '#/components/schemas/ParentStemName'
        modelResidualDb:
          type: [number, 'null']
        reconstructionErrorDb:
          type: [number, 'null']
    QualityTitles:
      type: object
      additionalProperties: false
      required: [title]
      properties:
        title:
          type: string
          maxLength: 200
        artist:
          type: [string, 'null']
          maxLength: 200
    QualityJobRequest:
      type: object
      additionalProperties: false
      required: [stems, detailParents, titles]
      description: All six standard stems must be present exactly once (else 422).
      properties:
        stems:
          type: array
          minItems: 6
          maxItems: 64
          items:
            $ref: '#/components/schemas/QualityInput'
        detailParents:
          type: array
          maxItems: 5
          items:
            $ref: '#/components/schemas/DetailParentInput'
        titles:
          $ref: '#/components/schemas/QualityTitles'
    QualityStage:
      type: [string, 'null']
      enum: [loading, analysing, rating, null]
    QualityLevel:
      type: string
      enum: [low, medium, high, unknown]
    Reliability:
      type: string
      description: '`validated` only for stem types and dimensions that passed gate G1 (research.md R-04).'
      enum: [validated, indicative]
    QualityRating:
      type: string
      enum: [good, fair, poor, not-present, unknown]
    QualityReasonCode:
      type: string
      description: Texts in data-model 4.6.
      enum: [clean, bleed, bleed-together, artefacts, bleed-and-artefacts, not-present, too-short]
    ArtefactKind:
      type: string
      enum: [flicker, dropouts, model-residual, rest-share]
    BleedEstimate:
      type: object
      additionalProperties: false
      required: [level, index, mainSource, coOccurrence, reliability]
      properties:
        level:
          $ref: '#/components/schemas/QualityLevel'
        index:
          type: number
          minimum: 0
          maximum: 1
          description: Leakage share after the co-occurrence guard (data-model 4.2).
        mainSource:
          oneOf:
            - $ref: '#/components/schemas/StemName'
            - type: 'null'
        coOccurrence:
          type: boolean
        reliability:
          $ref: '#/components/schemas/Reliability'
    ArtefactEstimate:
      type: object
      additionalProperties: false
      required: [level, index, kinds, reliability]
      properties:
        level:
          $ref: '#/components/schemas/QualityLevel'
        index:
          type: number
          minimum: 0
          maximum: 1
        kinds:
          type: array
          uniqueItems: true
          maxItems: 4
          items:
            $ref: '#/components/schemas/ArtefactKind'
        reliability:
          $ref: '#/components/schemas/Reliability'
    StemQuality:
      type: object
      additionalProperties: false
      required: [channel, rating, ratingReason, activeSeconds, activeShare, levelDb, bleed, artefacts]
      properties:
        channel:
          $ref: '#/components/schemas/ChannelId'
        rating:
          $ref: '#/components/schemas/QualityRating'
        ratingReason:
          $ref: '#/components/schemas/QualityReasonCode'
        activeSeconds:
          type: number
          minimum: 0
        activeShare:
          type: number
          minimum: 0
          maximum: 1
        levelDb:
          type: number
          minimum: -120
          maximum: 20
        bleed:
          $ref: '#/components/schemas/BleedEstimate'
        artefacts:
          $ref: '#/components/schemas/ArtefactEstimate'
    QualityResult:
      type: object
      additionalProperties: false
      required: [analyzerVersion, durationSeconds, stems]
      properties:
        analyzerVersion:
          type: string
          maxLength: 20
        durationSeconds:
          type: number
          minimum: 0
        stems:
          type: array
          maxItems: 64
          items:
            $ref: '#/components/schemas/StemQuality'
    QualityJob:
      type: object
      additionalProperties: false
      required: [qualityJobId, status, stage, progress, error, result, createdAt, updatedAt]
      properties:
        qualityJobId:
          $ref: '#/components/schemas/JobHexId'
        status:
          $ref: '#/components/schemas/RenderJobStatus'
        stage:
          $ref: '#/components/schemas/QualityStage'
        progress:
          type: number
          minimum: 0
          maximum: 1
        error:
          type: [string, 'null']
          maxLength: 500
        result:
          oneOf:
            - $ref: '#/components/schemas/QualityResult'
            - type: 'null'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    HandoutKind:
      type: string
      enum: [song, setlist]
    HandoutFamily:
      type: string
      description: Seven equal families (data-model 6.1).
      enum: [overview, vocals, guitar, bass, keys, drums, melodic]
    IngredientCode:
      type: string
      description: data-model 6.2.
      enum: [facts, form-chart, chords-over-lyrics, lyrics, chord-chart, notation, practice-notes, practice-progress, setlist-notes]
    Paper:
      type: string
      enum: [a4, letter]
    HandoutNotice:
      type: object
      additionalProperties: false
      required: [footer, full]
      description: Must equal the fixed texts of data-model 6.6 (else 422).
      properties:
        footer:
          type: string
          maxLength: 80
        full:
          type: string
          maxLength: 1000
    SetlistEntryBlock:
      type: object
      additionalProperties: false
      required: [position, title, artist, key, tempoBpm, durationSeconds, notes]
      description: One setlist entry. Entries whose track was deleted are already gone from the 014 setlist, so every entry has a song.
      properties:
        position:
          type: integer
          minimum: 1
          maximum: 500
        title:
          type: string
          maxLength: 300
        artist:
          type: [string, 'null']
          maxLength: 500
        key:
          type: [string, 'null']
          maxLength: 40
        tempoBpm:
          type: [integer, 'null']
          minimum: 20
          maximum: 400
        durationSeconds:
          type: [number, 'null']
          minimum: 0
        notes:
          type: [string, 'null']
          maxLength: 4000
    SetlistBlock:
      type: object
      additionalProperties: false
      required: [name, notes, entries]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        notes:
          type: [string, 'null']
          maxLength: 4000
        entries:
          type: array
          maxItems: 500
          items:
            $ref: '#/components/schemas/SetlistEntryBlock'
    SongFacts:
      type: object
      additionalProperties: false
      required: [tempoBpm, timeSignature, key, keySource, durationSeconds, transpositionNote]
      properties:
        tempoBpm:
          type: [integer, 'null']
          minimum: 20
          maximum: 400
        timeSignature:
          type: [string, 'null']
          pattern: '^[1-9][0-9]?/(2|4|8)$'
        key:
          type: [string, 'null']
          maxLength: 40
          example: A minor
        keySource:
          type: [string, 'null']
          enum: [chords, score, null]
        durationSeconds:
          type: number
          minimum: 0
        transpositionNote:
          type: [string, 'null']
          maxLength: 120
          example: Part in B-flat (sounds a major second lower)
    ChordSymbol:
      type: string
      description: ASCII accidentals, e.g. `Bb`, `F#m7`, `C/G` (research.md R-08).
      pattern: '^[A-G](#|b)?[A-Za-z0-9+#b()-]{0,12}(/[A-G](#|b)?)?$|^N\.C\.$'
      maxLength: 20
    HandoutSection:
      type: object
      additionalProperties: false
      required: [name, startSeconds, endSeconds, startBar, bars, chordBars, practiceTempoPercent]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 80
        startSeconds:
          type: number
          minimum: 0
        endSeconds:
          type: number
          minimum: 0
        startBar:
          type: [integer, 'null']
          minimum: 0
        bars:
          type: [integer, 'null']
          minimum: 0
          maximum: 999
        chordBars:
          type: [array, 'null']
          maxItems: 999
          items:
            type: array
            maxItems: 8
            items:
              $ref: '#/components/schemas/ChordSymbol'
        practiceTempoPercent:
          type: [integer, 'null']
          minimum: 25
          maximum: 200
    LyricChord:
      type: object
      additionalProperties: false
      required: [symbol, charIndex]
      properties:
        symbol:
          $ref: '#/components/schemas/ChordSymbol'
        charIndex:
          type: integer
          minimum: 0
          maximum: 500
    LyricLine:
      type: object
      additionalProperties: false
      required: [text, section, chords]
      properties:
        text:
          type: string
          maxLength: 500
          description: Lyric text; empty for an instrumental chord row (016 chord sheet rows).
        section:
          type: [integer, 'null']
          minimum: 0
          description: Index into `sections`, or null.
        chords:
          type: array
          maxItems: 32
          items:
            $ref: '#/components/schemas/LyricChord'
    HandoutLyrics:
      type: object
      additionalProperties: false
      required: [lines, chordPlacement, source]
      properties:
        lines:
          type: array
          maxItems: 1000
          items:
            $ref: '#/components/schemas/LyricLine'
        chordPlacement:
          type: string
          description: |
            How the API placed the chords (the 016 chord sheet rule, `ChordSheetBuilder`): `word` = word-synced
            lyrics, chords at the word they start in; `line` = line-synced lyrics, chords at the word nearest
            their share of the line; `none` = no chords placed (no chords, no synced lyrics, or the family
            excludes them).
          enum: [word, line, none]
        source:
          type: string
          maxLength: 200
    NotationKind:
      type: string
      enum: [score, tab, drums, transposed]
    HandoutNotation:
      type: object
      additionalProperties: false
