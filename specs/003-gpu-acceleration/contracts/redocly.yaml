# Lint configuration for the StemStudio OpenAPI 3.1 contracts.
# Run from the repo root: npx @redocly/cli@2.78.0 lint --config specs/003-gpu-acceleration/contracts/redocly.yaml #   specs/003-gpu-acceleration/contracts/worker-api.openapi.yaml specs/003-gpu-acceleration/contracts/backend-api.openapi.yaml
extends:
  - recommended
rules:
  # GET /health, GET /api/device and GET /api/tracks have no client-error cases; every other operation lists its 4XX responses.
  operation-4xx-response: warn
  no-server-example.com: off
