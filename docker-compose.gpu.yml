# Optional NVIDIA GPU override for the worker (feature 003, ADR-012).
#   docker compose -f docker-compose.yml -f docker-compose.gpu.yml up --build
#
# Builds the GPU variant of docker/worker.Dockerfile (TORCH_VARIANT=cu132: torch 2.15.0+cu132 and
# torchaudio 2.11.1+cu132; ORT_VARIANT=gpu: onnxruntime-gpu 1.32.0 + cuRAND) as
# stemstudio/worker:local-gpu and sets
# STEMSTUDIO_DEVICE=auto: the worker uses the GPU when its start-up probe passes and otherwise
# runs on the CPU with the reason in /health (it never fails to start). CPU stays the default.
#
# Prerequisites (specs/003-gpu-acceleration/quickstart.md, research.md G-05):
#   - NVIDIA GPU with compute capability >= 7.5 (Turing or newer) and a host driver with CUDA 13.2
#     support (R580 or newer).
#   - Windows 11: Docker Desktop with the WSL2 backend; do NOT install a Linux NVIDIA driver inside
#     WSL. Linux: the NVIDIA Container Toolkit.
#   - Check: docker run --rm --gpus all nvcr.io/nvidia/k8s/cuda-sample:nbody nbody -gpu -benchmark
# The GPU image is about 11.6 GB on disk (CPU image 3.4 GB) and contains the proprietary NVIDIA
# CUDA runtime libraries (system dependency, ADR-011; never in the CPU image or CI).
#
# GPU lease (feature 009, ADR-018 D3, FR-011): the worker takes an exclusive flock on
# /gpu-lease/gpu.lock (named volume gpu-lease) for every GPU step. The optional generative services
# (docker-compose.generative.yml: generator, singer) mount the same volume, so only one StemStudio
# GPU step runs at a time across containers. A step waits up to STEMSTUDIO_GPU_LEASE_WAIT_SECONDS
# (default 900) for the lease and then runs on the CPU. Without the generative services the lease
# is always free.

services:
  worker:
    build:
      args:
        TORCH_VARIANT: ${STEMSTUDIO_TORCH_VARIANT:-cu132}
        ORT_VARIANT: gpu
        WORKER_DEVICE: auto
    image: stemstudio/worker:local-gpu
    environment:
      STEMSTUDIO_DEVICE: ${STEMSTUDIO_DEVICE:-auto}
      STEMSTUDIO_GPU_LEASE_FILE: /gpu-lease/gpu.lock
      STEMSTUDIO_GPU_LEASE_WAIT_SECONDS: ${STEMSTUDIO_GPU_LEASE_WAIT_SECONDS:-900}
    volumes:
      - gpu-lease:/gpu-lease
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

volumes:
  gpu-lease:
